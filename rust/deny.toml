# cargo-deny policy for the whole Rust workspace (PLAN-foundation.md
# section 2), copied from mailgun-relay and run by the `rust` CI job and
# `just rust-check`. Only the release target is checked. Advisories (RustSec)
# and yanked crates fail the check; crates come from crates.io only. A new
# license needs a deliberate line here naming the crate that brings it.
# Copyleft licenses are not allowed workspace-wide; the only planned
# exception is a `[[licenses.exceptions]]` entry for `GPL-3.0-or-later`
# scoped to `rust-apt` and `software-live-apt` (section 9), added by the
# slice that adds that helper crate.
[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
