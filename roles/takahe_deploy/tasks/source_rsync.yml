---
- name: source_rsync | Validate local source path exists
  ansible.builtin.stat:
    path: "{{ takahe_source_path }}"
  delegate_to: localhost
  become: false
  register: takahe_source_check

- name: source_rsync | Fail when source path is missing
  ansible.builtin.fail:
    msg: "Source path {{ takahe_source_path }} does not exist on the controller"
  when: not takahe_source_check.stat.exists

- name: source_rsync | Build rsync exclude options
  ansible.builtin.set_fact:
    takahe_rsync_exclude_opts: "{{ takahe_rsync_excludes | map('regex_replace', '^', '--exclude=') | list }}"

- name: source_rsync | Sync Takahe source code
  ansible.posix.synchronize:
    src: "{{ takahe_source_path }}/"
    dest: "{{ takahe_site_path }}/"
    owner: false
    group: false
    # directories.yml owns the site and runtime directory modes (0750);
    # preserving controller modes would flip them on every sync and restart.
    perms: false
    rsync_opts: "{{ takahe_rsync_exclude_opts + ['--omit-dir-times'] }}"
  delegate_to: localhost
  become: false
  notify:
    - restart takahe-gunicorn
    - restart takahe-stator

- name: source_rsync | Ensure correct ownership of synced files
  ansible.builtin.file:
    path: "{{ takahe_site_path }}"
    owner: "{{ takahe_user }}"
    group: "{{ takahe_group }}"
    recurse: true
