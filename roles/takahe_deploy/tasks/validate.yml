---
- name: Validate required Takahe settings
  ansible.builtin.assert:
    that:
      - takahe_source_mode in ['rsync', 'git']
      - takahe_source_mode != 'rsync' or (takahe_source_path | default('') | length > 0)
      - takahe_domain is defined
      - takahe_domain | length > 0
      - takahe_secret_key is defined
      - takahe_secret_key | length > 0
      - takahe_secret_key != 'CHANGEME'
      - takahe_postgres_password is defined
      - takahe_postgres_password | length > 0
      - takahe_postgres_password != 'CHANGEME'
      - takahe_email_server is defined
      - takahe_email_server | length > 0
      - takahe_email_server != 'CHANGEME'
      - takahe_email_from is defined
      - takahe_email_from | length > 0
      - takahe_email_from != 'CHANGEME'
      - takahe_error_emails is defined
    fail_msg: |
      SECURITY ERROR: Required Takahe settings are missing or contain placeholder values.

      Required values:
      - takahe_domain
      - takahe_secret_key
      - takahe_postgres_password
      - takahe_email_server
      - takahe_email_from
      - takahe_error_emails (list of alert recipients, [] to disable error mail)

      Update the appropriate secrets file in ops-control before deploying.

# An empty list is a supported, explicit configuration: it turns Django error
# mail off. Takahe only assigns ADMINS when TAKAHE_ERROR_EMAILS parses to a
# non-empty list, and Django's mail_admins() is a no-op with empty ADMINS.
# What Takahe cannot survive is a non-list value: its pydantic settings model
# declares ERROR_EMAILS as list[EmailStr] | None and parses the environment
# variable as JSON, so a bare string (the CHANGEME placeholder, a single
# address, or an empty string) raises SettingsError before Django starts.
- name: Validate Takahe error mail recipients
  ansible.builtin.assert:
    that:
      - takahe_error_emails is sequence
      - takahe_error_emails is not string
      - takahe_error_emails is not mapping
      - "'CHANGEME' not in takahe_error_emails"
    fail_msg: |
      takahe_error_emails must be a list of recipient addresses.

      To send Django error reports:

          takahe_error_emails:
            - "ops@example.com"

      To turn error mail off entirely (a supported configuration):

          takahe_error_emails: []

      A bare string - including the CHANGEME placeholder and an empty string -
      is rejected here because Takahe parses TAKAHE_ERROR_EMAILS as a JSON list
      and would fail to start.

- name: Validate Takahe Git settings
  ansible.builtin.assert:
    that:
      - takahe_git_repo | default('') | length > 0
    fail_msg: "takahe_git_repo must be set when takahe_source_mode is git"
  when: takahe_source_mode == 'git'
