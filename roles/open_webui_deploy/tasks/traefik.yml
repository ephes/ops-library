---
- name: Ensure Traefik dynamic config directory exists
  ansible.builtin.file:
    path: "{{ open_webui_traefik_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure htpasswd is installed (apache2-utils)
  ansible.builtin.package:
    name: apache2-utils
    state: present
  when:
    - open_webui_basic_auth_enabled | bool
    - ansible_facts['os_family'] == 'Debian'

- name: Resolve basic auth password hash (reuse the deployed one while it matches)
  ansible.builtin.include_role:
    name: local.ops_library.webapp_deploy_internal
    tasks_from: traefik_basic_auth_hash
  vars:
    webapp_deploy_internal_basic_auth_user: "{{ open_webui_basic_auth_user }}"
    webapp_deploy_internal_basic_auth_password: "{{ open_webui_basic_auth_password }}"
    webapp_deploy_internal_basic_auth_config_path: "{{ open_webui_traefik_config_path }}"
    webapp_deploy_internal_basic_auth_hash_var: open_webui_basic_auth_password_hash
  when:
    - open_webui_basic_auth_enabled | bool
    - open_webui_basic_auth_password_hash | length == 0

- name: Render Traefik configuration for Open WebUI
  ansible.builtin.template:
    src: open-webui-traefik.yml.j2
    dest: "{{ open_webui_traefik_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: reload traefik
