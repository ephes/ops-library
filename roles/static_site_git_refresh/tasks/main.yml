---
- name: main | Validate refresh configuration
  ansible.builtin.include_tasks: validate.yml

- name: main | Provision refresh account, deploy key, and document root
  ansible.builtin.include_tasks: account.yml

- name: main | Require repository read access
  ansible.builtin.include_tasks: access.yml
  when: not ansible_check_mode

- name: main | Install refresh script and systemd units
  ansible.builtin.include_tasks: service.yml
