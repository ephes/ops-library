---
- name: validate | Validate refresh configuration
  ansible.builtin.assert:
    that:
      - static_site_git_refresh_name is match('^[a-z][a-z0-9-]{1,62}\Z')
      - static_site_git_refresh_user is match('^[a-z_][a-z0-9_-]{0,30}\Z')
      - static_site_git_refresh_group is match('^[a-z_][a-z0-9_-]{0,30}\Z')
      - static_site_git_refresh_home is match('^/[A-Za-z0-9_./-]+\Z')
      - static_site_git_refresh_home is not match('^/(home|root)(/|\Z)')
      - static_site_git_refresh_repo is match('^(git@[A-Za-z0-9.-]+:|ssh://git@[A-Za-z0-9.-]+/)[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\Z')
      - static_site_git_refresh_branch is match('^[A-Za-z0-9][A-Za-z0-9_./-]{0,99}\Z')
      - "'..' not in static_site_git_refresh_branch"
      - static_site_git_refresh_checkout_path.startswith(static_site_git_refresh_home ~ '/')
      - static_site_git_refresh_checkout_path is match('^/[A-Za-z0-9_./-]+\Z')
      - "'..' not in static_site_git_refresh_checkout_path"
      - static_site_git_refresh_deploy_key_path.startswith(static_site_git_refresh_home ~ '/')
      - static_site_git_refresh_known_hosts_path.startswith(static_site_git_refresh_home ~ '/')
      - static_site_git_refresh_known_hosts is sequence
      - static_site_git_refresh_known_hosts is not string
      - static_site_git_refresh_known_hosts | length > 0
      - static_site_git_refresh_build_command is sequence
      - static_site_git_refresh_build_command is not string
      - static_site_git_refresh_build_command | length > 0
      - static_site_git_refresh_build_command[0] is match('^/[A-Za-z0-9_./-]+\Z')
      - static_site_git_refresh_build_environment is mapping
      - static_site_git_refresh_build_timeout_seconds | int > 0
      - static_site_git_refresh_output_path is match('^[A-Za-z0-9_][A-Za-z0-9_./-]*\Z')
      - "'..' not in static_site_git_refresh_output_path"
      - static_site_git_refresh_output_max_bytes | int > 0
      - static_site_git_refresh_publish_path is match('^/[A-Za-z0-9_./-]+\Z')
      - static_site_git_refresh_publish_path != '/'
      - "'..' not in static_site_git_refresh_publish_path"
      - static_site_git_refresh_publish_group is match('^[a-z_][a-z0-9_-]{0,30}\Z')
      - static_site_git_refresh_publish_name is match('^[A-Za-z0-9_][A-Za-z0-9_.-]*\Z')
      - static_site_git_refresh_script_path is match('^/[A-Za-z0-9_./-]+\Z')
      - static_site_git_refresh_systemd_unit_name is match('^[a-z][a-z0-9_.-]{1,62}\Z')
      - static_site_git_refresh_interval is match('^[0-9]+(s|min|h)\Z')
    fail_msg: >-
      static_site_git_refresh requires an SSH repository URL, a safe branch,
      paths under a non-home state directory, an absolute build executable,
      a relative output path, a document root, its serving group, and a
      systemd time span such as 5min.

- name: validate | Validate build environment names
  ansible.builtin.assert:
    that:
      - item is match('^[A-Z_][A-Z0-9_]*\Z')
    fail_msg: "Unsafe static_site_git_refresh_build_environment name: {{ item }}"
  loop: "{{ static_site_git_refresh_build_environment.keys() | list }}"

- name: validate | Validate pinned host keys
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^[A-Za-z0-9.,\[\]:-]+ (ssh-ed25519|ecdsa-sha2-nistp256|ssh-rsa) [A-Za-z0-9+/=]+\Z')
    fail_msg: "static_site_git_refresh_known_hosts entries must be single known_hosts lines."
  loop: "{{ static_site_git_refresh_known_hosts }}"

- name: validate | Inspect build executable
  ansible.builtin.stat:
    path: "{{ static_site_git_refresh_build_command[0] }}"
  register: static_site_git_refresh_build_executable

- name: validate | Require build executable on the target
  ansible.builtin.assert:
    that:
      - static_site_git_refresh_build_executable.stat.exists
      - static_site_git_refresh_build_executable.stat.executable
    fail_msg: >-
      Build executable {{ static_site_git_refresh_build_command[0] }} is missing
      on {{ inventory_hostname }}; install it first (for example with
      local.ops_library.uv_install).
