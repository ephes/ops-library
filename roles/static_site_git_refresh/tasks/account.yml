---
- name: account | Install git and SSH client
  ansible.builtin.package:
    name:
      - git
      - openssh-client
    state: present

- name: account | Ensure refresh group exists
  ansible.builtin.group:
    name: "{{ static_site_git_refresh_group }}"
    system: true
    state: present

- name: account | Ensure document root group exists
  ansible.builtin.group:
    name: "{{ static_site_git_refresh_publish_group }}"
    system: true
    state: present

- name: account | Ensure refresh user exists
  ansible.builtin.user:
    name: "{{ static_site_git_refresh_user }}"
    group: "{{ static_site_git_refresh_group }}"
    home: "{{ static_site_git_refresh_home }}"
    shell: /usr/sbin/nologin
    create_home: true
    system: true
    state: present

- name: account | Restrict refresh state directory
  ansible.builtin.file:
    path: "{{ static_site_git_refresh_home }}"
    state: directory
    owner: "{{ static_site_git_refresh_user }}"
    group: "{{ static_site_git_refresh_group }}"
    mode: "0750"

- name: account | Ensure SSH directory exists
  ansible.builtin.file:
    path: "{{ static_site_git_refresh_deploy_key_path | dirname }}"
    state: directory
    owner: "{{ static_site_git_refresh_user }}"
    group: "{{ static_site_git_refresh_group }}"
    mode: "0700"

- name: account | Pin repository host keys
  ansible.builtin.template:
    src: known_hosts.j2
    dest: "{{ static_site_git_refresh_known_hosts_path }}"
    owner: "{{ static_site_git_refresh_user }}"
    group: "{{ static_site_git_refresh_group }}"
    mode: "0644"

- name: account | Generate read-only deploy key on the target
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -q
      - -t
      - ed25519
      - -N
      - ""
      - -C
      - "{{ static_site_git_refresh_name }}@{{ inventory_hostname }}"
      - -f
      - "{{ static_site_git_refresh_deploy_key_path }}"
    creates: "{{ static_site_git_refresh_deploy_key_path }}"
  become: true
  become_user: "{{ static_site_git_refresh_user }}"

- name: account | Restrict deploy key permissions
  ansible.builtin.file:
    path: "{{ static_site_git_refresh_deploy_key_path }}"
    owner: "{{ static_site_git_refresh_user }}"
    group: "{{ static_site_git_refresh_group }}"
    mode: "0600"
  when: not ansible_check_mode

- name: account | Ensure document root parent exists
  ansible.builtin.file:
    path: "{{ static_site_git_refresh_publish_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: account | Ensure document root is writable only by the refresh user
  ansible.builtin.file:
    path: "{{ static_site_git_refresh_publish_path }}"
    state: directory
    owner: "{{ static_site_git_refresh_user }}"
    group: "{{ static_site_git_refresh_publish_group }}"
    mode: "2750"
