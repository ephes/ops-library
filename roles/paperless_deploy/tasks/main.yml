---
- name: Validate configuration
  ansible.builtin.import_tasks: validate.yml

- name: Install system packages
  ansible.builtin.import_tasks: packages.yml

- name: Ensure paperless user exists
  ansible.builtin.import_tasks: user.yml

- name: Create application directories
  ansible.builtin.import_tasks: directories.yml

- name: Manage storage layout
  ansible.builtin.import_tasks: storage.yml

- name: Configure scanner SFTP integration
  ansible.builtin.import_tasks: scanner.yml
  when: paperless_scanner_enabled

- name: Prepare Python environment
  ansible.builtin.import_tasks: python.yml

- name: Write the certifi/pip install constraints
  ansible.builtin.include_role:
    name: local.ops_library.python_security_floor
    tasks_from: constraints.yml
  vars:
    python_security_floor_constraints_path: "{{ paperless_python_security_constraints_path }}"
    python_security_floor_owner: "{{ paperless_username }}"
    python_security_floor_group: "{{ paperless_group }}"
  when: paperless_python_security_floor_enabled | bool

- name: Install Paperless application
  ansible.builtin.import_tasks: application.yml

- name: Verify the environment's certifi/pip floors
  ansible.builtin.include_role:
    name: local.ops_library.python_security_floor
    tasks_from: verify.yml
  vars:
    python_security_floor_python: "{{ paperless_virtualenv }}/bin/python"
    python_security_floor_user: "{{ paperless_username }}"
    python_security_floor_label: Paperless environment
  when: paperless_python_security_floor_enabled | bool

- name: Configure Paperless runtime
  ansible.builtin.import_tasks: configuration.yml

- name: Configure systemd services
  ansible.builtin.import_tasks: systemd.yml

- name: Configure Traefik routing
  ansible.builtin.import_tasks: traefik.yml
  when: paperless_traefik_enabled

- name: Rebuild Paperless search index
  ansible.builtin.import_tasks: search_index.yml

- name: Ensure service state
  ansible.builtin.import_tasks: service.yml
