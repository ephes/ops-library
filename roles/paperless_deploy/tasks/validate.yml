---
- name: Validate required secrets
  ansible.builtin.assert:
    that:
      - paperless_secret_key is defined and paperless_secret_key != "CHANGEME"
      - paperless_secret_key | length >= 50
      - paperless_postgres_password is defined and paperless_postgres_password != "CHANGEME"
      - paperless_admin_password is defined and paperless_admin_password != "CHANGEME"
      - paperless_scanner_enabled | bool == false or paperless_scanner_password != "CHANGEME"
      - paperless_version is defined and paperless_version | length > 0
      - paperless_release_checksum | string is regex('^sha256:[a-f0-9]{64}$')
    fail_msg: >-
      Set all CHANGEME variables (secret key, DB/admin/scanner passwords, version)
      and provide a sha256 checksum for the selected Paperless release before
      running paperless_deploy.

- name: Validate Redis configuration
  ansible.builtin.assert:
    that:
      - paperless_redis_requirepass_enabled | bool == false or paperless_redis_password | length > 0
    fail_msg: "paperless_redis_password must be provided when redis_requirepass is enabled."

- name: Validate uv binary path
  ansible.builtin.assert:
    that:
      - paperless_uv_binary | length > 0
    fail_msg: "paperless_uv_binary must point to the uv executable."

- name: Validate content date order
  ansible.builtin.assert:
    that:
      - paperless_date_order in ["DMY", "MDY", "YMD"]
    fail_msg: "paperless_date_order must be one of DMY, MDY, YMD (got '{{ paperless_date_order }}')."

# dateparser reads these using paperless_date_order, so an ISO string under a
# non-YMD order parses to None and is dropped without warning -- the setting
# then looks applied but ignores nothing. Fail loudly instead.
- name: Validate ignored dates match the configured date order
  vars:
    # Computed once and reused below: the same regex written inline in a folded
    # fail_msg would be escaped differently by YAML and silently match nothing.
    paperless_iso_ignore_dates: "{{ paperless_ignore_dates | select('match', '^\\s*\\d{4}-\\d{2}-\\d{2}\\s*$') | list }}"
  ansible.builtin.assert:
    that:
      - paperless_iso_ignore_dates | length == 0
    fail_msg: >-
      paperless_ignore_dates contains ISO-formatted (YYYY-MM-DD) entries
      {{ paperless_iso_ignore_dates }} but paperless_date_order is
      '{{ paperless_date_order }}'. dateparser would silently discard them.
      Rewrite them in {{ paperless_date_order }} order (e.g. 01.02.1970 for DMY).
  when: paperless_date_order != "YMD"
