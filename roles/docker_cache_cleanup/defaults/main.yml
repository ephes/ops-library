---
# Explicit role invocation opts into cache cleanup; false disables the schedule.
docker_cache_cleanup_enabled: true
docker_cache_cleanup_unused_hours: 168
# Zero preserves age-only cleanup. A positive integer is a byte target;
# shared or actively used build records can prevent reaching it immediately.
docker_cache_cleanup_max_used_bytes: 0
docker_cache_cleanup_calendar: "*-*-* 03:30:00"
docker_cache_cleanup_randomized_delay: "30m"
