---
- name: Skip os_apt_maintenance when disabled
  ansible.builtin.debug:
    msg: "os_apt_maintenance role skipped (os_apt_maintenance_enabled=false)."
  when: not os_apt_maintenance_enabled | bool

- name: Deploy os_apt_maintenance
  when: os_apt_maintenance_enabled | bool
  # Inputs of the endpoint's implementation switch (select and verify below,
  # only with os_apt_maintenance_endpoint_enabled; rust/metrics-httpd/PLAN.md
  # 7.2, argv of 7.3). The argv, sandbox and IP allow list mirror
  # templates/os-apt-maintenance-endpoint.service.j2 and the values the
  # template bakes into templates/os_apt_maintenance_httpd.py.j2.
  vars:
    metrics_httpd_switch_impl: "{{ os_apt_maintenance_endpoint_impl }}"
    metrics_httpd_switch_service_name: "{{ os_apt_maintenance_endpoint_service_name }}"
    metrics_httpd_switch_validate_user: "{{ os_apt_maintenance_endpoint_user }}"
    metrics_httpd_switch_validate_group: "{{ os_apt_maintenance_endpoint_group }}"
    metrics_httpd_switch_argv:
      - apt-state
      - --bind
      - "{{ os_apt_maintenance_endpoint_bind }}"
      - --port
      - "{{ os_apt_maintenance_endpoint_port | int | string }}"
      - --path
      - "{{ os_apt_maintenance_endpoint_path }}"
      - --json-path
      - "{{ os_apt_maintenance_state_file }}"
      - --htpasswd-file
      - "{{ os_apt_maintenance_endpoint_htpasswd_path }}"
      - --freshness-max-age
      - "{{ os_apt_maintenance_freshness_max_age_seconds | int | string }}"
      - --state-max-age
      - "{{ os_apt_maintenance_endpoint_state_max_age_seconds | int | string }}"
      - --realm
      - os-apt-maintenance
      - --server-name
      - os-apt-maintenance-httpd/0.1
    metrics_httpd_switch_unit_sandbox:
      - NoNewPrivileges=yes
      - ProtectSystem=strict
      - ProtectHome=yes
      - PrivateTmp=yes
      - "ReadOnlyPaths={{ os_apt_maintenance_state_file }}"
      - "ReadOnlyPaths={{ os_apt_maintenance_endpoint_htpasswd_path }}"
    metrics_httpd_switch_notify:
      - reload systemd
      - restart os-apt-maintenance-endpoint
    metrics_httpd_switch_python_script: "{{ os_apt_maintenance_endpoint_server_path }}"
    metrics_httpd_switch_probe_bind: "{{ os_apt_maintenance_endpoint_bind }}"
    metrics_httpd_switch_probe_port: "{{ os_apt_maintenance_endpoint_port }}"
    metrics_httpd_switch_probe_path: "{{ os_apt_maintenance_endpoint_path }}"
    metrics_httpd_switch_probe_realm: os-apt-maintenance
    metrics_httpd_switch_ip_address_allow: "{{ ['localhost'] + os_apt_maintenance_endpoint_ip_allow }}"
  block:
    - name: Validate apt maintenance variables
      ansible.builtin.assert:
        that:
          - os_apt_maintenance_host_id is defined
          - os_apt_maintenance_host_id | length > 0
          - os_apt_maintenance_state_dir is defined
          - os_apt_maintenance_state_dir | length > 0
          - os_apt_maintenance_state_file is defined
          - os_apt_maintenance_state_file | length > 0
          - os_apt_maintenance_script_path is defined
          - os_apt_maintenance_script_path | length > 0
          - os_apt_maintenance_timer_on_calendar is defined
          - os_apt_maintenance_timer_on_calendar | length > 0
          - os_apt_maintenance_command_timeout | int > 0
        fail_msg: "Invalid os_apt_maintenance configuration."

    - name: Validate apt index refresh variables
      ansible.builtin.assert:
        that:
          - os_apt_maintenance_refresh_service_name is defined
          - os_apt_maintenance_refresh_service_name | length > 0
          - os_apt_maintenance_refresh_service_name != os_apt_maintenance_service_name
          - os_apt_maintenance_refresh_timer_on_calendar is defined
          - os_apt_maintenance_refresh_timer_on_calendar | length > 0
          - os_apt_maintenance_refresh_command_timeout | int > 0
        fail_msg: "Invalid os_apt_maintenance refresh configuration."
      when: os_apt_maintenance_refresh_enabled | bool

    - name: Validate endpoint auth variables
      ansible.builtin.assert:
        that:
          - os_apt_maintenance_endpoint_auth_user is defined
          - os_apt_maintenance_endpoint_auth_user != "CHANGE_ME"
          - os_apt_maintenance_endpoint_auth_user | length > 0
          - os_apt_maintenance_endpoint_auth_password is defined
          - os_apt_maintenance_endpoint_auth_password != "CHANGE_ME"
          - os_apt_maintenance_endpoint_auth_password | length > 0
        fail_msg: |
          os_apt_maintenance endpoint auth values are missing or still set to CHANGE_ME.
          Set os_apt_maintenance_endpoint_auth_user/password before enabling the endpoint.
      when: os_apt_maintenance_endpoint_enabled | bool

    - name: Install apt maintenance dependencies
      ansible.builtin.package:
        name: "{{ os_apt_maintenance_packages }}"
        state: present

    - name: Install endpoint dependencies
      ansible.builtin.package:
        name: "{{ os_apt_maintenance_endpoint_packages }}"
        state: present
      when: os_apt_maintenance_endpoint_enabled | bool

    - name: Create endpoint system group
      ansible.builtin.group:
        name: "{{ os_apt_maintenance_endpoint_group }}"
        system: true
        state: present
      when: os_apt_maintenance_endpoint_enabled | bool

    - name: Create endpoint system user
      ansible.builtin.user:
        name: "{{ os_apt_maintenance_endpoint_user }}"
        group: "{{ os_apt_maintenance_endpoint_group }}"
        shell: /usr/sbin/nologin
        create_home: false
        system: true
        state: present
      when: os_apt_maintenance_endpoint_enabled | bool

    - name: Ensure apt maintenance state directory exists
      ansible.builtin.file:
        path: "{{ os_apt_maintenance_state_dir }}"
        state: directory
        owner: root
        group: "{{ os_apt_maintenance_endpoint_group if os_apt_maintenance_endpoint_enabled | bool else 'root' }}"
        mode: "{{ '0750' if os_apt_maintenance_endpoint_enabled | bool else '0755' }}"

    - name: Ensure endpoint htpasswd directory exists
      ansible.builtin.file:
        path: "{{ os_apt_maintenance_endpoint_htpasswd_dir }}"
        state: directory
        owner: root
        group: "{{ os_apt_maintenance_endpoint_group }}"
        mode: "0750"
      when: os_apt_maintenance_endpoint_enabled | bool

    - name: Deploy apt maintenance runner
      ansible.builtin.template:
        src: os_apt_maintenance.py.j2
        dest: "{{ os_apt_maintenance_script_path }}"
        owner: root
        group: root
        mode: "0755"
      register: _os_apt_maintenance_runner

    - name: Deploy apt maintenance service unit
      ansible.builtin.template:
        src: os-apt-maintenance.service.j2
        dest: "/etc/systemd/system/{{ os_apt_maintenance_service_name }}.service"
        owner: root
        group: root
        mode: "0644"
      notify:
        - reload systemd

    - name: Deploy apt maintenance timer unit
      ansible.builtin.template:
        src: os-apt-maintenance.timer.j2
        dest: "/etc/systemd/system/{{ os_apt_maintenance_service_name }}.timer"
        owner: root
        group: root
        mode: "0644"
      notify:
        - reload systemd
        - restart os-apt-maintenance-timer

    - name: Deploy apt index refresh service unit
      ansible.builtin.template:
        src: os-apt-maintenance-refresh.service.j2
        dest: "/etc/systemd/system/{{ os_apt_maintenance_refresh_service_name }}.service"
        owner: root
        group: root
        mode: "0644"
      notify:
        - reload systemd
      when: os_apt_maintenance_refresh_enabled | bool

    - name: Deploy apt index refresh timer unit
      ansible.builtin.template:
        src: os-apt-maintenance-refresh.timer.j2
        dest: "/etc/systemd/system/{{ os_apt_maintenance_refresh_service_name }}.timer"
        owner: root
        group: root
        mode: "0644"
      notify:
        - reload systemd
        - restart os-apt-maintenance-refresh-timer
      when: os_apt_maintenance_refresh_enabled | bool

    - name: Deploy apt maintenance HTTP server
      ansible.builtin.template:
        src: os_apt_maintenance_httpd.py.j2
        dest: "{{ os_apt_maintenance_endpoint_server_path }}"
        owner: root
        group: root
        mode: "0755"
      notify: restart os-apt-maintenance-endpoint
      when: os_apt_maintenance_endpoint_enabled | bool

    - name: Verify existing endpoint htpasswd credentials
      ansible.builtin.command: >-
        htpasswd -viB {{ os_apt_maintenance_endpoint_htpasswd_path }}
        {{ os_apt_maintenance_endpoint_auth_user }}
      args:
        stdin: "{{ os_apt_maintenance_endpoint_auth_password }}"
      register: _os_apt_maintenance_htpasswd_verify
      changed_when: false
      failed_when: false
      no_log: true
      when: os_apt_maintenance_endpoint_enabled | bool

    - name: Generate endpoint htpasswd entry
      ansible.builtin.command: "htpasswd -niB {{ os_apt_maintenance_endpoint_auth_user }}"
      args:
        stdin: "{{ os_apt_maintenance_endpoint_auth_password }}"
      register: _os_apt_maintenance_htpasswd_entry
      changed_when: false
      no_log: true
      when:
        - os_apt_maintenance_endpoint_enabled | bool
        - _os_apt_maintenance_htpasswd_verify.rc != 0

    - name: Write endpoint htpasswd file
      ansible.builtin.copy:
        dest: "{{ os_apt_maintenance_endpoint_htpasswd_path }}"
        content: "{{ _os_apt_maintenance_htpasswd_entry.stdout }}\n"
        owner: root
        group: "{{ os_apt_maintenance_endpoint_group }}"
        mode: "0640"
      notify: restart os-apt-maintenance-endpoint
      no_log: true
      when:
        - os_apt_maintenance_endpoint_enabled | bool
        - _os_apt_maintenance_htpasswd_verify.rc != 0

    - name: Deploy apt maintenance endpoint service unit
      ansible.builtin.template:
        src: os-apt-maintenance-endpoint.service.j2
        dest: "/etc/systemd/system/{{ os_apt_maintenance_endpoint_service_name }}.service"
        owner: root
        group: root
        mode: "0644"
      notify:
        - reload systemd
        - restart os-apt-maintenance-endpoint
      when: os_apt_maintenance_endpoint_enabled | bool

    - name: Flush handlers to ensure systemd sees apt maintenance units
      ansible.builtin.meta: flush_handlers

    - name: Check whether apt maintenance state exists
      ansible.builtin.stat:
        path: "{{ os_apt_maintenance_state_file }}"
      register: _os_apt_maintenance_state

    - name: Initialize apt maintenance state file without running apt
      ansible.builtin.command: "{{ os_apt_maintenance_script_path }} --init-state"
      changed_when: not _os_apt_maintenance_state.stat.exists
      when: not _os_apt_maintenance_state.stat.exists

    - name: Run apt maintenance once on deploy when requested
      ansible.builtin.systemd:
        name: "{{ os_apt_maintenance_service_name }}.service"
        state: started
      when: >-
        os_apt_maintenance_run_on_deploy | bool
        or (
          os_apt_maintenance_run_on_first_deploy | bool
          and not _os_apt_maintenance_state.stat.exists
        )

    - name: Ensure apt maintenance state permissions for endpoint
      ansible.builtin.file:
        path: "{{ os_apt_maintenance_state_file }}"
        owner: root
        group: "{{ os_apt_maintenance_endpoint_group if os_apt_maintenance_endpoint_enabled | bool else 'root' }}"
        mode: "{{ '0640' if os_apt_maintenance_endpoint_enabled | bool else '0644' }}"

    # Python or the pinned Rust metrics-httpd (drop-in metrics-httpd-impl.conf);
    # a change notifies the handlers flushed below. Placed after the state
    # file exists: the unit's (and --check-config's) ReadOnlyPaths= names it.
    - name: Select the endpoint's HTTP server implementation
      ansible.builtin.include_role:
        name: local.ops_library.metrics_httpd_switch
        tasks_from: select
      when: os_apt_maintenance_endpoint_enabled | bool

    - name: Ensure apt maintenance timer is enabled and started
      ansible.builtin.systemd:
        name: "{{ os_apt_maintenance_service_name }}.timer"
        enabled: "{{ os_apt_maintenance_timer_enabled | bool }}"
        state: "{{ os_apt_maintenance_timer_state }}"
        daemon_reload: true

    - name: Ensure apt index refresh timer is enabled and started
      ansible.builtin.systemd:
        name: "{{ os_apt_maintenance_refresh_service_name }}.timer"
        enabled: "{{ os_apt_maintenance_refresh_timer_enabled | bool }}"
        state: "{{ os_apt_maintenance_refresh_timer_state }}"
        daemon_reload: true
      when: os_apt_maintenance_refresh_enabled | bool

    # Turning the refresh off must actually stop it. Leaving the units on disk
    # would keep a disabled-in-inventory timer firing until someone noticed.
    - name: Stop apt index refresh timer when disabled
      ansible.builtin.systemd:
        name: "{{ os_apt_maintenance_refresh_service_name }}.timer"
        enabled: false
        state: stopped
      failed_when: false
      when: not os_apt_maintenance_refresh_enabled | bool

    - name: Remove apt index refresh units when disabled
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ os_apt_maintenance_refresh_service_name }}.{{ item }}"
        state: absent
      loop:
        - service
        - timer
      notify: reload systemd
      when: not os_apt_maintenance_refresh_enabled | bool

    - name: Ensure apt maintenance endpoint is enabled and running
      ansible.builtin.systemd:
        name: "{{ os_apt_maintenance_endpoint_service_name }}"
        enabled: true
        state: started
        daemon_reload: true
      when: os_apt_maintenance_endpoint_enabled | bool

    - name: Apply a pending endpoint implementation switch before verifying it
      ansible.builtin.meta: flush_handlers

    # The endpoint runs the selected implementation and answers 401 with its
    # realm; then the metrics-httpd pin moves and old releases are pruned.
    - name: Verify the endpoint's HTTP server implementation
      ansible.builtin.include_role:
        name: local.ops_library.metrics_httpd_switch
        tasks_from: verify
      when: os_apt_maintenance_endpoint_enabled | bool
