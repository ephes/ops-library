---
# Wagtail deployment main tasks

- name: main | Validate inputs
  ansible.builtin.import_tasks: validate.yml

- name: main | Validate rsync-specific requirements
  ansible.builtin.assert:
    that:
      - wagtail_source_path is defined
      - wagtail_source_path | length > 0
      - wagtail_source_path != "/"
    fail_msg: "wagtail_source_path must be set when using rsync deployment"
  when: wagtail_deploy_method == "rsync"

- name: main | Validate git-specific requirements
  ansible.builtin.assert:
    that:
      - wagtail_git_repo is defined
      - wagtail_git_repo | length > 0
    fail_msg: "wagtail_git_repo must be set when using git deployment"
  when: wagtail_deploy_method == "git"

- name: main | Validate db_worker requirements
  ansible.builtin.assert:
    that:
      - wagtail_db_worker_backend | length > 0
      - wagtail_db_worker_id | length > 0
    fail_msg: "wagtail_db_worker_backend and wagtail_db_worker_id must be set when wagtail_db_worker_enabled is true"
  when: wagtail_db_worker_enabled | bool

- name: main | Provision PostgreSQL database and user
  ansible.builtin.include_tasks: postgres.yml

- name: main | Setup user and directories
  ansible.builtin.include_tasks: user.yml

- name: main | Deploy source code
  ansible.builtin.include_tasks: "source_{{ wagtail_deploy_method }}.yml"

- name: main | Ensure runtime cache directory exists after source deploy
  ansible.builtin.file:
    path: "{{ wagtail_cache_dir }}"
    state: directory
    owner: "{{ wagtail_user }}"
    group: "{{ wagtail_group }}"
    mode: "0755"

- name: main | Setup Python environment
  ansible.builtin.include_tasks: python.yml

- name: main | Configure Django application
  ansible.builtin.include_tasks: django.yml

- name: main | Setup systemd service
  ansible.builtin.include_tasks: service.yml

- name: main | Configure Traefik
  ansible.builtin.include_tasks: traefik.yml
  when: wagtail_traefik_enabled | bool
