---
# Setup Python environment for Wagtail

- name: python | Provision and verify managed runtime
  ansible.builtin.import_tasks: runtime.yml
  vars:
    wagtail_runtime_notify_restarts: true
    wagtail_runtime_install_bin: true

- name: python | Determine Python executable path
  ansible.builtin.command:
    cmd: "{{ wagtail_uv_path }} --no-config python find --managed-python --no-python-downloads {{ wagtail_python_version }}"
    chdir: "{{ wagtail_home }}"
  environment:
    HOME: "{{ wagtail_home }}"
  register: _wagtail_python_exec_path
  become: true
  become_user: "{{ wagtail_user }}"
  changed_when: false
  when: wagtail_python_version | length > 0

- name: python | Set Python executable fact
  ansible.builtin.set_fact:
    _wagtail_python_executable: "{{ _wagtail_python_exec_path.stdout | trim }}"
  when: wagtail_python_version | length > 0

- name: python | Set Python executable fact (fallback)
  ansible.builtin.set_fact:
    _wagtail_python_executable: "{{ wagtail_global_python }}"
  when: wagtail_python_version | length == 0

- name: python | Check existing virtualenv Python binary
  ansible.builtin.stat:
    path: "{{ wagtail_venv_path }}/bin/python"
  register: _wagtail_venv_python_stat

- name: python | Detect current virtualenv Python version
  ansible.builtin.command:
    cmd: "{{ wagtail_venv_path }}/bin/python --version"
  register: _wagtail_current_python_version
  changed_when: false
  failed_when: false
  when: _wagtail_venv_python_stat.stat.exists

- name: python | Set Python version mismatch fact
  ansible.builtin.set_fact:
    _wagtail_python_mismatch: >-
      {{ (_wagtail_current_python_version.stdout | default('')).split()[1] != wagtail_python_version }}
  when:
    - _wagtail_venv_python_stat.stat.exists
    - _wagtail_current_python_version.stdout is defined
    - wagtail_python_version | length > 0

- name: python | Remove broken virtualenv if Python is not usable
  ansible.builtin.file:
    path: "{{ wagtail_venv_path }}"
    state: absent
  when:
    - _wagtail_venv_python_stat.stat.exists
    - _wagtail_current_python_version.rc is defined
    - _wagtail_current_python_version.rc != 0

- name: python | Remove virtualenv if Python version changed
  ansible.builtin.file:
    path: "{{ wagtail_venv_path }}"
    state: absent
  when:
    - _wagtail_venv_python_stat.stat.exists
    - _wagtail_python_mismatch | default(false)

- name: python | Create virtual environment using uv
  ansible.builtin.command: "{{ wagtail_uv_path }} venv --python {{ _wagtail_python_executable }} {{ wagtail_venv_path }}"
  args:
    creates: "{{ wagtail_venv_path }}/bin/python"
  become: true
  become_user: "{{ wagtail_user }}"
  notify:
    - restart wagtail
    - restart wagtail db worker

- name: python | Create venv symlink
  ansible.builtin.file:
    src: "{{ wagtail_venv_path }}"
    dest: "{{ wagtail_site_path }}/venv"
    state: link
    owner: "{{ wagtail_user }}"
    group: "{{ wagtail_group }}"
    force: true

- name: python | Sync locked dependencies
  ansible.builtin.import_tasks: uv_sync.yml
