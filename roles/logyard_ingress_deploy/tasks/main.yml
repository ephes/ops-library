---
- name: Skip logyard_ingress_deploy when disabled
  ansible.builtin.debug:
    msg: "logyard_ingress_deploy skipped (logyard_ingress_enabled=false)."
  when: not logyard_ingress_enabled | bool

- name: Configure Logyard ingress
  when: logyard_ingress_enabled | bool
  block:
    - name: Validate required ingress variables
      ansible.builtin.assert:
        that:
          - logyard_ingress_host | length > 0
          - logyard_ingress_host != "logyard.example.com"
          - logyard_ingress_backend_url | length > 0
          - logyard_ingress_internal_ip_ranges | length > 0
          - not logyard_ingress_root_redirect_enabled | bool or logyard_ingress_root_redirect_url | length > 0
        fail_msg: >-
          Missing required logyard_ingress_* configuration. Ensure host, backend URL,
          internal IP ranges, and optional root redirect target are set.

    - name: Validate allowed Loki paths
      ansible.builtin.assert:
        that:
          - logyard_ingress_allowed_paths is sequence
          - logyard_ingress_allowed_paths is not string
          - logyard_ingress_allowed_paths | length > 0
        fail_msg: >-
          logyard_ingress_allowed_paths must be a non-empty list of
          {path, methods} entries.

    - name: Validate each allowed Loki path entry
      ansible.builtin.assert:
        that:
          - item is mapping
          - item.path is defined
          - item.path is string
          - item.path is match('^/[A-Za-z0-9._~/-]*$')
          - item.methods is defined
          - item.methods is sequence
          - item.methods is not string
          - item.methods | length > 0
          - item.methods | select('string') | select('match', '^[A-Z]+$') | list | length == item.methods | length
        fail_msg: >-
          Each logyard_ingress_allowed_paths entry needs an absolute path made of
          URL-safe characters and a non-empty list of upper-case HTTP methods.
        quiet: true
      loop: "{{ logyard_ingress_allowed_paths }}"
      loop_control:
        label: "{{ item.path | default(item) }}"

    - name: Ensure Traefik dynamic config directory exists
      ansible.builtin.file:
        path: "{{ logyard_ingress_traefik_config_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Render Traefik dynamic config for Logyard
      ansible.builtin.template:
        src: traefik-logyard.yml.j2
        dest: "{{ logyard_ingress_traefik_config_path }}"
        owner: root
        group: root
        mode: "0644"
