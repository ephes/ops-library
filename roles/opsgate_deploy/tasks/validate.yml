---
- name: validate | Ensure target host is macOS
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Darwin'
    fail_msg: "opsgate_deploy only supports macOS targets (launchd runtime model)."

- name: validate | Enforce fixed opsgate service name
  ansible.builtin.assert:
    that:
      - opsgate_service_name == 'opsgate'
    fail_msg: "Service name must remain fixed to 'opsgate'."

- name: validate | Ensure account model invariants
  ansible.builtin.assert:
    that:
      - ops_user | trim | length > 0
      - control_service_user | trim | length > 0
      - ops_user != control_service_user
      - ops_home_dir | trim | length > 0
      - control_service_home_dir | trim | length > 0
    fail_msg: >-
      OpsGate account model invalid. Runner must use ops user, API/UI must use control_service_user,
      and both homes must be set.

- name: validate | Ensure execution and artifact paths are configured
  ansible.builtin.assert:
    that:
      - execution_data_dir | trim | length > 0
      - tickets_dir | trim | length > 0
      - session_artifacts_dir | trim | length > 0
      - opsgate_app_dir | trim | length > 0
      - opsgate_runner_app_dir | trim | length > 0
      - opsgate_config_dir | trim | length > 0
      - opsgate_log_dir | trim | length > 0
      - opsgate_db_path | trim | length > 0
    fail_msg: "OpsGate path variables are incomplete."

- name: validate | Ensure app deployment inputs are configured
  ansible.builtin.assert:
    that:
      - opsgate_source_path | trim | length > 0
      - opsgate_uv_bin | trim | length > 0
    fail_msg: "OpsGate app deployment requires opsgate_source_path and opsgate_uv_bin."

- name: validate | Ensure GitHub deploy keys are a mapping
  ansible.builtin.assert:
    that:
      - opsgate_ops_github_deploy_keys is mapping
    fail_msg: "opsgate_ops_github_deploy_keys must be a mapping of workspace repository name to key pair."

- name: validate | Ensure workspace repo bootstrap inputs are coherent
  ansible.builtin.assert:
    that:
      - >-
        (opsgate_ops_github_ssh_private_key | trim | length == 0) ==
        (opsgate_ops_github_ssh_public_key | trim | length == 0)
      - not (opsgate_ops_manage_workspace_repos | bool) or (opsgate_ops_workspace_repositories | length > 0)
      - >-
        not (opsgate_ops_manage_workspace_repos | bool) or
        (
          (
            opsgate_ops_workspace_repositories
            | map(attribute='repo')
            | select('match', '^(git@github[.]com:|ssh://git@github[.]com/)')
            | list
            | length
          ) == 0
        ) or
        (
          opsgate_ops_github_ssh_private_key | trim | length > 0 and
          opsgate_ops_github_ssh_public_key | trim | length > 0
        ) or
        (
          opsgate_ops_workspace_repositories
          | selectattr('repo', 'match', '^(git@github[.]com:|ssh://git@github[.]com/)')
          | map(attribute='name')
          | reject('in', opsgate_ops_github_deploy_keys)
          | list
          | length
        ) == 0
      - >-
        not (opsgate_ops_manage_workspace_repos | bool) or
        (
          opsgate_ops_workspace_repositories
          | map(attribute='name')
          | reject('equalto', '')
          | list
          | length
        ) == (opsgate_ops_workspace_repositories | length)
      - >-
        not (opsgate_ops_manage_workspace_repos | bool) or
        (
          opsgate_ops_workspace_repositories
          | map(attribute='repo')
          | reject('equalto', '')
          | list
          | length
        ) == (opsgate_ops_workspace_repositories | length)
      - >-
        not (opsgate_ops_manage_workspace_repos | bool) or
        (
          opsgate_ops_workspace_repositories
          | map(attribute='name')
          | list
          | unique
          | length
        ) == (opsgate_ops_workspace_repositories | length)
    fail_msg: >-
      Workspace repo bootstrap requires non-empty unique repository names and non-empty repo URLs
      for each entry in opsgate_ops_workspace_repositories. Every GitHub SSH repository URL also
      requires either both opsgate_ops_github_ssh_private_key and opsgate_ops_github_ssh_public_key
      or an opsgate_ops_github_deploy_keys entry for that repository.

- name: validate | Ensure each GitHub deploy key belongs to a GitHub SSH workspace repository
  ansible.builtin.assert:
    that:
      - item.key is match('^[A-Za-z0-9._-]+$')
      - item.value is mapping
      - item.value.private_key | default('') | trim | length > 0
      - item.value.public_key | default('') | trim | length > 0
      - item.value.public_key | trim is not search('[\r\n]')
      - >-
        opsgate_ops_workspace_repositories
        | selectattr('name', 'equalto', item.key)
        | selectattr('repo', 'match', '^(git@github[.]com:|ssh://git@github[.]com/)')
        | list
        | length == 1
    fail_msg: >-
      opsgate_ops_github_deploy_keys entry {{ item.key }} needs a name of letters, digits, '.', '_'
      or '-', a non-empty private_key and a one-line public_key, and must name exactly one
      opsgate_ops_workspace_repositories entry with a GitHub SSH URL.
  loop: "{{ opsgate_ops_github_deploy_keys | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: validate | Ensure launchd labels and plist paths are set
  ansible.builtin.assert:
    that:
      - opsgate_api_launchd_label | trim | length > 0
      - opsgate_runner_launchd_label | trim | length > 0
      - opsgate_api_launchd_plist_path | trim | length > 0
      - opsgate_runner_launchd_plist_path | trim | length > 0
    fail_msg: "Launchd configuration is incomplete for opsgate api/runner daemons."

- name: validate | Ensure credential placeholders are not deployed
  ansible.builtin.assert:
    that:
      - "'CHANGEME' not in opsgate_ui_password_bcrypt"
      - opsgate_ui_password_bcrypt is match('^\\$2[aby]\\$.+')
      - "'CHANGEME' not in opsgate_submit_token_nyxmon"
      - "'CHANGEME' not in opsgate_submit_token_operator"
      - "'CHANGEME' not in opsgate_runner_token"
      - "'CHANGEME' not in opsgate_session_secret"
      - >-
        (opsgate_submit_token_openclaw | trim | length == 0) or
        (
          'CHANGEME' not in opsgate_submit_token_openclaw and
          (opsgate_submit_token_openclaw | trim | length >= 20)
        )
      - opsgate_submit_token_nyxmon | trim | length >= 20
      - opsgate_submit_token_operator | trim | length >= 20
      - opsgate_runner_token | trim | length >= 20
      - opsgate_session_secret | trim | length >= 20
    fail_msg: >-
      OpsGate credentials still contain placeholder values. Provide real (or at least non-placeholder)
      bcrypt/token values via ops-control secrets before deployment. OpenClaw submit token is optional in the current slice.

# Before anything changes on the host (rust/PLAN.md 10.1 step 1 of the opsgate
# repository): the switch values, and a release for any unit that runs Rust.
- name: validate | Ensure the implementation switch is coherent
  ansible.builtin.assert:
    that:
      - opsgate_api_impl in ['python', 'rust']
      - opsgate_runner_impl in ['python', 'rust']
      - opsgate_rust_version is string
      - >-
        opsgate_rust_version == '' or
        opsgate_rust_version is regex('^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$')
      - opsgate_rust_sha256 is string
      - opsgate_rust_sha256 == '' or opsgate_rust_sha256 is regex('^[0-9a-f]{64}$')
      - opsgate_rust_local_archive is string
      - >-
        opsgate_rust_version == '' or opsgate_rust_sha256 != '' or
        opsgate_rust_local_archive != ''
      - opsgate_rust_sha256 == '' or opsgate_rust_version != ''
      - opsgate_rust_local_archive == '' or opsgate_rust_version != ''
      - >-
        (opsgate_api_impl == 'python' and opsgate_runner_impl == 'python') or
        opsgate_rust_version != ''
      - opsgate_rust_release_url is string
      - opsgate_rust_local_archive != '' or opsgate_rust_release_url is regex('^https://')
      # Absolute and normalised: no '.', '..' or empty components, no trailing
      # slash, no characters a shell or a plist would need to quote.
      - opsgate_rust_install_root is string
      - opsgate_rust_install_root is regex('^(/[A-Za-z0-9_][A-Za-z0-9._-]*)+$')
      # rsync --delete owns the app dirs; an install below them would be wiped.
      - >-
        not ((opsgate_rust_install_root ~ '/')
        .startswith(opsgate_app_dir | regex_replace('/+$', '') ~ '/'))
      - >-
        not ((opsgate_rust_install_root ~ '/')
        .startswith(opsgate_runner_app_dir | regex_replace('/+$', '') ~ '/'))
      - opsgate_rust_keep_versions is not boolean
      - (opsgate_rust_keep_versions | string) is regex('^[0-9]+$')
      - opsgate_rust_keep_versions | int >= 1
      - (opsgate_launchd_verify_retries | string) is regex('^[0-9]+$')
      - opsgate_launchd_verify_retries | int >= 1
      - (opsgate_launchd_verify_delay | string) is regex('^[0-9]+$')
      - opsgate_launchd_python_plist_dir is string
      - opsgate_launchd_python_plist_dir is regex('^(/[A-Za-z0-9_][A-Za-z0-9._-]*)+$')
      - opsgate_launchd_python_plist_dir is not regex('^/(System/)?Library/Launch(Daemons|Agents)$')
    fail_msg: >-
      OpsGate implementation settings are invalid. opsgate_api_impl and
      opsgate_runner_impl must be python or rust (got {{ opsgate_api_impl }} and
      {{ opsgate_runner_impl }}); any rust needs opsgate_rust_version.
      opsgate_rust_version must be empty or a version such as 0.3.0 (got
      '{{ opsgate_rust_version }}') and needs opsgate_rust_sha256 (64 lowercase
      hex digits) or opsgate_rust_local_archive; a checksum or local archive
      without a version is refused. opsgate_rust_release_url must be an https
      URL. opsgate_rust_install_root must be a normalised absolute path other
      than / outside both app dirs, opsgate_rust_keep_versions a whole number
      >= 1, opsgate_launchd_verify_retries a whole number >= 1 and
      opsgate_launchd_verify_delay a whole number, opsgate_launchd_python_plist_dir a normalised absolute path that
      launchd does not load.
