---
# Validate the optional service token settings before they reach the .env
# file: a value FastDeploy cannot parse would stop the service from starting.
# This runs after the postgres_install meta dependency (as do the secret
# checks), but before .env is written or the service is restarted.
# The timestamp may use a space instead of "T" (an unquoted YAML timestamp
# becomes a datetime whose string form has one); the template writes "T".

- name: validate_service_token_settings | Check the legacy service token grace period
  when: fastdeploy_legacy_service_tokens_accepted_until | string | length > 0
  block:
    - name: validate_service_token_settings | Check the timestamp format
      ansible.builtin.assert:
        that:
          - >-
            fastdeploy_legacy_service_tokens_accepted_until | string
            is match('^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])[T ]([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9]([.][0-9]+)?)?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$')
        quiet: true

    # The format check allows impossible calendar dates (2026-02-30); parsing
    # the date part refuses them (and year 0000) like FastDeploy would.
    - name: validate_service_token_settings | Check the timestamp is a real date
      ansible.builtin.assert:
        that:
          - (fastdeploy_legacy_service_tokens_accepted_until | string)[:10] | to_datetime('%Y-%m-%d') is not none
        quiet: true
  rescue:
    - name: validate_service_token_settings | Refuse the legacy service token grace period
      ansible.builtin.fail:
        msg: >-
          fastdeploy_legacy_service_tokens_accepted_until must be an ISO 8601
          timestamp with a UTC offset, for example "2026-11-01T00:00:00+00:00"
          (got "{{ fastdeploy_legacy_service_tokens_accepted_until }}").

- name: validate_service_token_settings | Check the service token day counts
  ansible.builtin.assert:
    that:
      - item.value | string is match('^[1-9][0-9]*$')
    fail_msg: "{{ item.name }} must be a positive whole number of days (got \"{{ item.value }}\")."
    quiet: true
  loop:
    - name: fastdeploy_service_token_max_expire_days
      value: "{{ fastdeploy_service_token_max_expire_days }}"
    - name: fastdeploy_service_token_retention_days
      value: "{{ fastdeploy_service_token_retention_days }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.value | string | length > 0

# Names of users to create for legacy service tokens (see initialize.yml).
- name: validate_service_token_settings | Check the legacy token users
  ansible.builtin.assert:
    that:
      - fastdeploy_legacy_token_users is not string
      - fastdeploy_legacy_token_users is not mapping
      - fastdeploy_legacy_token_users is sequence
      - fastdeploy_legacy_token_users | reject('string') | list | length == 0
      - >-
        fastdeploy_legacy_token_users | select('string')
        | reject('match', '^[A-Za-z0-9][A-Za-z0-9._@-]{0,254}$') | list | length == 0
    fail_msg: >-
      fastdeploy_legacy_token_users must be a list of user names (letters,
      digits, ".", "_", "@", "-"; at most 255 characters).
    quiet: true

# SERVICE_TOKEN_ADMIN_USERS and RESTORE_POLICIES are written as JSON in single
# quotes: only plain names, buckets and prefixes (never a quote or line break) may reach them,
# and FastDeploy refuses to start on a policy it cannot parse.
- name: validate_service_token_settings | Check the service token admin users
  ansible.builtin.assert:
    that:
      - fastdeploy_service_token_admin_users is not string
      - fastdeploy_service_token_admin_users is not mapping
      - fastdeploy_service_token_admin_users is sequence
      - fastdeploy_service_token_admin_users | reject('string') | list | length == 0
      - >-
        fastdeploy_service_token_admin_users | select('string')
        | reject('match', '^[A-Za-z0-9][A-Za-z0-9._@-]{0,254}\Z') | list | length == 0
    fail_msg: >-
      fastdeploy_service_token_admin_users must be a list of user names (letters,
      digits, ".", "_", "@", "-"; at most 255 characters).
    quiet: true

- name: validate_service_token_settings | Check the restore policies are a mapping
  ansible.builtin.assert:
    that:
      - fastdeploy_restore_policies is mapping
    fail_msg: >-
      fastdeploy_restore_policies must map FastDeploy service names to
      {bucket: <bucket>, prefixes: [<prefix>/, ...]}.
    quiet: true

# FastDeploy's RestorePolicy: a lowercase S3 bucket name and a non-empty list
# of relative prefixes, each ending in "/".
- name: validate_service_token_settings | Check each restore policy
  ansible.builtin.assert:
    that:
      - item.key is string
      - item.key is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,254}\Z')
      - item.value is mapping
      - item.value.keys() | list | sort == ['bucket', 'prefixes']
      - item.value.bucket is string
      - item.value.bucket is match('^[a-z0-9][a-z0-9.-]*[a-z0-9]\Z')
      - item.value.prefixes is not string
      - item.value.prefixes is not mapping
      - item.value.prefixes is sequence
      - item.value.prefixes | length > 0
      - item.value.prefixes | reject('string') | list | length == 0
      - >-
        item.value.prefixes | select('string')
        | reject('match', '^[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*/\Z') | list | length == 0
    fail_msg: >-
      fastdeploy_restore_policies["{{ item.key }}"] must be {bucket: <lowercase
      bucket name>, prefixes: [<prefix>/, ...]} with at least one prefix; a
      prefix uses letters, digits, "_", "-" and "/" and ends in "/".
    quiet: true
  loop: "{{ fastdeploy_restore_policies | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
