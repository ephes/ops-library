---
- name: "Validate backup root"
  ansible.builtin.assert:
    that:
      - work_app_backup_root | length > 0
    fail_msg: "work_app_backup_root must be configured (typically derived from backup_root_prefix)"

- name: "Collect work app backup targets"
  ansible.builtin.stat:
    path: "{{ item.path }}"
  register: _work_app_backup_stats
  loop:
    - { name: "site", path: "{{ work_app_site_path }}", optional: false }
    - { name: "database", path: "{{ work_app_database_path }}", optional: true }
    - { name: "static", path: "{{ work_app_static_root }}", optional: true }
    - { name: "env", path: "{{ work_app_env_file }}", optional: true }
    - { name: "systemd", path: "{{ work_app_systemd_unit_path }}", optional: true }
    - { name: "traefik", path: "{{ work_app_traefik_config_path }}", optional: true }
  loop_control:
    label: "{{ item.name }}"

- name: "Build existence lookup"
  ansible.builtin.set_fact:
    work_app_backup_exists: "{{ work_app_backup_exists | default({}) | combine({item.item.name: item.stat.exists}) }}"
  loop: "{{ _work_app_backup_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: "Ensure required paths exist"
  ansible.builtin.assert:
    that:
      - (work_app_backup_exists.site | default(false)) | bool
    fail_msg: "work_app_site_path ({{ work_app_site_path }}) must exist on the target host"

- name: "Set backup timestamp"
  ansible.builtin.set_fact:
    work_app_backup_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"

- name: "Compute backup directory and archive"
  ansible.builtin.set_fact:
    work_app_backup_dir: "{{ work_app_backup_root }}/{{ work_app_backup_prefix }}-{{ work_app_backup_timestamp }}"
    work_app_backup_archive: "{{ work_app_backup_root }}/{{ work_app_backup_prefix }}-{{ work_app_backup_timestamp }}.{{ work_app_backup_archive_format }}"

- name: "Compute SQLite backup target"
  ansible.builtin.set_fact:
    work_app_backup_sqlite_target: "{{ work_app_backup_dir }}/database/{{ work_app_database_path | basename }}"

- name: "Ensure backup root exists"
  ansible.builtin.file:
    path: "{{ work_app_backup_root }}"
    state: directory
    owner: "{{ work_app_backup_owner }}"
    group: "{{ work_app_backup_group }}"
    mode: "{{ work_app_backup_dir_mode }}"

- name: "Ensure backup directory exists"
  ansible.builtin.file:
    path: "{{ work_app_backup_dir }}"
    state: directory
    owner: "{{ work_app_backup_owner }}"
    group: "{{ work_app_backup_group }}"
    mode: "{{ work_app_backup_dir_mode }}"

- name: "Ensure subdirectories exist"
  ansible.builtin.file:
    path: "{{ work_app_backup_dir }}/{{ item }}"
    state: directory
    owner: "{{ work_app_backup_owner }}"
    group: "{{ work_app_backup_group }}"
    mode: "{{ work_app_backup_dir_mode }}"
  loop:
    - database
    - static
    - configs
    - env

- name: "Detect ops-library galaxy file"
  ansible.builtin.stat:
    path: "{{ role_path | dirname | dirname }}/galaxy.yml"
  register: work_app_ops_library_galaxy

- name: "Determine ops-library version"
  ansible.builtin.set_fact:
    work_app_ops_library_version: "{{ (lookup('file', work_app_ops_library_galaxy.stat.path) | from_yaml).version }}"
  when:
    - work_app_ops_library_version is not defined
    - work_app_ops_library_galaxy.stat.exists

- name: "Default ops-library version when galaxy metadata missing"
  ansible.builtin.set_fact:
    work_app_ops_library_version: "{{ work_app_ops_library_version | default('unknown') }}"

- name: "Initialise SQLite backup mode"
  ansible.builtin.set_fact:
    work_app_backup_offline_required: "{{ work_app_backup_force_stop | bool }}"
    work_app_backup_sqlite_mode: "{{ 'offline' if work_app_backup_force_stop else 'hot' }}"

- when:
    - not work_app_backup_offline_required
    - work_app_backup_exists.database | default(false)
  block:
    - name: "Perform SQLite hot backup"
      ansible.builtin.command:
        cmd: >
          {{ work_app_backup_sqlite_command }} "{{ work_app_database_path }}"
          ".backup '{{ work_app_backup_sqlite_target }}'"
      register: work_app_backup_sqlite_result
      retries: "{{ work_app_backup_sqlite_retries }}"
      delay: 2
      until: work_app_backup_sqlite_result.rc == 0
      changed_when: true
  rescue:
    - name: "Fallback to offline backup mode"
      ansible.builtin.set_fact:
        work_app_backup_offline_required: true
        work_app_backup_sqlite_mode: offline

- when:
    - work_app_backup_offline_required
    - work_app_backup_exists.database | default(false)
  block:
    - name: "Stop Work app service for offline SQLite snapshot"
      ansible.builtin.systemd:
        name: "{{ work_app_service_name }}"
        state: stopped
      register: work_app_backup_systemd_stop

    - name: "Copy SQLite database file (offline)"
      ansible.builtin.command:
        cmd: >
          cp "{{ work_app_database_path }}" "{{ work_app_backup_sqlite_target }}"
      register: work_app_backup_sqlite_offline
      changed_when: true

  always:
    - name: "Ensure Work app service is running"
      ansible.builtin.systemd:
        name: "{{ work_app_service_name }}"
        state: started
      failed_when: false

- name: "Rsync work app static files"
  ansible.builtin.command:
    cmd: >
      rsync -a{{ ' --delete' if work_app_backup_rsync_use_delete else '' }}
      "{{ item.src }}/"
      "{{ item.dest }}/"
  loop:
    - { src: "{{ work_app_static_root }}", dest: "{{ work_app_backup_dir }}/static", enabled: "{{ work_app_backup_include_static }}", key: "static" }
  loop_control:
    label: "{{ item.src }}"
  when:
    - item.enabled | bool
    - work_app_backup_exists[item.key] | default(false)
  changed_when: true

- name: "Copy .env file"
  ansible.builtin.copy:
    src: "{{ work_app_env_file }}"
    dest: "{{ work_app_backup_dir }}/env/.env"
    owner: "{{ work_app_backup_owner }}"
    group: "{{ work_app_backup_group }}"
    mode: "{{ work_app_backup_file_mode }}"
    remote_src: true
  when:
    - work_app_backup_include_env | bool
    - work_app_backup_exists.env | default(false)

- name: "Copy systemd unit file"
  ansible.builtin.copy:
    src: "{{ work_app_systemd_unit_path }}"
    dest: "{{ work_app_backup_dir }}/configs/work-app.service"
    owner: "{{ work_app_backup_owner }}"
    group: "{{ work_app_backup_group }}"
    mode: "{{ work_app_backup_file_mode }}"
    remote_src: true
  when:
    - work_app_backup_include_systemd | bool
    - work_app_backup_exists.systemd | default(false)

- name: "Copy Traefik config"
  ansible.builtin.copy:
    src: "{{ work_app_traefik_config_path }}"
    dest: "{{ work_app_backup_dir }}/configs/traefik.yml"
    owner: "{{ work_app_backup_owner }}"
    group: "{{ work_app_backup_group }}"
    mode: "{{ work_app_backup_file_mode }}"
    remote_src: true
  when:
    - work_app_backup_include_traefik | bool
    - work_app_backup_exists.traefik | default(false)

- name: "Write backup metadata"
  ansible.builtin.copy:
    dest: "{{ work_app_backup_dir }}/metadata.yml"
    owner: "{{ work_app_backup_owner }}"
    group: "{{ work_app_backup_group }}"
    mode: "{{ work_app_backup_file_mode }}"
    content: |
      slug: "{{ work_app_slug }}"
      timestamp: "{{ work_app_backup_timestamp }}"
      host: "{{ inventory_hostname }}"
      ops_library_version: "{{ work_app_ops_library_version | default('unknown') }}"
      sqlite_mode: "{{ work_app_backup_sqlite_mode if work_app_backup_exists.database | default(false) else 'missing' }}"
      include_static: {{ work_app_backup_include_static | bool }}
      include_env: {{ work_app_backup_include_env | bool }}
      include_systemd: {{ work_app_backup_include_systemd | bool }}
      include_traefik: {{ work_app_backup_include_traefik | bool }}
      site_path: "{{ work_app_site_path }}"
      database_path: "{{ work_app_database_path }}"
      static_root: "{{ work_app_static_root }}"
      env_file: "{{ work_app_env_file }}"

- name: "Generate checksum manifest"
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ work_app_backup_dir }}"
    find . -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > manifest.sha256
  args:
    executable: /bin/bash
  when: work_app_backup_manifest_enabled | bool
  changed_when: true

- name: "Create archive"
  ansible.builtin.command:
    cmd: >
      tar -C "{{ work_app_backup_root }}"
      -czf "{{ work_app_backup_archive | basename }}"
      "{{ work_app_backup_dir | basename }}"
  when:
    - work_app_backup_create_archive | bool
    - work_app_backup_archive_format == 'tar.gz'
  args:
    chdir: "{{ work_app_backup_root }}"
  changed_when: true

- name: "Ensure local backup directory exists"
  ansible.builtin.file:
    path: "{{ work_app_backup_local_dir }}"
    state: directory
    mode: "{{ work_app_backup_local_dir_mode }}"
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - work_app_backup_fetch_local | bool
    - work_app_backup_create_archive | bool
    - work_app_backup_archive_format == 'tar.gz'

- name: "Fetch archive to control machine"
  ansible.builtin.fetch:
    src: "{{ work_app_backup_archive }}"
    dest: "{{ work_app_backup_local_dir }}/"
    flat: true
  run_once: true
  become: false
  when:
    - work_app_backup_fetch_local | bool
    - work_app_backup_create_archive | bool
    - work_app_backup_archive_format == 'tar.gz'
