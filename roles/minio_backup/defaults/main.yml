---
# MinIO backup role defaults

# Backup destination
minio_backup_root: /opt/backups/minio
minio_backup_prefix: manual
minio_backup_owner: root
minio_backup_group: root
minio_backup_dir_mode: "0700"
minio_backup_file_mode: "0600"

# MinIO installation paths (must mirror minio_deploy)
minio_user: minio
minio_group: minio
minio_bin_path: /usr/local/bin/minio
minio_env_file: /etc/default/minio
minio_service_unit: /etc/systemd/system/minio.service
minio_service_name: minio.service
minio_config_dir: /etc/minio
minio_certs_dir: "{{ minio_config_dir }}/certs"
minio_data_dirs:
  - /var/lib/minio/data
minio_tls_enable: false
minio_traefik_config_path: /etc/traefik/dynamic/minio.yml

# MinIO networking
minio_api_bind_host: 127.0.0.1
minio_api_port: 9001
minio_console_port: 9002

# Credentials (must be provided via ops-control secrets)
minio_root_user: ""
minio_root_password: ""

# MinIO Client (mc)
minio_mc_bin_path: /usr/local/bin/mc
minio_mc_version: "RELEASE.2025-08-13T08-35-41Z"
minio_mc_checksum: "sha256:01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891"
minio_mc_download_url: "https://dl.min.io/client/mc/release/linux-amd64/archive/mc.{{ minio_mc_version }}"
minio_mc_host_alias: minio_backup
minio_backup_mc_no_tls: true
minio_backup_mc_insecure: false
minio_backup_mc_ca_cert_path: ""

# Metadata export settings
minio_backup_export_iam: true
minio_backup_export_bucket_metadata: true
minio_backup_metadata_temp_dir: /tmp/minio-backup-metadata

# Inclusion flags
minio_backup_include_tls_certs: "{{ minio_tls_enable }}"
minio_backup_include_traefik: true

# Backup scope. false (default): metadata-only backup (IAM export, bucket
# metadata export incl. policies/versioning/lifecycle/replication config, env
# file, systemd unit, Traefik/TLS config); MinIO keeps running and no object
# data is copied. Object data is protected elsewhere (bucket replication and
# snapshots of the replica). true: cold backup, MinIO is stopped while every
# data directory is copied; it is refused when minio_backup_root lies on the
# root filesystem (a full copy there can fill the system disk). The IAM export
# contains secret keys: keep minio_backup_root root-only and on encrypted
# storage.
minio_backup_include_data: false

# Credential redaction. The bucket metadata export carries each remote
# target's access and secret key (for a replication target set up with root
# credentials, the root password). true (default): drop every
# bucket-targets.json from the export before it is stored. A restore then
# leaves existing remote targets alone; on a rebuilt MinIO re-run the
# replication setup, which creates the targets from the deployment secrets.
# The env file copy holds the root password too: with redaction the values of
# *PASSWORD*, *SECRET* and *TOKEN* keys become REDACTED-BY-MINIO-BACKUP and
# minio_restore refuses to put such a file back. It applies to the metadata
# scope only (the default there); a full-scope backup copies the env file
# unredacted for its full restore.
minio_backup_redact_target_secrets: true
minio_backup_redact_env_secrets: "{{ not (minio_backup_include_data | bool) }}"
minio_backup_python: python3
# Fail the run when the root password still appears in a snapshot file or
# ZIP member (metadata scope: the whole snapshot; full scope: the metadata
# exports). Only active together with the redaction it checks.
minio_backup_verify_secret_absent: true

# Free space required under minio_backup_root for a metadata-only backup.
minio_backup_metadata_min_free_bytes: 104857600

# Retention: keep this many of the newest "<prefix>-<timestamp>" backups
# (directory and archive) under minio_backup_root and delete older ones with
# the same prefix after a successful run. 0 keeps everything.
minio_backup_keep_count: 0

# Service handling
minio_backup_stop_timeout: 30

# Disk space validation
minio_backup_disk_check_enabled: true
minio_backup_disk_overhead_ratio: 1.5

# Rsync / archive behaviour
minio_backup_rsync_binary: rsync
minio_backup_use_delete: true
minio_backup_create_archive: true
minio_backup_archive_format: tar.gz  # tar.gz | tar.zst
minio_backup_generate_checksums: true

# Fetch archive back to controller
minio_backup_fetch_local: true
minio_backup_local_dir: "{{ lookup('env', 'HOME') }}/backups/minio"
minio_backup_local_dir_mode: "0700"

# Reporting
minio_backup_report_size: true
