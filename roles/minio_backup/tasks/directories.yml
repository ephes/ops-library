---
- name: Ensure backup root directory exists
  ansible.builtin.file:
    path: "{{ minio_backup_root }}"
    state: directory
    owner: "{{ minio_backup_owner }}"
    group: "{{ minio_backup_group }}"
    mode: "{{ minio_backup_dir_mode }}"

# Archives from runs before the archive tasks set 0600 can still be readable
# by other accounts. Tighten every archive directly in the backup root on each
# run (idempotent: only files that are not 0600 yet are touched).
- name: Find backup archives to restrict
  ansible.builtin.find:
    paths: "{{ minio_backup_root }}"
    patterns: ["*.tar", "*.tar.*", "*.tgz"]
    file_type: file
  register: minio_backup_archive_modes

- name: Restrict backup archives to owner-only
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0600"
  loop: "{{ minio_backup_archive_modes.files | rejectattr('mode', 'equalto', '0600') | list }}"
  loop_control:
    label: "{{ item.path }}"

- name: Ensure backup subdirectories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ minio_backup_owner }}"
    group: "{{ minio_backup_group }}"
    mode: "{{ minio_backup_dir_mode }}"
  loop: >-
    {{
      [minio_backup_dir, minio_backup_metadata_dir]
      + ([minio_backup_data_root] if (minio_backup_include_data | bool) else [])
      + [minio_backup_config_dir, minio_backup_systemd_dir, minio_backup_certs_dir, minio_backup_traefik_dir]
    }}
