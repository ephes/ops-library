---
- name: Compute repository settings
  ansible.builtin.set_fact:
    tailscale_repo_url: "{{ tailscale_repo_base }}/{{ tailscale_channel }}/{{ tailscale_repo_distro }}"
    tailscale_repo_key_url: "{{ tailscale_repo_base }}/{{ tailscale_channel }}/{{ tailscale_repo_distro }}/{{ tailscale_repo_release }}.noarmor.gpg"

- name: Ensure Tailscale repository key is installed
  ansible.builtin.get_url:
    url: "{{ tailscale_repo_key_url }}"
    dest: "{{ tailscale_repo_keyring }}"
    mode: "0644"
    force: true
  register: tailscale_repo_key

- name: Install python3-debian for deb822 repository support
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove legacy one-line Tailscale repository
  ansible.builtin.file:
    path: "{{ tailscale_repo_list_file }}"
    state: absent
  register: tailscale_legacy_repo

- name: Configure Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: "{{ tailscale_repo_name }}"
    types: deb
    uris: "{{ tailscale_repo_url }}"
    suites: "{{ tailscale_repo_release }}"
    components:
      - "{{ tailscale_repo_component }}"
    signed_by: "{{ tailscale_repo_keyring }}"
    enabled: true
    state: present
  register: tailscale_repo_config
