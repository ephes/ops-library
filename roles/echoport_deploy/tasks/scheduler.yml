---
# Setup scheduled backup and cleanup cron jobs for Echoport

- name: scheduler | Setup scheduled backup cron job
  ansible.builtin.cron:
    name: "Echoport scheduled backups"
    minute: "{{ echoport_scheduler_interval }}"
    hour: "*"
    job: >-
      cd {{ echoport_site_path }} &&
      DJANGO_SETTINGS_MODULE={{ echoport_django_settings_module }}
      {{ echoport_venv_bin }}/python manage.py run_scheduled_backups
      >> {{ echoport_home }}/logs/scheduler.log 2>&1
    user: "{{ echoport_user }}"
    state: "{{ 'present' if echoport_scheduler_enabled else 'absent' }}"

- name: scheduler | Create scheduler log file
  ansible.builtin.file:
    path: "{{ echoport_home }}/logs/scheduler.log"
    state: touch
    owner: "{{ echoport_user }}"
    group: "{{ echoport_group }}"
    mode: "0640"
    modification_time: preserve
    access_time: preserve
  when: echoport_scheduler_enabled

- name: scheduler | Require MinIO access for retention cleanup
  ansible.builtin.assert:
    that:
      - echoport_minio_alias | length > 0
      - echoport_minio_url | length > 0
      - echoport_minio_access_key | length > 0
      - echoport_minio_secret_key | length > 0
      - echoport_minio_secret_key != "CHANGEME"
    fail_msg: >-
      echoport_cleanup_enabled requires echoport_minio_url,
      echoport_minio_access_key and echoport_minio_secret_key so the cleanup
      job can delete expired archives as {{ echoport_user }}.
  when: echoport_cleanup_enabled

- name: scheduler | Read current mc alias for cleanup user
  ansible.builtin.command:
    argv:
      - "{{ echoport_minio_mc_path }}"
      - --json
      - alias
      - list
      - "{{ echoport_minio_alias }}"
  become: true
  become_user: "{{ echoport_user }}"
  register: _echoport_mc_alias_current
  changed_when: false
  failed_when: false
  no_log: true
  when: echoport_cleanup_enabled

- name: scheduler | Configure mc alias for cleanup user
  ansible.builtin.command:
    argv:
      - "{{ echoport_minio_mc_path }}"
      - alias
      - set
      - "{{ echoport_minio_alias }}"
      - "{{ echoport_minio_url }}"
      - "{{ echoport_minio_access_key }}"
      - "{{ echoport_minio_secret_key }}"
  become: true
  become_user: "{{ echoport_user }}"
  no_log: true
  vars:
    _echoport_mc_alias_json: >-
      {{
        (_echoport_mc_alias_current.stdout | default('') | from_json)
        if (_echoport_mc_alias_current.rc | default(1)) == 0
          and (_echoport_mc_alias_current.stdout | default('') | trim | length) > 0
        else {}
      }}
  when:
    - echoport_cleanup_enabled
    - >-
      _echoport_mc_alias_json.URL | default('') != echoport_minio_url
      or _echoport_mc_alias_json.accessKey | default('') != echoport_minio_access_key
      or _echoport_mc_alias_json.secretKey | default('') != echoport_minio_secret_key

- name: scheduler | Verify cleanup user can reach the MinIO bucket
  ansible.builtin.command:
    argv:
      - "{{ echoport_minio_mc_path }}"
      - ls
      - "{{ echoport_minio_alias }}/{{ echoport_minio_verify_bucket }}"
  become: true
  become_user: "{{ echoport_user }}"
  changed_when: false
  no_log: true
  when:
    - echoport_cleanup_enabled
    - echoport_minio_verify_bucket | length > 0

- name: scheduler | Setup cleanup cron job
  ansible.builtin.cron:
    name: "Echoport cleanup old backups"
    minute: "0"
    hour: "{{ echoport_cleanup_hour }}"
    job: >-
      cd {{ echoport_site_path }} &&
      DJANGO_SETTINGS_MODULE={{ echoport_django_settings_module }}
      {{ echoport_venv_bin }}/python manage.py cleanup_old_backups
      >> {{ echoport_home }}/logs/cleanup.log 2>&1
    user: "{{ echoport_user }}"
    state: "{{ 'present' if echoport_cleanup_enabled else 'absent' }}"

- name: scheduler | Create cleanup log file
  ansible.builtin.file:
    path: "{{ echoport_home }}/logs/cleanup.log"
    state: touch
    owner: "{{ echoport_user }}"
    group: "{{ echoport_group }}"
    mode: "0640"
    modification_time: preserve
    access_time: preserve
  when: echoport_cleanup_enabled

- name: scheduler | Deploy staging DB refresh helper script
  ansible.builtin.template:
    src: staging-db-refresh.sh.j2
    dest: "{{ echoport_site_path }}/staging-db-refresh.sh"
    owner: "{{ echoport_user }}"
    group: "{{ echoport_group }}"
    mode: "0750"
  when:
    - echoport_staging_db_refresh_enabled
    - echoport_staging_db_refresh_targets | length > 0

- name: scheduler | Setup staging DB refresh cron job
  ansible.builtin.cron:
    name: "Echoport staging DB refresh"
    minute: "{{ echoport_staging_db_refresh_minute }}"
    hour: "{{ echoport_staging_db_refresh_hour }}"
    job: >-
      cd {{ echoport_site_path }} &&
      {{ echoport_site_path }}/staging-db-refresh.sh
      >> {{ echoport_home }}/logs/staging-db-refresh.log 2>&1
    user: "{{ echoport_user }}"
    state: "{{ 'present' if (echoport_staging_db_refresh_enabled and (echoport_staging_db_refresh_targets | length > 0)) else 'absent' }}"

- name: scheduler | Create staging DB refresh log file
  ansible.builtin.file:
    path: "{{ echoport_home }}/logs/staging-db-refresh.log"
    state: touch
    owner: "{{ echoport_user }}"
    group: "{{ echoport_group }}"
    mode: "0640"
    modification_time: preserve
    access_time: preserve
  when:
    - echoport_staging_db_refresh_enabled
    - echoport_staging_db_refresh_targets | length > 0
