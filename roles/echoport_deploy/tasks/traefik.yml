---
# Configure Traefik for Echoport

- name: Ensure Traefik dynamic config directory exists
  file:
    path: /etc/traefik/dynamic
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Resolve basic auth password hash (reuse the deployed one while it matches)
  ansible.builtin.include_role:
    name: local.ops_library.webapp_deploy_internal
    tasks_from: traefik_basic_auth_hash
  vars:
    webapp_deploy_internal_basic_auth_user: "{{ echoport_basic_auth_user }}"
    webapp_deploy_internal_basic_auth_password: "{{ echoport_basic_auth_password }}"
    webapp_deploy_internal_basic_auth_config_path: "/etc/traefik/dynamic/echoport.yml"
    webapp_deploy_internal_basic_auth_hash_var: echoport_basic_auth_password_hash
  when:
    - echoport_basic_auth_enabled | bool

- name: Create Traefik configuration for Echoport
  template:
    src: traefik-echoport.yml.j2
    dest: /etc/traefik/dynamic/echoport.yml
    owner: root
    group: root
    mode: '0644'
  notify: reload traefik
