---
# Configure Django application
#
# The settings load {{ echoport_site_path }}/.env themselves, so management commands
# get SECRET_KEY and the FastDeploy token from that 0600 file. Secrets never go into a
# task environment: under become, Ansible puts those values into the command it hands
# to sudo, and sudo logs that command.

- name: Create environment file for Django
  template:
    src: echoport.env.j2
    dest: "{{ echoport_site_path }}/.env"
    owner: "{{ echoport_user }}"
    group: "{{ echoport_group }}"
    mode: '0600'
  notify: restart echoport

- name: Run Django migrations
  django_manage:
    command: migrate
    app_path: "{{ echoport_django_path }}"
    virtualenv: "{{ echoport_venv_path }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ echoport_django_settings_module }}"
  become_user: "{{ echoport_user }}"
  when: not echoport_skip_django_manage | default(false)
  no_log: true

- name: Collect static files
  django_manage:
    command: collectstatic
    app_path: "{{ echoport_django_path }}"
    virtualenv: "{{ echoport_venv_path }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ echoport_django_settings_module }}"
  become_user: "{{ echoport_user }}"
  when: not echoport_skip_django_manage | default(false)
  no_log: true

- name: Ensure admin user exists
  ansible.builtin.shell:
    cmd: |
      # Lossless: stdin is 'x' + value with no added newline (never empty, so the
      # command never inherits another stdin); both sentinels are stripped.
      ADMIN_PASSWORD=$(cat; printf x)
      ADMIN_PASSWORD=${ADMIN_PASSWORD%x}
      ADMIN_PASSWORD=${ADMIN_PASSWORD#x}
      export ADMIN_PASSWORD
      exec {{ (echoport_venv_path ~ '/bin/python') | quote }} manage.py ensure_superuser
    stdin: "x{{ echoport_admin_password }}"
    stdin_add_newline: false
    chdir: "{{ echoport_django_path }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ echoport_django_settings_module }}"
    ADMIN_USERNAME: "{{ echoport_admin_username }}"
    ADMIN_EMAIL: "{{ echoport_admin_email | default('') }}"
  become_user: "{{ echoport_user }}"
  register: echoport_ensure_superuser
  changed_when: >-
    'Created superuser' in echoport_ensure_superuser.stdout
    or 'Updated superuser' in echoport_ensure_superuser.stdout
  when:
    - not echoport_skip_django_manage | default(false)
    - echoport_admin_username is defined
    - echoport_admin_password is defined
  no_log: true
