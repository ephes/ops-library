---
- name: Require explicit removal with clients quiesced
  ansible.builtin.assert:
    that:
      - daybook_operations_api_remove_confirmed | bool
      - daybook_operations_api_remove_clients_quiesced | bool
    fail_msg: Quiesce clients and confirm removal; database and replay evidence are retained.
- name: Inspect installed service units
  ansible.builtin.service_facts:

- name: Stop and disable operations services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: [daybook-operations, daybook-operations-reconcile]
  when: (item + '.service') in ansible_facts.services
- name: Remove service entry points while preserving all data and credentials
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/daybook-operations.service
    - /etc/systemd/system/daybook-operations-reconcile.service
    - /etc/traefik/dynamic/daybook-operations.yml
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
