---
# Echoport backup role defaults

# Service identity for FastDeploy registration
echoport_backup_service_name: "echoport-backup"
echoport_backup_service_description: "Echoport backup service - backs up SQLite databases and files to MinIO"

# FastDeploy paths
echoport_backup_fastdeploy_root: "/home/fastdeploy/site"
echoport_backup_fastdeploy_user: "fastdeploy"
echoport_backup_deploy_user: "deploy"  # User that FastDeploy runs scripts as
echoport_backup_services_root: "services"
echoport_backup_service_dir: "{{ echoport_backup_fastdeploy_root }}/{{ echoport_backup_services_root }}/{{ echoport_backup_service_name }}"

# Runner user (who executes the backup)
echoport_backup_user: "root"
echoport_backup_group: "root"

# MinIO configuration
echoport_backup_minio_alias: "minio"
echoport_backup_minio_url: ""  # Must be provided
echoport_backup_minio_access_key: ""  # Must be provided
echoport_backup_minio_secret_key: ""  # Must be provided
echoport_backup_default_bucket: "backups"
# OS users whose mc configuration gets the alias (tasks/minio_alias.yml).
echoport_backup_minio_alias_users:
  - "{{ echoport_backup_user }}"
# Aliases to remove from those users' mc configuration, for example the shared
# alias a per-target alias replaces.
echoport_backup_minio_retired_aliases: []
# Per-target aliases of the generic runner, by first segment of the object key
# (Echoport's key prefix is the target name), e.g. {nyxmon: backup-nyxmon}.
# A key without an entry uses echoport_backup_minio_alias.
echoport_backup_minio_prefix_aliases: {}

# mc (MinIO client) installation
echoport_backup_mc_install_path: "/usr/local/bin/mc"
echoport_backup_mc_version: "RELEASE.2025-08-13T08-35-41Z"
# https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z.sha256sum
echoport_backup_mc_checksum: "sha256:01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891"
echoport_backup_mc_download_url: "https://github.com/minio/mc/releases/download/{{ echoport_backup_mc_version }}/mc.linux-amd64.{{ echoport_backup_mc_version }}"

# Temporary directory for backup operations
echoport_backup_temp_dir: "/tmp/echoport-backup"

# Security: Allowed backup path roots (defense-in-depth)
# Only paths under these directories can be backed up.
# This prevents potential file exfiltration if config is compromised.
echoport_backup_allowed_roots:
  - "/home/"
  - "/opt/"
  - "/var/lib/"

# FastDeploy API (for sync)
echoport_backup_api_base: "http://localhost:8000"
echoport_backup_api_token: ""
echoport_backup_sync_services: true
