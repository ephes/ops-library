---
# Echoport backup role - registers backup service with FastDeploy

- name: Ensure sqlite3 is installed
  ansible.builtin.package:
    name: sqlite3
    state: present

- name: Install pinned and verified mc client
  ansible.builtin.include_role:
    name: local.ops_library.minio_backup
    tasks_from: mc_install
  vars:
    minio_mc_version: "{{ echoport_backup_mc_version }}"
    minio_mc_checksum: "{{ echoport_backup_mc_checksum }}"
    minio_mc_bin_path: "{{ echoport_backup_mc_install_path }}"
    minio_mc_download_url: "{{ echoport_backup_mc_download_url }}"

- name: Configure mc alias for MinIO
  ansible.builtin.include_tasks: minio_alias.yml
  when:
    - echoport_backup_minio_url | length > 0
    - echoport_backup_minio_access_key | length > 0
    - echoport_backup_minio_secret_key | length > 0

# The runner runs as root (echoport_backup_user) through FastDeploy's sudo
# chain, so it lives in a root-owned directory outside FastDeploy's site
# (fastdeploy_runner role); config.json names that fixed path.
- name: Remember the runner template of this role
  ansible.builtin.set_fact:
    echoport_backup_runner_template: "{{ role_path }}/templates/backup.py.j2"

- name: Install the backup runner and register it with FastDeploy
  ansible.builtin.include_role:
    name: local.ops_library.fastdeploy_runner
  vars:
    fastdeploy_runner_service: "{{ echoport_backup_service_name }}"
    fastdeploy_runner_description: "{{ echoport_backup_service_description }}"
    fastdeploy_runner_steps: [init, backup, download, upload, verify, extract, stop, restore, start, result]
    fastdeploy_runner_template: "{{ echoport_backup_runner_template }}"
    fastdeploy_runner_libexec_root: "{{ echoport_backup_libexec_root }}"
    fastdeploy_runner_fastdeploy_root: "{{ echoport_backup_fastdeploy_root }}"
    fastdeploy_runner_services_root: "{{ echoport_backup_fastdeploy_root }}/{{ echoport_backup_services_root }}"
    fastdeploy_runner_config_dir: "{{ echoport_backup_service_dir }}"
    fastdeploy_runner_fastdeploy_user: "{{ echoport_backup_fastdeploy_user }}"
    fastdeploy_runner_deploy_user: "{{ echoport_backup_deploy_user }}"
    fastdeploy_runner_run_as: "{{ echoport_backup_user }}"
    fastdeploy_runner_sudoers_file: /etc/sudoers.d/echoport_backup
    fastdeploy_runner_sync: "{{ echoport_backup_sync_services }}"
