---
# Install the runtime unit from the role's template and let the role's
# service.yml render, enable and start graphyard-web and graphyard-agent with
# the role defaults (runtime enabled). The programs the units start are stubs:
# a shell loop for granian, `manage.py start_agent` and the Rust agent, and a
# `docker` that succeeds unless /run/graphyard-runtime-test/fail-up exists.
# graphyard-control-requires carries the dependency the units had before
# (Requires= + After=) so verify.yml can show what changed.
- name: Converge
  hosts: all
  become: true

  vars:
    stub_loop: |
      #!/bin/sh
      while :; do sleep 3600; done

  tasks:
    - name: Load the role defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../defaults/main.yml"

    - name: Stat docker
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: runtime_deps_docker

    - name: Refuse an instance that has a real docker
      ansible.builtin.assert:
        that:
          - not runtime_deps_docker.stat.exists
        fail_msg: /usr/bin/docker exists; this scenario installs a stub there.

    - name: Create the graphyard user
      ansible.builtin.user:
        name: "{{ graphyard_user }}"
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Create the unit directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ graphyard_home }}"
        - "{{ graphyard_django_path }}"
        - "{{ graphyard_venv_bin }}"
        - "{{ graphyard_env_dir }}"
        - /opt/graphyard-agent/0.1.0

    - name: Write an empty env file
      ansible.builtin.copy:
        dest: "{{ graphyard_env_path }}"
        content: ""
        mode: "0640"
        group: "{{ graphyard_group }}"

    - name: Install the stub programs
      ansible.builtin.copy:
        dest: "{{ item }}"
        content: "{{ stub_loop }}"
        mode: "0755"
      loop:
        - "{{ graphyard_venv_bin }}/granian"
        - "{{ graphyard_venv_bin }}/python"
        - /opt/graphyard-agent/0.1.0/graphyard-agent

    - name: Install the docker stub
      ansible.builtin.copy:
        dest: /usr/bin/docker
        mode: "0755"
        content: |
          #!/bin/sh
          # `docker compose ... up` fails while the flag file exists.
          case " $* " in
            *" up "*)
              if [ -e /run/graphyard-runtime-test/fail-up ]; then
                echo "stub: compose up failed" >&2
                exit 1
              fi
              ;;
          esac
          exit 0

    - name: Install a docker.service stand-in
      ansible.builtin.copy:
        dest: /etc/systemd/system/docker.service
        mode: "0644"
        content: |
          [Unit]
          Description=docker.service stand-in for the graphyard runtime_deps scenario

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/true

    - name: Install the unit state reader
      ansible.builtin.copy:
        dest: /usr/local/bin/graphyard-unit-state
        mode: "0755"
        content: |
          #!/usr/bin/python3
          """Print the test units' state, or with `deps UNIT` that unit's dependencies, as JSON."""
          import json
          import subprocess
          import sys

          UNITS = {
              "runtime": "graphyard-runtime",
              "web": "graphyard-web",
              "agent": "graphyard-agent",
              "control": "graphyard-control-requires",
          }


          def show(unit, props):
              shown = subprocess.run(
                  ["systemctl", "show", unit, "-p", ",".join(props)],
                  capture_output=True, text=True, check=True,
              ).stdout
              return dict(line.split("=", 1) for line in shown.splitlines() if "=" in line)


          if sys.argv[1:2] == ["deps"]:
              props = ["Requires", "Requisite", "BindsTo", "PartOf", "Wants", "After"]
              print(json.dumps({k: v.split() for k, v in show(sys.argv[2], props).items()}))
              sys.exit(0)

          state = {}
          for key, unit in UNITS.items():
              props = show(unit, [
                  "ActiveState", "MainPID",
                  "ActiveEnterTimestampMonotonic", "ExecMainStartTimestampMonotonic",
              ])
              pid = int(props["MainPID"])
              cmd = ""
              if pid:
                  with open(f"/proc/{pid}/cmdline", "rb") as handle:
                      cmd = handle.read().replace(b"\0", b" ").decode().strip()
              state[key] = {
                  "state": props["ActiveState"],
                  "pid": pid,
                  "cmd": cmd,
                  "active_enter": int(props["ActiveEnterTimestampMonotonic"]),
                  "main_start": int(props["ExecMainStartTimestampMonotonic"]),
              }
          print(json.dumps(state))

    - name: Render the runtime unit from the role template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/graphyard-runtime.service.j2"
        dest: "/etc/systemd/system/{{ graphyard_runtime_service_name }}.service"
        mode: "0644"

    - name: Install the negative control with the previous dependency
      ansible.builtin.copy:
        dest: /etc/systemd/system/graphyard-control-requires.service
        mode: "0644"
        content: |
          [Unit]
          Description=Negative control: Requires= + After= on the graphyard runtime
          After={{ graphyard_runtime_service_name }}.service
          Requires={{ graphyard_runtime_service_name }}.service

          [Service]
          ExecStart=/bin/sh -c 'while :; do sleep 3600; done'

    - name: Enable and start the runtime and the control
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: "{{ item != 'graphyard-control-requires' }}"
        state: started
        daemon_reload: true
      loop:
        - "{{ graphyard_runtime_service_name }}"
        - graphyard-control-requires

    - name: Render, enable and start web and agent with the role
      ansible.builtin.include_role:
        name: graphyard_deploy
        tasks_from: service.yml
