---
# Configure Traefik for Homelab with dual router authentication

- name: Ensure Traefik dynamic config directory exists
  file:
    path: /etc/traefik/dynamic
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install apache2-utils for htpasswd
  package:
    name: apache2-utils
    state: present
  when:
    - ansible_facts['os_family'] == "Debian"
    - homelab_basic_auth_enabled

- name: Resolve basic auth password hash (reuse the deployed one while it matches)
  ansible.builtin.include_role:
    name: local.ops_library.webapp_deploy_internal
    tasks_from: traefik_basic_auth_hash
  vars:
    webapp_deploy_internal_basic_auth_user: "{{ homelab_basic_auth_user }}"
    webapp_deploy_internal_basic_auth_password: "{{ homelab_basic_auth_password }}"
    webapp_deploy_internal_basic_auth_config_path: "{{ homelab_traefik_config_path }}"
    webapp_deploy_internal_basic_auth_hash_var: homelab_basic_auth_password_hash
  when:
    - homelab_basic_auth_enabled | bool

- name: Create Traefik configuration for Homelab
  template:
    src: traefik.yml.j2
    dest: "{{ homelab_traefik_config_path }}"
    owner: root
    group: root
    mode: '0644'
  # Traefik automatically watches dynamic directory, no reload needed
