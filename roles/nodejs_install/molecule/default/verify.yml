---
- name: Verify
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Verify | Read node and npm versions as an unprivileged user
      ansible.builtin.command: "{{ item }} --version"
      loop:
        - node
        - npm
      become_user: nobody
      environment:
        HOME: /tmp
      register: verify_versions
      changed_when: false

    - name: Verify | Node.js 24 with its bundled npm is on PATH
      ansible.builtin.assert:
        that:
          - verify_versions.results[0].stdout is match('^v24\.')
          - verify_versions.results[1].stdout is match('^1[0-9]\.')

    - name: Verify | Gather package facts
      ansible.builtin.package_facts:

    - name: Verify | NodeSource nodejs replaced the distribution packages
      ansible.builtin.assert:
        that:
          - ansible_facts.packages['nodejs'][0].version is match('^24\.')
          - "'npm' not in ansible_facts.packages"

    - name: Verify | Exactly one NodeSource repository line is configured
      ansible.builtin.command: grep -rhc nodesource.com /etc/apt/sources.list.d/nodesource.list
      register: verify_repo_lines
      changed_when: false
      failed_when: verify_repo_lines.stdout != "1"

    - name: Verify | The apt pin makes NodeSource the nodejs candidate
      ansible.builtin.shell: |
        set -o pipefail
        apt-cache policy nodejs | grep -E 'Candidate:|^ +(\*\*\* )?[0-9].* [0-9]+$'
      args:
        executable: /bin/bash
      register: verify_policy
      changed_when: false
      failed_when: >-
        verify_policy.stdout is not search('Candidate: 24\.[^\n]*nodesource')
        or verify_policy.stdout is not search('24\.[^\n]*nodesource[^\n]* 700')
