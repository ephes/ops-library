---
# prepare.yml already deployed the relay with recipient rewrites enabled. This
# play applies only the final configuration, so the idempotence step re-runs
# exactly one configuration.
- name: Converge
  hosts: all
  become: true

  vars:
    mail_relay_domains:
      - "example.test"
    mail_relay_backend_host: "smtp.example.test"
    mail_relay_sasl_password: "relay-password"
    mail_relay_greylisting_enabled: false
    mail_relay_tls_enabled: false
    mail_relay_smtpd_tls_security_level: "none"
    mail_relay_mynetworks:
      - "127.0.0.0/8"
      - "[::1]/128"
    mail_relay_recipient_rewrites: []
    # Final state also exercises the filtering features. The local recursor
    # stays off: the container has no recursive resolver.
    mail_relay_verify_recipients: true
    mail_relay_postscreen_enabled: true
    mail_relay_postscreen_access_extra:
      - "192.0.2.10/32"
    mail_relay_submission_discard_spam: true

  tasks:
    - name: Converge | Apply role with the final configuration
      ansible.builtin.include_role:
        name: mail_relay_deploy
