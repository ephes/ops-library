---
- name: config | Render livekit.yaml
  ansible.builtin.template:
    src: livekit.yaml.j2
    dest: "{{ livekit_config_dir }}/livekit.yaml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart livekit

- name: config | Render egress.yaml
  ansible.builtin.template:
    src: egress.yaml.j2
    dest: "{{ livekit_config_dir }}/egress.yaml"
    owner: root
    group: root
    # The egress container runs as user "egress", whose primary group is root
    # (gid 0, `useradd -g root` in the upstream image), so group-read is enough.
    mode: "0640"
  no_log: true
  notify: restart livekit
