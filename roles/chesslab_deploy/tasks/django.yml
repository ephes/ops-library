---
# Management commands source the 0600 shell companion of the service environment and
# read the admin password from stdin. Under become, Ansible puts task environment
# values into the command it hands to sudo, and sudo logs that command.
- name: django | Run database migrations
  ansible.builtin.shell:
    cmd: |
      set -a
      . {{ (chesslab_env_path ~ '.shell') | quote }}
      set +a
      exec {{ (chesslab_venv_bin ~ '/python') | quote }} -m django migrate --noinput
  args:
    chdir: "{{ chesslab_site_path }}"
  become: true
  become_user: "{{ chesslab_user }}"
  register: chesslab_django_migrate_result
  changed_when: "'No migrations to apply' not in chesslab_django_migrate_result.stdout"
  no_log: true
  when: chesslab_run_migrations | bool

- name: django | Ensure Django app users exist
  ansible.builtin.shell:
    cmd: |
      set -a
      . {{ (chesslab_env_path ~ '.shell') | quote }}
      set +a
      # Lossless: stdin is 'x' + value with no added newline (never empty, so the
      # command never inherits another stdin); both sentinels are stripped.
      CHESSLAB_ADMIN_PASSWORD=$(cat; printf x)
      CHESSLAB_ADMIN_PASSWORD=${CHESSLAB_ADMIN_PASSWORD%x}
      CHESSLAB_ADMIN_PASSWORD=${CHESSLAB_ADMIN_PASSWORD#x}
      export CHESSLAB_ADMIN_PASSWORD
      exec {{ (chesslab_venv_bin ~ '/chesslab') | quote }} django ensure_admin \
        --username {{ item.username | quote }} \
        --lichess-username {{ (item.owner | default(item.lichess_username)) | quote }}
    stdin: "x{{ item.password }}"
    stdin_add_newline: false
  args:
    chdir: "{{ chesslab_site_path }}"
  become: true
  become_user: "{{ chesslab_user }}"
  loop: "{{ chesslab_users }}"
  changed_when: >
    'created' in chesslab_ensure_admin_result.stdout or
    'updated' in chesslab_ensure_admin_result.stdout
  register: chesslab_ensure_admin_result
  no_log: true
