---
- name: env | Render chesslab environment file
  ansible.builtin.template:
    src: chesslab.env.j2
    dest: "{{ chesslab_env_path }}"
    owner: "{{ chesslab_user }}"
    group: "{{ chesslab_group }}"
    mode: "0600"
  no_log: true
  notify:
    - restart chesslab

- name: env | Render management shell environment
  ansible.builtin.template:
    src: chesslab.env.j2
    dest: "{{ chesslab_env_path }}.shell"
    owner: "{{ chesslab_user }}"
    group: "{{ chesslab_group }}"
    mode: "0600"
  vars:
    task_shell_environment: true
  no_log: true
