---
# minecraft_java_restore - Start service after restore

- name: Start minecraft service
  ansible.builtin.systemd:
    name: "{{ minecraft_java_service_name }}"
    state: started
    enabled: true
  when: "'LoadState=loaded' in minecraft_restore_service_load.stdout_lines"

- name: Wait for server to start
  ansible.builtin.wait_for:
    port: "{{ minecraft_java_port }}"
    host: 127.0.0.1
    state: started
    timeout: 60
    delay: 5
  when: "'LoadState=loaded' in minecraft_restore_service_load.stdout_lines"

- name: Display start status
  ansible.builtin.debug:
    msg: |
      Service {{ 'started successfully' if 'LoadState=loaded' in minecraft_restore_service_load.stdout_lines else 'not found (run deploy first)' }}

      {% if 'LoadState=loaded' in minecraft_restore_service_load.stdout_lines %}
      The Minecraft server should now be accessible.
      Check status: systemctl status {{ minecraft_java_service_name }}
      Check logs: journalctl -u {{ minecraft_java_service_name }} -f
      {% endif %}
