---
- name: Verify
  hosts: all
  become: true
  gather_facts: true

  vars:
    traefik_binary_path: /usr/local/bin/traefik
    traefik_static_config: /etc/traefik/traefik.toml
    traefik_unit_path: /etc/systemd/system/traefik.service
    traefik_acme_storage: /etc/traefik/acme/acme.json
    traefik_http_port: 80

  tasks:
    - name: Verify | Traefik binary present
      ansible.builtin.stat:
        path: "{{ traefik_binary_path }}"
      register: traefik_bin

    - name: Verify | Assert binary exists
      ansible.builtin.assert:
        that:
          - traefik_bin.stat.exists
        fail_msg: "Traefik binary missing at {{ traefik_binary_path }}"

    - name: Verify | Static config present
      ansible.builtin.stat:
        path: "{{ traefik_static_config }}"
      register: traefik_config

    - name: Verify | Assert config exists
      ansible.builtin.assert:
        that:
          - traefik_config.stat.exists
        fail_msg: "Traefik config missing at {{ traefik_static_config }}"

    - name: Verify | Unit file present
      ansible.builtin.stat:
        path: "{{ traefik_unit_path }}"
      register: traefik_unit

    - name: Verify | Assert unit exists
      ansible.builtin.assert:
        that:
          - traefik_unit.stat.exists
        fail_msg: "Traefik unit missing at {{ traefik_unit_path }}"

    - name: Verify | ACME storage present
      ansible.builtin.stat:
        path: "{{ traefik_acme_storage }}"
      register: traefik_acme

    - name: Verify | Assert acme storage exists
      ansible.builtin.assert:
        that:
          - traefik_acme.stat.exists
        fail_msg: "ACME storage missing at {{ traefik_acme_storage }}"

    - name: Verify | Service is active
      ansible.builtin.command: systemctl is-active traefik
      register: traefik_status
      changed_when: false

    - name: Verify | Assert service active
      ansible.builtin.assert:
        that:
          - traefik_status.rc == 0
        fail_msg: "Traefik service is not active"

    # The role must have taken :80 away from the stock distro unit. `disabled`
    # is not sufficient - apt upgrades re-enable a disabled unit, so the trap
    # would silently re-arm on a host running unattended apt maintenance.
    - name: Verify | Read stock nginx enablement
      ansible.builtin.command: systemctl is-enabled nginx.service
      register: traefik_stock_nginx_enabled
      changed_when: false
      failed_when: false

    - name: Verify | Assert the stock nginx unit is masked
      ansible.builtin.assert:
        that:
          - "'masked' in traefik_stock_nginx_enabled.stdout"
        fail_msg: >-
          stock nginx.service is '{{ traefik_stock_nginx_enabled.stdout | trim }}',
          expected 'masked'; it would race Traefik for :80 at boot.
        success_msg: "Stock nginx.service is masked."

    - name: Verify | Read stock nginx activity
      ansible.builtin.command: systemctl is-active nginx.service
      register: traefik_stock_nginx_active
      changed_when: false
      failed_when: false

    - name: Verify | Assert the stock nginx unit is not running
      ansible.builtin.assert:
        that:
          - traefik_stock_nginx_active.stdout | trim != 'active'
        fail_msg: "stock nginx.service is still running and holding :80."

    - name: Verify | Traefik owns the HTTP entrypoint
      ansible.builtin.command: ss -lntp
      register: traefik_listeners
      changed_when: false

    - name: Verify | Assert Traefik holds port 80
      ansible.builtin.assert:
        that:
          - traefik_listeners.stdout is search(':' ~ traefik_http_port ~ '\\b.*traefik')
        fail_msg: >-
          Traefik does not hold port {{ traefik_http_port }}.
          Listeners: {{ traefik_listeners.stdout }}
        success_msg: "Traefik holds port {{ traefik_http_port }}."

    # The role must tolerate a referenced-but-absent unit rather than failing
    # the play on it.
    - name: Verify | Absent unit has no unit file to mask
      ansible.builtin.command: systemctl show apache2.service --property=LoadState --value
      register: traefik_absent_unit
      changed_when: false
      failed_when: false

    - name: Verify | Assert the absent unit was left alone
      ansible.builtin.assert:
        that:
          - "'not-found' in traefik_absent_unit.stdout"
        fail_msg: >-
          apache2.service unexpectedly exists; the dangling-unit case is not
          being exercised.
        success_msg: "Absent unit correctly skipped rather than failing the play."

    # Regression: the postrotate script ran `systemctl reload traefik`, which
    # fails because the unit has no ExecReload; `|| true` hid that and Traefik
    # kept writing to the renamed access.log.1. Rotate for real and check that
    # the running process, without a restart, writes to the fresh access.log
    # (reopened on SIGUSR1) and to traefik.log (copytruncate: Traefik never
    # reopens its own log).
    - name: Verify | Logrotate configuration parses
      ansible.builtin.command: logrotate --debug /etc/logrotate.d/traefik
      changed_when: false

    - name: Verify | Read Traefik main PID before rotation
      ansible.builtin.command: systemctl show traefik.service --property=MainPID --value
      register: traefik_pid_before
      changed_when: false

    # notifempty skips empty files; give both logs content to rotate.
    - name: Verify | Make sure both logs are non-empty
      ansible.builtin.shell: |
        set -eu
        for log in access.log traefik.log; do
          echo '{"molecule":"logrotate"}' >> "/var/log/traefik/$log"
        done
      changed_when: true

    - name: Verify | Force a Traefik log rotation
      ansible.builtin.command: logrotate --force /etc/logrotate.d/traefik
      changed_when: true

    - name: Verify | Rotated files exist
      ansible.builtin.stat:
        path: "/var/log/traefik/{{ item }}.1"
      register: traefik_rotated
      loop:
        - access.log
        - traefik.log

    - name: Verify | Assert both logs were rotated
      ansible.builtin.assert:
        that:
          - traefik_rotated.results | map(attribute='stat.exists') | min
        fail_msg: "logrotate did not rotate the Traefik logs"

    - name: Verify | Read the copied general log
      ansible.builtin.command: cat /var/log/traefik/traefik.log.1
      register: traefik_general_rotated
      changed_when: false

    - name: Verify | Assert copytruncate kept the general log content
      ansible.builtin.assert:
        that:
          - "'\"molecule\":\"logrotate\"' in traefik_general_rotated.stdout"
        fail_msg: "traefik.log.1 does not contain the marker written before rotation"

    - name: Verify | Wait until Traefik holds the fresh log files open
      ansible.builtin.shell: |
        set -euo pipefail
        pid=$(systemctl show traefik.service --property=MainPID --value)
        for fd in /proc/"$pid"/fd/*; do readlink "$fd" || true; done | grep '^/var/log/traefik/' | sort -u
      args:
        executable: /bin/bash
      register: traefik_open_logs
      changed_when: false
      until:
        - "'/var/log/traefik/access.log' in traefik_open_logs.stdout_lines"
        - "'/var/log/traefik/traefik.log' in traefik_open_logs.stdout_lines"
      retries: 10
      delay: 1

    # Traefik logs the SIGUSR1 it received into its general log. It writes
    # with O_APPEND, so after copytruncate the line lands at offset 0 instead
    # of leaving a NUL-filled hole the size of the old file.
    - name: Verify | Traefik writes the truncated general log from the start
      ansible.builtin.shell: |
        set -euo pipefail
        log=/var/log/traefik/traefik.log
        grep -qi 'rotation' "$log"
        test "$(tr -d '\000' < "$log" | wc -c)" -eq "$(wc -c < "$log")"
      args:
        executable: /bin/bash
      register: traefik_general_fresh
      changed_when: false
      until: traefik_general_fresh.rc == 0
      retries: 10
      delay: 1

    - name: Verify | Read Traefik main PID after rotation
      ansible.builtin.command: systemctl show traefik.service --property=MainPID --value
      register: traefik_pid_after
      changed_when: false

    - name: Verify | Assert Traefik reopened its logs without a restart
      ansible.builtin.assert:
        that:
          - traefik_pid_after.stdout == traefik_pid_before.stdout
          - traefik_open_logs.stdout_lines | select('search', '\\.log\\.1$') | list | length == 0
        fail_msg: >-
          Traefik (PID {{ traefik_pid_before.stdout }} -> {{ traefik_pid_after.stdout }})
          still holds {{ traefik_open_logs.stdout_lines }} after rotation.
        success_msg: "Traefik writes to the fresh access.log and to traefik.log."
