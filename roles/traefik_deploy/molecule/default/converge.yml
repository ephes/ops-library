---
- name: Converge
  hosts: all
  become: true

  vars:
    traefik_letsencrypt_email: "molecule@example.invalid"
    traefik_force_update: false
    traefik_configure_firewall: false
    traefik_dashboard_firewall_open: false

  pre_tasks:
    # Reproduce the production trap before the role runs: a distro web-server
    # package enables a stock unit that binds :80. Left alone it races Traefik
    # at boot and can take the host's whole ingress down.
    - name: Converge | Install a conflicting distro web server
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Converge | Ensure the stock unit is enabled and running
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started

    # Regression: a host can carry a dangling reference to a unit whose file is
    # gone. service_facts reports it identically to a real failed unit, and
    # acting on it fails with "Could not find the requested service". Reproduce
    # it by leaving apache2 referenced-but-absent.
    - name: Converge | Create a dangling reference to an absent unit
      ansible.builtin.shell: |
        systemctl start apache2.service 2>/dev/null || true
        systemctl --failed --no-legend | grep -q apache2 || true
      changed_when: false

  roles:
    - role: traefik_deploy
