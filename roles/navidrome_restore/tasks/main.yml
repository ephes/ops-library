---
# Navidrome restore tasks
#
# Safety contract:
# - the archive is unpacked and checked in staging before Navidrome stops;
# - the stop must succeed (Navidrome is confirmed inactive);
# - the config file, systemd unit and Traefik file are copied to the safety
#   directory;
# - the live data directory is renamed to `<dir>.pre-restore-<ts>` instead of
#   being overwritten with rsync --delete, and the archive is restored into a
#   fresh directory;
# - any failure moves the old directory and files back and starts Navidrome
#   again; a successful run keeps only this run's pre-restore copies;
# - the staging directory is removed in `always`.

- name: Validate restore inputs
  ansible.builtin.assert:
    that:
      - navidrome_restore_root | length > 0
      - navidrome_restore_archive | length > 0
      - navidrome_restore_safety_root is match('^/.*[^/]')
    fail_msg: >-
      navidrome_restore_root and navidrome_restore_archive are required, and
      navidrome_restore_safety_root must be an absolute path other than /

- name: Determine Navidrome archive when set to latest
  ansible.builtin.find:
    paths: "{{ navidrome_restore_root }}"
    patterns: "*.{{ navidrome_backup_archive_extension }}"
    file_type: file
  register: navidrome_restore_candidates
  when: navidrome_restore_archive == "latest"

- name: Select Navidrome archive
  ansible.builtin.set_fact:
    navidrome_restore_selected_archive: >-
      {{ (navidrome_restore_candidates.files | sort(attribute='mtime', reverse=true) | first).path
         if navidrome_restore_archive == "latest"
         else (navidrome_restore_archive if navidrome_restore_archive.startswith('/') else navidrome_restore_root ~ '/' ~ navidrome_restore_archive) }}
  when: navidrome_restore_archive != 'latest' or (navidrome_restore_candidates.files | length > 0)

- name: Fail when no archive is available
  ansible.builtin.fail:
    msg: "No Navidrome backup archives found in {{ navidrome_restore_root }}"
  when:
    - (navidrome_restore_selected_archive | default('')) | length == 0

- name: Ensure archive exists
  ansible.builtin.stat:
    path: "{{ navidrome_restore_selected_archive }}"
  register: navidrome_restore_selected_stat

- name: Abort on missing archive
  ansible.builtin.fail:
    msg: "Navidrome restore archive not found: {{ navidrome_restore_selected_archive }}"
  when: not navidrome_restore_selected_stat.stat.exists

- name: Fix the safety copy timestamp
  ansible.builtin.set_fact:
    navidrome_restore_timestamp: "{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}"

- name: Name the safety copies
  ansible.builtin.set_fact:
    navidrome_restore_safety_root_clean: "{{ navidrome_restore_safety_root | regex_replace('/+$', '') }}"
    navidrome_restore_safety_dir: "{{ navidrome_restore_safety_root | regex_replace('/+$', '') }}/{{ navidrome_restore_timestamp }}"

- name: Restore with staging cleanup
  block:
    - name: Reset staging directory
      ansible.builtin.file:
        path: "{{ navidrome_restore_staging_dir }}"
        state: absent

    - name: Create staging directory
      ansible.builtin.file:
        path: "{{ navidrome_restore_staging_dir }}"
        state: directory
        mode: "0700"

    - name: Unpack Navidrome archive into staging
      ansible.builtin.unarchive:
        src: "{{ navidrome_restore_selected_archive }}"
        dest: "{{ navidrome_restore_staging_dir }}"
        remote_src: true

    - name: Locate extracted payload directory
      ansible.builtin.find:
        paths: "{{ navidrome_restore_staging_dir }}"
        file_type: directory
        depth: 1
      register: navidrome_restore_payload_dirs

    - name: Set Navidrome payload path
      ansible.builtin.set_fact:
        navidrome_restore_payload_dir: "{{ (navidrome_restore_payload_dirs.files | map(attribute='path') | list | first) | default('') }}"

    - name: Abort when payload directory missing
      ansible.builtin.fail:
        msg: "Unable to locate payload directory inside restore archive"
      when: navidrome_restore_payload_dir | length == 0

    - name: Gather payload content facts
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: navidrome_restore_payload_stats
      loop:
        - { path: "{{ navidrome_restore_payload_dir }}/data", label: "data" }
        - { path: "{{ navidrome_restore_payload_dir }}/config/{{ navidrome_config_path | basename }}", label: "config" }
        - { path: "{{ navidrome_restore_payload_dir }}/systemd/{{ navidrome_service_unit | basename }}", label: "systemd unit" }
        - { path: "{{ navidrome_restore_payload_dir }}/traefik/{{ navidrome_traefik_config_path | basename }}", label: "traefik config" }
        - { path: "{{ navidrome_restore_payload_dir }}/logs", label: "logs" }
      loop_control:
        label: "{{ item.label }}"

    - name: Abort when Navidrome data payload is missing
      ansible.builtin.fail:
        msg: "Navidrome data directory missing inside archive: {{ navidrome_restore_payload_dir }}/data"
      when: not (navidrome_restore_payload_stats.results[0].stat.isdir | default(false))

    - name: Ensure Navidrome directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ navidrome_data_dir }}", owner: "{{ navidrome_user }}", group: "{{ navidrome_group }}", mode: "0750" }
        - { path: "{{ navidrome_cache_dir }}", owner: "{{ navidrome_user }}", group: "{{ navidrome_group }}", mode: "0750" }
        - { path: "{{ navidrome_log_dir }}", owner: "{{ navidrome_user }}", group: "{{ navidrome_group }}", mode: "0750" }
        - { path: "{{ navidrome_config_path | dirname }}", owner: "root", group: "root", mode: "0755" }
        - { path: "{{ navidrome_traefik_config_path | dirname }}", owner: "root", group: "root", mode: "0755" }

    - name: List the directories to keep aside
      ansible.builtin.set_fact:
        # path, owner, group, mode of the fresh directory
        navidrome_restore_aside_dirs:
          - ["{{ navidrome_data_dir }}", "{{ navidrome_user }}", "{{ navidrome_group }}", "0750"]
        navidrome_restore_config_files:
          - "{{ navidrome_config_path }}"
          - "{{ navidrome_service_unit }}"
          - "{{ navidrome_traefik_config_path }}"

    # --- Stop (fail closed) and copy the config files ---

    - name: Stop Navidrome and copy config files
      block:
        - name: Stop Navidrome before restore
          ansible.builtin.systemd:
            name: "{{ navidrome_service_name }}"
            state: stopped

        - name: Confirm Navidrome is stopped
          ansible.builtin.command:
            argv: [systemctl, is-active, "{{ navidrome_service_name }}"]
          register: navidrome_restore_stop_state
          changed_when: false
          failed_when: (navidrome_restore_stop_state.stdout | trim) not in ['inactive', 'failed']

        - name: Create safety directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            mode: "0700"
          loop:
            - "{{ navidrome_restore_safety_root_clean }}"
            - "{{ navidrome_restore_safety_dir }}"

        - name: Copy config files aside
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              files="$SAFETY_DIR/files"
              mkdir -p "$files"
              chmod 0700 "$files"
              : > "$SAFETY_DIR/files.manifest"
              while IFS= read -r path; do
                [ -n "$path" ] || continue
                printf '%s\n' "$path" >> "$SAFETY_DIR/files.manifest"
                if [ -e "$path" ] || [ -L "$path" ]; then
                  mkdir -p "$files$(dirname "$path")"
                  cp -a "$path" "$files$path"
                fi
              done <<< "$CONFIG_FILES"
              sync
            executable: /bin/bash
          environment:
            SAFETY_DIR: "{{ navidrome_restore_safety_dir }}"
            CONFIG_FILES: "{{ navidrome_restore_config_files | join('\n') }}"
          changed_when: true

      rescue:
        - name: Fail without restoring (live data untouched)
          ansible.builtin.fail:
            msg: >-
              Navidrome restore aborted before anything was overwritten
              ({{ ansible_failed_task.name | default('unknown task') }}): Navidrome did
              not stop or the config files could not be copied to
              {{ navidrome_restore_safety_dir }}. The live data is untouched. Navidrome
              may be stopped; start it with `systemctl start {{ navidrome_service_name }}`.

    # --- Move the live data aside and restore; any failure moves it back ---

    - name: Restore Navidrome with rollback
      block:
        - name: Move live data aside
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              mountinfo="${MOUNTINFO:-/proc/self/mountinfo}"
              dev() { stat -c %d -- "$1" 2>/dev/null || stat -f %d -- "$1"; }
              # has_mount DIR: DIR itself or anything inside it is a mount point. rm -rf
              # would delete the mounted files, so such a tree is never removed.
              has_mount() {
                local esc path
                # mountinfo lists canonical paths; resolve symlinked ancestors first.
                path="$(readlink -f -- "$1")" || return 0
                if [ -r "$mountinfo" ]; then
                  # mountinfo escapes space and backslash as octal.
                  esc="$(printf '%s' "$path" | sed -e 's/\\/\\134/g' -e 's/ /\\040/g')"
                  P="$esc" awk '$5 == ENVIRON["P"] || index($5, ENVIRON["P"] "/") == 1 { found = 1 } END { exit !found }' "$mountinfo"
                  return
                fi
                # Without a mount table: the root on another device than its parent, or
                # entries below it on other devices.
                [ "$(dev "$path")" != "$(dev "$(dirname -- "$path")")" ] && return 0
                [ "$(find "$path" 2>/dev/null | wc -l)" != "$(find "$path" -xdev 2>/dev/null | wc -l)" ]
              }
              # under A B: A is B or lies inside it.
              under() { case "$1/" in "$2"/*) return 0 ;; *) return 1 ;; esac; }
              safety="$(readlink -f -- "$SAFETY_DIR")"
              manifest="$SAFETY_DIR/dirs.manifest"
              done_list="$SAFETY_DIR/dirs.done"
              : > "$manifest"
              : > "$done_list"
              # Check every directory before the first one is touched.
              reals=()
              specs=()
              while IFS=$'\t' read -r dir owner group mode; do
                [ -n "$dir" ] || continue
                if [ ! -e "$dir" ] && [ ! -L "$dir" ]; then
                  # Recorded, so a failed restore removes what it created there.
                  printf '%s\t-\n' "$dir" >> "$manifest"
                  echo "nothing to keep: $dir does not exist"
                  continue
                fi
                real="$(readlink -f -- "$dir")"
                if [ ! -d "$real" ]; then
                  echo "$dir is not a directory" >&2
                  exit 1
                fi
                # The manifests must stay put while the directory moves.
                if under "$safety" "$real"; then
                  echo "the safety directory $safety lies inside $real" >&2
                  exit 1
                fi
                reals+=("$real")
                specs+=("$owner"$'\t'"$group"$'\t'"$mode")
              done <<< "$DIRS"
              plan=()
              for i in "${!reals[@]}"; do
                real="${reals[$i]}"
                # Each directory is moved on its own, so none may contain another.
                for j in "${!reals[@]}"; do
                  [ "$i" != "$j" ] || continue
                  if under "$real" "${reals[$j]}"; then
                    echo "$real is ${reals[$j]} or lies inside it; list only one of them" >&2
                    exit 1
                  fi
                done
                aside="$real.pre-restore-$STAMP"
                if [ -e "$aside" ] || [ -L "$aside" ]; then
                  echo "safety path already exists: $aside" >&2
                  exit 1
                fi
                # A rename is only free (and atomic) within one filesystem, and the
                # rollback removes and renames the directory even after a merge, so no
                # mount point of any kind (bind mounts share the parent's device).
                # Nested mounts too: the rollback deletes the restored (or merged) tree.
                if has_mount "$real" \
                  || { command -v mountpoint >/dev/null 2>&1 && mountpoint -q -- "$real"; }; then
                  echo "$real is or contains a mount point and cannot be moved aside" >&2
                  exit 1
                fi
                plan+=("$real"$'\t'"$aside"$'\t'"${specs[$i]}")
              done
              for entry in "${plan[@]}"; do
                IFS=$'\t' read -r real aside owner group mode <<< "$entry"
                printf '%s\t%s\n' "$real" "$aside" >> "$manifest"
                if [ "$KEEP_LIVE" = "true" ]; then
                  # The restore merges into the live tree, so keep a full copy.
                  cp -a -- "$real" "$aside"
                  printf '%s\t%s\n' "$real" "$aside" >> "$done_list"
                else
                  mv -- "$real" "$aside"
                  printf '%s\t%s\n' "$real" "$aside" >> "$done_list"
                  mkdir -- "$real"
                  chown -- "$owner:$group" "$real"
                  chmod -- "$mode" "$real"
                fi
                echo "kept $real as $aside"
              done
              sync
            executable: /bin/bash
          environment:
            SAFETY_DIR: "{{ navidrome_restore_safety_dir }}"
            STAMP: "{{ navidrome_restore_timestamp }}"
            KEEP_LIVE: "false"
            DIRS: "{{ navidrome_restore_aside_dirs | map('join', '\t') | join('\n') }}"
          register: navidrome_restore_aside
          changed_when: true

        - name: Restore Navidrome data directory
          ansible.builtin.command:
            argv: [rsync, -a, "{{ navidrome_restore_payload_dir }}/data/", "{{ navidrome_data_dir }}/"]
          changed_when: true

        - name: Restore Navidrome config file
          ansible.builtin.copy:
            src: "{{ navidrome_restore_payload_dir }}/config/{{ navidrome_config_path | basename }}"
            dest: "{{ navidrome_config_path }}"
            owner: root
            group: root
            mode: "0644"
            remote_src: true
          when: navidrome_restore_payload_stats.results[1].stat.exists

        - name: Restore Navidrome systemd unit when present
          ansible.builtin.copy:
            src: "{{ navidrome_restore_payload_dir }}/systemd/{{ navidrome_service_unit | basename }}"
            dest: "{{ navidrome_service_unit }}"
            owner: root
            group: root
            mode: "0644"
            remote_src: true
          register: navidrome_restore_unit_copy
          when: navidrome_restore_payload_stats.results[2].stat.exists

        - name: Restore Traefik configuration when present
          ansible.builtin.copy:
            src: "{{ navidrome_restore_payload_dir }}/traefik/{{ navidrome_traefik_config_path | basename }}"
            dest: "{{ navidrome_traefik_config_path }}"
            owner: root
            group: root
            mode: "0644"
            remote_src: true
          register: navidrome_restore_traefik_copy
          when: navidrome_restore_payload_stats.results[3].stat.exists

        # Logs are merged, not replaced, and not rolled back.
        - name: Restore Navidrome logs when present
          ansible.builtin.command:
            argv: [rsync, -a, "{{ navidrome_restore_payload_dir }}/logs/", "{{ navidrome_log_dir }}/"]
          changed_when: true
          when: navidrome_restore_payload_stats.results[4].stat.exists

        - name: Reload systemd if unit changed
          ansible.builtin.systemd:
            daemon_reload: true
          when: navidrome_restore_unit_copy is changed

        - name: Ensure Navidrome permissions on data directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: "{{ navidrome_user }}"
            group: "{{ navidrome_group }}"
            recurse: true
          loop:
            - "{{ navidrome_data_dir }}"
            - "{{ navidrome_cache_dir }}"
            - "{{ navidrome_log_dir }}"

        - name: Start Navidrome service after restore
          ansible.builtin.systemd:
            name: "{{ navidrome_service_name }}"
            enabled: true
            state: "{{ navidrome_restore_restart | bool | ternary('restarted', 'started') }}"
            daemon_reload: true

      rescue:
        - name: Make sure Navidrome is stopped before rolling back
          ansible.builtin.systemd:
            name: "{{ navidrome_service_name }}"
            state: stopped
          failed_when: false

        - name: Check that Navidrome is down before rolling back
          ansible.builtin.command:
            argv: [systemctl, is-active, "{{ navidrome_service_name }}"]
          register: navidrome_restore_rescue_state
          changed_when: false
          failed_when: false

        - name: Roll back data and config files
          ansible.builtin.shell:
            cmd: |
              set -uo pipefail
              mountinfo="${MOUNTINFO:-/proc/self/mountinfo}"
              dev() { stat -c %d -- "$1" 2>/dev/null || stat -f %d -- "$1"; }
              # has_mount DIR: DIR itself or anything inside it is a mount point. rm -rf
              # would delete the mounted files, so such a tree is never removed.
              has_mount() {
                local esc path
                # mountinfo lists canonical paths; resolve symlinked ancestors first.
                path="$(readlink -f -- "$1")" || return 0
                if [ -r "$mountinfo" ]; then
                  # mountinfo escapes space and backslash as octal.
                  esc="$(printf '%s' "$path" | sed -e 's/\\/\\134/g' -e 's/ /\\040/g')"
                  P="$esc" awk '$5 == ENVIRON["P"] || index($5, ENVIRON["P"] "/") == 1 { found = 1 } END { exit !found }' "$mountinfo"
                  return
                fi
                # Without a mount table: the root on another device than its parent, or
                # entries below it on other devices.
                [ "$(dev "$path")" != "$(dev "$(dirname -- "$path")")" ] && return 0
                [ "$(find "$path" 2>/dev/null | wc -l)" != "$(find "$path" -xdev 2>/dev/null | wc -l)" ]
              }
              failed=0
              manifest="$SAFETY_DIR/dirs.manifest"
              done_list="$SAFETY_DIR/dirs.done"
              if [ ! -f "$manifest" ]; then
                # Without the manifest nothing proves the live directories are in place.
                echo "rollback manifest $manifest is missing; check the directories by hand" >&2
                failed=1
              else
                while IFS=$'\t' read -r real aside; do
                  [ -n "$real" ] || continue
                  if [ "$aside" = "-" ]; then
                    # Did not exist before the restore: remove what the restore created.
                    if [ -L "$real" ]; then
                      echo "$real is a symlink now; remove the restored data by hand" >&2
                      failed=1
                    elif [ -e "$real" ]; then
                      if has_mount "$real"; then
                        echo "$real is or contains a mount point; not removed" >&2
                        failed=1
                      else
                        rm -rf -- "$real" || failed=1
                      fi
                    fi
                    continue
                  fi
                  if [ ! -e "$aside" ] && [ ! -L "$aside" ]; then
                    continue
                  fi
                  if [ ! -e "$real" ] && [ ! -L "$real" ]; then
                    mv -- "$aside" "$real" || failed=1
                  elif grep -Fxq -- "$real"$'\t'"$aside" "$done_list" 2>/dev/null; then
                    # $real holds only what this run restored from the archive.
                    if has_mount "$real"; then
                      echo "$real is or contains a mount point; not replaced, the old copy stays at $aside" >&2
                      failed=1
                    else
                      { rm -rf -- "$real" && mv -- "$aside" "$real"; } || failed=1
                    fi
                  else
                    # The copy did not finish; the live directory was never touched.
                    if has_mount "$aside"; then
                      echo "$aside is or contains a mount point; not removed" >&2
                      failed=1
                    else
                      rm -rf -- "$aside" || failed=1
                    fi
                  fi
                done < "$manifest"
              fi
              files="$SAFETY_DIR/files"
              if [ -s "$SAFETY_DIR/files.manifest" ]; then
                while IFS= read -r path; do
                  [ -n "$path" ] || continue
                  if [ -e "$files$path" ] || [ -L "$files$path" ]; then
                    { rm -f "$path" && cp -a "$files$path" "$path"; } || failed=1
                  else
                    rm -f "$path" || failed=1
                  fi
                done < "$SAFETY_DIR/files.manifest"
                systemctl daemon-reload || failed=1
              fi
              exit "$failed"
            executable: /bin/bash
          environment:
            SAFETY_DIR: "{{ navidrome_restore_safety_dir }}"
          register: navidrome_restore_rollback
          changed_when: true
          failed_when: false
          when: (navidrome_restore_rescue_state.stdout | default('') | trim) in ['inactive', 'failed']

        - name: Start Navidrome again on the old data
          ansible.builtin.systemd:
            name: "{{ navidrome_service_name }}"
            state: started
          register: navidrome_restore_rescue_start
          failed_when: false
          when: (navidrome_restore_rollback.rc | default(1)) == 0

        - name: Check whether Navidrome runs again
          ansible.builtin.command:
            argv: [systemctl, is-active, "{{ navidrome_service_name }}"]
          register: navidrome_restore_rescue_active
          changed_when: false
          failed_when: false
          when: navidrome_restore_rescue_start is not skipped

        - name: Fail after rollback
          ansible.builtin.fail:
            msg: >-
              Navidrome restore failed ({{ ansible_failed_task.name | default('unknown task') }}).
              Rollback: {{ 'SKIPPED - Navidrome could not be confirmed stopped; move the directory back by hand'
                if navidrome_restore_rollback is skipped
                else 'done' if navidrome_restore_rollback.rc == 0
                else 'FAILED: ' ~ (navidrome_restore_rollback.stderr | default('') | trim) }}.
              Navidrome {{ 'was started again on the old data'
                if (navidrome_restore_rescue_active.stdout | default('') | trim) == 'active'
                else 'is not running (check systemctl status)' }}.
              Pre-restore copies: the data directory as <dir>.pre-restore-{{ navidrome_restore_timestamp }}
              (moved back if the rollback is done), config files in {{ navidrome_restore_safety_dir }}/files.

    - name: Prune older pre-restore copies
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          shopt -s nullglob
          mountinfo="${MOUNTINFO:-/proc/self/mountinfo}"
          dev() { stat -c %d -- "$1" 2>/dev/null || stat -f %d -- "$1"; }
          # has_mount DIR: DIR itself or anything inside it is a mount point. rm -rf
          # would delete the mounted files, so such a tree is never removed.
          has_mount() {
            local esc path
            # mountinfo lists canonical paths; resolve symlinked ancestors first.
            path="$(readlink -f -- "$1")" || return 0
            if [ -r "$mountinfo" ]; then
              # mountinfo escapes space and backslash as octal.
              esc="$(printf '%s' "$path" | sed -e 's/\\/\\134/g' -e 's/ /\\040/g')"
              P="$esc" awk '$5 == ENVIRON["P"] || index($5, ENVIRON["P"] "/") == 1 { found = 1 } END { exit !found }' "$mountinfo"
              return
            fi
            # Without a mount table: the root on another device than its parent, or
            # entries below it on other devices.
            [ "$(dev "$path")" != "$(dev "$(dirname -- "$path")")" ] && return 0
            [ "$(find "$path" 2>/dev/null | wc -l)" != "$(find "$path" -xdev 2>/dev/null | wc -l)" ]
          }
          remove() {
            if has_mount "$1"; then
              echo "keeping $1: a mount point lies inside it; unmount it and remove the copy by hand" >&2
              return
            fi
            rm -rf -- "$1" || echo "could not remove $1" >&2
          }
          # Keep one generation: this run's copies. Failures here only warn.
          if [ -f "$SAFETY_DIR/dirs.done" ]; then
            while IFS=$'\t' read -r real aside; do
              [ -n "$real" ] || continue
              for old in "$real".pre-restore-[0-9]*T[0-9]*Z; do
                [ "$old" = "$aside" ] && continue
                remove "$old"
              done
            done < "$SAFETY_DIR/dirs.done"
          fi
          for old in "$SAFETY_ROOT"/[0-9]*T[0-9]*Z; do
            [ "$old" = "$SAFETY_DIR" ] && continue
            remove "$old"
          done
          exit 0
        executable: /bin/bash
      environment:
        SAFETY_DIR: "{{ navidrome_restore_safety_dir }}"
        SAFETY_ROOT: "{{ navidrome_restore_safety_root_clean }}"
      changed_when: true

    - name: Run full rescan after restore (optional)
      ansible.builtin.command:
        argv:
          - "{{ navidrome_bin_path }}"
          - --configfile
          - "{{ navidrome_config_path }}"
          - scan
          - --full
      register: navidrome_restore_rescan_cmd
      changed_when: navidrome_restore_rescan_cmd.rc == 0
      when: navidrome_restore_force_full_rescan | bool
      become_user: "{{ navidrome_user }}"

  always:
    - name: Cleanup Navidrome restore staging directory
      ansible.builtin.file:
        path: "{{ navidrome_restore_staging_dir }}"
        state: absent
      when: navidrome_restore_cleanup | bool

- name: Report restore completion
  ansible.builtin.debug:
    msg:
      - "Navidrome restored from {{ navidrome_restore_selected_archive }}."
      - "{{ navidrome_restore_aside.stdout_lines | default([]) | join('; ') }}"
      - "Config files before the restore: {{ navidrome_restore_safety_dir }}/files"
