---
# Default values for uv_install role

# Version and checksum must be updated together.
uv_version: "0.13.4"

# Installation directory (must be world-readable for all users to access uv)
uv_install_dir: "/usr/local/bin"
uv_install_owner: "root"
uv_install_group: "{{ 'wheel' if ansible_facts.os_family == 'Darwin' else 'root' }}"

# Whether to create system-wide symlinks (deprecated, use uv_install_dir instead)
uv_create_symlinks: false

# System-wide symlink location (deprecated, use uv_install_dir instead)
uv_symlink_dir: "/usr/local/bin"

# Whether to update if already installed and a specific version is requested
uv_update_existing: true

# Force reinstallation even if same version exists
uv_force_reinstall: false

uv_checksum:
  # https://github.com/astral-sh/uv/releases/download/0.13.4/uv-x86_64-unknown-linux-gnu.tar.gz.sha256
  x86_64-unknown-linux-gnu: "sha256:2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
  # https://github.com/astral-sh/uv/releases/download/0.13.4/uv-aarch64-unknown-linux-gnu.tar.gz.sha256
  aarch64-unknown-linux-gnu: "sha256:1ae72b4718729e2ccc4f1ae2c6d1e531ca8467800e0546e9130b3886023a60ab"
  # https://github.com/astral-sh/uv/releases/download/0.13.4/uv-x86_64-apple-darwin.tar.gz.sha256
  x86_64-apple-darwin: "sha256:7be2dcd316122f4b3e5a0a7889f6248266c14425374e105ff7dc9779184603a6"
  # https://github.com/astral-sh/uv/releases/download/0.13.4/uv-aarch64-apple-darwin.tar.gz.sha256
  aarch64-apple-darwin: "sha256:e0b1d4743ce64c55d9f0f4a444afa6b81125680070ee04e853fcd0f6c1ebf8f1"
