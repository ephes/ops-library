---
# Default values for uv_install role

# Version and checksum must be updated together.
uv_version: "0.13.0"

# Installation directory (must be world-readable for all users to access uv)
uv_install_dir: "/usr/local/bin"
uv_install_owner: "root"
uv_install_group: "{{ 'wheel' if ansible_facts.os_family == 'Darwin' else 'root' }}"

# Whether to create system-wide symlinks (deprecated, use uv_install_dir instead)
uv_create_symlinks: false

# System-wide symlink location (deprecated, use uv_install_dir instead)
uv_symlink_dir: "/usr/local/bin"

# Whether to update if already installed and a specific version is requested
uv_update_existing: true

# Force reinstallation even if same version exists
uv_force_reinstall: false

uv_checksum:
  # https://github.com/astral-sh/uv/releases/download/0.13.0/uv-x86_64-unknown-linux-gnu.tar.gz.sha256
  x86_64-unknown-linux-gnu: "sha256:1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"
  # https://github.com/astral-sh/uv/releases/download/0.13.0/uv-aarch64-unknown-linux-gnu.tar.gz.sha256
  aarch64-unknown-linux-gnu: "sha256:3ccfb6af6e242433eb552f7d9676abd5412c6595c497e990d9c8cb7b5bd4d2c3"
  # https://github.com/astral-sh/uv/releases/download/0.13.0/uv-x86_64-apple-darwin.tar.gz.sha256
  x86_64-apple-darwin: "sha256:5f44dcbde809b632f47c36fadb241cb4d6f9af71d0c8f172b5d2026d3dde742c"
  # https://github.com/astral-sh/uv/releases/download/0.13.0/uv-aarch64-apple-darwin.tar.gz.sha256
  aarch64-apple-darwin: "sha256:a9c1b29002cf3c83f07fa9cd8a887a3be0107d90e23189721221e7257db8e3d6"
