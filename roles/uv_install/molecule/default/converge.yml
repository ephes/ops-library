---
- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - name: Ensure remote temp directory exists
      ansible.builtin.file:
        path: /root/.ansible/tmp
        state: directory
        mode: "0700"
        owner: root
        group: root

    - name: Install verified archive prerequisites
      ansible.builtin.apt:
        name:
          - tar
          - gzip
          - ca-certificates
        state: present
        update_cache: true

  roles:
    - role: uv_install
