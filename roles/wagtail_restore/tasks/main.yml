---
# Wagtail restore tasks

- name: Validate restore inputs
  ansible.builtin.assert:
    that:
      - wagtail_service_name | length > 0
      - wagtail_restore_root | length > 0
      - wagtail_restore_archive | length > 0
      - wagtail_restore_postgres_database | length > 0
      - wagtail_restore_postgres_user | length > 0
      - wagtail_restore_postgres_password is defined
      - wagtail_restore_postgres_password | length > 0
      - wagtail_restore_postgres_password != "CHANGEME"
    fail_msg: "Missing required Wagtail restore variables or secrets."

- name: Refuse legacy PostgreSQL target options
  ansible.builtin.assert:
    that:
      - wagtail_restore_postgres_target_opts | length == 0
    fail_msg: "wagtail_restore_postgres_target_opts must be empty; transactional restore owns these options."

- name: Determine archive when set to latest
  ansible.builtin.find:
    paths: "{{ wagtail_restore_root }}"
    patterns: "*.{{ wagtail_restore_archive_extension }}"
    file_type: file
  register: wagtail_restore_candidates
  when: wagtail_restore_archive == "latest"

- name: Select restore archive
  ansible.builtin.set_fact:
    wagtail_restore_selected_archive: >-
      {{ (wagtail_restore_candidates.files | sort(attribute='mtime', reverse=true) | first).path
         if wagtail_restore_archive == 'latest' and (wagtail_restore_candidates.files | length > 0)
         else (wagtail_restore_archive if wagtail_restore_archive.startswith('/') else wagtail_restore_root ~ '/' ~ wagtail_restore_archive) }}

- name: Fail when no archive is available
  ansible.builtin.fail:
    msg: "No Wagtail backup archives found in {{ wagtail_restore_root }}"
  when:
    - wagtail_restore_archive == "latest"
    - (wagtail_restore_selected_archive | default('')) | length == 0

- name: Check selected archive or directory
  ansible.builtin.stat:
    path: "{{ wagtail_restore_selected_archive }}"
  register: wagtail_restore_archive_stat

- name: Abort on missing archive
  ansible.builtin.fail:
    msg: "Wagtail restore archive not found: {{ wagtail_restore_selected_archive }}"
  when: not wagtail_restore_archive_stat.stat.exists

- name: Validate preservation layout before staging changes
  ansible.builtin.include_tasks: "{{ role_path }}/../restore_preserve_internal/tasks/validate.yml"
  vars:
    restore_preserve_mutable_paths:
      - "{{ wagtail_site_path }}"
      - "{{ wagtail_restore_staging_dir }}"
    restore_preserve_source: "{{ wagtail_restore_selected_archive }}"

- name: Reset staging directory
  ansible.builtin.file:
    path: "{{ wagtail_restore_staging_dir }}"
    state: absent
  when: wagtail_restore_archive_stat.stat.isreg

- name: Create staging directory
  ansible.builtin.file:
    path: "{{ wagtail_restore_staging_dir }}"
    state: directory
    mode: "0700"
  when: wagtail_restore_archive_stat.stat.isreg

- name: Unpack restore archive
  ansible.builtin.unarchive:
    src: "{{ wagtail_restore_selected_archive }}"
    dest: "{{ wagtail_restore_staging_dir }}"
    remote_src: true
  when: wagtail_restore_archive_stat.stat.isreg

- name: Locate extracted payload directory
  ansible.builtin.find:
    paths: "{{ wagtail_restore_staging_dir }}"
    file_type: directory
    depth: 1
  register: wagtail_restore_payload_dirs
  when: wagtail_restore_archive_stat.stat.isreg

- name: Set payload path
  ansible.builtin.set_fact:
    wagtail_restore_payload_dir: >-
      {{ (wagtail_restore_payload_dirs.files | map(attribute='path') | list | first)
         if wagtail_restore_archive_stat.stat.isreg
         else wagtail_restore_selected_archive }}

- name: Abort when payload directory missing
  ansible.builtin.fail:
    msg: "Unable to locate payload directory inside restore archive"
  when:
    - wagtail_restore_archive_stat.stat.isreg
    - wagtail_restore_payload_dir | length == 0

- name: Validate database dump exists
  ansible.builtin.stat:
    path: "{{ wagtail_restore_payload_dir }}/database/{{ wagtail_restore_postgres_database }}.sql.gz"
  register: wagtail_restore_dump_stat

- name: Abort when database dump is missing
  ansible.builtin.fail:
    msg: "Database dump missing inside archive"
  when: not wagtail_restore_dump_stat.stat.exists

- name: Validate compressed SQL dump before stopping services
  ansible.builtin.shell: |
    set -euo pipefail
    gzip -t "$DUMP"
    gzip -dc "$DUMP" | tail -n 10 | grep -Fx -- '-- PostgreSQL database dump complete'
  args:
    executable: /bin/bash
  environment:
    DUMP: "{{ wagtail_restore_payload_dir }}/database/{{ wagtail_restore_postgres_database }}.sql.gz"
  changed_when: false

- name: Reset Wagtail recovery state for this invocation
  ansible.builtin.set_fact:
    wagtail_restore_database_touched: false
    wagtail_restore_safety_ready: false
    wagtail_restore_replacement_complete: false
    wagtail_restore_recovery_complete: false
    wagtail_restore_failed_task_name: "none"
    wagtail_restore_preserved: {}
    wagtail_restore_preserved_size: "dump incomplete"

- name: Check Wagtail site preservation before stopping writers
  ansible.builtin.include_tasks: "{{ role_path }}/../restore_preserve_internal/tasks/preflight.yml"
  vars:
    restore_preserve_path: "{{ wagtail_site_path }}"
    restore_preserve_empty: false
  when:
    - not wagtail_restore_dry_run | bool
    - not ansible_check_mode

- name: Skip destructive restore steps during dry run
  ansible.builtin.debug:
    msg: "wagtail_restore_dry_run=true - skipping service stop and database restore"
  when: wagtail_restore_dry_run | bool

- when: not wagtail_restore_dry_run | bool and not ansible_check_mode
  block:
    # Auxiliary units are stopped first, and deliberately not failed_when: false.
    # They are opt-in, so a unit that will not stop means the restore would drop
    # the database while it still holds a connection. Going first means such a
    # failure aborts with the database untouched and the web service still up.
    - name: Stop auxiliary Wagtail units before restore
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop: "{{ wagtail_restore_extra_systemd_units }}"
      when: wagtail_restore_stop_service | bool

    - name: Stop Wagtail service before restore
      ansible.builtin.systemd:
        name: "{{ wagtail_restore_systemd_unit_name }}"
        state: stopped
      when: wagtail_restore_stop_service | bool

    - name: Keep Wagtail site pre-restore copy
      ansible.builtin.include_tasks: "{{ role_path }}/../restore_preserve_internal/tasks/main.yml"
      vars:
        restore_preserve_path: "{{ wagtail_site_path }}"
        restore_preserve_empty: false

    - name: Remember Wagtail pre-restore copy
      ansible.builtin.set_fact:
        wagtail_restore_preserved: "{{ restore_preserve_report }}"

    - name: Require existing Wagtail site for safety dump
      ansible.builtin.assert:
        that:
          - wagtail_restore_preserved.path is not none

    - name: Take and verify live database safety dump
      ansible.builtin.shell: |
        set -euo pipefail
        required="$(psql --no-psqlrc -At --command='SELECT pg_database_size(current_database())')"
        available="$(df -PB1 "$SAFETY_DIR" | awk 'NR==2 {print $4}')"
        test "$available" -ge "$((required + required / 10 + 16777216))"
        test ! -e "$SAFETY_DIR/database.pre-restore.dump"
        test ! -L "$SAFETY_DIR/database.pre-restore.dump"
        pg_dump --format=custom --file="$SAFETY_DIR/database.pre-restore.dump"
        pg_restore --list "$SAFETY_DIR/database.pre-restore.dump" > /dev/null
        pg_restore --file=/dev/null "$SAFETY_DIR/database.pre-restore.dump"
        chmod 600 "$SAFETY_DIR/database.pre-restore.dump"
        du -sb "$SAFETY_DIR"
      args:
        executable: /bin/bash
      environment:
        SAFETY_DIR: "{{ wagtail_restore_preserved.path }}"
        PGHOST: "{{ wagtail_restore_postgres_host }}"
        PGPORT: "{{ wagtail_restore_postgres_port | string }}"
        PGUSER: "{{ wagtail_restore_postgres_user }}"
        PGPASSWORD: "{{ wagtail_restore_postgres_password }}"
        PGDATABASE: "{{ wagtail_restore_postgres_database }}"
      register: wagtail_restore_safety_dump
      changed_when: true
      no_log: true

    - name: Record verified Wagtail recovery dump
      ansible.builtin.set_fact:
        wagtail_restore_safety_ready: true
        wagtail_restore_preserved_size: "{{ wagtail_restore_safety_dump.stdout.split()[0] }}"

    - name: Mark database replacement started
      ansible.builtin.set_fact:
        wagtail_restore_database_touched: true

    - name: Drop Wagtail database
      community.postgresql.postgresql_db:
        name: "{{ wagtail_restore_postgres_database }}"
        state: absent
        force: true
        login_host: "{{ wagtail_restore_postgres_host if (wagtail_restore_postgres_host | default('') | length > 0) else omit }}"
        login_port: "{{ wagtail_restore_postgres_port if (wagtail_restore_postgres_port | default('') | length > 0) else omit }}"
        login_user: "{{ wagtail_restore_postgres_admin_user }}"
        login_password: "{{ wagtail_restore_postgres_admin_password if (wagtail_restore_postgres_admin_password | default('') | length > 0) else omit }}"
      become: true
      become_user: "{{ wagtail_restore_postgres_become_user }}"
      no_log: "{{ (wagtail_restore_postgres_admin_password | default('') | length > 0) }}"

    - name: Recreate Wagtail database
      community.postgresql.postgresql_db:
        name: "{{ wagtail_restore_postgres_database }}"
        owner: "{{ wagtail_restore_postgres_user }}"
        state: present
        login_host: "{{ wagtail_restore_postgres_host if (wagtail_restore_postgres_host | default('') | length > 0) else omit }}"
        login_port: "{{ wagtail_restore_postgres_port if (wagtail_restore_postgres_port | default('') | length > 0) else omit }}"
        login_user: "{{ wagtail_restore_postgres_admin_user }}"
        login_password: "{{ wagtail_restore_postgres_admin_password if (wagtail_restore_postgres_admin_password | default('') | length > 0) else omit }}"
      become: true
      become_user: "{{ wagtail_restore_postgres_become_user }}"
      no_log: "{{ (wagtail_restore_postgres_admin_password | default('') | length > 0) }}"

    - name: Restore PostgreSQL dump in one transaction
      ansible.builtin.shell: |
        set -euo pipefail
        gzip -dc "$DUMP" | psql --no-psqlrc --single-transaction -v ON_ERROR_STOP=1
      args:
        executable: /bin/bash
      environment:
        DUMP: "{{ wagtail_restore_payload_dir }}/database/{{ wagtail_restore_postgres_database }}.sql.gz"
        PGHOST: "{{ wagtail_restore_postgres_host }}"
        PGPORT: "{{ wagtail_restore_postgres_port | string }}"
        PGUSER: "{{ wagtail_restore_postgres_user }}"
        PGPASSWORD: "{{ wagtail_restore_postgres_password }}"
        PGDATABASE: "{{ wagtail_restore_postgres_database }}"
      changed_when: true
      no_log: true

    - name: Mark SQL replacement committed
      ansible.builtin.set_fact:
        wagtail_restore_replacement_complete: true

    - name: Ensure database privileges
      community.postgresql.postgresql_privs:
        db: "{{ wagtail_restore_postgres_database }}"
        type: database
        privs: ALL
        roles: "{{ wagtail_restore_postgres_user }}"
        state: present
        login_host: "{{ wagtail_restore_postgres_host if (wagtail_restore_postgres_host | default('') | length > 0) else omit }}"
        login_port: "{{ wagtail_restore_postgres_port if (wagtail_restore_postgres_port | default('') | length > 0) else omit }}"
        login_user: "{{ wagtail_restore_postgres_admin_user }}"
        login_password: "{{ wagtail_restore_postgres_admin_password if (wagtail_restore_postgres_admin_password | default('') | length > 0) else omit }}"
      become: true
      become_user: "{{ wagtail_restore_postgres_become_user }}"
      no_log: "{{ (wagtail_restore_postgres_admin_password | default('') | length > 0) }}"

    - name: Run migrations after restore
      ansible.builtin.shell: |
        set -a
        . "{{ wagtail_env_path }}"
        set +a
        "{{ wagtail_python }}" "{{ wagtail_manage_py }}" migrate
      args:
        chdir: "{{ wagtail_site_path }}"
        executable: /bin/bash
      environment:
        DJANGO_SETTINGS_MODULE: "{{ wagtail_django_settings_module }}"
      become: true
      become_user: "{{ wagtail_user }}"
      when: wagtail_restore_run_migrations | bool

    - name: Collect static files after restore
      ansible.builtin.shell: |
        set -a
        . "{{ wagtail_env_path }}"
        set +a
        "{{ wagtail_python }}" "{{ wagtail_manage_py }}" collectstatic --noinput
      args:
        chdir: "{{ wagtail_site_path }}"
        executable: /bin/bash
      environment:
        DJANGO_SETTINGS_MODULE: "{{ wagtail_django_settings_module }}"
      become: true
      become_user: "{{ wagtail_user }}"
      when: wagtail_restore_collectstatic | bool

    - name: Update Wagtail search index after restore
      ansible.builtin.shell: |
        set -a
        . "{{ wagtail_env_path }}"
        set +a
        "{{ wagtail_python }}" "{{ wagtail_manage_py }}" update_index
      args:
        chdir: "{{ wagtail_site_path }}"
        executable: /bin/bash
      environment:
        DJANGO_SETTINGS_MODULE: "{{ wagtail_django_settings_module }}"
      become: true
      become_user: "{{ wagtail_user }}"
      changed_when: false
      when: wagtail_restore_update_index | bool

    - name: Start Wagtail service after restore
      ansible.builtin.systemd:
        name: "{{ wagtail_restore_systemd_unit_name }}"
        enabled: true
        state: "{{ wagtail_restore_restart | bool | ternary('restarted', 'started') }}"
        daemon_reload: true

    # Run state only - enablement is owned by wagtail_deploy, and a restore that
    # leaves a worker down must not report success. Gated on the same condition as
    # the stop above, so a worker this run did not stop is left exactly as it was.
    - name: Start auxiliary Wagtail units after restore
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: "{{ wagtail_restore_restart | bool | ternary('restarted', 'started') }}"
      loop: "{{ wagtail_restore_extra_systemd_units }}"
      when: wagtail_restore_stop_service | bool

  rescue:
    - name: Record this invocation's Wagtail restore failure
      ansible.builtin.set_fact:
        wagtail_restore_failed_task_name: "{{ ansible_failed_task.name | default('unknown task') }}"

    - name: Leave Wagtail services stopped after restore failure
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop: "{{ [wagtail_restore_systemd_unit_name] + wagtail_restore_extra_systemd_units }}"
      when:
        - wagtail_restore_database_touched | bool
        - wagtail_restore_stop_service | bool

    - name: Recover verified Wagtail database
      when:
        - wagtail_restore_safety_ready | bool
        - wagtail_restore_database_touched | bool
        - not wagtail_restore_replacement_complete | bool
      block:
        - name: Drop failed Wagtail database
          community.postgresql.postgresql_db:
            name: "{{ wagtail_restore_postgres_database }}"
            state: absent
            force: true
            login_host: "{{ wagtail_restore_postgres_host if (wagtail_restore_postgres_host | default('') | length > 0) else omit }}"
            login_port: "{{ wagtail_restore_postgres_port if (wagtail_restore_postgres_port | default('') | length > 0) else omit }}"
            login_user: "{{ wagtail_restore_postgres_admin_user }}"
            login_password: "{{ wagtail_restore_postgres_admin_password if (wagtail_restore_postgres_admin_password | default('') | length > 0) else omit }}"
          become: true
          become_user: "{{ wagtail_restore_postgres_become_user }}"
          no_log: "{{ (wagtail_restore_postgres_admin_password | default('') | length > 0) }}"

        - name: Recreate Wagtail database for recovery
          community.postgresql.postgresql_db:
            name: "{{ wagtail_restore_postgres_database }}"
            owner: "{{ wagtail_restore_postgres_user }}"
            state: present
            login_host: "{{ wagtail_restore_postgres_host if (wagtail_restore_postgres_host | default('') | length > 0) else omit }}"
            login_port: "{{ wagtail_restore_postgres_port if (wagtail_restore_postgres_port | default('') | length > 0) else omit }}"
            login_user: "{{ wagtail_restore_postgres_admin_user }}"
            login_password: "{{ wagtail_restore_postgres_admin_password if (wagtail_restore_postgres_admin_password | default('') | length > 0) else omit }}"
          become: true
          become_user: "{{ wagtail_restore_postgres_become_user }}"
          no_log: "{{ (wagtail_restore_postgres_admin_password | default('') | length > 0) }}"
        - name: Restore Wagtail safety dump in one transaction
          ansible.builtin.command:
            argv:
              - pg_restore
              - --single-transaction
              - --exit-on-error
              - "--dbname={{ wagtail_restore_postgres_database }}"
              - "{{ wagtail_restore_preserved.path }}/database.pre-restore.dump"
          environment:
            PGHOST: "{{ wagtail_restore_postgres_host }}"
            PGPORT: "{{ wagtail_restore_postgres_port | string }}"
            PGUSER: "{{ wagtail_restore_postgres_user }}"
            PGPASSWORD: "{{ wagtail_restore_postgres_password }}"
          changed_when: true
          no_log: true

        - name: Record successful database recovery
          ansible.builtin.set_fact:
            wagtail_restore_recovery_complete: true

    - name: Re-raise the restore failure
      ansible.builtin.fail:
        msg: >-
          Wagtail restore failed at {{ wagtail_restore_failed_task_name }}.
          SQL replacement committed: {{ wagtail_restore_replacement_complete }};
          database recovery completed: {{ wagtail_restore_recovery_complete }}.
          Inspect services and retained copy {{ wagtail_restore_preserved }} before starting them.

  always:
    - name: Report retained Wagtail pre-restore copy
      ansible.builtin.debug:
        msg: >-
          Failed task: {{ wagtail_restore_failed_task_name }};
          database touched: {{ wagtail_restore_database_touched }};
          SQL replacement committed: {{ wagtail_restore_replacement_complete }};
          database recovery completed: {{ wagtail_restore_recovery_complete }}.
          Retained copy {{ wagtail_restore_preserved | default({}) }};
          size including database dump: {{ wagtail_restore_preserved_size | default('dump incomplete') }} bytes.
          Owner prunes copies by hand.

- name: Cleanup restore staging directory
  ansible.builtin.file:
    path: "{{ wagtail_restore_staging_dir }}"
    state: absent
  when:
    - wagtail_restore_cleanup | bool
    - wagtail_restore_archive_stat.stat.isreg
