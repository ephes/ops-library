---
# Pin and prune of the Rust guard with impl shadow and stub releases against a
# real sshd (rust/echoport-command-guard/PLAN.md 6.2): repeated failed
# deployments, a stale line, a written but unverified line, protection from
# the live state alone, the switch to Python, check mode and the
# rollback-independence cases. Ubuntu 24.04 only; converge.yml asserts
# everything, so there is no idempotence step (it replays a sequence).
driver:
  name: docker
platforms:
  - name: "instance-${MOLECULE_RUN_ID:-local}"
    image: geerlingguy/docker-ubuntu2404-ansible
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  playbooks:
    prepare: ../shared/prepare.yml
    converge: converge.yml
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/..:~/.ansible/roles:/etc/ansible/roles"
    MOLECULE_GUARD_IMPL: python
verifier:
  name: ansible
scenario:
  name: pins
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - cleanup
    - destroy
