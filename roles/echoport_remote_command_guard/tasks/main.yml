---
- name: Validate guard policy shape
  ansible.builtin.assert:
    that:
      - echoport_remote_command_guard_policy is mapping
      - (echoport_remote_command_guard_policy | dict2items | map(attribute='key') | list)
        is subset(['postgres', 'units', 'private_media_paths', 'path_roots', 'temp_dirs',
                   'sqlite_snapshots', 'read_files', 'ready_urls'])
      - (echoport_remote_command_guard_policy.postgres | default({})) is mapping
      - (echoport_remote_command_guard_policy.units | default([])) is sequence
      - (echoport_remote_command_guard_policy.units | default([])) is not string
      - (echoport_remote_command_guard_policy.private_media_paths | default([])) is sequence
      - (echoport_remote_command_guard_policy.private_media_paths | default([])) is not string
      - (echoport_remote_command_guard_policy.path_roots | default([])) is sequence
      - (echoport_remote_command_guard_policy.path_roots | default([])) is not string
      - (echoport_remote_command_guard_policy.temp_dirs | default([])) is sequence
      - (echoport_remote_command_guard_policy.temp_dirs | default([])) is not string
      - (echoport_remote_command_guard_policy.sqlite_snapshots | default([])) is sequence
      - (echoport_remote_command_guard_policy.sqlite_snapshots | default([])) is not string
      - (echoport_remote_command_guard_policy.read_files | default([])) is sequence
      - (echoport_remote_command_guard_policy.read_files | default([])) is not string
      - (echoport_remote_command_guard_policy.ready_urls | default([])) is sequence
      - (echoport_remote_command_guard_policy.ready_urls | default([])) is not string
      - echoport_remote_command_guard_path is match('^/[A-Za-z0-9._/-]+$')
      - echoport_remote_command_guard_policy_path is match('^/[A-Za-z0-9._/-]+$')
      - echoport_remote_command_guard_python is match('^/[A-Za-z0-9._/-]+$')
    fail_msg: >-
      echoport_remote_command_guard_policy must be a mapping with only
      postgres, units, private_media_paths, path_roots, temp_dirs,
      sqlite_snapshots, read_files and ready_urls (see the role README), and
      the install paths must be plain absolute paths.
    quiet: true

# The Rust inputs themselves are checked in the Rust block below, where a
# mistake only warns with impl python (rollback independence, PLAN.md 6.2).
- name: Validate the guard implementation
  ansible.builtin.assert:
    that:
      - echoport_remote_command_guard_impl in ['python', 'shadow', 'rust']
      - >-
        echoport_remote_command_guard_impl == 'python'
        or (echoport_remote_command_guard_rust_version | string | length > 0
            and (echoport_remote_command_guard_rust_sha256 | string | length > 0
                 or echoport_remote_command_guard_rust_local_archive | string | length > 0))
    fail_msg: >-
      echoport_remote_command_guard_impl must be python, shadow or rust (got
      {{ echoport_remote_command_guard_impl | to_json }}); shadow and rust need
      echoport_remote_command_guard_rust_version and either
      echoport_remote_command_guard_rust_sha256 or
      echoport_remote_command_guard_rust_local_archive.
    quiet: true

- name: Check that the guard's interpreter exists
  ansible.builtin.stat:
    path: "{{ echoport_remote_command_guard_python }}"
  register: echoport_remote_command_guard_python_stat

- name: Require the guard's interpreter
  ansible.builtin.assert:
    that:
      - echoport_remote_command_guard_python_stat.stat.exists
    fail_msg: "{{ echoport_remote_command_guard_python }} is missing; the guard needs Python 3."
    quiet: true

- name: Install the forced-command guard
  ansible.builtin.copy:
    src: echoport-remote-command-guard.py
    dest: "{{ echoport_remote_command_guard_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Ensure the policy directory exists
  ansible.builtin.file:
    path: "{{ echoport_remote_command_guard_policy_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The Python guard stays installed as the rollback target and as what shadow
# execs (until S12).
- name: Set the Rust guard state
  ansible.builtin.set_fact:
    _echoport_guard_rust_wanted: "{{ echoport_remote_command_guard_rust_version | string | length > 0 }}"
    _echoport_guard_rust_fatal: "{{ echoport_remote_command_guard_impl != 'python' }}"
    _echoport_guard_rust_ok: false

- name: Install and check the Rust guard
  ansible.builtin.include_tasks: rust.yml
  when: _echoport_guard_rust_wanted | bool

# The guard validates the policy itself before it is put in place, so a policy
# it would refuse at login never reaches the host. (rust.yml has already run
# the Rust --check-policy on the same rendering.)
- name: Install the guard policy
  ansible.builtin.copy:
    content: "{{ echoport_remote_command_guard_policy | to_nice_json }}\n"
    dest: "{{ echoport_remote_command_guard_policy_path }}"
    owner: root
    group: root
    mode: "0644"
    validate: "{{ echoport_remote_command_guard_python }} -I {{ echoport_remote_command_guard_path }} --check-policy %s"

# Fatal Rust failures stop the play in rust.yml, so with impl shadow or rust
# this is only reached with a checked binary. Every part is a safe path
# (asserted above and in rust.yml), so nothing needs quoting inside command="".
- name: Publish the forced command for authorized_keys
  ansible.builtin.include_tasks: forced_command.yml
