---
# minecraft_java_deploy - Install Java and mcrcon

- name: Install OpenJDK and build dependencies
  ansible.builtin.apt:
    name:
      - "openjdk-{{ minecraft_java_version }}-jre-headless"
      - build-essential
      - git
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check if mcrcon is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/mcrcon
  register: mcrcon_installed

- name: Build and install mcrcon when missing
  when:
    - not mcrcon_installed.stat.exists
    - not ansible_check_mode
  block:
    - name: Allocate mcrcon build directory
      ansible.builtin.tempfile:
        state: directory
        prefix: mcrcon-
      register: minecraft_java_mcrcon_build

    - name: Clone mcrcon repository
      ansible.builtin.git:
        repo: https://github.com/Tiiffi/mcrcon.git
        dest: "{{ minecraft_java_mcrcon_build.path }}"
        version: v0.7.2
        force: true

    - name: Build mcrcon
      ansible.builtin.command: make
      args:
        chdir: "{{ minecraft_java_mcrcon_build.path }}"
      changed_when: true

    - name: Install mcrcon
      ansible.builtin.copy:
        src: "{{ minecraft_java_mcrcon_build.path }}/mcrcon"
        dest: /usr/local/bin/mcrcon
        owner: root
        group: root
        mode: "0755"
        remote_src: true

  always:
    - name: Clean up mcrcon build directory
      ansible.builtin.file:
        path: "{{ minecraft_java_mcrcon_build.path }}"
        state: absent
      when: minecraft_java_mcrcon_build.path is defined

- name: Verify Java installation
  ansible.builtin.command: java -version
  register: java_version_check
  changed_when: false

- name: Display Java version
  ansible.builtin.debug:
    msg: "Java installed: {{ java_version_check.stderr_lines[0] | default('unknown') }}"

- name: Verify mcrcon installation
  ansible.builtin.command: mcrcon -v
  register: mcrcon_version_check
  changed_when: false
  failed_when: false

- name: Display mcrcon version
  ansible.builtin.debug:
    msg: "mcrcon installed: {{ mcrcon_version_check.stdout | default(mcrcon_version_check.stderr) | default('unknown') }}"
