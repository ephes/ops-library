---
# Request or update certificate using DNS-01

- name: Build domain list
  ansible.builtin.set_fact:
    certbot_dns_domains: >-
      {{
        (
          ((certbot_dns_include_base | bool) | ternary([certbot_dns_domain], []))
          + ((certbot_dns_wildcard | bool) | ternary(["*." + certbot_dns_domain], []))
          + (certbot_dns_additional_domains | default([]))
        ) | unique
      }}

- name: Validate domain list is not empty
  ansible.builtin.assert:
    that:
      - certbot_dns_domains | length > 0
    fail_msg: "No domains requested for certificate"

- name: Assemble domain arguments
  ansible.builtin.set_fact:
    certbot_dns_domain_args: "{{ certbot_dns_domains | map('regex_replace', '^(.*)$', '-d \\1') | list }}"

- name: Request certificate via DNS challenge
  ansible.builtin.command:
    argv: >-
      {{
        [
          "certbot",
          "certonly",
          "--non-interactive",
          "--agree-tos",
          "--email", certbot_dns_email,
          "--authenticator", "dns-" + certbot_dns_provider,
          "--dns-" + certbot_dns_provider + "-credentials", certbot_dns_active_credentials_file,
          "--dns-" + certbot_dns_provider + "-propagation-seconds", certbot_dns_propagation_seconds | string,
          "--cert-name", certbot_dns_domain,
          "--key-type", certbot_dns_key_type,
          "--keep-until-expiring",
          "--expand"
        ]
        + (certbot_dns_staging | bool | ternary(["--staging"], []))
        + certbot_dns_domain_args
      }}
  register: certbot_dns_request
  changed_when: >
    (
      'not yet due for renewal' not in (
        (certbot_dns_request.stdout | default('')) +
        (certbot_dns_request.stderr | default(''))
      )
    )
  become: yes

# `certonly --keep-until-expiring` leaves an existing, still valid lineage alone,
# including its stored authenticator, so a provider change would otherwise only
# take effect at the next real renewal -- with the old provider. reconfigure
# switches the lineage after a successful dry run against the staging CA.
- name: Read the lineage's renewal configuration
  ansible.builtin.slurp:
    path: "{{ certbot_dns_config_dir }}/renewal/{{ certbot_dns_domain }}.conf"
  register: certbot_dns_renewal_conf
  failed_when: false
  become: yes
  when: certbot_dns_reconfigure_on_provider_change | bool

- name: Determine the lineage's current authenticator
  ansible.builtin.set_fact:
    certbot_dns_current_authenticator: >-
      {{ ((certbot_dns_renewal_conf.content | default('') | b64decode)
          | regex_search('(?m)^authenticator\s*=\s*(\S+)', '\1') | default([], true) | first | default('')) }}
  when: certbot_dns_reconfigure_on_provider_change | bool

- name: Switch the lineage to the configured DNS provider
  ansible.builtin.command:
    argv:
      - certbot
      - reconfigure
      - --non-interactive
      - --cert-name
      - "{{ certbot_dns_domain }}"
      - --authenticator
      - "dns-{{ certbot_dns_provider }}"
      - "--dns-{{ certbot_dns_provider }}-credentials"
      - "{{ certbot_dns_active_credentials_file }}"
      - "--dns-{{ certbot_dns_provider }}-propagation-seconds"
      - "{{ certbot_dns_propagation_seconds | string }}"
  become: yes
  when:
    - certbot_dns_reconfigure_on_provider_change | bool
    - not ansible_check_mode
    - certbot_dns_current_authenticator | default('') | length > 0
    - certbot_dns_current_authenticator != 'dns-' ~ certbot_dns_provider
