---
# Render provider credentials securely

- name: Ensure certbot config directory exists
  ansible.builtin.file:
    path: "{{ certbot_dns_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: yes

- name: Select the credentials file for the configured provider
  ansible.builtin.set_fact:
    certbot_dns_active_credentials_file: >-
      {{ certbot_dns_rfc2136_credentials_file if certbot_dns_provider == 'rfc2136'
         else certbot_dns_credentials_file }}

- name: Render DNS credentials file
  ansible.builtin.template:
    src: dns-credentials.ini.j2
    dest: "{{ certbot_dns_active_credentials_file }}"
    owner: root
    group: root
    mode: "0600"
  become: yes
  no_log: true
