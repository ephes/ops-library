---
# Default variables for certbot_dns_deploy role

# DNS provider: "gandi" (LiveDNS API) or "rfc2136" (DNS UPDATE signed with TSIG,
# e.g. against your own BIND primary)
certbot_dns_provider: "gandi"

# Certificate identity (punycode-safe)
certbot_dns_domain: "home.xn--wersdrfer-47a.de"

# Let's Encrypt account email
certbot_dns_email: "admin@wersdoerfer.de"

# Provider credentials (must be overridden)
certbot_dns_gandi_api_token: "CHANGEME"

# RFC 2136 provider. The server must be an IP address (the plugin does not
# resolve names) of the zone's primary. The key needs an update-policy grant for
# TXT at _acme-challenge.<name> for every requested name.
certbot_dns_rfc2136_server: "CHANGEME"
certbot_dns_rfc2136_port: 53
certbot_dns_rfc2136_key_name: "CHANGEME"
certbot_dns_rfc2136_key_secret: "CHANGEME"     # base64 TSIG secret (from secrets)
certbot_dns_rfc2136_key_algorithm: "HMAC-SHA256"

# Domain set to request
certbot_dns_wildcard: true                # Request *.domain
certbot_dns_include_base: true            # Also include base domain
certbot_dns_additional_domains: []        # Extra SANs to include

# Certificate options
certbot_dns_key_type: "ecdsa"             # rsa or ecdsa
certbot_dns_staging: false                # Use Let's Encrypt staging
certbot_dns_propagation_seconds: 120      # Wait time for DNS propagation

# Paths
certbot_dns_config_dir: "/etc/letsencrypt"
certbot_dns_credentials_file: "/etc/letsencrypt/dns-credentials.ini"          # gandi
# Separate file per provider: a lineage's renewal configuration points at its
# credentials file, so switching providers must not rewrite the file the old
# authenticator still uses (a failed switch, or another lineage, keeps working).
certbot_dns_rfc2136_credentials_file: "/etc/letsencrypt/dns-rfc2136-credentials.ini"
certbot_dns_renewal_hook_path: "/etc/letsencrypt/renewal-hooks/deploy/reload-services.sh"

# Renewal hooks (commands run after renewal)
certbot_dns_renewal_hooks: []
# Example:
# The postfix@- unit name below is specific to Debian/Ubuntu multi-instance packaging.
# certbot_dns_renewal_hooks:
#   - "systemctl restart traefik"
#   - "systemctl reload postfix@-"
#   - "systemctl reload dovecot"

# When an existing lineage was issued with a different authenticator (for example
# when moving from gandi to rfc2136), run `certbot reconfigure` so renewals use
# the configured provider. reconfigure performs a dry-run challenge with the new
# settings and only saves them if it succeeds. Requires certbot >= 2.3.
certbot_dns_reconfigure_on_provider_change: true

# Delete the other provider's credentials file once no renewal configuration
# under renewal/ mentions it any more (after a successful switch). A lineage
# that still uses it, for example after a failed switch, keeps it.
certbot_dns_remove_unused_credentials: true

# Package management
certbot_dns_package_state: present
