---
- name: Require Debian certificate packaging
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - java_ca_refresh_services is sequence
      - java_ca_refresh_services is not string
      - java_ca_refresh_ports is sequence
      - java_ca_refresh_ports is not string

- name: Inspect the distribution Java trust store
  ansible.builtin.command:
    argv: [keytool, -list, -keystore, /etc/ssl/certs/java/cacerts, -storepass, changeit]
  environment:
    LC_ALL: C
  register: java_ca_refresh_before
  changed_when: false
  check_mode: false

- name: Identify stale affected distribution aliases
  ansible.builtin.set_fact:
    java_ca_refresh_needed: >-
      {{ 'debian:comodo_aaa_services_root.pem,' in java_ca_refresh_before.stdout
         or 'debian:emsign_ecc_root_ca_-_g3.pem,' in java_ca_refresh_before.stdout }}

- name: Require patched OS PEM state before rebuilding Java trust
  ansible.builtin.stat:
    path: "/etc/ssl/certs/{{ item }}"
    follow: false
  loop:
    - Comodo_AAA_Services_root.pem
    - emSign_ECC_Root_CA_-_G3.pem
  register: java_ca_refresh_pem

- name: Refuse refresh while affected roots remain enabled in OS trust
  ansible.builtin.assert:
    that:
      - not item.stat.exists
    fail_msg: Patch the distribution ca-certificates package before refreshing Java trust.
  loop: "{{ java_ca_refresh_pem.results }}"

- name: Inspect pending JVM restart marker
  ansible.builtin.stat:
    path: /var/lib/ops-library-java-ca-refresh.pending
  register: java_ca_refresh_pending

- name: Persist pending restart before changing trust
  ansible.builtin.copy:
    dest: /var/lib/ops-library-java-ca-refresh.pending
    content: "Restart selected JVMs after Java CA refresh.\n"
    owner: root
    group: root
    mode: '0600'
  when: java_ca_refresh_needed

- name: Refresh Java trust through the supported distribution hook
  ansible.builtin.command:
    argv: [update-ca-certificates, --fresh]
  when: java_ca_refresh_needed
  changed_when: true

- name: Verify refreshed Java trust
  ansible.builtin.command:
    argv: [keytool, -list, -keystore, /etc/ssl/certs/java/cacerts, -storepass, changeit]
  environment:
    LC_ALL: C
  register: java_ca_refresh_after
  changed_when: false
  when: not ansible_check_mode

- name: Require both affected roots absent
  ansible.builtin.assert:
    that:
      - "'debian:comodo_aaa_services_root.pem,' not in java_ca_refresh_after.stdout"
      - "'debian:emsign_ecc_root_ca_-_g3.pem,' not in java_ca_refresh_after.stdout"
  when: not ansible_check_mode

- name: Restart explicitly selected JVM services after trust refresh
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
  loop: "{{ java_ca_refresh_services }}"
  when: java_ca_refresh_needed or java_ca_refresh_pending.stat.exists

- name: Wait for explicitly selected local service ports
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item }}"
    timeout: 180
  loop: "{{ java_ca_refresh_ports }}"
  when: not ansible_check_mode

- name: Clear pending marker only after successful verification and readiness
  ansible.builtin.file:
    path: /var/lib/ops-library-java-ca-refresh.pending
    state: absent
  when: not ansible_check_mode
