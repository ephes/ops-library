---
- name: validate | Validate tootctl command list
  ansible.builtin.assert:
    that:
      - mastodon_maintenance_tootctl_commands is iterable
      - mastodon_maintenance_tootctl_commands is not string
      - mastodon_maintenance_extra_commands is iterable
      - mastodon_maintenance_extra_commands is not string
    fail_msg: "mastodon_maintenance_tootctl_commands and mastodon_maintenance_extra_commands must be lists of tootctl subcommands"

- name: validate | Set maintenance command list
  ansible.builtin.set_fact:
    mastodon_maintenance_commands: "{{ mastodon_maintenance_tootctl_commands + mastodon_maintenance_extra_commands }}"

# Commands are rendered unquoted into a shell script, so only plain words are
# accepted: no newlines, quotes, backslashes or shell operators.
- name: validate | Reject maintenance commands with shell syntax
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^[A-Za-z0-9 ._=/:,+-]+\Z')
    fail_msg: >-
      Refusing maintenance command {{ item | to_json }}: only letters, digits, spaces
      and . _ = / : , + - are allowed.
    quiet: true
  loop: "{{ mastodon_maintenance_commands }}"

# `tootctl emoji purge` without a scope flag deletes every custom emoji,
# including the instance's own. tootctl (Thor) accepts abbreviated command
# names (`em pur`), misspelt flags and values for boolean flags
# (`--remote-only false`). So anything addressing the emoji commands must use
# the full names, and a purge must be followed only by `--remote-only` and/or
# `--suspended-only`.
- name: validate | Reject unscoped or abbreviated custom emoji commands
  ansible.builtin.assert:
    that:
      - >-
        not 'emoji'.startswith(item.split()[0])
        or (item.split()[:2] in [['emoji', 'import'], ['emoji', 'export']])
        or (item.split()[:2] == ['emoji', 'purge']
            and item.split()[2:] | length > 0
            and item.split()[2:] | reject('in', ['--remote-only', '--suspended-only']) | list | length == 0)
    fail_msg: >-
      Refusing maintenance command "{{ item }}": emoji commands must use full names, and
      `emoji purge` must be followed only by --remote-only or --suspended-only; anything
      else can delete local custom emoji too.
    quiet: true
  loop: "{{ mastodon_maintenance_commands }}"
