---
- name: validate | Validate tootctl command list
  ansible.builtin.assert:
    that:
      - mastodon_maintenance_tootctl_commands is iterable
      - mastodon_maintenance_tootctl_commands is not string
      - mastodon_maintenance_extra_commands is iterable
      - mastodon_maintenance_extra_commands is not string
    fail_msg: "mastodon_maintenance_tootctl_commands and mastodon_maintenance_extra_commands must be lists of tootctl subcommands"

- name: validate | Set maintenance command list
  ansible.builtin.set_fact:
    mastodon_maintenance_commands: "{{ mastodon_maintenance_tootctl_commands + mastodon_maintenance_extra_commands }}"

# `tootctl emoji purge` without a scope flag deletes every custom emoji,
# including the instance's own. tootctl does not reject unknown options and
# accepts values for boolean flags (`--remote-only false`), and the command is
# rendered unquoted into a shell script. So any command that mentions an emoji
# purge (ignoring quotes, backslashes and shell punctuation) must be exactly
# `emoji purge` followed only by `--remote-only` / `--suspended-only`.
- name: validate | Reject unscoped custom emoji purges
  ansible.builtin.assert:
    that:
      - >-
        not ((item | string) | regex_replace(mastodon_maintenance_quote_chars, '')
        is search(mastodon_maintenance_emoji_purge_pattern))
        or ((item | string) | trim | regex_replace('\s+', ' ')
        is match(mastodon_maintenance_scoped_emoji_purge_pattern))
    fail_msg: >-
      Refusing maintenance command "{{ item }}": `emoji purge` must be followed only by
      --remote-only or --suspended-only; anything else can delete local custom emoji too.
    quiet: true
  loop: "{{ mastodon_maintenance_commands }}"
  vars:
    mastodon_maintenance_quote_chars: "['\"\\\\]"
    mastodon_maintenance_emoji_purge_pattern: '(^|[^A-Za-z0-9_-])emoji[^A-Za-z0-9_-]+purge($|[^A-Za-z0-9_-])'
    mastodon_maintenance_scoped_emoji_purge_pattern: '^emoji purge( --remote-only| --suspended-only)+$'
