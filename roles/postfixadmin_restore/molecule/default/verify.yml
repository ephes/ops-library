---
- name: Verify PostfixAdmin restore
  hosts: all
  become: true

  pre_tasks:
    - name: Ensure Ansible remote tmp exists
      ansible.builtin.file:
        path: /tmp/.ansible/tmp
        state: directory
        mode: "0700"

  tasks:
    - name: Verify admin account was restored with every column
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        db: mail
        query: >-
          SELECT username, phone, email_other, totp_secret, superadmin, active
          FROM admin WHERE username = 'admin@example.test'
      register: admin_check

    - name: Assert admin account was restored
      ansible.builtin.assert:
        that:
          - admin_check.query_result | length == 1
          - admin_check.query_result[0].phone == '+49 30 000000'
          - admin_check.query_result[0].email_other == 'other@example.test'
          - admin_check.query_result[0].totp_secret == 'MOLECULETOTPSECRET'
          - admin_check.query_result[0].superadmin | bool
          - admin_check.query_result[0].active | bool
        fail_msg: "Admin account was not restored completely: {{ admin_check.query_result }}"

    - name: Verify config file exists
      ansible.builtin.stat:
        path: /opt/postfixadmin/config.local.php
      register: config_stat

    - name: Assert config file exists
      ansible.builtin.assert:
        that:
          - config_stat.stat.exists
        fail_msg: "Config file missing after restore"

    # Fail-closed: a backup whose manifest lists a part that is missing, and
    # a timestamp that is a path, are refused before anything changes.
    - name: Find the restored backup
      ansible.builtin.find:
        paths: /tmp/postfixadmin-backups
        file_type: directory
        patterns: '^[0-9]{8}T[0-9]{6}$'
        use_regex: true
      register: restore_backups

    - name: Copy the backup without domain_admins.json
      ansible.builtin.shell: |
        set -euo pipefail
        cp -a "{{ (restore_backups.files | sort(attribute='path'))[-1].path }}" /tmp/postfixadmin-backups/20000101T000000
        rm /tmp/postfixadmin-backups/20000101T000000/domain_admins.json
      args:
        executable: /bin/bash
      changed_when: true

    - name: Delete the admin again
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        db: mail
        query: "DELETE FROM admin WHERE username = 'admin@example.test'"

    - name: Try the incomplete backup and a path as timestamp
      ansible.builtin.include_tasks: restore_refused.yml
      loop:
        - 20000101T000000
        - ../postfixadmin-backups/20000101T000000
      loop_control:
        loop_var: refused_timestamp

    - name: Verify nothing was restored from a refused backup
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        db: mail
        query: "SELECT username FROM admin WHERE username = 'admin@example.test'"
      register: refused_check

    - name: Assert the refused restores changed nothing
      ansible.builtin.assert:
        that:
          - refused_check.query_result | length == 0
        fail_msg: "A refused restore still wrote the admin account"

    # A superadmin-only setup has no domain_admins rows; such a backup must
    # restore as well.
    - name: Put the admin back from the complete backup
      ansible.builtin.include_role:
        name: postfixadmin_restore
      vars:
        postfixadmin_db_password: "molecule-test-password"
        postfixadmin_backup_path: "/tmp/postfixadmin-backups"
        postfixadmin_restore_timestamp: "{{ (restore_backups.files | map(attribute='path') | map('basename') | sort)[-1] }}"

    - name: Empty the domain_admins table
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        db: mail
        query: "DELETE FROM domain_admins"

    - name: Wait so the next backup gets a new timestamp
      ansible.builtin.pause:
        seconds: 1

    - name: Refresh the timestamp fact
      ansible.builtin.setup:
        gather_subset: [min]

    - name: Back up with an empty domain_admins table
      ansible.builtin.include_role:
        name: postfixadmin_backup
      vars:
        postfixadmin_db_password: "molecule-test-password"
        postfixadmin_backup_path: "/tmp/postfixadmin-backups"

    - name: Restore the backup with an empty domain_admins table
      ansible.builtin.include_role:
        name: postfixadmin_restore
      vars:
        postfixadmin_db_password: "molecule-test-password"
        postfixadmin_backup_path: "/tmp/postfixadmin-backups"
        postfixadmin_restore_timestamp: "{{ postfixadmin_backup_timestamp }}"

    - name: Read the empty domain_admins backup
      ansible.builtin.slurp:
        src: "/tmp/postfixadmin-backups/{{ postfixadmin_backup_timestamp }}/domain_admins.json"
      register: empty_domain_admins

    - name: Assert the empty table was written as a list
      ansible.builtin.assert:
        that:
          - (empty_domain_admins.content | b64decode | from_json) == []

    - name: Display verification summary
      ansible.builtin.debug:
        msg: |
          PostfixAdmin restore verification completed successfully:
          - Admin account restored with TOTP secret, phone and email_other: OK
          - Config file: OK
          - Incomplete backup and path timestamp refused: OK
          - Backup and restore with empty domain_admins: OK
