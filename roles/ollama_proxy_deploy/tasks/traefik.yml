---
- name: Ensure Traefik dynamic config directory exists
  ansible.builtin.file:
    path: "{{ ollama_proxy_traefik_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure htpasswd is installed (apache2-utils)
  ansible.builtin.package:
    name: apache2-utils
    state: present
  when:
    - ollama_proxy_basic_auth_enabled | bool
    - ansible_facts['os_family'] == 'Debian'

- name: Resolve basic auth password hash (reuse the deployed one while it matches)
  ansible.builtin.include_role:
    name: local.ops_library.webapp_deploy_internal
    tasks_from: traefik_basic_auth_hash
  vars:
    webapp_deploy_internal_basic_auth_user: "{{ ollama_proxy_basic_auth_user }}"
    webapp_deploy_internal_basic_auth_password: "{{ ollama_proxy_basic_auth_password }}"
    webapp_deploy_internal_basic_auth_config_path: "{{ ollama_proxy_traefik_config_path }}"
    webapp_deploy_internal_basic_auth_hash_var: ollama_proxy_basic_auth_password_hash
  when:
    - ollama_proxy_basic_auth_enabled | bool
    - ollama_proxy_basic_auth_password | default('') | length > 0
    - ollama_proxy_basic_auth_password_hash | length == 0

- name: Render Traefik configuration for Ollama proxy
  ansible.builtin.template:
    src: ollama-proxy-traefik.yml.j2
    dest: "{{ ollama_proxy_traefik_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: reload traefik
