---
# Configure Traefik for the work app with dual router authentication.
# Traefik watches /etc/traefik/dynamic, so no reload is needed (as for homelab).

- name: Render work app Traefik config
  ansible.builtin.include_role:
    name: local.ops_library.webapp_deploy_internal
    tasks_from: traefik_config
  vars:
    webapp_deploy_internal_traefik_template_src: "templates/traefik.yml.j2"
    webapp_deploy_internal_traefik_dest: "{{ work_app_traefik_config_path }}"
    webapp_deploy_internal_traefik_basic_auth_enabled: "{{ work_app_basic_auth_enabled }}"
    webapp_deploy_internal_traefik_basic_auth_user: "{{ work_app_basic_auth_user }}"
    webapp_deploy_internal_traefik_basic_auth_password: "{{ work_app_basic_auth_password }}"
    webapp_deploy_internal_traefik_password_hash_var: work_app_basic_auth_password_hash
    webapp_deploy_internal_traefik_auth_packages:
      - apache2-utils
    webapp_deploy_internal_traefik_auth_package_os_families:
      - Debian
