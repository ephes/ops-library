---
# Setup systemd service for the work app

- name: Render and enable work app systemd unit
  ansible.builtin.include_role:
    name: local.ops_library.webapp_deploy_internal
    tasks_from: systemd_service
  vars:
    webapp_deploy_internal_service_template_src: "templates/work-app.service.j2"
    webapp_deploy_internal_service_unit_dest: "{{ work_app_systemd_unit_path }}"
    webapp_deploy_internal_service_name: "{{ work_app_service_name }}"
    webapp_deploy_internal_service_notify_handlers:
      - reload systemd
      - restart work app
