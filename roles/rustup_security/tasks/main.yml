---
- name: rustup_security | Require explicit existing installation guard
  ansible.builtin.assert:
    that:
      - rustup_security_old_sha256 is match('^[0-9a-f]{64}$')
      - rustup_security_version == '1.29.2'
      - rustup_security_owner | length > 0
      - rustup_security_home is match('^/.+')
      - rustup_security_cargo_home is match('^/.+')
      - rustup_security_rustup_home is match('^/.+')
      - rustup_security_ca_file is match('^/.+')
      - rustup_security_triple in rustup_security_checksums
    fail_msg: Require exact existing Rustup identity and pinned security release.

- name: rustup_security | Verify OS trust before downloading the replacement
  ansible.builtin.command:
    argv:
      - "{{ rustup_security_python }}"
      - -c
      - |
        import hashlib
        import ssl
        import sys
        assert sys.version_info >= (3, 11), "Rustup security helper requires Python 3.11+"
        context = ssl.create_default_context(cafile={{ rustup_security_ca_file | to_json }})
        roots = {hashlib.sha256(c).hexdigest() for c in context.get_ca_certs(binary_form=True)}
        blocked = {
            'd7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4',
            '86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b',
        }
        assert roots and not roots.intersection(blocked)
  changed_when: false
  check_mode: false

- name: rustup_security | Stage and run the narrowly scoped owner helper
  become: "{{ rustup_security_become }}"
  become_user: "{{ rustup_security_owner }}"
  block:
    - name: rustup_security | Allocate private staging directory
      ansible.builtin.tempfile:
        state: directory
        prefix: managed-rustup-security-
      register: rustup_security_stage
      changed_when: false
      check_mode: false

    - name: rustup_security | Stage security helper
      ansible.builtin.copy:
        src: rustup_security.py
        dest: "{{ rustup_security_stage.path }}/rustup_security.py"
        mode: '0600'
      changed_when: false
      check_mode: false

    - name: rustup_security | Inspect existing manager, proxies and idle owner
      ansible.builtin.command:
        argv: >-
          {{ [rustup_security_python, rustup_security_stage.path ~ '/rustup_security.py',
              '--home', rustup_security_home, '--user', rustup_security_owner,
              '--old-sha256', rustup_security_old_sha256,
              '--cargo-home', rustup_security_cargo_home, '--rustup-home', rustup_security_rustup_home,
              '--triple', rustup_security_triple]
             + ['--check'] }}
        chdir: /
      register: rustup_security_plan
      changed_when: "ansible_check_mode and 'CHANGED' in rustup_security_plan.stdout_lines"
      check_mode: false

    - name: rustup_security | Download exact fixed updater using verified OS trust
      ansible.builtin.uri:
        url: "https://static.rust-lang.org/rustup/archive/1.29.2/{{ rustup_security_triple }}/rustup-init"
        status_code: [200]
        return_content: false
        use_netrc: false
        dest: "{{ rustup_security_stage.path }}/rustup-init"
        mode: '0700'
        validate_certs: true
        ca_path: "{{ rustup_security_ca_file }}"
      when: not ansible_check_mode and 'CHANGED' in rustup_security_plan.stdout_lines
      changed_when: false

    - name: rustup_security | Verify downloaded archive checksum
      ansible.builtin.stat:
        path: "{{ rustup_security_stage.path }}/rustup-init"
        checksum_algorithm: sha256
      register: rustup_security_download
      when: not ansible_check_mode and 'CHANGED' in rustup_security_plan.stdout_lines

    - name: rustup_security | Require exact official updater bytes
      ansible.builtin.assert:
        that:
          - "'sha256:' ~ rustup_security_download.stat.checksum == rustup_security_checksums[rustup_security_triple]"
      when: not ansible_check_mode and 'CHANGED' in rustup_security_plan.stdout_lines

    - name: rustup_security | Replace only the manager and upstream proxies
      ansible.builtin.command:
        argv: >-
          {{ [rustup_security_python, rustup_security_stage.path ~ '/rustup_security.py',
              '--home', rustup_security_home, '--user', rustup_security_owner,
              '--old-sha256', rustup_security_old_sha256,
              '--cargo-home', rustup_security_cargo_home, '--rustup-home', rustup_security_rustup_home,
              '--triple', rustup_security_triple]
             + ['--candidate', rustup_security_stage.path ~ '/rustup-init'] }}
        chdir: /
      register: rustup_security_result
      changed_when: "'CHANGED' in rustup_security_result.stdout_lines"
      check_mode: false
      when: not ansible_check_mode and 'CHANGED' in rustup_security_plan.stdout_lines

    - name: rustup_security | Report manager-only result
      ansible.builtin.debug:
        msg: "{{ rustup_security_result.stdout_lines | default(rustup_security_plan.stdout_lines) }}"
  always:
    - name: rustup_security | Remove temporary updater and helper
      ansible.builtin.file:
        path: "{{ rustup_security_stage.path }}"
        state: absent
      when: rustup_security_stage.path is defined
      changed_when: false
      check_mode: false
