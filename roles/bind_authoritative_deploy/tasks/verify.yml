---
- name: Verify authoritative responses for zones
  ansible.builtin.command: >-
    dig @{{ bind_verify_server }} {{ item.name }} SOA +comments +norecurse
  register: bind_verify_results
  changed_when: false
  # +norecurse plus the 'aa' flag is what makes this a real authority check:
  # without it a recursive resolver can answer NOERROR from the public internet
  # while the local zone is still empty or not loaded at all.
  until: >-
    'status: NOERROR' in bind_verify_results.stdout
    and bind_verify_results.stdout is search('flags:[^;]* aa[ ;]')
  retries: "{{ bind_verify_retries }}"
  delay: "{{ bind_verify_delay }}"
  loop: "{{ bind_zones }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - bind_verify_enabled
    - item.type | default(bind_zone_default_type) in bind_verify_zone_types

- name: Check if UFW is installed
  ansible.builtin.command: which ufw
  register: bind_ufw_check
  changed_when: false
  failed_when: false
  when: bind_firewall_check_enabled

- name: Inspect UFW status
  ansible.builtin.command: ufw status verbose
  register: bind_ufw_status
  changed_when: false
  failed_when: false
  when:
    - bind_firewall_check_enabled
    - bind_ufw_check.rc == 0

- name: Warn when UFW is inactive
  ansible.builtin.debug:
    msg: "WARNING: UFW is inactive; ensure TCP/UDP 53 is allowed by other firewalls."
  when:
    - bind_firewall_check_enabled
    - bind_ufw_check.rc == 0
    - "'Status: inactive' in bind_ufw_status.stdout"

- name: Warn when UFW is active but port 53 is not explicitly allowed
  ansible.builtin.debug:
    msg: "WARNING: UFW is active but no explicit TCP/UDP 53 rule was found."
  when:
    - bind_firewall_check_enabled
    - bind_ufw_check.rc == 0
    - "'Status: active' in bind_ufw_status.stdout"
    - "'53/tcp' not in bind_ufw_status.stdout and '53/udp' not in bind_ufw_status.stdout"
