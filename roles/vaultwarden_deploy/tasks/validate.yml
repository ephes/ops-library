---
# Validate Vaultwarden configuration

- name: validate | Validate required variables are set
  ansible.builtin.assert:
    that:
      - vaultwarden_domain != "CHANGEME"
      - vaultwarden_domain is defined
      - vaultwarden_domain | length > 0
    fail_msg: "vaultwarden_domain must be set to a valid URL (e.g., https://vault.example.com)"
    success_msg: "Domain configured: {{ vaultwarden_domain }}"

- name: validate | Validate admin token is set when admin panel is enabled
  ansible.builtin.assert:
    that:
      - vaultwarden_admin_token is defined
      - vaultwarden_admin_token != "CHANGEME"
      - vaultwarden_admin_token | length > 0
    fail_msg: >-
      vaultwarden_admin_token must be set when admin panel is enabled.
      Generate one with: openssl rand -base64 48
      Or set vaultwarden_admin_enabled=false to disable admin panel entirely.
    success_msg: "Admin token configured"
  when: vaultwarden_admin_enabled | bool

- name: validate | Note admin panel status
  ansible.builtin.debug:
    msg: "Admin panel is DISABLED (vaultwarden_admin_enabled=false)"
  when: not (vaultwarden_admin_enabled | bool)

- name: validate | Validate package version pins look like deb versions
  ansible.builtin.assert:
    that:
      - item is string
      - item | length == 0 or item is match('^[A-Za-z0-9][A-Za-z0-9.+:~-]*$')
    fail_msg: >-
      Package version pins must be exact deb versions such as 1.34.1-1, not
      ranges or expressions. Got: {{ item }}
  loop:
    - "{{ vaultwarden_package_version }}"
    - "{{ vaultwarden_web_vault_package_version }}"

# `| bool` coerces an unrecognised value such as "ture" to false, which would
# silently release both holds. Fail instead.
- name: validate | Validate the apt hold flag is a real boolean or unmanaged
  ansible.builtin.assert:
    that:
      - vaultwarden_packages_hold is none
        or vaultwarden_packages_hold is boolean
    fail_msg: >-
      vaultwarden_packages_hold must be true, false, or ~ (unmanaged). Got:
      {{ vaultwarden_packages_hold }}

# allow_change_held_packages applies to the whole apt invocation, so a mixed pin
# would let dependency resolution move the other held package. Both or neither.
- name: validate | Require both package versions to be pinned together
  ansible.builtin.assert:
    that:
      - (vaultwarden_package_version | length > 0)
        == (vaultwarden_web_vault_package_version | length > 0)
    fail_msg: >-
      Pin vaultwarden_package_version and vaultwarden_web_vault_package_version
      together or not at all. Pinning one alone would still permit apt to move
      the other held package while resolving dependencies.

- name: validate | Validate SMTP configuration if host is set
  ansible.builtin.assert:
    that:
      - vaultwarden_smtp_from | length > 0
    fail_msg: "vaultwarden_smtp_from must be set when vaultwarden_smtp_host is configured"
  when: vaultwarden_smtp_host | length > 0

- name: validate | Validate Debian codename is supported
  ansible.builtin.assert:
    that:
      - vaultwarden_debian_codename in ['bullseye', 'bookworm', 'trixie', 'jammy', 'noble']
    fail_msg: >-
      Unsupported Debian/Ubuntu version: {{ vaultwarden_debian_codename }}.
      Supported: bullseye, bookworm, trixie (Debian) or jammy, noble (Ubuntu).
    success_msg: "Debian codename: {{ vaultwarden_debian_codename }}"

- name: validate | Map Ubuntu release to Debian codename
  ansible.builtin.set_fact:
    vaultwarden_debian_codename: >-
      {{ 'bookworm' if ansible_distribution_release in ['jammy', 'noble'] else vaultwarden_debian_codename }}
  when: ansible_distribution == 'Ubuntu'

- name: "validate | Ensure Traefik IP allowlist is a list of networks"
  ansible.builtin.assert:
    that:
      - vaultwarden_traefik_ip_allowlist is not string
      - vaultwarden_traefik_ip_allowlist is not mapping
      - vaultwarden_traefik_ip_allowlist is iterable
      - >-
        vaultwarden_traefik_ip_allowlist
        | reject('string') | list | length == 0
    fail_msg: >-
      vaultwarden_traefik_ip_allowlist must be a list of CIDR networks (address/prefix); an empty list leaves the route open to every client.
    quiet: true

# Exact parsing, not a pattern (as in unifi_deploy): Traefik cannot build the
# middleware from 192.168.1.0/33 or fd7a::/129, and the route would vanish
# after a deploy that reported success.
- name: "validate | Verify Traefik IP allowlist entries parse as networks"
  ansible.builtin.command:
    argv:
      - python3
      - "-c"
      - |
        import ipaddress, json, sys
        invalid = []
        for entry in json.loads(sys.argv[1]):
            try:
                if entry != "".join(entry.split()) or "%" in entry:
                    raise ValueError("whitespace or zone")
                if "/" not in entry:
                    raise ValueError("no prefix length")
                if "/" in entry:
                    prefix = entry.partition("/")[2]
                    if not (prefix.isascii() and prefix.isdigit()):
                        raise ValueError("prefix length is not a number")
                    ipaddress.ip_network(entry, strict=False)
                else:
                    ipaddress.ip_address(entry)
            except ValueError:
                invalid.append(entry)
        if invalid:
            print(
                "vaultwarden_traefik_ip_allowlist entries are not CIDR networks: "
                + ", ".join(repr(entry) for entry in invalid)
            )
            sys.exit(1)
      - "{{ vaultwarden_traefik_ip_allowlist | to_json }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: vaultwarden_traefik_ip_allowlist_check
  failed_when: vaultwarden_traefik_ip_allowlist_check.rc != 0
  when:
    - vaultwarden_traefik_ip_allowlist | length > 0
