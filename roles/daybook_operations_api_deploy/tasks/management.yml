---
- name: management | Execute with native Ansible failure handling
  block:
    - name: management | Run one protected management command
      # Secrets come from the 0600 companion file, never from the task environment:
      # under become, Ansible places task environment values inside the command it
      # hands to sudo, and sudo logs that command (journal and auth.log).
      ansible.builtin.shell:
        cmd: |
          set -a
          . {{ (daybook_operations_api_config_dir ~ '/environment.shell') | quote }}
          set +a
          exec {{ ([daybook_operations_api_venv + '/bin/python', daybook_operations_api_site + '/services/operations_api/manage.py'] + daybook_operations_api_management_argv) | map('quote') | join(' ') }}
      become: true
      become_user: "{{ daybook_operations_api_user }}"
      register: daybook_operations_api_management
      changed_when: "'Applying ' in daybook_operations_api_management.stdout or 'changed' in daybook_operations_api_management.stdout"
      no_log: true
  rescue:
    - name: management | Report only sanitized command or module failure
      ansible.builtin.fail:
        msg: >-
          Operations management failed:
          {{ daybook_operations_api_management.stderr | default('')
             | regex_findall('operations_(?:storage_unavailable|configuration_unreadable|configuration_invalid)')
             | unique | join(', ') | default('management_command_failed', true) }}
