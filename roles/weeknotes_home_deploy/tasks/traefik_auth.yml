---
- name: traefik_auth | Install htpasswd for Basic Auth hashing
  ansible.builtin.package:
    name: apache2-utils
    state: present
  when:
    - weeknotes_home_basic_auth_enabled | bool
    - weeknotes_home_basic_auth_password_hash | length == 0
    - not ansible_check_mode
    - ansible_facts["os_family"] == "Debian"

- name: traefik_auth | Resolve Basic Auth bcrypt hash (reuse the deployed one while it matches)
  ansible.builtin.include_role:
    name: local.ops_library.webapp_deploy_internal
    tasks_from: traefik_basic_auth_hash
  vars:
    webapp_deploy_internal_basic_auth_user: "{{ weeknotes_home_basic_auth_user }}"
    webapp_deploy_internal_basic_auth_password: "{{ weeknotes_home_basic_auth_password }}"
    webapp_deploy_internal_basic_auth_config_path: "{{ weeknotes_home_traefik_config_path }}"
    webapp_deploy_internal_basic_auth_hash_var: weeknotes_home_basic_auth_password_hash
  when:
    - weeknotes_home_basic_auth_enabled | bool
    - weeknotes_home_basic_auth_password_hash | length == 0
