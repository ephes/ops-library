---
- name: django | Render environment file
  ansible.builtin.template:
    src: weeknotes-home.env.j2
    dest: "{{ weeknotes_home_env_path }}"
    owner: "{{ weeknotes_home_user }}"
    group: "{{ weeknotes_home_group }}"
    mode: "0600"
  no_log: true
  notify: restart weeknotes home

# Management commands source this 0600 shell companion of the service environment.
# Secrets never go into a task environment: under become, Ansible puts those values
# into the command it hands to sudo, and sudo logs that command.
- name: django | Render management shell environment
  ansible.builtin.template:
    src: weeknotes-home.env.j2
    dest: "{{ weeknotes_home_env_path }}.shell"
    owner: "{{ weeknotes_home_user }}"
    group: "{{ weeknotes_home_group }}"
    mode: "0600"
  vars:
    task_shell_environment: true
  no_log: true

- name: django | Run migrations
  ansible.builtin.shell:
    cmd: |
      set -a
      . {{ (weeknotes_home_env_path ~ '.shell') | quote }}
      set +a
      exec {{ (weeknotes_home_venv_bin ~ '/python') | quote }} {{ weeknotes_home_manage_py | quote }} migrate --noinput
  args:
    chdir: "{{ weeknotes_home_service_path }}"
  become: true
  become_user: "{{ weeknotes_home_user }}"
  register: weeknotes_home_migrate
  changed_when: "'No migrations to apply' not in weeknotes_home_migrate.stdout"
  no_log: true
  when: weeknotes_home_run_migrations | bool

- name: django | Collect static files
  ansible.builtin.shell:
    cmd: |
      set -a
      . {{ (weeknotes_home_env_path ~ '.shell') | quote }}
      set +a
      exec {{ (weeknotes_home_venv_bin ~ '/python') | quote }} {{ weeknotes_home_manage_py | quote }} collectstatic --noinput
  args:
    chdir: "{{ weeknotes_home_service_path }}"
  become: true
  become_user: "{{ weeknotes_home_user }}"
  register: weeknotes_home_collectstatic_result
  changed_when: "'0 static files copied' not in weeknotes_home_collectstatic_result.stdout"
  no_log: true
  when: weeknotes_home_collectstatic | bool
