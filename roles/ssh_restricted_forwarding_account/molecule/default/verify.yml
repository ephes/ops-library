---
- name: Verify real restricted OpenSSH behavior
  hosts: all
  become: true
  vars:
    ssh_restricted_forwarding_account_fence_generation: 1
    ssh_restricted_forwarding_account_fence_token: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    ssh_options:
      - -p
      - "2222"
      - -i
      - /root/.ssh/molecule-forwarding
      - -o
      - IdentitiesOnly=yes
      - -o
      - StrictHostKeyChecking=no
      - -o
      - UserKnownHostsFile=/dev/null
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=5
  tasks:
    - name: Inspect durable transaction state after normal authenticated release
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /var/lib/ssh-restricted-forwarding
        - /var/lib/ssh-restricted-forwarding/molecule_forward.transaction.json
        - /var/lib/ssh-restricted-forwarding/molecule_forward.recovery.json
      register: durable_transaction_state

    - name: Require root-only state directory and durable marker credential cleanup
      ansible.builtin.assert:
        that:
          - durable_transaction_state.results[0].stat.isdir
          - durable_transaction_state.results[0].stat.pw_name == 'root'
          - durable_transaction_state.results[0].stat.mode == '0700'
          - not durable_transaction_state.results[1].stat.exists
          - not durable_transaction_state.results[2].stat.exists

    - name: Derive test public key
      ansible.builtin.command:
        argv: [/usr/bin/ssh-keygen, -y, -f, /root/.ssh/molecule-forwarding]
      register: molecule_public_key
      changed_when: false
      no_log: true

    - name: Read effective Match policy
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
          - -C
          - user=molecule_forward,host=localhost,addr=127.0.0.1
      register: effective_sshd
      changed_when: false

    - name: Require effective forwarding-only policy
      ansible.builtin.assert:
        that:
          - "'authenticationmethods publickey' in effective_sshd.stdout"
          - "'passwordauthentication no' in effective_sshd.stdout"
          - "'kbdinteractiveauthentication no' in effective_sshd.stdout"
          - "'allowtcpforwarding local' in effective_sshd.stdout"
          - "'permitopen 127.0.0.1:18443' in effective_sshd.stdout"
          - "'permitlisten none' in effective_sshd.stdout"
          - "'allowstreamlocalforwarding no' in effective_sshd.stdout"
          - "'gatewayports no' in effective_sshd.stdout"
          - "'allowagentforwarding no' in effective_sshd.stdout"
          - "'x11forwarding no' in effective_sshd.stdout"
          - "'permittty no' in effective_sshd.stdout"
          - "'permituserrc no' in effective_sshd.stdout"
          - "'maxsessions 0' in effective_sshd.stdout"

    - name: Read forwarding account shadow state
      ansible.builtin.command:
        argv: [/usr/bin/getent, shadow, molecule_forward]
      register: forwarding_shadow
      changed_when: false
      no_log: true

    - name: Prove forwarding account is not password-locked
      ansible.builtin.assert:
        that:
          - forwarding_shadow.stdout.split(':')[1].startswith('$6$')
      no_log: true

    - name: Start sole permitted destination server
      ansible.builtin.command:
        argv: [/usr/bin/python3, -m, http.server, "18443", --bind, 127.0.0.1]
      async: 3600
      poll: 0
      changed_when: true

    - name: Wait for permitted destination
      ansible.builtin.uri:
        url: http://127.0.0.1:18443/
        status_code: 200
      register: destination_ready
      retries: 20
      delay: 1
      until: destination_ready.status == 200

    - name: Authenticate key and establish permitted local forwarding
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/bin/ssh'] + ssh_options +
          ['-o', 'ControlMaster=yes', '-o', 'ControlPath=/tmp/molecule-forward-control',
          '-fNT', '-L', '127.0.0.1:19443:127.0.0.1:18443',
          'molecule_forward@127.0.0.1'] }}
      changed_when: true

    - name: Prove bytes traverse the permitted destination
      ansible.builtin.uri:
        url: http://127.0.0.1:19443/
        status_code: 200

    - name: Exercise real CLI check mode while restricted connection is active
      ansible.builtin.command:
        argv:
          - "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/../../.venv/bin/ansible-playbook"
          - --inventory
          - "{{ lookup('ansible.builtin.env', 'MOLECULE_INVENTORY_FILE') }}"
          - --check
          - "{{ playbook_dir }}/check-active.yml"
      environment:
        ANSIBLE_ROLES_PATH: >-
          {{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/..
        ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
      register: active_removal_check
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Reprove active forwarding after the read-only removal check
      ansible.builtin.uri:
        url: http://127.0.0.1:19443/
        status_code: 200

    - name: Inspect server state preserved by active-tunnel check mode
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /home/molecule_forward/.ssh/authorized_keys
        - /etc/ssh/sshd_config.d/90-molecule-forwarding.conf
        - /var/lib/ssh-restricted-forwarding/molecule_forward.account.json
      register: active_check_mode_survivors

    - name: Require check mode to defer the process gate without mutation
      ansible.builtin.assert:
        that:
          - >-
            active_check_mode_survivors.results
            | map(attribute='stat.isreg') | select('equalto', true) | list | length == 3
          - "'Contracted-UID processes' in active_removal_check.stdout"
          - "'deferred post-shutdown gate' in active_removal_check.stdout"

    - name: Reject shell or exec session
      ansible.builtin.command:
        argv: "{{ ['/usr/bin/ssh'] + ssh_options + ['molecule_forward@127.0.0.1', 'true'] }}"
      register: rejected_session
      changed_when: false
      failed_when: rejected_session.rc == 0

    - name: Reject subsystem session
      ansible.builtin.command:
        argv: "{{ ['/usr/bin/ssh'] + ssh_options + ['-s', 'molecule_forward@127.0.0.1', 'sftp'] }}"
      register: rejected_subsystem
      changed_when: false
      failed_when: rejected_subsystem.rc == 0

    - name: Reject remote forwarding
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/bin/ssh'] + ssh_options + ['-o', 'ExitOnForwardFailure=yes',
          '-NT', '-R', '127.0.0.1:20443:127.0.0.1:18443',
          'molecule_forward@127.0.0.1'] }}
      register: rejected_remote
      changed_when: false
      failed_when: rejected_remote.rc == 0

    - name: Start alternate prohibited local destination request
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/bin/ssh'] + ssh_options +
          ['-o', 'ControlMaster=yes', '-o', 'ControlPath=/tmp/molecule-rejected-control',
          '-fNT', '-L', '127.0.0.1:19444:127.0.0.1:18444',
          'molecule_forward@127.0.0.1'] }}
      changed_when: true

    - name: Reject traffic to alternate local-forward destination
      ansible.builtin.uri:
        url: http://127.0.0.1:19444/
        status_code: 200
        timeout: 2
      register: rejected_alternate
      failed_when: rejected_alternate.status | default(-1) == 200

    - name: Close controlled SSH test processes
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/bin/ssh'] + ssh_options + ['-o', 'ControlPath=' ~ item,
          '-O', 'exit', 'molecule_forward@127.0.0.1'] }}
      loop:
        - /tmp/molecule-forward-control
        - /tmp/molecule-rejected-control
      changed_when: true

    - name: Exercise traversal rejection before root writes
      block:
        - name: Attempt traversal drop-in
          ansible.builtin.include_role:
            name: ssh_restricted_forwarding_account
          vars:
            ssh_restricted_forwarding_account_state: absent
            ssh_restricted_forwarding_account_user: molecule_forward
            ssh_restricted_forwarding_account_permit_host: 127.0.0.1
            ssh_restricted_forwarding_account_sshd_dropin: /etc/ssh/sshd_config.d/../../tmp/escaped.conf
        - name: Fail if traversal was accepted
          ansible.builtin.fail:
            msg: Traversal input was accepted
      rescue:
        - name: Record traversal rejection
          ansible.builtin.set_fact:
            traversal_rejected: true

    - name: Require traversal rejection without escaped write
      ansible.builtin.assert:
        that:
          - traversal_rejected | default(false)
          - not lookup('ansible.builtin.fileglob', '/tmp/escaped.conf')

    - name: Exercise public-key option injection rejection
      block:
        - name: Attempt injected public key
          ansible.builtin.include_role:
            name: ssh_restricted_forwarding_account
          vars:
            ssh_restricted_forwarding_account_user: molecule_forward
            ssh_restricted_forwarding_account_public_key: "ssh-ed25519 AAAATEST command=bad"
            ssh_restricted_forwarding_account_permit_host: 127.0.0.1
        - ansible.builtin.fail:
            msg: Injected public key was accepted
      rescue:
        - ansible.builtin.set_fact:
            key_injection_rejected: true

    - name: Exercise comment newline injection rejection
      block:
        - name: Attempt injected key comment
          ansible.builtin.include_role:
            name: ssh_restricted_forwarding_account
          vars:
            ssh_restricted_forwarding_account_user: molecule_forward
            ssh_restricted_forwarding_account_public_key: "{{ molecule_public_key.stdout.split()[:2] | join(' ') }}"
            ssh_restricted_forwarding_account_key_comment: "bad\ncomment"
            ssh_restricted_forwarding_account_permit_host: 127.0.0.1
        - ansible.builtin.fail:
            msg: Injected key comment was accepted
      rescue:
        - ansible.builtin.set_fact:
            comment_injection_rejected: true

    - name: Exercise shell argument injection rejection
      block:
        - name: Attempt injected no-login shell
          ansible.builtin.include_role:
            name: ssh_restricted_forwarding_account
          vars:
            ssh_restricted_forwarding_account_user: molecule_forward
            ssh_restricted_forwarding_account_public_key: "{{ molecule_public_key.stdout.split()[:2] | join(' ') }}"
            ssh_restricted_forwarding_account_shell: /usr/sbin/nologin -c
            ssh_restricted_forwarding_account_permit_host: 127.0.0.1
        - ansible.builtin.fail:
            msg: Injected shell was accepted
      rescue:
        - ansible.builtin.set_fact:
            shell_injection_rejected: true

    - name: Require injection rejection coverage
      ansible.builtin.assert:
        that:
          - key_injection_rejected | default(false)
          - comment_injection_rejected | default(false)
          - shell_injection_rejected | default(false)

    - name: Prepare symlinked identity parent target
      block:
        - name: Create identity parent test directories
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: directory
            owner: root
            group: root
            mode: "{{ item.mode }}"
          loop:
            - path: /tmp/molecule-identity-home
              mode: "0700"
            - path: /tmp/molecule-identity-target
              mode: "0751"

        - name: Install identity parent target marker
          ansible.builtin.copy:
            dest: /tmp/molecule-identity-target/marker
            content: "must remain untouched\n"
            owner: root
            group: root
            mode: "0640"

        - name: Link configured SSH parent to the protected target
          ansible.builtin.file:
            src: /tmp/molecule-identity-target
            dest: /tmp/molecule-identity-home/.ssh
            state: link

        - name: Capture symlink target metadata and contents
          ansible.builtin.stat:
            path: "{{ item }}"
            follow: false
            checksum_algorithm: sha256
          loop:
            - /tmp/molecule-identity-target
            - /tmp/molecule-identity-target/marker
          register: identity_symlink_target_before

    - name: Exercise symlinked identity parent rejection before mutation
      block:
        - name: Attempt identity generation through a symlinked parent
          ansible.builtin.include_role:
            name: ssh_forwarding_identity
          vars:
            ssh_forwarding_identity_user: root
            ssh_forwarding_identity_group: root
            ssh_forwarding_identity_home: /tmp/molecule-identity-home
            ssh_forwarding_identity_path: /tmp/molecule-identity-home/.ssh/forwarding
            ssh_forwarding_identity_comment: molecule-symlink-rejection
        - name: Fail if symlinked identity parent was accepted
          ansible.builtin.fail:
            msg: Symlinked identity parent was accepted
      rescue:
        - name: Record symlinked identity parent rejection
          ansible.builtin.set_fact:
            identity_parent_symlink_rejected: true

    - name: Recapture symlink target metadata and contents
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        checksum_algorithm: sha256
      loop:
        - /tmp/molecule-identity-target
        - /tmp/molecule-identity-target/marker
        - /tmp/molecule-identity-target/forwarding
        - /tmp/molecule-identity-target/forwarding.pub
      register: identity_symlink_target_after

    - name: Prove symlink target contents and metadata were untouched
      ansible.builtin.assert:
        that:
          - identity_parent_symlink_rejected | default(false)
          - not identity_symlink_target_after.results[2].stat.exists
          - not identity_symlink_target_after.results[3].stat.exists
          - >-
            identity_symlink_target_after.results[0].stat.mode
            == identity_symlink_target_before.results[0].stat.mode
          - >-
            identity_symlink_target_after.results[0].stat.uid
            == identity_symlink_target_before.results[0].stat.uid
          - >-
            identity_symlink_target_after.results[0].stat.gid
            == identity_symlink_target_before.results[0].stat.gid
          - >-
            identity_symlink_target_after.results[0].stat.mtime
            == identity_symlink_target_before.results[0].stat.mtime
          - >-
            identity_symlink_target_after.results[1].stat.checksum
            == identity_symlink_target_before.results[1].stat.checksum
          - >-
            identity_symlink_target_after.results[1].stat.mode
            == identity_symlink_target_before.results[1].stat.mode

    - name: Capture managed key checksum before metadata rejection test
      ansible.builtin.stat:
        path: /home/molecule_forward/.ssh/authorized_keys
        checksum_algorithm: sha256
      register: canonical_key_before
      no_log: true

    - name: Make managed key metadata noncanonical
      ansible.builtin.file:
        path: /home/molecule_forward/.ssh/authorized_keys
        mode: "0644"

    - name: Exercise noncanonical managed pre-state rejection
      block:
        - name: Attempt update with noncanonical managed key metadata
          ansible.builtin.include_role:
            name: ssh_restricted_forwarding_account
          vars:
            ssh_restricted_forwarding_account_user: molecule_forward
            ssh_restricted_forwarding_account_public_key: >-
              {{ molecule_public_key.stdout.split()[:2] | join(' ') }}
            ssh_restricted_forwarding_account_key_comment: molecule-forwarding
            ssh_restricted_forwarding_account_permit_host: 127.0.0.1
            ssh_restricted_forwarding_account_permit_port: 18443
            ssh_restricted_forwarding_account_sshd_dropin: /etc/ssh/sshd_config.d/90-molecule-forwarding.conf
        - ansible.builtin.fail:
            msg: Noncanonical managed pre-state was accepted
      rescue:
        - ansible.builtin.set_fact:
            canonical_prestate_rejected: true

    - name: Restore managed key canonical mode after rejection test
      ansible.builtin.file:
        path: /home/molecule_forward/.ssh/authorized_keys
        mode: "0600"

    - name: Inspect managed key after metadata rejection test
      ansible.builtin.stat:
        path: /home/molecule_forward/.ssh/authorized_keys
        checksum_algorithm: sha256
      register: canonical_key_after
      no_log: true

    - name: Require metadata rejection without managed key byte mutation
      ansible.builtin.assert:
        that:
          - canonical_prestate_rejected | default(false)
          - canonical_key_after.stat.checksum == canonical_key_before.stat.checksum
          - canonical_key_after.stat.mode == '0600'
      no_log: true

    - name: Generate failed replacement identity
      ansible.builtin.command:
        argv:
          - /usr/bin/ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ""
          - -f
          - /root/.ssh/molecule-forwarding-replacement
      args:
        creates: /root/.ssh/molecule-forwarding-replacement
      no_log: true

    - name: Derive failed replacement public key
      ansible.builtin.command:
        argv:
          - /usr/bin/ssh-keygen
          - -y
          - -f
          - /root/.ssh/molecule-forwarding-replacement
      register: molecule_replacement_public_key
      changed_when: false
      no_log: true

    - name: Capture transactional state before forced reload failure
      block:
        - name: Capture installed drop-in and authorized keys
          ansible.builtin.slurp:
            path: "{{ item }}"
          loop:
            - /etc/ssh/sshd_config.d/90-molecule-forwarding.conf
            - /home/molecule_forward/.ssh/authorized_keys
          register: transaction_files_before_rollback
          no_log: true

        - name: Capture forwarding account records
          ansible.builtin.command:
            argv: [/usr/bin/getent, "{{ item }}", molecule_forward]
          loop:
            - passwd
            - shadow
            - group
          register: transaction_account_before_rollback
          changed_when: false
          no_log: true

    - name: Reset deterministic reload fault injection state
      ansible.builtin.file:
        path: /run/molecule-sshd-reload-count
        state: absent

    - name: Exercise partial candidate activation and failed rollback reload
      block:
        - name: Attempt key and policy rotation with fault-injected reloads
          ansible.builtin.include_role:
            name: ssh_restricted_forwarding_account
          vars:
            ssh_restricted_forwarding_account_user: molecule_forward
            ssh_restricted_forwarding_account_public_key: >-
              {{ molecule_replacement_public_key.stdout.split()[:2] | join(' ') }}
            ssh_restricted_forwarding_account_key_comment: molecule-forwarding-replacement
            ssh_restricted_forwarding_account_permit_host: 127.0.0.1
            ssh_restricted_forwarding_account_permit_port: 18444
            ssh_restricted_forwarding_account_sshd_dropin: /etc/ssh/sshd_config.d/90-molecule-forwarding.conf
            ssh_restricted_forwarding_account_reload_command:
              - /usr/local/sbin/molecule-sshd-reload-fault
        - ansible.builtin.fail:
            msg: Fault-injected reload failure unexpectedly succeeded
      rescue:
        - ansible.builtin.set_fact:
            rollback_exercised: true
            rollback_failure_message: "{{ ansible_failed_result.msg | default('') }}"

    - name: Capture transactional state after rollback
      block:
        - name: Read restored drop-in and authorized keys
          ansible.builtin.slurp:
            path: "{{ item }}"
          loop:
            - /etc/ssh/sshd_config.d/90-molecule-forwarding.conf
            - /home/molecule_forward/.ssh/authorized_keys
          register: transaction_files_after_rollback
          no_log: true

        - name: Read restored forwarding account records
          ansible.builtin.command:
            argv: [/usr/bin/getent, "{{ item }}", molecule_forward]
          loop:
            - passwd
            - shadow
            - group
          register: transaction_account_after_rollback
          changed_when: false
          no_log: true

    - name: Require managed account, key, and policy rollback
      ansible.builtin.assert:
        that:
          - rollback_exercised | default(false)
          - "'ROLLBACK INCOMPLETE' in rollback_failure_message"
          - "'old-key usability is NOT attested' in rollback_failure_message"
          - >-
            transaction_files_after_rollback.results | map(attribute='content') | list
            == transaction_files_before_rollback.results | map(attribute='content') | list
          - >-
            transaction_account_after_rollback.results | map(attribute='stdout') | list
            == transaction_account_before_rollback.results | map(attribute='stdout') | list
      no_log: true

    - name: Validate complete on-disk configuration after rollback
      ansible.builtin.command:
        argv: [/usr/sbin/sshd, -t, -f, /etc/ssh/sshd_config]
      changed_when: false

    - name: Read reload fault invocation count
      ansible.builtin.slurp:
        path: /run/molecule-sshd-reload-count
      register: rollback_reload_count

    - name: Require candidate HUP and failed rollback reload were both attempted
      ansible.builtin.assert:
        that:
          - rollback_reload_count.content | b64decode | trim == '2'

    - name: Start prior-key forwarding while live candidate policy remains possible
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/bin/ssh'] + ssh_options +
          ['-o', 'ControlMaster=yes', '-o', 'ControlPath=/tmp/molecule-unattested-control',
          '-o', 'ExitOnForwardFailure=yes', '-fNT',
          '-L', '127.0.0.1:19445:127.0.0.1:18443',
          'molecule_forward@127.0.0.1'] }}
      changed_when: true

    - name: Prove restored bytes alone do not establish prior forwarding usability
      ansible.builtin.uri:
        url: http://127.0.0.1:19445/
        status_code: 200
        timeout: 2
      register: unattested_prior_forwarding
      failed_when: unattested_prior_forwarding.status | default(-1) == 200

    - name: Close unattested prior-key forwarding process
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/bin/ssh'] + ssh_options +
          ['-o', 'ControlPath=/tmp/molecule-unattested-control',
          '-O', 'exit', 'molecule_forward@127.0.0.1'] }}
      changed_when: true

    - name: Perform operator recovery reload of restored policy
      ansible.builtin.service:
        name: ssh
        state: reloaded

    - name: Prove prior key authenticates after recovery reload
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/bin/ssh'] + ssh_options +
          ['-o', 'ControlMaster=yes', '-o', 'ControlPath=/tmp/molecule-rollback-control',
          '-o', 'ExitOnForwardFailure=yes', '-fNT',
          '-L', '127.0.0.1:19445:127.0.0.1:18443',
          'molecule_forward@127.0.0.1'] }}
      changed_when: true

    - name: Prove prior-key rollback forwarding traverses the original destination
      ansible.builtin.uri:
        url: http://127.0.0.1:19445/
        status_code: 200

    - name: Prove failed replacement key does not authenticate after rollback
      ansible.builtin.command:
        argv:
          - /usr/bin/ssh
          - -p
          - "2222"
          - -i
          - /root/.ssh/molecule-forwarding-replacement
          - -o
          - IdentitiesOnly=yes
          - -o
          - StrictHostKeyChecking=no
          - -o
          - UserKnownHostsFile=/dev/null
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=5
          - -o
          - ExitOnForwardFailure=yes
          - -fNT
          - -L
          - 127.0.0.1:19446:127.0.0.1:18443
          - molecule_forward@127.0.0.1
      register: failed_replacement_authentication
      changed_when: false
      failed_when: failed_replacement_authentication.rc == 0
      no_log: true

    - name: Close prior-key rollback forwarding process
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/bin/ssh'] + ssh_options +
          ['-o', 'ControlPath=/tmp/molecule-rollback-control',
          '-O', 'exit', 'molecule_forward@127.0.0.1'] }}
      changed_when: true

    - name: Capture canonical removal identity
      ansible.builtin.command:
        argv: [/usr/bin/getent, passwd, molecule_forward]
      register: canonical_removal_passwd
      changed_when: false
      no_log: true

    - name: Create protected drift target
      ansible.builtin.file:
        path: /srv/molecule-protected-home
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Install protected drift marker
      ansible.builtin.copy:
        dest: /srv/molecule-protected-home/must-survive
        content: "protected\n"
        owner: root
        group: root
        mode: "0640"

    - name: Drift passwd home to protected data
      ansible.builtin.command:
        argv: [/usr/sbin/usermod, -d, /srv/molecule-protected-home, molecule_forward]
      changed_when: true

    - name: Exercise drifted passwd home rejection
      block:
        - name: Attempt removal with drifted passwd home
          ansible.builtin.include_role:
            name: ssh_restricted_forwarding_account
          vars:
            ssh_restricted_forwarding_account_state: absent
            ssh_restricted_forwarding_account_user: molecule_forward
            ssh_restricted_forwarding_account_permit_host: 127.0.0.1
            ssh_restricted_forwarding_account_sshd_dropin: /etc/ssh/sshd_config.d/90-molecule-forwarding.conf
            ssh_restricted_forwarding_account_fence_generation: 2
