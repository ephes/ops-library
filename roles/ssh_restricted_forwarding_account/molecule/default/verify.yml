                molecule_bind_survivors.results
                | map(attribute='stat.exists') | select('equalto', true) | list | length == 4
              - molecule_bind_passwd.rc == 0

        - name: Unmount nested bind fixture
          ansible.builtin.command:
            argv: [/usr/bin/umount, /home/molecule_forward/molecule-bind]
          changed_when: true

    - name: Canonically revoke and remove managed account
      ansible.builtin.include_role:
        name: ssh_restricted_forwarding_account
      vars:
        ssh_restricted_forwarding_account_state: absent
        ssh_restricted_forwarding_account_user: molecule_forward
        ssh_restricted_forwarding_account_permit_host: 127.0.0.1
        ssh_restricted_forwarding_account_sshd_dropin: /etc/ssh/sshd_config.d/90-molecule-forwarding.conf
        ssh_restricted_forwarding_account_fence_generation: 12
        ssh_restricted_forwarding_account_fence_token: b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1

    - name: Inspect canonical account removal
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /home/molecule_forward
        - /etc/ssh/sshd_config.d/90-molecule-forwarding.conf
        - /var/lib/ssh-restricted-forwarding/molecule_forward.account.json
      register: canonical_removal_paths

    - name: Read removed account and group records
      ansible.builtin.command:
        argv: [/usr/bin/getent, "{{ item }}", molecule_forward]
      loop:
        - passwd
        - group
      register: canonical_removal_records
      changed_when: false
      failed_when: canonical_removal_records.rc not in [0, 2]

    - name: Inspect unrelated protected marker after canonical removal
      ansible.builtin.stat:
        path: /srv/molecule-protected-home/must-survive
        follow: false
      register: protected_marker_after_removal

    - name: Require canonical bounded removal
      ansible.builtin.assert:
        that:
          - canonical_removal_paths.results | map(attribute='stat.exists') | select('equalto', true) | list | length == 0
          - canonical_removal_records.results | map(attribute='rc') | select('equalto', 0) | list | length == 0
          - protected_marker_after_removal.stat.isreg | default(false)

    - name: Rerun absent state to prove idempotence
      ansible.builtin.include_role:
        name: ssh_restricted_forwarding_account
      vars:
        ssh_restricted_forwarding_account_state: absent
        ssh_restricted_forwarding_account_user: molecule_forward
        ssh_restricted_forwarding_account_permit_host: 127.0.0.1
        ssh_restricted_forwarding_account_sshd_dropin: /etc/ssh/sshd_config.d/90-molecule-forwarding.conf
        ssh_restricted_forwarding_account_fence_generation: 13
        ssh_restricted_forwarding_account_fence_token: c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1
