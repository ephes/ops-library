---
- name: Prepare real OpenSSH harness
  hosts: all
  become: true
  tasks:
    - name: Install OpenSSH client/server and curl
      ansible.builtin.apt:
        name:
          - openssh-client
          - openssh-server
          - curl
        state: present
        update_cache: true

    - name: Generate container SSH host keys
      ansible.builtin.command:
        argv: [/usr/bin/ssh-keygen, -A]
      changed_when: false

    - name: Configure isolated sshd test port
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-molecule-port.conf
        content: |
          Port 2222
          ListenAddress 127.0.0.1
          UsePAM no
        owner: root
        group: root
        mode: "0644"

    - name: Disable socket activation so sshd honors isolated test port
      ansible.builtin.systemd_service:
        name: ssh.socket
        state: stopped
        enabled: false

    - name: Start isolated SSH service
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Install deterministic partial-success reload fault injector
      ansible.builtin.copy:
        dest: /usr/local/sbin/molecule-sshd-reload-fault
        owner: root
        group: root
        mode: "0700"
        content: |
          #!/bin/sh
          set -eu
          count_file=/run/molecule-sshd-reload-count
          count=0
          if [ -f "$count_file" ]; then
              count="$(cat "$count_file")"
          fi
          count=$((count + 1))
          printf '%s\n' "$count" > "$count_file"
          if [ "$count" -eq 1 ]; then
              kill -HUP "$(cat /run/sshd.pid)"
              sleep 1
          fi
          exit 1
