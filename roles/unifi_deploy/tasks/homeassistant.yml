---

- name: "homeassistant | Install utilities for password hashing"
  ansible.builtin.apt:
    name: whois
    state: present

- name: "homeassistant | Initialize password fact"
  no_log: true
  ansible.builtin.set_fact:
    unifi_homeassistant_password_effective: "{{ unifi_homeassistant_password | default('', true) }}"

- name: "homeassistant | Fail when password is undefined"
  ansible.builtin.fail:
    msg: "Set unifi_homeassistant_password from inventory (SOPS/Ansible Vault); automatic generation is no longer supported."
  when: unifi_homeassistant_password_effective | length == 0

- name: homeassistant | Run mongosh with a private credential script
  block:
    - name: homeassistant | Allocate private MongoDB directory
      ansible.builtin.tempfile:
        state: directory
        prefix: unifi_deploy-mongo-
      register: unifi_deploy_task_mongo_3
      changed_when: false
      when: not ansible_check_mode

    - name: homeassistant | Render authenticated MongoDB script
      ansible.builtin.template:
        src: task-mongosh.js.j2
        dest: "{{ unifi_deploy_task_mongo_3.path }}/command.js"
        mode: "0600"
      vars:
        task_mongo_auth_db: "admin"
        task_mongo_database: "{{ unifi_mongodb_database }}"
        task_mongo_script: |
          quit(db.site.findOne({name: 'default'}) ? 0 : 1)
      no_log: true
      changed_when: false
      when:
        - not ansible_check_mode
        - unifi_deploy_task_mongo_3.path is defined

    - name: "homeassistant | Probe for default site"
      ansible.builtin.shell: |
        mongosh --quiet --host {{ unifi_mongodb_host }} --port {{ unifi_mongodb_port }} \
          --file {{ (unifi_deploy_task_mongo_3.path ~ '/command.js' if unifi_deploy_task_mongo_3.path is defined else '/dev/null') | quote }}
      register: unifi_homeassistant_site_probe
      changed_when: false
      failed_when: false
      no_log: true

  always:
    - name: homeassistant | Remove private MongoDB directory
      ansible.builtin.file:
        path: "{{ unifi_deploy_task_mongo_3.path }}"
        state: absent
      changed_when: false
      when:
        - not ansible_check_mode
        - unifi_deploy_task_mongo_3.path is defined

- name: "homeassistant | Record default site presence"
  ansible.builtin.set_fact:
    unifi_homeassistant_default_site_present: "{{ unifi_homeassistant_site_probe.rc == 0 }}"

- name: "homeassistant | Warn when default site missing"
  ansible.builtin.debug:
    msg: >-
      UniFi default site was not detected; skipping Home Assistant user creation.
      Complete the UniFi setup wizard once, then rerun deploy-one unifi to finish the integration.
  when: not unifi_homeassistant_default_site_present | bool
- when: unifi_homeassistant_default_site_present | bool
  block:
    - name: homeassistant | Run mongosh with a private credential script
      block:
        - name: homeassistant | Allocate private MongoDB directory
          ansible.builtin.tempfile:
            state: directory
            prefix: unifi_deploy-mongo-
          register: unifi_deploy_task_mongo_4
          changed_when: false
          when: not ansible_check_mode

        - name: homeassistant | Render authenticated MongoDB script
          ansible.builtin.template:
            src: task-mongosh.js.j2
            dest: "{{ unifi_deploy_task_mongo_4.path }}/command.js"
            mode: "0600"
          vars:
            task_mongo_auth_db: "admin"
            task_mongo_database: "{{ unifi_mongodb_database }}"
            task_mongo_script: |
              quit(db.site.findOne({name: 'default'}) ? 0 : 1)
          no_log: true
          changed_when: false
          when:
            - not ansible_check_mode
            - unifi_deploy_task_mongo_4.path is defined

        - name: "homeassistant | Wait for default site"
          ansible.builtin.shell: |
            mongosh --quiet --host {{ unifi_mongodb_host }} --port {{ unifi_mongodb_port }} \
              --file {{ (unifi_deploy_task_mongo_4.path ~ '/command.js' if unifi_deploy_task_mongo_4.path is defined else '/dev/null') | quote }}
          register: unifi_homeassistant_site_check
          until: unifi_homeassistant_site_check.rc == 0
          retries: "{{ unifi_homeassistant_wait_retries }}"
          delay: "{{ unifi_homeassistant_wait_delay }}"
          changed_when: false
          no_log: true

      always:
        - name: homeassistant | Remove private MongoDB directory
          ansible.builtin.file:
            path: "{{ unifi_deploy_task_mongo_4.path }}"
            state: absent
          changed_when: false
          when:
            - not ansible_check_mode
            - unifi_deploy_task_mongo_4.path is defined

    - name: homeassistant | Run mongosh with a private credential script
      block:
        - name: homeassistant | Allocate private MongoDB directory
          ansible.builtin.tempfile:
            state: directory
            prefix: unifi_deploy-mongo-
          register: unifi_deploy_task_mongo_5
          changed_when: false
          when: not ansible_check_mode

        - name: homeassistant | Render authenticated MongoDB script
          ansible.builtin.template:
            src: task-mongosh.js.j2
            dest: "{{ unifi_deploy_task_mongo_5.path }}/command.js"
            mode: "0600"
          vars:
            task_mongo_auth_db: "admin"
            task_mongo_database: "{{ unifi_mongodb_database }}"
            task_mongo_script: |
              const u = db.admin.findOne({name: '{{ unifi_homeassistant_username }}'}); print(u && u.x_shadow ? u.x_shadow : '')
          no_log: true
          changed_when: false
          when:
            - not ansible_check_mode
            - unifi_deploy_task_mongo_5.path is defined

        - name: "homeassistant | Read existing user password hash"
          ansible.builtin.shell: |
            mongosh --quiet --host {{ unifi_mongodb_host }} --port {{ unifi_mongodb_port }} \
              --file {{ (unifi_deploy_task_mongo_5.path ~ '/command.js' if unifi_deploy_task_mongo_5.path is defined else '/dev/null') | quote }}
          register: unifi_homeassistant_existing_hash
          changed_when: false
          no_log: true

      always:
        - name: homeassistant | Remove private MongoDB directory
          ansible.builtin.file:
            path: "{{ unifi_deploy_task_mongo_5.path }}"
            state: absent
          changed_when: false
          when:
            - not ansible_check_mode
            - unifi_deploy_task_mongo_5.path is defined

    - name: "homeassistant | Hash password for MongoDB"
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ lookup('ansible.builtin.file', role_path ~ '/files/hash_ha_password.py') }}"
        stdin: "{{ {'existing_hash': unifi_homeassistant_existing_hash.stdout | default(''), 'password': unifi_homeassistant_password_effective} | to_json }}"
      register: unifi_homeassistant_password_hash
      changed_when: false
      no_log: true

    - name: "homeassistant | Manage temporary MongoDB script"
      when: not ansible_check_mode
      block:
        - name: "homeassistant | Allocate private MongoDB script"
          ansible.builtin.tempfile:
            state: file
            prefix: unifi-mongo-ha-
          register: unifi_homeassistant_script

        - name: "homeassistant | Render MongoDB script"
          ansible.builtin.template:
            src: mongo-ha-user.js.j2
            dest: "{{ unifi_homeassistant_script.path }}"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: "homeassistant | Apply MongoDB script"
          ansible.builtin.shell: |
            mongosh --quiet --host {{ unifi_mongodb_host }} --port {{ unifi_mongodb_port }} \
              --file {{ unifi_homeassistant_script.path | quote }}
          register: unifi_homeassistant_user
          changed_when: "'changed=true' in unifi_homeassistant_user.stdout.lower()"
          failed_when: "'STATUS=error' in unifi_homeassistant_user.stdout"
          no_log: true

      always:
        - name: "homeassistant | Remove temporary MongoDB script"
          ansible.builtin.file:
            path: "{{ unifi_homeassistant_script.path }}"
            state: absent
          when: unifi_homeassistant_script.path is defined

    - name: "homeassistant | Persist password locally"
      ansible.builtin.copy:
        dest: "{{ unifi_homeassistant_password_store }}"
        content: "{{ unifi_homeassistant_password_effective }}"
        owner: "{{ unifi_user }}"
        group: "{{ unifi_group }}"
        mode: "0600"
      no_log: true
