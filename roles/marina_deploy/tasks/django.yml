---
# Configure Django application

- name: Create environment file for Django
  template:
    src: marina.env.j2
    dest: "{{ marina_env_file }}"
    owner: "{{ marina_user }}"
    group: "{{ marina_group }}"
    mode: '0600'
  notify: restart marina

- name: Run Django migrations
  shell: |
    set -a
    . {{ marina_env_file }}
    set +a
    {{ marina_venv_bin }}/python manage.py migrate
  args:
    chdir: "{{ marina_site_path }}"
    executable: /bin/bash
  environment:
    DJANGO_SETTINGS_MODULE: "{{ marina_django_settings_module }}"
  become: true
  become_user: "{{ marina_user }}"
  register: marina_migrate_result
  changed_when: "'No migrations to apply' not in marina_migrate_result.stdout"

- name: Collect static files
  shell: |
    set -a
    . {{ marina_env_file }}
    set +a
    {{ marina_venv_bin }}/python manage.py collectstatic --noinput
  args:
    chdir: "{{ marina_site_path }}"
    executable: /bin/bash
  environment:
    DJANGO_SETTINGS_MODULE: "{{ marina_django_settings_module }}"
  become: true
  become_user: "{{ marina_user }}"
  register: marina_collectstatic_result
  changed_when: "'0 static files copied' not in marina_collectstatic_result.stdout"

# The admin password arrives on stdin, never in the task environment: under become,
# Ansible puts task environment values into the command it hands to sudo, and sudo
# logs that command.
- name: Ensure admin user exists
  shell:
    cmd: |
      set -a
      . {{ marina_env_file }}
      set +a
      # Lossless: stdin is 'x' + value with no added newline (never empty, so the
      # command never inherits another stdin); both sentinels are stripped.
      ADMIN_PASSWORD=$(cat; printf x)
      ADMIN_PASSWORD=${ADMIN_PASSWORD%x}
      ADMIN_PASSWORD=${ADMIN_PASSWORD#x}
      export ADMIN_PASSWORD
      {{ marina_venv_bin }}/python manage.py ensure_superuser
    stdin: "x{{ marina_admin_password }}"
    stdin_add_newline: false
  args:
    chdir: "{{ marina_site_path }}"
    executable: /bin/bash
  environment:
    DJANGO_SETTINGS_MODULE: "{{ marina_django_settings_module }}"
    ADMIN_USERNAME: "{{ marina_admin_username }}"
    ADMIN_EMAIL: "{{ marina_admin_email | default('') }}"
  become: true
  become_user: "{{ marina_user }}"
  when:
    - marina_admin_username is defined
    - marina_admin_password is defined
  no_log: true
