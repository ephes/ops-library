---
ops_library_documentation_category: infrastructure
# Create one unattended Ed25519 identity without rotating an existing key.
ssh_forwarding_identity_enabled: true
ssh_forwarding_identity_state: present
ssh_forwarding_identity_removal_confirm: false
ssh_forwarding_identity_become: false
ssh_forwarding_identity_user: "CHANGEME"
ssh_forwarding_identity_group: "{{ ssh_forwarding_identity_user }}"
ssh_forwarding_identity_home: "/home/{{ ssh_forwarding_identity_user }}"
ssh_forwarding_identity_path: "{{ ssh_forwarding_identity_home }}/.ssh/forwarding_ed25519"
ssh_forwarding_identity_comment: "restricted-forwarding@{{ inventory_hostname }}"
ssh_forwarding_identity_keygen: /usr/bin/ssh-keygen
