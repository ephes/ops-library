---
- name: main | Skip role when disabled
  ansible.builtin.meta: end_host
  when: not mailgun_relay_enabled | bool

- name: main | Validate required variables
  ansible.builtin.assert:
    that:
      - mailgun_relay_deploy_method in ["rsync", "git"]
      - mailgun_relay_smtp_username is defined
      - mailgun_relay_smtp_username | length > 0
      - mailgun_relay_smtp_username != "CHANGEME"
      - mailgun_relay_smtp_password is defined
      - mailgun_relay_smtp_password | length > 0
      - mailgun_relay_smtp_password != "CHANGEME"
      - mailgun_relay_envelope_sender is defined
      - mailgun_relay_envelope_sender | length > 0
      - mailgun_relay_envelope_sender != "CHANGEME"
      - mailgun_relay_tokens is defined
      - mailgun_relay_tokens | length > 0
      - mailgun_relay_public_host | length > 0
      - mailgun_relay_smtp_host | length > 0
    fail_msg: >-
      mailgun_relay_deploy: required variables missing. Set smtp_username,
      smtp_password, envelope_sender, and at least one entry in mailgun_relay_tokens
      from ops-control SOPS secrets. CHANGEME placeholders are rejected.

- name: main | Validate the optional SMTP concurrency cap
  ansible.builtin.assert:
    that:
      - (mailgun_relay_smtp_max_concurrency | string) is match('^[0-9]+\Z')
      - (mailgun_relay_smtp_max_concurrency | int) >= 1
    fail_msg: >-
      mailgun_relay_smtp_max_concurrency must be empty (relay default 8) or a
      whole number of at least 1; got '{{ mailgun_relay_smtp_max_concurrency }}'.
  when: mailgun_relay_smtp_max_concurrency | string | length > 0

- name: main | Validate every token entry has the required shape
  ansible.builtin.assert:
    that:
      - item.label is defined
      - item.label | length > 0
      - item.token_sha256 is defined
      - item.token_sha256 | length == 64
      - item.token_sha256 is match("^[0-9a-fA-F]{64}$")
      - item.mailgun_domains is defined
      - item.mailgun_domains | length > 0
      - item.allowed_from_domains is defined
      - item.allowed_from_domains | length > 0
    fail_msg: >-
      mailgun_relay token entry for label {{ item.label | default('<no-label>') }}
      is malformed. Each token must have label, token_sha256 (64-hex sha256),
      mailgun_domains, allowed_from_domains. (Value omitted from this message
      because token_sha256 is sensitive.)
  loop: "{{ mailgun_relay_tokens }}"
  loop_control:
    label: "{{ item.label | default('<no-label>') }}"
  no_log: true

- name: main | Validate rsync-specific requirements
  ansible.builtin.assert:
    that:
      - mailgun_relay_source_path is defined
      - mailgun_relay_source_path | length > 0
    fail_msg: "mailgun_relay_source_path must be set when mailgun_relay_deploy_method=rsync"
  when: mailgun_relay_deploy_method == "rsync"

- name: main | Validate implementation settings
  ansible.builtin.assert:
    that:
      - mailgun_relay_impl in ['python', 'rust']
      - mailgun_relay_rust_version is string
      - >-
        mailgun_relay_rust_version == '' or
        mailgun_relay_rust_version is regex('^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$')
      - mailgun_relay_rust_sha256 is string
      - mailgun_relay_rust_sha256 == '' or mailgun_relay_rust_sha256 is regex('^[0-9a-f]{64}$')
      - mailgun_relay_rust_local_archive is string
      - >-
        mailgun_relay_rust_version == '' or mailgun_relay_rust_sha256 != '' or
        mailgun_relay_rust_local_archive != ''
      - mailgun_relay_rust_sha256 == '' or mailgun_relay_rust_version != ''
      - mailgun_relay_rust_local_archive == '' or mailgun_relay_rust_version != ''
      - mailgun_relay_impl == 'python' or mailgun_relay_rust_version != ''
      - mailgun_relay_rust_install_root is string
      - mailgun_relay_rust_install_root is regex('^/[^ ]*[^/ ]$')
      # Only normalized paths, so the checks here see the real location:
      # no empty, '.' or '..' components (/opt/.. is /).
      - mailgun_relay_rust_install_root is not regex('//|/[.][.]?(/|$)')
      # rsync --delete owns the site tree; an install below it would be wiped.
      - >-
        not ((mailgun_relay_rust_install_root ~ '/')
        .startswith(mailgun_relay_site_path | regex_replace('/+$', '') ~ '/'))
      - mailgun_relay_rust_keep_versions is not boolean
      - (mailgun_relay_rust_keep_versions | string) is regex('^[0-9]+$')
      - mailgun_relay_rust_keep_versions | int >= 1
    fail_msg: >-
      Implementation settings are invalid. mailgun_relay_impl must be python or
      rust (got {{ mailgun_relay_impl }}); rust needs mailgun_relay_rust_version.
      mailgun_relay_rust_version must be empty or a version such as 0.2.0 (got
      '{{ mailgun_relay_rust_version }}'). A version needs
      mailgun_relay_rust_sha256 (64 lowercase hex digits) or
      mailgun_relay_rust_local_archive; a checksum or local archive without a
      version is refused. mailgun_relay_rust_install_root must be an absolute
      path other than / without '.', '..' or empty components, outside
      {{ mailgun_relay_site_path }},
      mailgun_relay_rust_keep_versions a whole number >= 1.

- name: main | Ensure service user and directories
  ansible.builtin.import_tasks: user.yml

- name: main | Sync mailgun-relay source code
  ansible.builtin.include_tasks: "source_{{ mailgun_relay_deploy_method }}.yml"

- name: main | Prepare Python runtime and dependencies
  ansible.builtin.import_tasks: python.yml

- name: main | Render env and secrets files
  ansible.builtin.import_tasks: config.yml

- name: main | Install the pinned Rust release and select the implementation
  ansible.builtin.import_tasks: impl.yml

- name: main | Configure and start systemd service
  ansible.builtin.import_tasks: service.yml

- name: main | Apply handlers before health verification
  ansible.builtin.meta: flush_handlers

- name: main | Verify health endpoint
  ansible.builtin.import_tasks: health.yml
  when: mailgun_relay_healthcheck_enabled | bool

- name: main | Verify the running implementation and prune old Rust releases
  ansible.builtin.import_tasks: verify_impl.yml
