---
- name: health | Wait for OpenClaw port
  ansible.builtin.wait_for:
    host: "{{ openclaw_bind_host }}"
    port: "{{ openclaw_host_port }}"
    delay: 2
    timeout: "{{ openclaw_healthcheck_delay * openclaw_healthcheck_retries }}"

- name: health | Verify container is running
  ansible.builtin.command:
    cmd: docker inspect --format '{{ '{{' }}.State.Running{{ '}}' }}' {{ openclaw_container_name }}
  register: openclaw_health_container
  changed_when: false
  failed_when: openclaw_health_container.stdout != 'true'

- name: health | Wait for container to stabilize (catch early crash loops)
  ansible.builtin.pause:
    seconds: 5

- name: health | Verify container still running after stabilization
  ansible.builtin.command:
    cmd: docker inspect --format '{{ '{{' }}.State.Running{{ '}}' }}' {{ openclaw_container_name }}
  register: openclaw_health_stable
  changed_when: false
  failed_when: openclaw_health_stable.stdout != 'true'

- name: health | Determine whether Telegram readiness is required
  ansible.builtin.set_fact:
    _openclaw_telegram_expected_enabled: >-
      {{
        openclaw_gateway_config.get('channels', {}).get('telegram', {}).get('enabled', false)
        if (openclaw_gateway_config | length > 0)
        else (openclaw_telegram_enabled | bool)
      }}

- name: health | Wait for gateway and configured channel readiness
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json
        import subprocess
        import sys

        result = subprocess.run(
            ["docker", "exec", sys.argv[1], "openclaw", "health", "--json"],
            capture_output=True,
            text=True,
        )
        if result.returncode != 0:
            sys.stderr.write(result.stderr)
            raise SystemExit(result.returncode)

        try:
            health = json.loads(result.stdout)
        except (json.JSONDecodeError, TypeError) as error:
            sys.stderr.write(f"OpenClaw health returned invalid JSON: {error}\n")
            raise SystemExit(1)

        ready = isinstance(health, dict) and health.get("ok") is True
        if ready and sys.argv[2] == "true":
            channels = health.get("channels")
            telegram = channels.get("telegram") if isinstance(channels, dict) else None
            ready = (
                isinstance(telegram, dict)
                and telegram.get("configured") is True
                and telegram.get("running") is True
                and telegram.get("connected") is True
                and telegram.get("lastError") is None
            )
        if not ready:
            sys.stderr.write("OpenClaw or its configured Telegram channel is not ready\n")
            raise SystemExit(1)

        print(json.dumps(health))
      - "{{ openclaw_container_name }}"
      - "{{ (_openclaw_telegram_expected_enabled | bool) | ternary('true', 'false') }}"
  register: _openclaw_gateway_health
  changed_when: false
  failed_when: false
  retries: "{{ openclaw_healthcheck_retries }}"
  delay: "{{ openclaw_healthcheck_delay }}"
  until: _openclaw_gateway_health.rc == 0

- name: health | Parse gateway RPC health
  ansible.builtin.set_fact:
    _openclaw_gateway_health_json: "{{ _openclaw_gateway_health.stdout | from_json }}"

- name: health | Require configured Telegram channel readiness
  ansible.builtin.assert:
    that:
      - _openclaw_gateway_health_json.channels.telegram.configured | default(false) | bool
      - _openclaw_gateway_health_json.channels.telegram.running | default(false) | bool
      - _openclaw_gateway_health_json.channels.telegram.connected | default(false) | bool
      - (_openclaw_gateway_health_json.channels.telegram.lastError | default(none)) is none
    fail_msg: >-
      OpenClaw gateway is reachable, but the configured Telegram channel is not
      running and connected. Inspect gateway logs for migration or crash-loop
      suppression errors.
  when: _openclaw_telegram_expected_enabled | bool

- name: health | Inspect managed heartbeat recovery runtime
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ openclaw_container_name }}"
      - openclaw
      - plugins
      - inspect
      - heartbeat-recovery
      - --runtime
      - --json
  register: _openclaw_heartbeat_recovery_inspect
  changed_when: false
  when: openclaw_heartbeat_recovery_managed | bool

- name: health | Verify heartbeat recovery enabled state and hook registration
  ansible.builtin.assert:
    that:
      - >-
        (_openclaw_heartbeat_recovery_inspect.stdout | from_json).plugin.enabled
        == (openclaw_heartbeat_recovery_enabled | bool)
      - >-
        not (openclaw_heartbeat_recovery_enabled | bool)
        or (
          (_openclaw_heartbeat_recovery_inspect.stdout | from_json).plugin.status == 'loaded'
          and (_openclaw_heartbeat_recovery_inspect.stdout | from_json).plugin.imported
          and (
            ['before_prompt_build', 'before_tool_call', 'agent_end']
            | difference(
                (_openclaw_heartbeat_recovery_inspect.stdout | from_json).typedHooks
                | map(attribute='name') | list
              ) | length == 0
          )
        )
    fail_msg: >-
      Heartbeat recovery plugin state or runtime hooks do not match the managed
      configuration. Inspect plugin diagnostics, including conversation-access
      and prompt-injection permissions, before considering deployment successful.
  when: openclaw_heartbeat_recovery_managed | bool
