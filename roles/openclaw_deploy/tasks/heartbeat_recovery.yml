---
- name: heartbeat_recovery | Create extension directory
  ansible.builtin.file:
    path: "{{ openclaw_data_dir }}/extensions/heartbeat-recovery"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"

- name: heartbeat_recovery | Deploy extension
  ansible.builtin.copy:
    src: "heartbeat-recovery/{{ item }}"
    dest: "{{ openclaw_data_dir }}/extensions/heartbeat-recovery/{{ item }}"
    owner: "1000"
    group: "1000"
    mode: "0640"
  loop:
    - index.js
    - openclaw.plugin.json
    - package.json
  notify: restart openclaw
