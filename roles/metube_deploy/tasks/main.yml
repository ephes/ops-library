---
- name: "Validate required variables"
  ansible.builtin.include_tasks: validate.yml

# With the dependency sync enabled the environment ends up exactly as the
# checked lock (uv sync --frozen is exact), so only a deploy that leaves the
# environment alone checks it before changing anything.
- name: "Check the existing environment's certifi/pip floors"
  ansible.builtin.include_tasks: security_preflight.yml
  when:
    - metube_python_security_floor_enabled | bool
    - not (metube_sync_dependencies | bool)

- name: "Ensure uv is installed"
  ansible.builtin.include_tasks: uv.yml
  when: metube_install_uv | bool

- name: "Ensure Node.js is installed"
  ansible.builtin.include_tasks: nodejs.yml

- name: "Install required packages"
  ansible.builtin.include_tasks: packages.yml

- name: "Ensure metube user and group exist"
  ansible.builtin.include_tasks: user.yml

- name: "Create directories"
  ansible.builtin.include_tasks: directories.yml

- name: "Build frontend assets in the staging checkout"
  ansible.builtin.include_tasks: ui.yml
  when: metube_ui_build | bool

- name: "Check the dependency lock of the revision to deploy"
  ansible.builtin.include_tasks: security_source.yml
  when: metube_python_security_floor_enabled | bool

- name: "Fetch MeTube sources"
  ansible.builtin.include_tasks: source.yml

- name: "Publish frontend assets"
  ansible.builtin.include_tasks: ui_publish.yml
  when: metube_ui_build | bool

- name: "Create Python environment and install dependencies"
  ansible.builtin.include_tasks: python.yml
  when: metube_sync_dependencies | bool

- name: "Verify the environment's certifi/pip floors"
  ansible.builtin.include_tasks: security_verify.yml
  when: metube_python_security_floor_enabled | bool

- name: "Render environment file"
  ansible.builtin.include_tasks: env.yml

- name: "Configure systemd service"
  ansible.builtin.include_tasks: systemd.yml

- name: "Configure Traefik exposure"
  ansible.builtin.include_tasks: traefik.yml
  when: metube_traefik_enabled | bool

- name: "Run health check"
  ansible.builtin.include_tasks: health.yml
  when: metube_healthcheck_enabled | bool
