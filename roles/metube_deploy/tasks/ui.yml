---
# The UI is built in a separate staging checkout (metube_ui_build_dir), so a
# failed dependency install or build never leaves new sources in
# metube_install_dir next to an old build. source.yml then checks out exactly
# the commit built here and ui_publish.yml copies the build into place.
- name: "Create UI build directory"
  ansible.builtin.file:
    path: "{{ metube_ui_build_root }}"
    state: directory
    owner: "{{ metube_user }}"
    group: "{{ metube_group }}"
    mode: "0755"

- name: "Checkout MeTube sources for the UI build"
  ansible.builtin.git:
    repo: "{{ metube_repo_url }}"
    dest: "{{ metube_ui_build_dir }}"
    version: "{{ metube_repo_version }}"
    update: true
    force: true
  register: metube_ui_git_checkout
  become: true
  become_user: "{{ metube_user }}"

- name: "Read revision of the staged UI build"
  ansible.builtin.slurp:
    src: "{{ metube_ui_build_dir }}/ui/dist/metube/{{ metube_ui_rev_file }}"
  register: metube_ui_staged_rev
  failed_when: false

- name: "Detect UI lockfile"
  ansible.builtin.stat:
    path: "{{ metube_ui_build_dir }}/ui/pnpm-lock.yaml"
  register: metube_ui_pnpm_lock

# pnpm runs through corepack, which uses the version pinned in the
# packageManager field of ui/package.json. pnpm passes options after the
# script name to the script; npm needs "--".
- name: "Select UI package manager"
  ansible.builtin.set_fact:
    metube_ui_build_rev: "{{ metube_ui_git_checkout.after }}"
    metube_ui_package_manager: "{{ 'pnpm' if metube_ui_pnpm_lock.stat.exists else 'npm' }}"
    metube_ui_install_argv: >-
      {{ ['corepack', 'pnpm', 'install', '--frozen-lockfile']
         if metube_ui_pnpm_lock.stat.exists else ['npm', 'ci'] }}
    metube_ui_build_argv: >-
      {{ (['corepack', 'pnpm', 'run', 'build']
          if metube_ui_pnpm_lock.stat.exists else ['npm', 'run', 'build', '--'])
         + ['--configuration', metube_ui_build_configuration] }}
    metube_ui_build_env:
      HOME: "{{ metube_ui_build_root }}"
      CI: "true"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      NG_CLI_ANALYTICS: "false"

- name: "Build UI in the staging checkout"
  when: >-
    (metube_ui_staged_rev.content | default('') | b64decode | trim)
    != metube_ui_build_rev
  become: true
  become_user: "{{ metube_user }}"
  block:
    - name: "Install frontend dependencies ({{ metube_ui_package_manager }})"
      ansible.builtin.command:
        argv: "{{ metube_ui_install_argv }}"
        chdir: "{{ metube_ui_build_dir }}/ui"
      environment: "{{ metube_ui_build_env | combine({'NODE_ENV': '', 'npm_config_production': 'false'}) }}"
      changed_when: true

    - name: "Build frontend assets ({{ metube_ui_package_manager }})"
      ansible.builtin.command:
        argv: "{{ metube_ui_build_argv }}"
        chdir: "{{ metube_ui_build_dir }}/ui"
      environment: "{{ metube_ui_build_env | combine({'NODE_ENV': metube_ui_node_env}) }}"
      changed_when: true

    - name: "Check built UI entry point"
      ansible.builtin.stat:
        path: "{{ metube_ui_build_dir }}/ui/dist/metube/browser/index.html"
      register: metube_ui_index_stat

    - name: "Assert the build produced ui/dist/metube/browser"
      ansible.builtin.assert:
        that: metube_ui_index_stat.stat.exists
        fail_msg: "Build finished but ui/dist/metube/browser/index.html is missing; MeTube serves the UI from that path."

    - name: "Record revision of the staged UI build"
      ansible.builtin.copy:
        content: "{{ metube_ui_build_rev }}\n"
        dest: "{{ metube_ui_build_dir }}/ui/dist/metube/{{ metube_ui_rev_file }}"
        mode: "0644"
  rescue:
    - name: "Stop before touching the live install"
      ansible.builtin.fail:
        msg: >-
          MeTube UI build for {{ metube_ui_build_rev }} failed at
          "{{ ansible_failed_task.name }}" ({{ metube_ui_package_manager }}).
          {{ metube_install_dir }} and the running service were left unchanged.
          Fix the build in {{ metube_ui_build_dir }}/ui or pin
          metube_repo_version, then re-run.
