---
- name: Prepare
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure remote ansible tmp exists
      ansible.builtin.file:
        path: /tmp/.ansible/tmp
        state: directory
        mode: "0700"

    - name: Install curl for the verify step
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: true
