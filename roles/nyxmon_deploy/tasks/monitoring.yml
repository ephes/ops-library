---
# Setup monitoring for Nyxmon

- name: monitoring | Create monitoring service file
  template:
    src: nyxmon-monitor.service.j2
    dest: "/etc/systemd/system/{{ nyxmon_monitoring_service_name | regex_replace('\\.service$', '') }}.service"
    owner: root
    group: root
    mode: '0644'
  notify:
    - reload systemd
    - restart nyxmon-monitor

# Before 2.75.0 this drop-in pointed the unit's Python ExecStart at the Rust
# agent. The unit above starts the Rust agent itself, so the drop-in is removed
# here, after the unit is written and before systemd reloads. Only this fixed
# path is touched; the directory and its other drop-ins stay.
- name: monitoring | Check for the retired agent implementation drop-in
  ansible.builtin.stat:
    path: "{{ nyxmon_agent_legacy_dropin }}"
    follow: false
  register: nyxmon_agent_legacy_dropin_stat

- name: monitoring | Refuse a retired drop-in that is not a regular file
  ansible.builtin.assert:
    that:
      - nyxmon_agent_legacy_dropin_stat.stat.isreg
    fail_msg: >-
      {{ nyxmon_agent_legacy_dropin }} exists but is not a regular file; it is
      left alone. Inspect and remove it by hand.
  when: nyxmon_agent_legacy_dropin_stat.stat.exists

- name: monitoring | Remove the retired agent implementation drop-in
  ansible.builtin.file:
    path: "{{ nyxmon_agent_legacy_dropin }}"
    state: absent
  notify:
    - reload systemd
    - restart nyxmon-monitor
  when: nyxmon_agent_legacy_dropin_stat.stat.exists

- name: monitoring | Enable and start monitoring service
  systemd:
    name: "{{ nyxmon_monitoring_service_name | regex_replace('\\.service$', '') }}"
    enabled: true
    state: started
    daemon_reload: true

- name: monitoring | Install the warning digest units
  ansible.builtin.template:
    src: "nyxmon-warning-digest.{{ item }}.j2"
    dest: "/etc/systemd/system/nyxmon-warning-digest.{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - service
    - timer
  notify:
    - reload systemd
    - restart nyxmon warning digest timer
  when: nyxmon_notify_warning_delivery == 'digest'

- name: monitoring | Enable the warning digest timer
  ansible.builtin.systemd:
    name: nyxmon-warning-digest.timer
    enabled: true
    state: started
    daemon_reload: true
  when: nyxmon_notify_warning_delivery == 'digest'

- name: monitoring | Check for warning digest units to retire
  ansible.builtin.stat:
    path: /etc/systemd/system/nyxmon-warning-digest.timer
    follow: false
  register: nyxmon_warning_digest_timer_stat
  when: nyxmon_notify_warning_delivery != 'digest'

- name: monitoring | Stop the warning digest timer
  ansible.builtin.systemd:
    name: nyxmon-warning-digest.timer
    enabled: false
    state: stopped
  when:
    - nyxmon_notify_warning_delivery != 'digest'
    - nyxmon_warning_digest_timer_stat.stat.exists

- name: monitoring | Remove the warning digest units
  ansible.builtin.file:
    path: "/etc/systemd/system/nyxmon-warning-digest.{{ item }}"
    state: absent
  loop:
    - timer
    - service
  notify: reload systemd
  when: nyxmon_notify_warning_delivery != 'digest'
