---
# Install and validate the pinned Rust agent release that nyxmon-monitor.service
# runs. Runs after the migrations (django.yml), so --check-schema sees the
# schema the agent will run against, and before monitoring.yml, which writes the
# unit naming the versioned binary.
#
# With nyxmon_agent_rust_version empty (monitoring disabled) nothing is
# installed or validated.

- name: agent_rust | Derive agent paths
  ansible.builtin.set_fact:
    nyxmon_agent_monitor_unit: "{{ nyxmon_monitoring_service_name | regex_replace('\\.service$', '') }}"
    nyxmon_agent_rust_dir: "{{ nyxmon_agent_rust_install_root }}/{{ nyxmon_agent_rust_version }}"
    nyxmon_agent_rust_binary: "{{ nyxmon_agent_rust_install_root }}/{{ nyxmon_agent_rust_version }}/nyxmon-agent"
    nyxmon_agent_rust_staging: "{{ nyxmon_agent_rust_install_root }}/.staging"

# nyxmon_agent_legacy_dropin: the drop-in that selected the Rust agent over a
# Python ExecStart before 2.75.0; monitoring.yml removes it.
- name: agent_rust | Derive the unit paths
  ansible.builtin.set_fact:
    nyxmon_agent_unit_file: "/etc/systemd/system/{{ nyxmon_agent_monitor_unit }}.service"
    nyxmon_agent_legacy_dropin: "/etc/systemd/system/{{ nyxmon_agent_monitor_unit }}.service.d/agent-impl.conf"

- name: agent_rust | Install and validate the pinned Rust agent release
  when: nyxmon_agent_rust_version | length > 0
  block:
    - name: agent_rust | Ensure the install root exists
      ansible.builtin.file:
        path: "{{ nyxmon_agent_rust_install_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: agent_rust | Remove leftovers of an interrupted install
      ansible.builtin.file:
        path: "{{ nyxmon_agent_rust_staging }}"
        state: absent

    - name: agent_rust | Check whether the pinned version is installed
      ansible.builtin.stat:
        path: "{{ nyxmon_agent_rust_dir }}"
      register: nyxmon_agent_rust_dir_stat

    - name: agent_rust | Checksum the local archive
      ansible.builtin.stat:
        path: "{{ nyxmon_agent_rust_local_archive }}"
        get_checksum: true
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: nyxmon_agent_rust_local_archive_stat
      when: nyxmon_agent_rust_local_archive | length > 0

    - name: agent_rust | Assert the local archive exists and matches a pinned checksum
      ansible.builtin.assert:
        that:
          - nyxmon_agent_rust_local_archive_stat.stat.exists
          - nyxmon_agent_rust_local_archive_stat.stat.isreg
          - >-
            nyxmon_agent_rust_sha256 == '' or
            nyxmon_agent_rust_local_archive_stat.stat.checksum == nyxmon_agent_rust_sha256
        fail_msg: >-
          nyxmon_agent_rust_local_archive {{ nyxmon_agent_rust_local_archive }} is
          missing, not a file, or its sha256
          ({{ nyxmon_agent_rust_local_archive_stat.stat.checksum | default('n/a') }})
          differs from nyxmon_agent_rust_sha256.
      when: nyxmon_agent_rust_local_archive | length > 0

    - name: agent_rust | Determine the expected archive checksum
      ansible.builtin.set_fact:
        nyxmon_agent_rust_archive_sha256: >-
          {{
            nyxmon_agent_rust_local_archive_stat.stat.checksum
            if nyxmon_agent_rust_local_archive | length > 0
            else nyxmon_agent_rust_sha256
          }}

    - name: agent_rust | Read the archive checksum of the installed version
      ansible.builtin.slurp:
        path: "{{ nyxmon_agent_rust_dir }}/.archive-sha256"
      register: nyxmon_agent_rust_installed_sha256
      failed_when: false
      when: nyxmon_agent_rust_dir_stat.stat.exists

    # An installed version directory is never modified in place: the same
    # version must come from the same archive.
    - name: agent_rust | Refuse a different archive for an installed version
      ansible.builtin.assert:
        that:
          - nyxmon_agent_rust_installed_sha256.content is defined
          - >-
            (nyxmon_agent_rust_installed_sha256.content | b64decode | trim)
            == nyxmon_agent_rust_archive_sha256
        fail_msg: >-
          {{ nyxmon_agent_rust_dir }} is installed from an archive with sha256
          {{ (nyxmon_agent_rust_installed_sha256.content | default('') | b64decode | trim) or 'unknown' }},
          but this run pins {{ nyxmon_agent_rust_archive_sha256 }}. An installed
          version is never replaced in place. Pin the matching archive, or remove
          the directory by hand when it is not the active version
          ({{ nyxmon_agent_unit_file }}).
      when: nyxmon_agent_rust_dir_stat.stat.exists

    - name: agent_rust | Stage the pinned release
      when:
        - not nyxmon_agent_rust_dir_stat.stat.exists
        - not ansible_check_mode
      block:
        - name: agent_rust | Create the staging directory
          ansible.builtin.file:
            path: "{{ nyxmon_agent_rust_staging }}/tree"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: agent_rust | Download the release archive
          ansible.builtin.get_url:
            url: "{{ nyxmon_agent_rust_release_url }}"
            dest: "{{ nyxmon_agent_rust_staging }}/archive.tar.gz"
            checksum: "sha256:{{ nyxmon_agent_rust_sha256 }}"
            owner: root
            group: root
            mode: "0600"
          when: nyxmon_agent_rust_local_archive | length == 0

        - name: agent_rust | Copy the local archive
          ansible.builtin.copy:
            src: "{{ nyxmon_agent_rust_local_archive }}"
            dest: "{{ nyxmon_agent_rust_staging }}/archive.tar.gz"
            owner: root
            group: root
            mode: "0600"
          when: nyxmon_agent_rust_local_archive | length > 0

        - name: agent_rust | Checksum the staged archive
          ansible.builtin.stat:
            path: "{{ nyxmon_agent_rust_staging }}/archive.tar.gz"
            get_checksum: true
            checksum_algorithm: sha256
          register: nyxmon_agent_rust_staged_archive

        - name: agent_rust | Assert the staged archive is the pinned one
          ansible.builtin.assert:
            that:
              - nyxmon_agent_rust_staged_archive.stat.checksum == nyxmon_agent_rust_archive_sha256
            fail_msg: >-
              The staged archive has sha256 {{ nyxmon_agent_rust_staged_archive.stat.checksum }},
              expected {{ nyxmon_agent_rust_archive_sha256 }}.

        # Checked before extraction: only regular files named nyxmon-agent and
        # LICENSE, each once. A link or device member could otherwise make the
        # following tasks act on a path outside the staging directory.
        - name: agent_rust | List the archive members
          ansible.builtin.command:
            argv:
              - tar
              - --list
              - --gzip
              - --file
              - "{{ nyxmon_agent_rust_staging }}/archive.tar.gz"
          changed_when: false
          register: nyxmon_agent_rust_member_names

        - name: agent_rust | List the archive member types
          ansible.builtin.command:
            argv:
              - tar
              - --list
              - --verbose
              - --gzip
              - --file
              - "{{ nyxmon_agent_rust_staging }}/archive.tar.gz"
          changed_when: false
          register: nyxmon_agent_rust_member_types

        - name: agent_rust | Assert the archive holds only the agent and its license as regular files
          ansible.builtin.assert:
            that:
              - "'nyxmon-agent' in nyxmon_agent_rust_members"
              - nyxmon_agent_rust_members | difference(['nyxmon-agent', 'LICENSE']) | length == 0
              - nyxmon_agent_rust_members | unique | length == nyxmon_agent_rust_members | length
              - nyxmon_agent_rust_member_types.stdout_lines | length == nyxmon_agent_rust_members | length
              - nyxmon_agent_rust_member_types.stdout_lines | reject('match', '-') | list | length == 0
            fail_msg: >-
              The release archive must hold the regular files nyxmon-agent (and
              LICENSE) at its root, once each; found
              {{ nyxmon_agent_rust_member_types.stdout_lines }}.
          vars:
            nyxmon_agent_rust_members: "{{ nyxmon_agent_rust_member_names.stdout_lines | map('regex_replace', '^[.]/', '') | list }}"

        - name: agent_rust | Unpack the release archive
          ansible.builtin.unarchive:
            src: "{{ nyxmon_agent_rust_staging }}/archive.tar.gz"
            dest: "{{ nyxmon_agent_rust_staging }}/tree"
            remote_src: true
            owner: root
            group: root

        - name: agent_rust | Check the unpacked agent binary
          ansible.builtin.stat:
            path: "{{ nyxmon_agent_rust_staging }}/tree/nyxmon-agent"
            follow: false
            get_checksum: false
          register: nyxmon_agent_rust_unpacked_binary

        - name: agent_rust | Assert the unpacked agent is a regular file
          ansible.builtin.assert:
            that:
              - nyxmon_agent_rust_unpacked_binary.stat.isreg | default(false)
            fail_msg: "{{ nyxmon_agent_rust_staging }}/tree/nyxmon-agent is not a regular file."

        - name: agent_rust | Make the agent binary root-owned and executable
          ansible.builtin.file:
            path: "{{ nyxmon_agent_rust_staging }}/tree/nyxmon-agent"
            state: file
            follow: false
            owner: root
            group: root
            mode: "0755"

        - name: agent_rust | Record the archive checksum with the version
          ansible.builtin.copy:
            content: "{{ nyxmon_agent_rust_archive_sha256 }}\n"
            dest: "{{ nyxmon_agent_rust_staging }}/tree/.archive-sha256"
            owner: root
            group: root
            mode: "0644"

        - name: agent_rust | Move the staged version into place
          ansible.builtin.command:
            argv:
              - mv
              - --no-target-directory
              - "{{ nyxmon_agent_rust_staging }}/tree"
              - "{{ nyxmon_agent_rust_dir }}"
            creates: "{{ nyxmon_agent_rust_dir }}"

        - name: agent_rust | Remove the staging directory
          ansible.builtin.file:
            path: "{{ nyxmon_agent_rust_staging }}"
            state: absent

    # Validated by the versioned path before the unit points at it, as the
    # service user. A fresh install that fails is removed again; an installed
    # version, the unit and the running agent are left alone.
    - name: agent_rust | Validate the candidate binary
      when: not ansible_check_mode or nyxmon_agent_rust_dir_stat.stat.exists
      block:
        - name: agent_rust | Read the version of the candidate binary
          ansible.builtin.command:
            argv:
              - "{{ nyxmon_agent_rust_binary }}"
              - --version
          become: true
          become_user: "{{ nyxmon_user }}"
          check_mode: false
          changed_when: false
          failed_when: false
          register: nyxmon_agent_rust_version_check

        - name: agent_rust | Assert the candidate reports the pinned version
          ansible.builtin.assert:
            that:
              - nyxmon_agent_rust_version_check.rc == 0
              - (nyxmon_agent_rust_version_check.stdout.split() + ['', ''])[0] == 'nyxmon-agent'
              - (nyxmon_agent_rust_version_check.stdout.split() + ['', ''])[1] == nyxmon_agent_rust_version
            fail_msg: >-
              {{ nyxmon_agent_rust_binary }} --version exited
              {{ nyxmon_agent_rust_version_check.rc }} with
              '{{ nyxmon_agent_rust_version_check.stdout | trim }}'
              {{ nyxmon_agent_rust_version_check.stderr | trim }};
              expected 'nyxmon-agent {{ nyxmon_agent_rust_version }} (<commit>)'.

        - name: agent_rust | Check the database schema with the candidate binary
          ansible.builtin.command:
            argv:
              - "{{ nyxmon_agent_rust_binary }}"
              - --check-schema
              - --db
              - "{{ nyxmon_django_path }}/db.sqlite3"
          become: true
          become_user: "{{ nyxmon_user }}"
          check_mode: false
          changed_when: false
          failed_when: false
          register: nyxmon_agent_rust_schema_check

        - name: agent_rust | Assert the database schema satisfies the candidate
          ansible.builtin.assert:
            that:
              - nyxmon_agent_rust_schema_check.rc == 0
            fail_msg: >-
              {{ nyxmon_agent_rust_binary }} --check-schema exited
              {{ nyxmon_agent_rust_schema_check.rc }}:
              {{ nyxmon_agent_rust_schema_check.stderr | trim }}
              {{ nyxmon_agent_rust_schema_check.stdout | trim }}

      rescue:
        - name: agent_rust | Remove the rejected fresh install
          ansible.builtin.file:
            path: "{{ nyxmon_agent_rust_dir }}"
            state: absent
          when: not nyxmon_agent_rust_dir_stat.stat.exists

        - name: agent_rust | Stop on a rejected candidate
          ansible.builtin.fail:
            msg: >-
              nyxmon-agent {{ nyxmon_agent_rust_version }} failed validation
              ({{ ansible_failed_result.msg | default('see above') }}). Nothing was
              switched: the unit, the running agent and the other installed
              versions are unchanged.

# The Rust version the monitoring unit started so far, read before
# monitoring.yml rewrites the unit: the base unit's ExecStart, or the retired
# drop-in's while it still exists (it overrides the base unit).
- name: agent_rust | Check the monitoring unit and the retired drop-in
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ nyxmon_agent_unit_file }}"
    - "{{ nyxmon_agent_legacy_dropin }}"
  register: nyxmon_agent_unit_stat

- name: agent_rust | Read the monitoring unit
  ansible.builtin.slurp:
    path: "{{ nyxmon_agent_unit_file }}"
  register: nyxmon_agent_unit_before
  when: nyxmon_agent_unit_stat.results[0].stat.isreg | default(false)

- name: agent_rust | Read the retired drop-in
  ansible.builtin.slurp:
    path: "{{ nyxmon_agent_legacy_dropin }}"
  register: nyxmon_agent_legacy_dropin_before
  when: nyxmon_agent_unit_stat.results[1].stat.isreg | default(false)

- name: agent_rust | Derive the Rust version the unit selected so far
  ansible.builtin.set_fact:
    nyxmon_agent_rust_active_before: >-
      {{
        (
          [nyxmon_agent_legacy_dropin_before, nyxmon_agent_unit_before]
          | map(attribute='content', default='')
          | map('b64decode')
          | map('regex_search',
              '(?m)^ExecStart=' ~ (nyxmon_agent_rust_install_root | regex_escape)
              ~ '/([^/ ]+)/nyxmon-agent( |$)', '\1')
          | map('default', [''], true)
          | map('first')
          | select
          | first
        ) | default('', true)
      }}

- name: agent_rust | Check the previously selected Rust version
  ansible.builtin.stat:
    path: "{{ nyxmon_agent_rust_install_root }}/{{ nyxmon_agent_rust_active_before }}"
  register: nyxmon_agent_rust_active_before_stat
  when: nyxmon_agent_rust_active_before | length > 0

# Kept by the pruning step as the rollback target. Written only when the
# selection moves to another version, not when the unit changes for another
# reason.
- name: agent_rust | Remember the previously selected Rust version
  ansible.builtin.copy:
    content: "{{ nyxmon_agent_rust_active_before }}\n"
    dest: "{{ nyxmon_agent_rust_install_root }}/.previous-version"
    owner: root
    group: root
    mode: "0644"
  when:
    - nyxmon_agent_rust_active_before | length > 0
    - nyxmon_agent_rust_active_before_stat.stat.isdir | default(false)
    - nyxmon_agent_rust_active_before != nyxmon_agent_rust_version
