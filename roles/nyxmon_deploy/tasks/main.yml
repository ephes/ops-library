---
# Nyxmon deployment main tasks

- name: Validate required variables
  assert:
    that:
      - nyxmon_django_secret_key is defined
      - nyxmon_django_secret_key != ""
      - nyxmon_django_secret_key != "CHANGEME"
      - nyxmon_django_secret_key != "development-secret-key-change-in-production"
      - nyxmon_telegram_bot_token is defined
      - nyxmon_telegram_bot_token != ""
      - nyxmon_telegram_bot_token != "CHANGEME"
      - nyxmon_telegram_bot_token != "development-token"
      - nyxmon_telegram_chat_id is defined
      - nyxmon_telegram_chat_id != ""
      - nyxmon_telegram_chat_id != "CHANGEME"
      - nyxmon_telegram_chat_id != "-1001234567890"
      - nyxmon_deploy_method in ['rsync', 'git']
    fail_msg: |
      SECURITY ERROR: Required secrets are missing or contain placeholder values!

      The following secrets MUST be properly configured:
      - nyxmon_django_secret_key: {{ nyxmon_django_secret_key | default('NOT SET') }}
      - nyxmon_telegram_bot_token: {{ nyxmon_telegram_bot_token | default('NOT SET') | regex_replace('.', '*') }}
      - nyxmon_telegram_chat_id: {{ nyxmon_telegram_chat_id | default('NOT SET') }}

      Placeholder or development values are NOT allowed in production.
      Please update secrets/prod/nyxmon.yml with real values using:
      SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt sops secrets/prod/nyxmon.yml

- name: Validate Nyxmon reliability settings are whole numbers
  assert:
    that:
      - item.value is not boolean
      - (item.value | string) is match('^[0-9]+$')
    fail_msg: >-
      {{ item.name }} must be a non-negative whole number, got
      {{ item.value | default('NOT SET') }}.
  loop:
    - name: nyxmon_notify_consecutive_failures
      value: "{{ nyxmon_notify_consecutive_failures }}"
    - name: nyxmon_notify_repeat_interval_seconds
      value: "{{ nyxmon_notify_repeat_interval_seconds }}"
    - name: nyxmon_notify_warning_repeat_interval_seconds
      value: "{{ nyxmon_notify_warning_repeat_interval_seconds }}"
    - name: nyxmon_processing_lease_seconds
      value: "{{ nyxmon_processing_lease_seconds }}"
    - name: nyxmon_check_batch_size
      value: "{{ nyxmon_check_batch_size }}"
  loop_control:
    label: "{{ item.name }}"

- name: Validate Nyxmon reliability settings
  assert:
    that:
      - nyxmon_notify_consecutive_failures | int >= 1
      - nyxmon_notify_consecutive_failures | int <= 100
      - nyxmon_notify_repeat_interval_seconds | int >= 60
      - nyxmon_notify_repeat_interval_seconds | int <= 2592000
      - nyxmon_notify_warning_repeat_interval_seconds | int >= 60
      - nyxmon_notify_warning_repeat_interval_seconds | int <= 2592000
      - nyxmon_processing_lease_seconds | int >= 30
      - nyxmon_check_batch_size | int >= 1
      - nyxmon_check_batch_size | int <= 100
      - >-
        nyxmon_processing_lease_seconds | int
        >= ((nyxmon_check_batch_size | int) + 5) * 60
    fail_msg: >-
      Nyxmon notification thresholds are out of range. The consecutive-failure
      threshold must be 1..100, reminder intervals must be 60..2592000 seconds,
      and the processing lease must be at least five minutes plus one minute per
      claimed check.

- name: Warn about the removed sample-count reminder variable
  debug:
    msg: >-
      DEPRECATION: nyxmon_notify_repeat_failures is set but ignored. Reminder
      cadence is elapsed-time based now, because a sample count means a
      different wall-clock interval for every check interval. Remove the
      variable and set nyxmon_notify_repeat_interval_seconds (errors) and
      nyxmon_notify_warning_repeat_interval_seconds (warnings) instead.
  when: nyxmon_notify_repeat_failures is defined

- name: Validate rsync-specific requirements
  assert:
    that:
      - nyxmon_source_path != ""
      - nyxmon_source_path is defined
      # The Django sync copies src/django/ into the site root, so that is where
      # Django keeps db.sqlite3. The ownership fix in source_rsync.yml keeps
      # the database's transient sidecars out of its walk only there.
      - >-
        (nyxmon_django_path | regex_replace('/+$', ''))
        == (nyxmon_site_path | regex_replace('/+$', ''))
    fail_msg: >-
      nyxmon_source_path must be set when using rsync deployment method, and
      nyxmon_django_path must be nyxmon_site_path (the Django sync puts the
      project and its database there); got nyxmon_django_path
      {{ nyxmon_django_path | default('NOT SET') }}, nyxmon_site_path
      {{ nyxmon_site_path | default('NOT SET') }}.
  when: nyxmon_deploy_method == "rsync"

- name: Validate Traefik basic auth configuration
  assert:
    that:
      - not nyxmon_basic_auth_enabled or (
          nyxmon_basic_auth_password is defined and
          nyxmon_basic_auth_password != "CHANGEME" and
          (nyxmon_basic_auth_password | default('') | length) > 0
        )
    fail_msg: |
      Basic auth is enabled but password is invalid.

      Requirements:
      - Must not be "CHANGEME"
      - Must not be empty, whitespace, or null

      Please update secrets/prod/traefik.yml with a strong password.
      The role will automatically hash it using htpasswd (bcrypt).

      Or disable basic auth with: nyxmon_basic_auth_enabled: false

- name: Validate OpsGate producer wiring
  assert:
    that:
      - >-
        (
          (nyxmon_opsgate_submit_base_url | trim | length) == 0 and
          (nyxmon_opsgate_submit_token | trim | length) == 0
        ) or
        (
          (nyxmon_opsgate_submit_base_url | trim | length) > 0 and
          (nyxmon_opsgate_submit_token | trim | length) >= 20
        )
    fail_msg: >-
      OpsGate producer config is invalid. Set both nyxmon_opsgate_submit_base_url and
      nyxmon_opsgate_submit_token (>=20 chars), or leave both empty to disable integration.

- name: Validate monitoring agent implementation settings
  ansible.builtin.assert:
    that:
      - nyxmon_agent_impl in ['python', 'rust']
      - nyxmon_agent_rust_version is string
      - >-
        nyxmon_agent_rust_version == '' or
        nyxmon_agent_rust_version is regex('^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$')
      - nyxmon_agent_rust_sha256 is string
      - nyxmon_agent_rust_sha256 == '' or nyxmon_agent_rust_sha256 is regex('^[0-9a-f]{64}$')
      - nyxmon_agent_rust_local_archive is string
      - >-
        nyxmon_agent_rust_version == '' or nyxmon_agent_rust_sha256 != '' or
        nyxmon_agent_rust_local_archive != ''
      - nyxmon_agent_rust_sha256 == '' or nyxmon_agent_rust_version != ''
      - nyxmon_agent_rust_local_archive == '' or nyxmon_agent_rust_version != ''
      - nyxmon_agent_impl == 'python' or nyxmon_agent_rust_version != ''
      - nyxmon_agent_impl == 'python' or nyxmon_monitoring_enabled | bool
      - nyxmon_agent_rust_install_root is regex('^/[^ ]*[^/ ]$')
      - nyxmon_agent_rust_keep_versions is not boolean
      - (nyxmon_agent_rust_keep_versions | string) is regex('^[0-9]+$')
      - nyxmon_agent_rust_keep_versions | int >= 1
    fail_msg: >-
      Monitoring agent settings are invalid. nyxmon_agent_impl must be python or
      rust (got {{ nyxmon_agent_impl }}). nyxmon_agent_rust_version must be empty
      or a version such as 0.1.0 (got '{{ nyxmon_agent_rust_version }}'), and
      impl rust needs a version and nyxmon_monitoring_enabled. A version needs
      nyxmon_agent_rust_sha256 (64 lowercase hex digits) or
      nyxmon_agent_rust_local_archive; a checksum or local archive without a
      version is refused. nyxmon_agent_rust_install_root must be an absolute
      path other than /, nyxmon_agent_rust_keep_versions a whole number >= 1.

- name: Setup user and directories
  include_tasks: user.yml

- name: Deploy source code
  include_tasks: "source_{{ nyxmon_deploy_method }}.yml"

- name: Setup Python environment
  include_tasks: python.yml

- name: Configure Django application
  include_tasks: django.yml

- name: Install the Rust agent and select the agent implementation
  include_tasks: agent_rust.yml

- name: Setup systemd service
  include_tasks: service.yml

- name: Configure Traefik
  include_tasks: traefik.yml
  when: nyxmon_traefik_enabled

- name: Setup monitoring
  include_tasks: monitoring.yml
  when: nyxmon_monitoring_enabled

- name: Enforce SQLite credential privacy
  include_tasks: sqlite_privacy.yml

- name: main | Flush handlers before OpsGate smoke validation
  meta: flush_handlers

- name: main | Verify the running agent implementation and prune old Rust agents
  include_tasks: agent_verify.yml

- name: main | Validate live nyxmon-monitor OpsGate settings
  include_tasks: validate_opsgate_smoke.yml
  when:
    - nyxmon_monitoring_enabled
    - (nyxmon_opsgate_submit_base_url | trim | length) > 0
    - (nyxmon_opsgate_submit_token | trim | length) > 0
