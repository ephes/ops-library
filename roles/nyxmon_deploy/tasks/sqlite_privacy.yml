---
- name: sqlite_privacy | Ensure systemd drop-in directories exist
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - nyxmon
    - "{{ nyxmon_monitoring_service_name | regex_replace('\\.service$', '') }}"

- name: sqlite_privacy | Install writer umask drop-ins
  ansible.builtin.copy:
    content: |
      [Service]
      UMask=0077
    dest: "/etc/systemd/system/{{ item }}.service.d/sqlite-privacy.conf"
    owner: root
    group: root
    mode: "0644"
  loop:
    - nyxmon
    - "{{ nyxmon_monitoring_service_name | regex_replace('\\.service$', '') }}"
  notify:
    - reload systemd
    - restart nyxmon for SQLite privacy
    - restart nyxmon-monitor for SQLite privacy

- name: sqlite_privacy | Activate writer umask drop-ins
  ansible.builtin.meta: flush_handlers

- name: sqlite_privacy | Find database and sidecars
  ansible.builtin.find:
    paths: "{{ nyxmon_django_path }}"
    patterns: "db.sqlite3*"
    file_type: file
    recurse: false
  register: nyxmon_sqlite_files
  when: not ansible_check_mode

- name: sqlite_privacy | Require the main database
  ansible.builtin.assert:
    that:
      - >-
        nyxmon_sqlite_files.files
        | selectattr('path', 'equalto', nyxmon_django_path ~ '/db.sqlite3')
        | list | length == 1
    fail_msg: "Nyxmon SQLite database is missing or ambiguous."
  when: not ansible_check_mode

# The writers keep running during the deploy. With journal_mode=delete every
# write transaction creates db.sqlite3-journal and deletes it at commit (in WAL
# mode -wal/-shm go away when the last connection closes), so a sidecar listed
# above can be gone before this loop reaches it. A failure on such a transient
# sidecar (db.sqlite3-*) therefore does not fail this step. That costs no
# privacy: the re-read and verify below are the guarantee. Every file still
# present then must belong to the service account with mode 0600, so a sidecar
# that survived a failed restriction stops the deploy there. Sidecars created
# after this step get the database file's mode from SQLite (and the umask from
# the drop-ins). The database itself and the other db.sqlite3* files (agent
# lock, backups) are persistent: any failure on them fails here.
- name: sqlite_privacy | Restrict database and sidecars
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ nyxmon_user }}"
    group: "{{ nyxmon_group }}"
    mode: "0600"
  loop: "{{ nyxmon_sqlite_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: nyxmon_sqlite_restricted
  failed_when:
    - nyxmon_sqlite_restricted is failed
    - not (item.path | basename).startswith('db.sqlite3-')
  when: not ansible_check_mode

- name: sqlite_privacy | Re-read database and sidecar metadata
  ansible.builtin.find:
    paths: "{{ nyxmon_django_path }}"
    patterns: "db.sqlite3*"
    file_type: file
    recurse: false
  register: nyxmon_sqlite_files_verified
  when: not ansible_check_mode

- name: sqlite_privacy | Verify database and sidecars are private
  ansible.builtin.assert:
    that:
      - item.pw_name == nyxmon_user
      - item.gr_name == nyxmon_group
      - item.mode == '0600'
    fail_msg: "Nyxmon SQLite file is not private to the service account."
  loop: "{{ nyxmon_sqlite_files_verified.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: not ansible_check_mode
