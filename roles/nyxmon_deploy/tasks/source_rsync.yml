---
# Deploy Nyxmon source code using rsync

- name: source_rsync | Ensure source directory exists
  delegate_to: localhost
  stat:
    path: "{{ nyxmon_source_path }}"
  register: source_dir
  become: false

- name: source_rsync | Fail if source directory doesn't exist
  fail:
    msg: "Source directory {{ nyxmon_source_path }} does not exist"
  when: not source_dir.stat.exists or not source_dir.stat.isdir

- name: source_rsync | Build list of required source paths
  set_fact:
    nyxmon_required_source_paths: >-
      {{ ['src/django/']
         + (nyxmon_rsync_additional_paths | default([]))
         + (nyxmon_rsync_extra_files | default([]))
         + (['pyproject.toml'] if nyxmon_use_source_pyproject else [])
         + (['uv.lock'] if nyxmon_use_uv and nyxmon_use_source_pyproject else []) }}
  delegate_to: localhost
  become: false

- name: source_rsync | Validate required source paths exist
  stat:
    path: "{{ nyxmon_source_path }}/{{ item }}"
  register: nyxmon_source_path_stats
  delegate_to: localhost
  become: false
  loop: "{{ nyxmon_required_source_paths }}"
  loop_control:
    label: "{{ item }}"

- name: source_rsync | Fail if required source paths are missing
  assert:
    that: item.stat.exists
    fail_msg: "Missing required path for rsync deployment: {{ nyxmon_source_path }}/{{ item.item }}"
  loop: "{{ nyxmon_source_path_stats.results }}"
  loop_control:
    label: "{{ nyxmon_source_path }}/{{ item.item }}"

- name: source_rsync | Ensure parent directories exist for additional sources
  file:
    path: "{{ (nyxmon_site_path ~ '/' ~ item) | regex_replace('/+$', '') | dirname }}"
    state: directory
    owner: "{{ nyxmon_user }}"
    group: "{{ nyxmon_group }}"
    mode: '0755'
  loop: "{{ nyxmon_rsync_additional_paths }}"
  loop_control:
    label: "{{ item }}"
  when:
    - nyxmon_rsync_additional_paths is defined
    - nyxmon_rsync_additional_paths | length > 0

- name: source_rsync | Ensure destination directories exist for additional sources
  file:
    path: "{{ (nyxmon_site_path ~ '/' ~ item) | regex_replace('/+$', '') }}"
    state: directory
    owner: "{{ nyxmon_user }}"
    group: "{{ nyxmon_group }}"
    mode: '0755'
  loop: "{{ nyxmon_rsync_additional_paths }}"
  loop_control:
    label: "{{ item }}"
  when:
    - nyxmon_rsync_additional_paths is defined
    - nyxmon_rsync_additional_paths | length > 0

# owner/group are deliberately not preserved: rsync would otherwise stamp the
# controller's uid/gid onto the destination directory itself, which takes write
# access to the site directory away from the service user mid-deploy. With a
# rollback journal that is exactly SQLITE_READONLY_DIRECTORY, reported as
# "attempt to write a readonly database".
- name: source_rsync | Sync Django source code to target
  ansible.posix.synchronize:
    src: "{{ nyxmon_source_path }}/src/django/"
    dest: "{{ nyxmon_site_path }}/"
    delete: true
    owner: false
    group: false
    rsync_opts: >-
      {{
        ((nyxmon_rsync_excludes + nyxmon_rsync_django_excludes)
         | map('regex_replace', '^', '--exclude=')
         | list)
        + (nyxmon_rsync_role_managed
           | map('regex_replace', '^/*', '--exclude=/')
           | list)
        + ['--omit-dir-times']
      }}
  vars:
    # Site-root paths this role creates after the sync: the venv symlink, the
    # lock file uv writes, and the pyproject.toml / extra files copied or
    # templated below. Without these (root-anchored) excludes, delete: true
    # removes them on every run. The sync, the copies that put them back and
    # the uv install that sees a new pyproject.toml would then all report a
    # change, and every deploy would restart nyxmon. --omit-dir-times keeps
    # the directory mtimes those writes bump from counting as source changes.
    nyxmon_rsync_role_managed: >-
      {{ ['venv', 'uv.lock', '.env.shell']
         + (['pyproject.toml'] if (nyxmon_use_source_pyproject or nyxmon_use_uv) else [])
         + (nyxmon_rsync_extra_files | default([])) }}
  become: false
  delegate_to: localhost
  notify:
    - restart nyxmon
    - restart nyxmon-monitor

- name: source_rsync | Sync additional Nyxmon source directories
  ansible.posix.synchronize:
    src: "{{ nyxmon_source_path }}/{{ item }}"
    dest: "{{ nyxmon_site_path }}/{{ item }}"
    delete: true
    owner: false
    group: false
    rsync_opts: >-
      {{
        (nyxmon_rsync_excludes
         | map('regex_replace', '^', '--exclude=')
         | list)
        + ['--omit-dir-times']
      }}
  become: false
  delegate_to: localhost
  loop: "{{ nyxmon_rsync_additional_paths }}"
  loop_control:
    label: "{{ item }}"
  when:
    - nyxmon_rsync_additional_paths is defined
    - nyxmon_rsync_additional_paths | length > 0
  notify:
    - restart nyxmon
    - restart nyxmon-monitor

- name: source_rsync | Copy pyproject.toml from source
  copy:
    src: "{{ nyxmon_source_path }}/pyproject.toml"
    dest: "{{ nyxmon_site_path }}/pyproject.toml"
    owner: "{{ nyxmon_user }}"
    group: "{{ nyxmon_group }}"
    mode: '0644'
  when:
    - nyxmon_use_source_pyproject
  notify:
    - restart nyxmon
    - restart nyxmon-monitor

- name: source_rsync | Copy uv.lock from source
  copy:
    src: "{{ nyxmon_source_path }}/uv.lock"
    dest: "{{ nyxmon_site_path }}/uv.lock"
    owner: "{{ nyxmon_user }}"
    group: "{{ nyxmon_group }}"
    mode: '0644'
  when:
    - nyxmon_use_uv
    - nyxmon_use_source_pyproject
  notify:
    - restart nyxmon
    - restart nyxmon-monitor

- name: source_rsync | Copy extra files from source
  copy:
    src: "{{ nyxmon_source_path }}/{{ item }}"
    dest: "{{ nyxmon_site_path }}/{{ item }}"
    owner: "{{ nyxmon_user }}"
    group: "{{ nyxmon_group }}"
    mode: '0644'
  loop: "{{ nyxmon_rsync_extra_files }}"
  loop_control:
    label: "{{ item }}"
  when:
    - nyxmon_rsync_extra_files is defined
    - nyxmon_rsync_extra_files | length > 0
  notify:
    - restart nyxmon
    - restart nyxmon-monitor

# This walks the live database, which lives in the site tree. That is safe: it
# only sets owner/group to the service user the database already belongs to, and
# it does not touch modes. The readonly-database failure came from the syncs
# above, where `synchronize`'s default `archive: true` stamped the CONTROLLER's
# uid/gid onto the destination directory and took write access away from the
# service user mid-sync - SQLITE_READONLY_DIRECTORY, because SQLite must create
# a journal file there. Hence `owner: false` / `group: false` on both syncs, plus
# the db.sqlite3* excludes in nyxmon_rsync_excludes.

- name: source_rsync | Set ownership for synced files
  file:
    path: "{{ nyxmon_site_path }}"
    owner: "{{ nyxmon_user }}"
    group: "{{ nyxmon_group }}"
    recurse: true
