---
# Configure Django application

- name: django | Create environment file for Django
  template:
    src: nyxmon.env.j2
    dest: "{{ nyxmon_site_path }}/.env"
    owner: "{{ nyxmon_user }}"
    group: "{{ nyxmon_group }}"
    mode: '0600'
  notify:
    - restart nyxmon
    - restart nyxmon-monitor

- name: django | Render management shell environment
  ansible.builtin.template:
    src: nyxmon.env.j2
    dest: "{{ nyxmon_site_path }}/.env.shell"
    owner: "{{ nyxmon_user }}"
    group: "{{ nyxmon_group }}"
    mode: "0600"
  vars:
    task_shell_environment: true
  no_log: true

- name: django | Run Django migrations
  ansible.builtin.shell: |
    set -a
    . {{ (nyxmon_site_path ~ '/.env.shell') | quote }}
    set +a
    export PATH={{ nyxmon_venv_bin | quote }}:"$PATH"
    export VIRTUAL_ENV={{ nyxmon_venv_path | quote }}
    exec ./manage.py migrate --noinput
  args:
    chdir: "{{ nyxmon_django_path }}"
  register: nyxmon_migrate_result
  changed_when: >-
    'Migrating forwards ' in nyxmon_migrate_result.stdout or
    'Applying' in nyxmon_migrate_result.stdout or
    (nyxmon_migrate_result.stdout_lines | select('search', 'Installed') | reject('search', 'Installed 0 object') | list | length > 0)
  become: true
  become_user: "{{ nyxmon_user }}"
  when: not nyxmon_skip_django_manage | default(false)

- name: django | Collect static files
  ansible.builtin.shell: |
    set -a
    . {{ (nyxmon_site_path ~ '/.env.shell') | quote }}
    set +a
    export PATH={{ nyxmon_venv_bin | quote }}:"$PATH"
    export VIRTUAL_ENV={{ nyxmon_venv_path | quote }}
    exec ./manage.py collectstatic --noinput
  args:
    chdir: "{{ nyxmon_django_path }}"
  register: nyxmon_collectstatic_result
  changed_when: nyxmon_collectstatic_result.stdout_lines | reject('equalto', '') | reject('search', '0 static files') | list | length > 0
  become: true
  become_user: "{{ nyxmon_user }}"
  when: not nyxmon_skip_django_manage | default(false)
