---
- name: Verify
  hosts: all
  become: true
  gather_facts: true

  vars:
    nyxmon_site_path: /home/nyxmon/site
    nyxmon_env_path: "{{ nyxmon_site_path }}/.env"
    nyxmon_service_unit: /etc/systemd/system/nyxmon.service
    nyxmon_monitoring_service_name: nyxmon-monitor
    nyxmon_monitoring_service_unit: "/etc/systemd/system/{{ nyxmon_monitoring_service_name }}.service"
    nyxmon_traefik_config: /etc/traefik/dynamic/nyxmon.yml
    nyxmon_venv_python: "{{ nyxmon_site_path }}/.venv/bin/python"
    nyxmon_opsgate_submit_base_url: "http://opsgate-api.internal:8711"
    nyxmon_opsgate_approval_base_url: "https://opsgate.example.test"

  tasks:
    - name: Verify | Site directory exists
      ansible.builtin.stat:
        path: "{{ nyxmon_site_path }}"
      register: nyxmon_site

    - name: Verify | Assert site directory present
      ansible.builtin.assert:
        that:
          - nyxmon_site.stat.exists
          - nyxmon_site.stat.isdir
        fail_msg: "Nyxmon site directory missing at {{ nyxmon_site_path }}"

    # The instance starts without a nyxmon user, so the role must create it
    # itself: primary group nyxmon and /bin/bash, not useradd's defaults.
    - name: Verify | Read the nyxmon account
      ansible.builtin.getent:
        database: passwd
        key: nyxmon

    - name: Verify | Read the nyxmon group
      ansible.builtin.getent:
        database: group
        key: nyxmon

    - name: Verify | Assert the role created the nyxmon account as configured
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_passwd.nyxmon[2] == ansible_facts.getent_group.nyxmon[1]
          - ansible_facts.getent_passwd.nyxmon[5] == '/bin/bash'
          - ansible_facts.getent_passwd.nyxmon[4] == '/home/nyxmon'
          # Converge applies the role several times; none of the later runs
          # may append nyxmon as a redundant member of its own primary group.
          - "'nyxmon' not in (ansible_facts.getent_group.nyxmon[2] | split(','))"
        fail_msg: >-
          nyxmon account is {{ ansible_facts.getent_passwd.nyxmon }},
          group {{ ansible_facts.getent_group.nyxmon }}

    - name: Verify | .env exists
      ansible.builtin.stat:
        path: "{{ nyxmon_env_path }}"
      register: nyxmon_env

    - name: Verify | Assert .env present
      ansible.builtin.assert:
        that:
          - nyxmon_env.stat.exists
        fail_msg: "Nyxmon .env missing at {{ nyxmon_env_path }}"

    - name: Verify | Service unit exists
      ansible.builtin.stat:
        path: "{{ nyxmon_service_unit }}"
      register: nyxmon_unit

    - name: Verify | Assert service unit exists
      ansible.builtin.assert:
        that:
          - nyxmon_unit.stat.exists
        fail_msg: "nyxmon.service not found at {{ nyxmon_service_unit }}"

    - name: Verify | Traefik config exists
      ansible.builtin.stat:
        path: "{{ nyxmon_traefik_config }}"
      register: nyxmon_traefik

    - name: Verify | Assert Traefik config exists
      ansible.builtin.assert:
        that:
          - nyxmon_traefik.stat.exists
        fail_msg: "Nyxmon Traefik config missing at {{ nyxmon_traefik_config }}"

    - name: Verify | Monitoring service unit exists
      ansible.builtin.stat:
        path: "{{ nyxmon_monitoring_service_unit }}"
      register: nyxmon_monitor_unit

    - name: Verify | Assert monitoring service unit exists
      ansible.builtin.assert:
        that:
          - nyxmon_monitor_unit.stat.exists
        fail_msg: "Nyxmon monitoring unit missing at {{ nyxmon_monitoring_service_unit }}"

    - name: Verify | Read Nyxmon env file
      ansible.builtin.slurp:
        src: "{{ nyxmon_env_path }}"
      register: nyxmon_env_content

    - name: Verify | Assert OpsGate env wiring rendered
      ansible.builtin.assert:
        that:
          - nyxmon_env_text is regex('(?m)^OPSGATE_SUBMIT_BASE_URL=' ~ (nyxmon_opsgate_submit_base_url | regex_escape) ~ '$')
          - nyxmon_env_text is regex('(?m)^OPSGATE_APPROVAL_BASE_URL=' ~ (nyxmon_opsgate_approval_base_url | regex_escape) ~ '$')
        fail_msg: "Nyxmon .env is missing the expected OpsGate URLs"
      vars:
        nyxmon_env_text: "{{ nyxmon_env_content.content | b64decode }}"

    - name: Verify | Assert reliability settings rendered
      ansible.builtin.assert:
        that:
          - nyxmon_env_text is regex('(?m)^NYXMON_NOTIFY_CONSECUTIVE_FAILURES=2$')
          - nyxmon_env_text is regex('(?m)^NYXMON_NOTIFY_REPEAT_INTERVAL_SECONDS=21600$')
          - >-
            nyxmon_env_text is
            regex('(?m)^NYXMON_NOTIFY_WARNING_REPEAT_INTERVAL_SECONDS=86400$')
          - nyxmon_env_text is regex('(?m)^NYXMON_PROCESSING_LEASE_SECONDS=900$')
          - nyxmon_env_text is regex('(?m)^NYXMON_CHECK_BATCH_SIZE=5$')
          - not (nyxmon_env_text is regex('(?m)^NYXMON_NOTIFY_REPEAT_FAILURES='))
        fail_msg: "Nyxmon .env is missing the expected reliability settings"
      vars:
        nyxmon_env_text: "{{ nyxmon_env_content.content | b64decode }}"

    - name: Verify | Assert NyxBoard login stays off by default
      ansible.builtin.assert:
        that:
          - nyxmon_env_text is regex('(?m)^NYXBOARD_REQUIRE_LOGIN=false$')
        fail_msg: "Nyxmon .env does not render NYXBOARD_REQUIRE_LOGIN=false by default"
      vars:
        nyxmon_env_text: "{{ nyxmon_env_content.content | b64decode }}"

    - name: Verify | Check monitoring service active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ nyxmon_monitoring_service_name }}"
      changed_when: false
      register: nyxmon_monitor_service_state

    - name: Verify | Assert monitoring service is active
      ansible.builtin.assert:
        that:
          - nyxmon_monitor_service_state.stdout | trim == "active"
        fail_msg: "{{ nyxmon_monitoring_service_name }}.service is not active in Molecule verify"

    - name: Verify | Virtualenv python exists
      ansible.builtin.stat:
        path: "{{ nyxmon_venv_python }}"
      register: nyxmon_venv

    - name: Verify | Assert venv python present
      ansible.builtin.assert:
        that:
          - nyxmon_venv.stat.exists
        fail_msg: "Nyxmon venv python missing at {{ nyxmon_venv_python }}"

    # converge.yml ends with a rollback from the fake Rust agent 0.1.1 to the
    # previous release 0.1.0.
    - name: Verify | Retired agent implementation drop-in is gone
      ansible.builtin.stat:
        path: /etc/systemd/system/nyxmon-monitor.service.d/agent-impl.conf
      register: nyxmon_agent_dropin

    - name: Verify | Read the monitoring process executable
      ansible.builtin.shell: |
        pid=$(systemctl show --property=MainPID --value nyxmon-monitor)
        readlink "/proc/$pid/exe"
      args:
        executable: /bin/bash
      changed_when: false
      register: nyxmon_agent_exe

    - name: Verify | Read the monitoring unit
      ansible.builtin.slurp:
        path: /etc/systemd/system/nyxmon-monitor.service
      register: nyxmon_agent_unit

    - name: Verify | List installed Rust agent versions
      ansible.builtin.find:
        paths: /opt/nyxmon-agent
        file_type: directory
      register: nyxmon_agent_installed

    - name: Verify | Read the remembered previous Rust version
      ansible.builtin.slurp:
        path: /opt/nyxmon-agent/.previous-version
      register: nyxmon_agent_previous

    - name: Verify | Assert the rollback left the previous Rust release running
      ansible.builtin.assert:
        that:
          - not nyxmon_agent_dropin.stat.exists
          - nyxmon_agent_exe.stdout | trim == '/opt/nyxmon-agent/0.1.0/nyxmon-agent'
          - "'ExecStart=/opt/nyxmon-agent/0.1.0/nyxmon-agent ' in (nyxmon_agent_unit.content | b64decode)"
          - "'start-agent' not in (nyxmon_agent_unit.content | b64decode)"
          - nyxmon_agent_installed.files | map(attribute='path') | map('basename') | sort == ['0.1.0', '0.1.1', 'keep-me']
          - nyxmon_agent_previous.content | b64decode | trim == '0.1.1'
        fail_msg: >-
          Rollback state is wrong: drop-in {{ nyxmon_agent_dropin.stat.exists }},
          exe {{ nyxmon_agent_exe.stdout }},
          versions {{ nyxmon_agent_installed.files | map(attribute='path') | list }}.

# Last: nyxmon_remove must take away everything nyxmon_deploy installed,
# including the SQLite privacy drop-ins (and their then empty directories).
- name: Verify | nyxmon_remove cleans up the deploy
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Verify | the deploy installed the SQLite privacy drop-ins
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ item }}.service.d/sqlite-privacy.conf"
      loop: [nyxmon, nyxmon-monitor]
      register: nyxmon_dropins_before

    - name: Verify | assert the drop-ins were there
      ansible.builtin.assert:
        that: nyxmon_dropins_before.results | map(attribute='stat.exists') | list == [true, true]

    - name: Verify | run nyxmon_remove
      ansible.builtin.include_role:
        name: nyxmon_remove
      vars:
        nyxmon_confirm_removal: true

    - name: Verify | look for the drop-in directories
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ item }}.service.d"
      loop: [nyxmon, nyxmon-monitor]
      register: nyxmon_dropin_dirs_after

    - name: Verify | assert nyxmon_remove left no drop-ins behind
      ansible.builtin.assert:
        that: nyxmon_dropin_dirs_after.results | map(attribute='stat.exists') | list == [false, false]
