---
# The role needs a pinned agent release with monitoring enabled, so the first
# play only prepares the instance and the first converge runs with a fake
# release (below).
- name: Prepare the instance
  hosts: all
  become: true

  tasks:
    - name: Ensure apt helpers and curl are present
      ansible.builtin.apt:
        name:
          - python3-apt
          - python3-debian
          - curl
          - ca-certificates
          - git
        state: present
        update_cache: true

    - name: Install dummy Traefik unit for Molecule
      ansible.builtin.copy:
        dest: /etc/systemd/system/traefik.service
        mode: "0644"
        content: |
          [Unit]
          Description=Dummy Traefik for Molecule

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/true
          ExecReload=/bin/true

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd after dummy Traefik unit
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Start dummy Traefik service
      ansible.builtin.systemd:
        name: traefik
        enabled: true
        state: started

    # The role default of nyxmon_site_path; this play does not load the role.
    - name: Remove existing site path for clean git clone
      ansible.builtin.file:
        path: /home/nyxmon/site
        state: absent
      when: nyxmon_deploy_method == "git"

    - name: Install uv for Nyxmon
      ansible.builtin.import_role:
        name: uv_install
      vars:
        uv_install_dir: /usr/local/bin

  vars_files:
    - nyxmon_vars.yml

# The converges use a fake nyxmon-agent compiled in the instance: the real
# release is an x86_64 binary and Molecule may run on arm64. The fake answers
# --version and --check-schema like the real one (the latter only checks the
# --db path exists) and otherwise waits for SIGTERM, so /proc/<pid>/exe of the
# unit is the versioned binary.
- name: Build fake Rust agent release archives
  hosts: all
  become: true
  vars:
    fake_agent_build: /root/fake-agent
    fake_agent_archives: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/fake-agent"
    fake_agent_builds:
      # name: [reported version, reported commit]
      a: ["0.1.0", "0000000000000000000000000000000000000000"]
      a2: ["0.1.0", "1111111111111111111111111111111111111111"]
      b: ["0.1.1", "2222222222222222222222222222222222222222"]
      wrong: ["0.1.0", "3333333333333333333333333333333333333333"]
  tasks:
    - name: Install a C compiler
      ansible.builtin.apt:
        name:
          - gcc
          - libc6-dev
        state: present

    - name: Create build directories
      ansible.builtin.file:
        path: "{{ fake_agent_build }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ fake_agent_builds.keys() | list }}"

    - name: Write the fake agent source
      ansible.builtin.copy:
        dest: "{{ fake_agent_build }}/fake-agent.c"
        mode: "0644"
        content: |
          #include <stdio.h>
          #include <string.h>
          #include <unistd.h>

          int main(int argc, char **argv) {
              const char *db = NULL;
              int check_schema = 0;
              for (int i = 1; i < argc; i++) {
                  if (strcmp(argv[i], "--version") == 0) {
                      printf("nyxmon-agent %s (%s)\n", AGENT_VERSION, AGENT_COMMIT);
                      return 0;
                  }
                  if (strcmp(argv[i], "--check-schema") == 0) check_schema = 1;
                  if (strcmp(argv[i], "--db") == 0 && i + 1 < argc) db = argv[++i];
              }
              if (db == NULL || access(db, R_OK) != 0) {
                  fprintf(stderr, "Database file not found: %s\n", db ? db : "(none)");
                  return 1;
              }
              if (check_schema) {
                  printf("schema OK\n");
                  return 0;
              }
              for (;;) pause();
          }

    - name: Compile the fake agents
      ansible.builtin.command:
        argv:
          - gcc
          - -O2
          - -DAGENT_VERSION="{{ item.value[0] }}"
          - -DAGENT_COMMIT="{{ item.value[1] }}"
          - -o
          - "{{ fake_agent_build }}/{{ item.key }}/nyxmon-agent"
          - "{{ fake_agent_build }}/fake-agent.c"
        creates: "{{ fake_agent_build }}/{{ item.key }}/nyxmon-agent"
      loop: "{{ fake_agent_builds | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Add a license file
      ansible.builtin.copy:
        dest: "{{ fake_agent_build }}/{{ item }}/LICENSE"
        content: "fake\n"
        mode: "0644"
      loop: "{{ fake_agent_builds.keys() | list }}"

    - name: Pack the archives in the release layout
      ansible.builtin.command:
        argv:
          - tar
          - --owner=0
          - --group=0
          - -czf
          - "{{ fake_agent_build }}/{{ item }}.tar.gz"
          - -C
          - "{{ fake_agent_build }}/{{ item }}"
          - nyxmon-agent
          - LICENSE
        creates: "{{ fake_agent_build }}/{{ item }}.tar.gz"
      loop: "{{ fake_agent_builds.keys() | list }}"

    - name: Create a hostile build whose agent is a symlink to /etc/shadow
      ansible.builtin.file:
        path: "{{ fake_agent_build }}/link/{{ item.name }}"
        src: "{{ item.src | default(omit) }}"
        state: "{{ item.state }}"
        force: true
        mode: "{{ item.mode | default(omit) }}"
      loop:
        - {name: "", state: directory, mode: "0755"}
        - {name: nyxmon-agent, state: link, src: /etc/shadow}
      loop_control:
        label: "{{ item.name or 'link/' }}"

    - name: Pack the hostile archive
      ansible.builtin.command:
        argv:
          - tar
          - --owner=0
          - --group=0
          - -czf
          - "{{ fake_agent_build }}/link.tar.gz"
          - -C
          - "{{ fake_agent_build }}/link"
          - nyxmon-agent
        creates: "{{ fake_agent_build }}/link.tar.gz"

    - name: Fetch the archives to the controller
      ansible.builtin.fetch:
        src: "{{ fake_agent_build }}/{{ item }}.tar.gz"
        dest: "{{ fake_agent_archives }}/{{ item }}.tar.gz"
        flat: true
      loop: "{{ fake_agent_builds.keys() | list + ['link'] }}"

- name: Converge with the Rust agent (fake 0.1.0)
  hosts: all
  become: true
  vars_files:
    - nyxmon_vars.yml
  vars:
    fake_agent_archives: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/fake-agent"
  roles:
    - role: nyxmon_deploy
      vars:
        nyxmon_agent_rust_version: "0.1.0"
        nyxmon_agent_rust_local_archive: "{{ fake_agent_archives }}/a.tar.gz"
        nyxmon_agent_rust_keep_versions: 1
  post_tasks:
    - name: Read the monitoring unit
      ansible.builtin.slurp:
        path: /etc/systemd/system/nyxmon-monitor.service
      register: rust_unit

    - name: Check for the retired drop-in
      ansible.builtin.stat:
        path: /etc/systemd/system/nyxmon-monitor.service.d/agent-impl.conf
      register: rust_dropin

    - name: Assert the unit starts the versioned binary itself
      ansible.builtin.assert:
        that:
          - >-
            'ExecStart=/opt/nyxmon-agent/0.1.0/nyxmon-agent --db /home/nyxmon/site/src/django/db.sqlite3 --enable-telegram'
            in (rust_unit.content | b64decode)
          - "'start-agent' not in (rust_unit.content | b64decode)"
          - not rust_dropin.stat.exists

# A host deployed before 2.75.0: the base unit names the Python start-agent and
# the agent-impl.conf drop-in selects the Rust agent. The deploy rewrites the
# unit, removes the drop-in (and only it), remembers the version the drop-in
# selected and prunes.
- name: Retire the drop-in of an older deploy, switch to fake 0.1.1 and prune
  hosts: all
  become: true
  vars_files:
    - nyxmon_vars.yml
  vars:
    fake_agent_archives: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/fake-agent"
  pre_tasks:
    - name: Plant an old version beyond keep_versions
      ansible.builtin.file:
        path: /opt/nyxmon-agent/0.0.9
        state: directory
        mode: "0755"
        modification_time: "200001010000.00"
        modification_time_format: "%Y%m%d%H%M.%S"

    - name: Plant a directory that is not a version
      ansible.builtin.file:
        path: /opt/nyxmon-agent/keep-me
        state: directory
        mode: "0755"
        modification_time: "200001010000.00"
        modification_time_format: "%Y%m%d%H%M.%S"

    - name: Restore the Python ExecStart of the pre-2.75.0 base unit
      ansible.builtin.replace:
        path: /etc/systemd/system/nyxmon-monitor.service
        regexp: '^ExecStart=/opt/nyxmon-agent/0\.1\.0/nyxmon-agent '
        replace: "ExecStart=/home/nyxmon/site/.venv/bin/start-agent "

    - name: Plant the pre-2.75.0 drop-in selecting fake 0.1.0
      ansible.builtin.copy:
        dest: /etc/systemd/system/nyxmon-monitor.service.d/agent-impl.conf
        mode: "0644"
        content: |
          # Managed by Ansible (nyxmon_deploy): nyxmon_agent_impl=rust.
          # Removed when nyxmon_agent_impl=python; the base unit then runs the venv
          # start-agent again.
          [Service]
          ExecStart=
          ExecStart=/opt/nyxmon-agent/0.1.0/nyxmon-agent --db /home/nyxmon/site/src/django/db.sqlite3 --enable-telegram

    - name: Plant a drop-in of the operator's own
      ansible.builtin.copy:
        dest: /etc/systemd/system/nyxmon-monitor.service.d/zz-operator.conf
        mode: "0644"
        content: |
          [Service]
          Environment=MOLECULE_OPERATOR_DROPIN=1

    - name: Load the planted unit state
      ansible.builtin.systemd:
        daemon_reload: true
  roles:
    - role: nyxmon_deploy
      vars:
        nyxmon_agent_rust_version: "0.1.1"
        nyxmon_agent_rust_local_archive: "{{ fake_agent_archives }}/b.tar.gz"
        nyxmon_agent_rust_keep_versions: 1
  post_tasks:
    - name: List the install root
      ansible.builtin.find:
        paths: /opt/nyxmon-agent
        file_type: directory
        hidden: true
      register: rust_installed

    - name: Read the remembered previous version
      ansible.builtin.slurp:
        path: /opt/nyxmon-agent/.previous-version
      register: rust_previous

    - name: Read the monitoring unit
      ansible.builtin.slurp:
        path: /etc/systemd/system/nyxmon-monitor.service
      register: retired_unit

    - name: Check the drop-ins
      ansible.builtin.stat:
        path: "/etc/systemd/system/nyxmon-monitor.service.d/{{ item }}"
      loop:
        - agent-impl.conf
        - zz-operator.conf
      register: retired_dropins

    - name: Remove the operator drop-in again
      ansible.builtin.file:
        path: /etc/systemd/system/nyxmon-monitor.service.d/zz-operator.conf
        state: absent

    - name: Assert the drop-in is retired, the previous version kept and the old one pruned
      ansible.builtin.assert:
        that:
          - rust_installed.files | map(attribute='path') | map('basename') | sort == ['0.1.0', '0.1.1', 'keep-me']
          - rust_previous.content | b64decode | trim == '0.1.0'
          - "'ExecStart=/opt/nyxmon-agent/0.1.1/nyxmon-agent ' in (retired_unit.content | b64decode)"
          - "'start-agent' not in (retired_unit.content | b64decode)"
          - not retired_dropins.results[0].stat.exists
          - retired_dropins.results[1].stat.exists

- name: Refuse a binary that reports another version
  hosts: all
  become: true
  vars_files:
    - nyxmon_vars.yml
  vars:
    fake_agent_archives: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/fake-agent"
  tasks:
    - name: Read the main PID before the refused run
      ansible.builtin.command: systemctl show --property=MainPID --value nyxmon-monitor
      changed_when: false
      register: pid_before

    - name: Deploy 0.2.0 from an archive whose binary reports 0.1.0
      block:
        - name: Run the role
          ansible.builtin.include_role:
            name: nyxmon_deploy
          vars:
            nyxmon_agent_rust_version: "0.2.0"
            nyxmon_agent_rust_local_archive: "{{ fake_agent_archives }}/wrong.tar.gz"
            nyxmon_agent_rust_keep_versions: 1

        - name: Record an unexpected success
          ansible.builtin.set_fact:
            refused_run_succeeded: true
      rescue:
        - name: Read the main PID after the refused run
          ansible.builtin.command: systemctl show --property=MainPID --value nyxmon-monitor
          changed_when: false
          register: pid_after

        - name: Stat the rejected version
          ansible.builtin.stat:
            path: /opt/nyxmon-agent/0.2.0
          register: rejected_version

        - name: Read the monitoring unit
          ansible.builtin.slurp:
            path: /etc/systemd/system/nyxmon-monitor.service
          register: refused_unit

        - name: Assert nothing was switched
          ansible.builtin.assert:
            that:
              - not (refused_run_succeeded | default(false))
              - "'reports the pinned version' in ansible_failed_result.msg | default('') or 'failed validation' in ansible_failed_result.msg | default('')"
              - not rejected_version.stat.exists
              - "'/opt/nyxmon-agent/0.1.1/nyxmon-agent' in (refused_unit.content | b64decode)"
              - pid_after.stdout == pid_before.stdout

    - name: Fail when the role accepted the wrong binary
      ansible.builtin.assert:
        that:
          - not (refused_run_succeeded | default(false))

- name: Refuse a different archive for an installed version
  hosts: all
  become: true
  vars_files:
    - nyxmon_vars.yml
  vars:
    fake_agent_archives: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/fake-agent"
  tasks:
    - name: Checksum the installed binary before the refused run
      ansible.builtin.stat:
        path: /opt/nyxmon-agent/0.1.0/nyxmon-agent
        checksum_algorithm: sha256
      register: binary_before

    - name: Deploy 0.1.0 from a different archive
      block:
        - name: Run the role
          ansible.builtin.include_role:
            name: nyxmon_deploy
          vars:
            nyxmon_agent_rust_version: "0.1.0"
            nyxmon_agent_rust_local_archive: "{{ fake_agent_archives }}/a2.tar.gz"
            nyxmon_agent_rust_keep_versions: 1

        - name: Record an unexpected success
          ansible.builtin.set_fact:
            replaced_run_succeeded: true
      rescue:
        - name: Checksum the installed binary after the refused run
          ansible.builtin.stat:
            path: /opt/nyxmon-agent/0.1.0/nyxmon-agent
            checksum_algorithm: sha256
          register: binary_after

        - name: Assert the installed version was not modified
          ansible.builtin.assert:
            that:
              - not (replaced_run_succeeded | default(false))
              - "'is installed from an archive with sha256' in ansible_failed_result.msg | default('')"
              - binary_after.stat.checksum == binary_before.stat.checksum

    - name: Fail when the role replaced an installed version
      ansible.builtin.assert:
        that:
          - not (replaced_run_succeeded | default(false))

- name: Refuse an archive whose agent is a symlink
  hosts: all
  become: true
  vars_files:
    - nyxmon_vars.yml
  vars:
    fake_agent_archives: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/fake-agent"
  tasks:
    - name: Stat /etc/shadow before the refused run
      ansible.builtin.stat:
        path: /etc/shadow
      register: shadow_before

    - name: Deploy 0.3.0 from the hostile archive
      block:
        - name: Run the role
          ansible.builtin.include_role:
            name: nyxmon_deploy
          vars:
            nyxmon_agent_rust_version: "0.3.0"
            nyxmon_agent_rust_local_archive: "{{ fake_agent_archives }}/link.tar.gz"
            nyxmon_agent_rust_keep_versions: 1

        - name: Record an unexpected success
          ansible.builtin.set_fact:
            link_run_succeeded: true
      rescue:
        - name: Stat /etc/shadow after the refused run
          ansible.builtin.stat:
            path: /etc/shadow
          register: shadow_after

        - name: Stat the refused version
          ansible.builtin.stat:
            path: /opt/nyxmon-agent/0.3.0
          register: link_version

        - name: Assert the link was refused before extraction
          ansible.builtin.assert:
            that:
              - not (link_run_succeeded | default(false))
              - "'regular files nyxmon-agent' in ansible_failed_result.msg | default('')"
              - shadow_after.stat.mode == shadow_before.stat.mode
              - shadow_after.stat.uid == shadow_before.stat.uid
              - shadow_after.stat.gid == shadow_before.stat.gid
              - not link_version.stat.exists

    - name: Fail when the role accepted the hostile archive
      ansible.builtin.assert:
        that:
          - not (link_run_succeeded | default(false))

# The rollback after the Python fallback's retirement: pin the previous Rust
# release again. verify.yml checks the result.
- name: Roll back to the previous Rust release (fake 0.1.0)
  hosts: all
  become: true
  vars_files:
    - nyxmon_vars.yml
  vars:
    fake_agent_archives: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/fake-agent"
  roles:
    - role: nyxmon_deploy
      vars:
        nyxmon_agent_rust_version: "0.1.0"
        nyxmon_agent_rust_local_archive: "{{ fake_agent_archives }}/a.tar.gz"
        nyxmon_agent_rust_keep_versions: 1
