---
# bash -c SCRIPT NAME DIR [--exclude=PATTERN ...]: the number of non-directories
# (files, links, ...) below DIR outside the excludes, as the media restore's
# rsync sees them. A failing rsync fails the task (pipefail).
mastodon_restore_count_media_files: |
  set -euo pipefail
  dir=$1
  shift
  rsync -a --list-only "$@" "$dir" | awk 'substr($0, 1, 1) != "d" { n++ } END { print n + 0 }'
