---
# Mastodon restore tasks
#
# Safety contract:
# - the database dump is validated (`pg_restore --list` plus a full read into
#   /dev/null) before any service is stopped;
# - the service stop must succeed; otherwise nothing is dropped;
# - after the stop, a safety `pg_dump -Fc` of the live database, a snapshot of
#   the media directory and copies of the env, systemd, Traefik and nginx
#   files are taken before the first overwrite;
# - the dump is restored with `--single-transaction`;
# - any failure while restoring puts the safety copies back, leaves the
#   services stopped and reports both safety paths;
# - the staging directory (it holds the unpacked dump) is removed in `always`.

- name: Validate restore inputs
  ansible.builtin.assert:
    that:
      - mastodon_restore_root | length > 0
      - mastodon_restore_archive | length > 0
      - mastodon_restore_safety_root is match('^/.*[^/]')
      - mastodon_restore_media_safety_root is match('^/.*[^/]')
    fail_msg: >-
      mastodon_restore_root and mastodon_restore_archive are required, and
      mastodon_restore_safety_root / mastodon_restore_media_safety_root must be
      absolute paths other than /

- name: Determine archive when set to latest
  ansible.builtin.find:
    paths: "{{ mastodon_restore_root }}"
    patterns: "*.{{ mastodon_backup_archive_extension }}"
    file_type: file
  register: mastodon_restore_candidates
  when: mastodon_restore_archive == "latest"

- name: Select restore archive
  ansible.builtin.set_fact:
    mastodon_restore_selected_archive: >-
      {{ (mastodon_restore_candidates.files | sort(attribute='mtime', reverse=true) | first).path
         if mastodon_restore_archive == 'latest'
         else (mastodon_restore_archive if mastodon_restore_archive.startswith('/') else mastodon_restore_root ~ '/' ~ mastodon_restore_archive) }}
  when: mastodon_restore_archive != 'latest' or (mastodon_restore_candidates.files | length > 0)

- name: Fail when no archive is available
  ansible.builtin.fail:
    msg: "No Mastodon backup archives found in {{ mastodon_restore_root }}"
  when:
    - (mastodon_restore_selected_archive | default('')) | length == 0

- name: Ensure selected archive exists
  ansible.builtin.stat:
    path: "{{ mastodon_restore_selected_archive }}"
  register: mastodon_restore_archive_stat

- name: Abort on missing archive
  ansible.builtin.fail:
    msg: "Mastodon restore archive not found: {{ mastodon_restore_selected_archive }}"
  when: not mastodon_restore_archive_stat.stat.exists

- name: Fix the safety copy timestamp
  ansible.builtin.set_fact:
    mastodon_restore_timestamp: "{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}"

- name: Name the safety copies
  ansible.builtin.set_fact:
    mastodon_restore_safety_dir: "{{ mastodon_restore_safety_root | regex_replace('/+$', '') }}/{{ mastodon_restore_timestamp }}"
    mastodon_restore_media_safety_dir: "{{ mastodon_restore_media_safety_root | regex_replace('/+$', '') }}/{{ mastodon_restore_timestamp }}"
    mastodon_restore_safety_dump: >-
      {{ mastodon_restore_safety_root | regex_replace('/+$', '') }}/{{ mastodon_restore_timestamp }}/database/{{ mastodon_restore_postgres_database }}.dump

- name: Restore with staging cleanup
  block:
    - name: Reset staging directory
      ansible.builtin.file:
        path: "{{ mastodon_restore_staging_dir }}"
        state: absent

    - name: Create staging directory
      ansible.builtin.file:
        path: "{{ mastodon_restore_staging_dir }}"
        state: directory
        mode: "0700"

    - name: Unpack restore archive
      ansible.builtin.unarchive:
        src: "{{ mastodon_restore_selected_archive }}"
        dest: "{{ mastodon_restore_staging_dir }}"
        remote_src: true

    - name: Locate extracted payload directory
      ansible.builtin.find:
        paths: "{{ mastodon_restore_staging_dir }}"
        file_type: directory
        depth: 1
      register: mastodon_restore_payload_dirs

    - name: Set payload path
      ansible.builtin.set_fact:
        mastodon_restore_payload_dir: "{{ (mastodon_restore_payload_dirs.files | map(attribute='path') | list | first) | default('') }}"

    - name: Abort when payload directory missing
      ansible.builtin.fail:
        msg: "Unable to locate payload directory inside restore archive"
      when: mastodon_restore_payload_dir | length == 0

    - name: Gather payload content stats
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: mastodon_restore_payload_stats
      loop:
        - { path: "{{ mastodon_restore_payload_dir }}/database/{{ mastodon_restore_postgres_database }}.dump", label: "database dump" }
        - { path: "{{ mastodon_restore_payload_dir }}/media", label: "media" }
        - { path: "{{ mastodon_restore_payload_dir }}/config/mastodon.env", label: "env" }
        - { path: "{{ mastodon_restore_payload_dir }}/systemd", label: "systemd" }
        - { path: "{{ mastodon_restore_payload_dir }}/traefik/{{ mastodon_traefik_config_path | basename }}", label: "traefik" }
        - { path: "{{ mastodon_restore_payload_dir }}/nginx/{{ mastodon_nginx_config_path | basename }}", label: "nginx" }
      loop_control:
        label: "{{ item.label }}"

    - name: Abort when database dump is missing
      ansible.builtin.fail:
        msg: "Database dump missing inside archive"
      when: not mastodon_restore_payload_stats.results[0].stat.exists

    - name: Record whether media is restored
      ansible.builtin.set_fact:
        mastodon_restore_media_enabled: >-
          {{ (mastodon_restore_payload_stats.results[1].stat.exists | bool) and (mastodon_storage_driver == 'local') }}

    - name: Ensure database payload path is accessible by restore user
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ mastodon_restore_postgres_become_user }}"
        mode: "0700"
      loop:
        - "{{ mastodon_restore_staging_dir }}"
        - "{{ mastodon_restore_payload_dir }}"
        - "{{ mastodon_restore_payload_dir }}/database"

    - name: Ensure database dump readable by Postgres user
      ansible.builtin.file:
        path: "{{ mastodon_restore_payload_dir }}/database/{{ mastodon_restore_postgres_database }}.dump"
        owner: "{{ mastodon_restore_postgres_become_user }}"
        mode: "0600"

    - name: Build restore connection arguments
      ansible.builtin.set_fact:
        mastodon_restore_pg_conn_args: >-
          {{ ((mastodon_restore_postgres_host | default('') | string | length > 0)
               | ternary(['--host=' ~ mastodon_restore_postgres_host], []))
             + ((mastodon_restore_postgres_port | default('') | string | length > 0)
               | ternary(['--port=' ~ mastodon_restore_postgres_port], []))
             + ['--username=' ~ mastodon_restore_postgres_user] }}
        # dropdb/createdb run as the Postgres OS user (peer auth) on the same
        # cluster: the configured port always, the host only when it is remote.
        mastodon_restore_pg_admin_conn_args: >-
          {{ (((mastodon_restore_postgres_host | default('') | string) not in ['', 'localhost', '127.0.0.1', '::1'])
               | ternary(['--host=' ~ mastodon_restore_postgres_host], []))
             + ((mastodon_restore_postgres_port | default('') | string | length > 0)
               | ternary(['--port=' ~ mastodon_restore_postgres_port], [])) }}

    # --- Validate the dump before anything is stopped or dropped ---

    - name: Validate the database dump table of contents
      ansible.builtin.shell: |
        set -euo pipefail
        toc="$({{ mastodon_restore_postgres_restore_binary }} --list "$DUMP")"
        if ! grep -Eq '^[0-9]+; [0-9]+ [0-9]+ TABLE DATA ' <<< "$toc"; then
          echo "dump has no TABLE DATA entries" >&2
          exit 1
        fi
        {{ mastodon_restore_postgres_restore_binary }} --file=/dev/null "$DUMP"
      args:
        executable: /bin/bash
      become: true
      become_user: "{{ mastodon_restore_postgres_become_user }}"
      environment:
        DUMP: "{{ mastodon_restore_payload_dir }}/database/{{ mastodon_restore_postgres_database }}.dump"
      changed_when: false

    - name: Ensure media directory exists
      ansible.builtin.file:
        path: "{{ mastodon_media_path }}"
        state: directory
        owner: "{{ mastodon_user }}"
        group: "{{ mastodon_group }}"
        mode: "0750"

    - name: Ensure site directory exists
      ansible.builtin.file:
        path: "{{ mastodon_site_path }}"
        state: directory
        owner: "{{ mastodon_user }}"
        group: "{{ mastodon_group }}"
        mode: "0750"

    # Same endpoint and role as the restore itself, so the safety dump below
    # always covers the database that is about to be replaced.
    - name: Check whether the live database exists
      ansible.builtin.command:
        argv: >-
          {{ [mastodon_restore_postgres_psql_binary]
             + mastodon_restore_pg_conn_args
             + ['--dbname=' ~ mastodon_restore_postgres_database, '--no-psqlrc',
                '--tuples-only', '--no-align', '--command=SELECT 1'] }}
      become: true
      become_user: "{{ mastodon_restore_postgres_become_user }}"
      environment:
        PGPASSWORD: "{{ mastodon_restore_postgres_password }}"
      no_log: "{{ (mastodon_restore_postgres_password | default('') | length > 0) }}"
      register: mastodon_restore_db_exists_query
      changed_when: false
      failed_when:
        - mastodon_restore_db_exists_query.rc != 0
        - ('database "' ~ mastodon_restore_postgres_database ~ '" does not exist') not in (mastodon_restore_db_exists_query.stderr | default(''))

    - name: Record whether the live database exists
      ansible.builtin.set_fact:
        mastodon_restore_db_exists: "{{ mastodon_restore_db_exists_query.rc == 0 and (mastodon_restore_db_exists_query.stdout | trim) == '1' }}"

    - name: Find systemd units in the archive
      ansible.builtin.find:
        paths: "{{ mastodon_restore_payload_dir }}/systemd"
        file_type: file
        recurse: false
      register: mastodon_restore_systemd_files
      when: mastodon_restore_payload_stats.results[3].stat.exists

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: List installed Mastodon units
      ansible.builtin.set_fact:
        mastodon_restore_installed_services: >-
          {{ mastodon_systemd_services
             | map('regex_replace', '[.]service$', '')
             | select('in', ansible_facts.services.keys() | map('regex_replace', '[.]service$', '') | list)
             | list }}

    # --- Stop (fail closed) and take the safety copies ---

    - name: Stop services and take safety copies
      block:
        - name: Stop Mastodon services before restore
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: stopped
          loop: "{{ mastodon_restore_installed_services }}"
          when: mastodon_restore_stop_services | bool

        - name: Confirm Mastodon services are stopped
          ansible.builtin.command:
            argv: [systemctl, is-active, "{{ item }}"]
          loop: "{{ mastodon_restore_installed_services }}"
          register: mastodon_restore_stop_state
          changed_when: false
          failed_when: (mastodon_restore_stop_state.stdout | trim) not in ['inactive', 'failed']

        - name: Create safety directories
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: directory
            owner: "{{ item.owner }}"
            mode: "{{ item.mode }}"
          loop:
            - { path: "{{ mastodon_restore_safety_root }}", owner: root, mode: "0711" }
            - { path: "{{ mastodon_restore_safety_dir }}", owner: root, mode: "0711" }
            - { path: "{{ mastodon_restore_safety_dir }}/database", owner: "{{ mastodon_restore_postgres_become_user }}", mode: "0700" }
            - { path: "{{ mastodon_restore_media_safety_root }}", owner: root, mode: "0700" }
          loop_control:
            label: "{{ item.path }}"

        - name: Take safety dump of the live database
          ansible.builtin.command:
            argv: >-
              {{ [mastodon_restore_postgres_dump_binary]
                 + mastodon_restore_pg_conn_args
                 + ['--format=custom', '--file=' ~ mastodon_restore_safety_dump,
                    '--dbname=' ~ mastodon_restore_postgres_database] }}
          become: true
          become_user: "{{ mastodon_restore_postgres_become_user }}"
          environment:
            PGPASSWORD: "{{ mastodon_restore_postgres_password }}"
          no_log: "{{ (mastodon_restore_postgres_password | default('') | length > 0) }}"
          changed_when: true
          when: mastodon_restore_db_exists | bool

        - name: Check the safety dump
          ansible.builtin.command:
            argv:
              - "{{ mastodon_restore_postgres_restore_binary }}"
              - --list
              - "{{ mastodon_restore_safety_dump }}"
          become: true
          become_user: "{{ mastodon_restore_postgres_become_user }}"
          changed_when: false
          when: mastodon_restore_db_exists | bool

        - name: Snapshot media and config files
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              if [ -e "$MEDIA_SAFETY" ]; then
                echo "media safety directory already exists: $MEDIA_SAFETY" >&2
                exit 1
              fi
              if [ "$MEDIA_ENABLED" = "true" ] && [ -d "$MEDIA_DIR" ]; then
                # Hard links share the files with the live tree, so the copy is
                # cheap; rsync writes restored files to new inodes and leaves
                # the snapshot intact. Fall back to a full copy across devices.
                # Copy the contents ("/."), so a symlinked media root is
                # followed instead of being copied as a link to the live tree.
                mkdir -m 0700 "$MEDIA_SAFETY"
                if ! cp -al "$MEDIA_DIR/." "$MEDIA_SAFETY/" 2>/dev/null; then
                  rm -rf "$MEDIA_SAFETY"
                  mkdir -m 0700 "$MEDIA_SAFETY"
                  cp -a "$MEDIA_DIR/." "$MEDIA_SAFETY/"
                fi
              fi
              files="$SAFETY_DIR/files"
              mkdir -p "$files"
              chmod 0700 "$files"
              : > "$SAFETY_DIR/files.manifest"
              while IFS= read -r path; do
                [ -n "$path" ] || continue
                printf '%s\n' "$path" >> "$SAFETY_DIR/files.manifest"
                if [ -e "$path" ] || [ -L "$path" ]; then
                  mkdir -p "$files$(dirname "$path")"
                  cp -a "$path" "$files$path"
                fi
              done <<< "$CONFIG_FILES"
              sync
            executable: /bin/bash
          environment:
            SAFETY_DIR: "{{ mastodon_restore_safety_dir }}"
            MEDIA_SAFETY: "{{ mastodon_restore_media_safety_dir }}"
            MEDIA_DIR: "{{ mastodon_media_path }}"
            MEDIA_ENABLED: "{{ mastodon_restore_media_enabled | bool | string | lower }}"
            CONFIG_FILES: "{{ mastodon_restore_config_targets | join('\n') }}"
          vars:
            mastodon_restore_config_targets: >-
              {{ [mastodon_env_file, mastodon_traefik_config_path, mastodon_nginx_config_path]
                 + (mastodon_restore_systemd_files.files | default([])
                    | map(attribute='path') | map('basename')
                    | map('regex_replace', '^', mastodon_systemd_unit_dir ~ '/') | list) }}
          changed_when: true

        - name: Report safety copy locations
          ansible.builtin.debug:
            msg:
              - "Pre-restore database dump: {{ mastodon_restore_safety_dump if mastodon_restore_db_exists | bool else 'none (no live database)' }}"
              - "Pre-restore media snapshot: {{ mastodon_restore_media_safety_dir if mastodon_restore_media_enabled | bool else 'none (media not restored)' }}"
              - "Pre-restore config files: {{ mastodon_restore_safety_dir }}/files"

      rescue:
        - name: Fail without restoring (live data untouched)
          ansible.builtin.fail:
            msg: >-
              Mastodon restore aborted before anything was dropped or overwritten
              ({{ ansible_failed_task.name | default('unknown task') }}): a service
              did not stop or a safety copy under {{ mastodon_restore_safety_dir }} /
              {{ mastodon_restore_media_safety_dir }} could not be taken. The live
              database and media are untouched. Services may be stopped; start
              them with `systemctl start {{ mastodon_systemd_services | join(' ') }}`.

    # --- Overwrite; any failure rolls back to the safety copies ---

    - name: Restore Mastodon with rollback
      block:
        - name: Drop Mastodon database
          ansible.builtin.command:
            argv: >-
              {{ [mastodon_restore_postgres_dropdb_binary] + mastodon_restore_pg_admin_conn_args
                 + ['--if-exists', mastodon_restore_postgres_database] }}
          become: true
          become_user: "{{ mastodon_restore_postgres_become_user }}"
          environment:
            PGPASSWORD: "{{ mastodon_restore_postgres_password }}"
          no_log: "{{ (mastodon_restore_postgres_password | default('') | length > 0) }}"
          changed_when: true

        - name: Recreate Mastodon database
          ansible.builtin.command:
            argv: >-
              {{ [mastodon_restore_postgres_createdb_binary] + mastodon_restore_pg_admin_conn_args
                 + ['--owner=' ~ mastodon_restore_postgres_user, mastodon_restore_postgres_database] }}
          become: true
          become_user: "{{ mastodon_restore_postgres_become_user }}"
          environment:
            PGPASSWORD: "{{ mastodon_restore_postgres_password }}"
          no_log: "{{ (mastodon_restore_postgres_password | default('') | length > 0) }}"
          changed_when: true

        - name: Restore PostgreSQL dump
          ansible.builtin.command:
            argv: >-
              {{ [mastodon_restore_postgres_restore_binary]
                 + mastodon_restore_pg_conn_args
                 + ['--dbname=' ~ mastodon_restore_postgres_database,
                    '--single-transaction', '--clean', '--if-exists', '--no-owner',
                    mastodon_restore_payload_dir ~ '/database/' ~ mastodon_restore_postgres_database ~ '.dump'] }}
          become: true
          become_user: "{{ mastodon_restore_postgres_become_user }}"
          environment:
            PGPASSWORD: "{{ mastodon_restore_postgres_password }}"
          no_log: "{{ (mastodon_restore_postgres_password | default('') | length > 0) }}"
          changed_when: true

        # --ignore-times makes rsync rewrite every file to a new inode (temp file
        # + rename). Without it, a file whose content is unchanged would get
        # its owner/mode updated in place, which would also change the
        # hard-linked media snapshot.
        - name: Restore media directory  # noqa: command-instead-of-module
          ansible.builtin.command:
            argv:
              - rsync
              - -a
              - --delete
              - --ignore-times
              - "{{ mastodon_restore_payload_dir }}/media/"
              - "{{ mastodon_media_path }}/"
          changed_when: true
          when: mastodon_restore_media_enabled | bool

        - name: Restore environment file
          ansible.builtin.copy:
            src: "{{ mastodon_restore_payload_dir }}/config/mastodon.env"
            dest: "{{ mastodon_env_file }}"
            owner: "{{ mastodon_user }}"
            group: "{{ mastodon_group }}"
            mode: "0600"
            remote_src: true
          when: mastodon_restore_payload_stats.results[2].stat.exists

        - name: Copy systemd unit files
          ansible.builtin.copy:
            src: "{{ item.path }}"
            dest: "{{ mastodon_systemd_unit_dir }}/{{ item.path | basename }}"
            owner: root
            group: root
            mode: "0644"
            remote_src: true
          loop: "{{ mastodon_restore_systemd_files.files | default([]) }}"
          register: mastodon_restore_unit_copy
          when: mastodon_restore_payload_stats.results[3].stat.exists

        - name: Restore Traefik configuration when present
          ansible.builtin.copy:
            src: "{{ mastodon_restore_payload_dir }}/traefik/{{ mastodon_traefik_config_path | basename }}"
            dest: "{{ mastodon_traefik_config_path }}"
            owner: root
            group: root
            mode: "0644"
            remote_src: true
          when: mastodon_restore_payload_stats.results[4].stat.exists

        - name: Restore nginx configuration when present
          ansible.builtin.copy:
            src: "{{ mastodon_restore_payload_dir }}/nginx/{{ mastodon_nginx_config_path | basename }}"
            dest: "{{ mastodon_nginx_config_path }}"
            owner: root
            group: root
            mode: "0644"
            remote_src: true
          when: mastodon_restore_payload_stats.results[5].stat.exists

        - name: Reload systemd
          ansible.builtin.systemd:
            daemon_reload: true

        - name: Run migrations after restore
          ansible.builtin.shell: |
            set -euo pipefail
            export RBENV_ROOT="{{ mastodon_rbenv_root }}"
            export PATH="{{ mastodon_rbenv_root }}/bin:{{ mastodon_rbenv_root }}/shims:/usr/local/bin:/usr/bin:/bin"
            set -a
            . "{{ mastodon_env_file }}"
            set +a
            cd "{{ mastodon_site_path }}"
            bundle exec rails db:migrate
          args:
            executable: /bin/bash
          become: true
          become_user: "{{ mastodon_user }}"
          changed_when: true
          when: mastodon_restore_run_migrations | bool

        - name: Start Mastodon services after restore
          ansible.builtin.systemd:
            name: "{{ item }}"
            enabled: true
            state: "{{ mastodon_restore_restart | bool | ternary('restarted', 'started') }}"
            daemon_reload: true
          loop: "{{ mastodon_systemd_services }}"

      rescue:
        - name: Make sure Mastodon services are stopped before rolling back
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: stopped
          loop: "{{ mastodon_systemd_services }}"
          failed_when: false

        - name: Check that Mastodon services are down before rolling back
          ansible.builtin.command:
            argv: [systemctl, is-active, "{{ item }}"]
          loop: "{{ mastodon_systemd_services }}"
          register: mastodon_restore_rescue_state
          changed_when: false
          failed_when: false

        - name: Record whether rollback is safe
          ansible.builtin.set_fact:
            # Only a positively confirmed stop makes the rollback safe; a failed
            # query (empty output) counts as "maybe running".
            mastodon_restore_rescue_running: >-
              {{ mastodon_restore_rescue_state.results
                 | map(attribute='stdout') | map('default', '') | map('trim')
                 | reject('in', ['inactive', 'failed'])
                 | list | length > 0 }}

        - name: Roll back the database from the safety dump
          ansible.builtin.shell: |
            set -euo pipefail
            admin=()
            case "$PG_HOST" in
              ""|localhost|127.0.0.1|::1) ;;
              *) admin+=("--host=$PG_HOST") ;;
            esac
            if [ -n "$PG_PORT" ]; then admin+=("--port=$PG_PORT"); fi
            conn=()
            if [ -n "$PG_HOST" ]; then conn+=("--host=$PG_HOST"); fi
            if [ -n "$PG_PORT" ]; then conn+=("--port=$PG_PORT"); fi
            "$DROPDB" "${admin[@]}" --if-exists "$DB"
            "$CREATEDB" "${admin[@]}" --owner="$DB_OWNER" "$DB"
            "$PG_RESTORE" "${conn[@]}" --username="$DB_OWNER" --dbname="$DB" \
              --single-transaction --no-owner "$SAFETY_DUMP"
          args:
            executable: /bin/bash
          become: true
          become_user: "{{ mastodon_restore_postgres_become_user }}"
          environment:
            PGPASSWORD: "{{ mastodon_restore_postgres_password }}"
            DROPDB: "{{ mastodon_restore_postgres_dropdb_binary }}"
            CREATEDB: "{{ mastodon_restore_postgres_createdb_binary }}"
            PG_RESTORE: "{{ mastodon_restore_postgres_restore_binary }}"
            DB: "{{ mastodon_restore_postgres_database }}"
            DB_OWNER: "{{ mastodon_restore_postgres_user }}"
            SAFETY_DUMP: "{{ mastodon_restore_safety_dump }}"
            PG_HOST: "{{ mastodon_restore_postgres_host | default('') | string }}"
            PG_PORT: "{{ mastodon_restore_postgres_port | default('') | string }}"
          no_log: "{{ (mastodon_restore_postgres_password | default('') | length > 0) }}"
          register: mastodon_restore_db_rollback
          changed_when: true
          failed_when: false
          when:
            - mastodon_restore_db_exists | bool
            - not (mastodon_restore_rescue_running | bool)

        - name: Roll back media and config files
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              if [ "$MEDIA_ENABLED" = "true" ] && [ -d "$MEDIA_SAFETY" ]; then
                rsync -a --delete --checksum "$MEDIA_SAFETY/" "$MEDIA_DIR/"
              fi
              files="$SAFETY_DIR/files"
              while IFS= read -r path; do
                [ -n "$path" ] || continue
                if [ -e "$files$path" ] || [ -L "$files$path" ]; then
                  rm -f "$path"
                  cp -a "$files$path" "$path"
                else
                  rm -f "$path"
                fi
              done < "$SAFETY_DIR/files.manifest"
              systemctl daemon-reload
            executable: /bin/bash
          environment:
            SAFETY_DIR: "{{ mastodon_restore_safety_dir }}"
            MEDIA_SAFETY: "{{ mastodon_restore_media_safety_dir }}"
            MEDIA_DIR: "{{ mastodon_media_path }}"
            MEDIA_ENABLED: "{{ mastodon_restore_media_enabled | bool | string | lower }}"
          register: mastodon_restore_files_rollback
          changed_when: true
          failed_when: false
          when: not (mastodon_restore_rescue_running | bool)

        - name: Fail after rollback and leave Mastodon stopped
          ansible.builtin.fail:
            msg: >-
              Mastodon restore failed ({{ ansible_failed_task.name | default('unknown task') }}).
              {{ 'A service could not be stopped, so NOTHING was rolled back; stop it and roll back by hand from the paths below.'
                 if (mastodon_restore_rescue_running | bool) else '' }}
              Database rollback: {{ 'not needed (no live database before the restore)'
                if not (mastodon_restore_db_exists | bool)
                else 'skipped' if (mastodon_restore_rescue_running | bool)
                else ('done' if (mastodon_restore_db_rollback.rc | default(1)) == 0 else 'FAILED') }}.
              Media and config rollback: {{ 'skipped' if (mastodon_restore_rescue_running | bool)
                else 'done' if (mastodon_restore_files_rollback.rc | default(1)) == 0
                else 'FAILED: ' ~ (mastodon_restore_files_rollback.stderr | default('') | trim) }}.
              Safety dump: {{ mastodon_restore_safety_dump if mastodon_restore_db_exists | bool else 'none' }}.
              Media snapshot: {{ mastodon_restore_media_safety_dir if mastodon_restore_media_enabled | bool else 'none' }}.
              Config copies: {{ mastodon_restore_safety_dir }}/files.
              Services are left stopped (unless reported above); check the data, then start them with
              `systemctl start {{ mastodon_systemd_services | join(' ') }}`.

  always:
    - name: Cleanup restore staging directory
      ansible.builtin.file:
        path: "{{ mastodon_restore_staging_dir }}"
        state: absent
      when: mastodon_restore_cleanup | bool

- name: Report restore completion
  ansible.builtin.debug:
    msg:
      - "Mastodon restored from {{ mastodon_restore_selected_archive }}."
      - "Pre-restore database dump: {{ mastodon_restore_safety_dump if mastodon_restore_db_exists | bool else 'none' }}"
      - "Pre-restore media snapshot: {{ mastodon_restore_media_safety_dir if mastodon_restore_media_enabled | bool else 'none' }}"
      - "Remove the safety copies once the restored instance is verified."
