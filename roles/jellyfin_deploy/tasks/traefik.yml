---
- name: Ensure Traefik dynamic config directory exists
  ansible.builtin.file:
    path: "{{ jellyfin_traefik_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Resolve basic auth password hash (reuse the deployed one while it matches)
  ansible.builtin.include_role:
    name: local.ops_library.webapp_deploy_internal
    tasks_from: traefik_basic_auth_hash
  vars:
    webapp_deploy_internal_basic_auth_user: "{{ jellyfin_basic_auth_user }}"
    webapp_deploy_internal_basic_auth_password: "{{ jellyfin_basic_auth_password }}"
    webapp_deploy_internal_basic_auth_config_path: "{{ jellyfin_traefik_config_path }}"
    webapp_deploy_internal_basic_auth_hash_var: jellyfin_basic_auth_password_hash
  when:
    - jellyfin_basic_auth_enabled | bool
    - jellyfin_basic_auth_password_hash | length == 0

- name: Render Traefik configuration for Jellyfin
  ansible.builtin.template:
    src: jellyfin-traefik.yml.j2
    dest: "{{ jellyfin_traefik_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: reload traefik
