---
# SOPS Dependencies Installation Defaults

# User configuration
sops_deps_user: "deploy"
sops_deps_group: "deploy"
sops_deps_home: "/home/deploy"

# Age configuration
sops_deps_age_key_path: "{{ sops_deps_home }}/.config/sops/age/keys.txt"
sops_deps_age_generate_key: true  # Generate if doesn't exist

# Package installation method
sops_deps_install_method: "apt"  # apt, snap, or binary

# Binary versions (if using binary installation)
sops_deps_age_version: "1.3.2"
sops_deps_sops_version: "3.13.3"

# Ansible collection dependencies
sops_deps_install_ansible_collection: true
sops_deps_ansible_user: "{{ sops_deps_user }}"

# https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.checksums.txt
sops_deps_sops_checksum: "sha256:e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b"
# age publishes no checksum file; this digest is the subject of the project's signed
# GitHub build attestation (gh attestation verify --repo FiloSottile/age), see
# https://api.github.com/repos/FiloSottile/age/attestations/sha256:cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
sops_deps_age_checksum: "sha256:cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10"
