---
- name: entry | Validate immutable previous-install evidence and cache identity
  ansible.builtin.script:
    cmd: "inspect_recovery.py {{ recovery | to_json | b64encode }} {{ security_trust_recover_wheel | quote }} {{ security_trust_recover_sha256 | quote }} {{ security_trust_recover_version | quote }}"
    executable: /usr/bin/python3
  register: recovery_raw
  changed_when: false
  check_mode: false

- name: entry | Parse guarded recovery selection
  ansible.builtin.set_fact:
    recovery_report: "{{ recovery_raw.stdout | from_json }}"

- name: entry | Preserve dependency compatibility before restoration
  ansible.builtin.assert:
    that:
      - recovery_report.before.packages.certifi.version is version(security_trust_recover_version, '<=', version_type='pep440')
      - "(recovery_report.before | local.ops_library.trust_update_conflicts({'certifi': security_trust_recover_version})) | length == 0"

  when: not recovery_report.already_fixed

- name: entry | Restore only guarded generated cache ownership through no-follow descriptors
  ansible.builtin.script:
    cmd: "inspect_recovery.py {{ recovery | to_json | b64encode }} {{ security_trust_recover_wheel | quote }} {{ security_trust_recover_sha256 | quote }} {{ security_trust_recover_version | quote }} --apply"
    executable: /usr/bin/python3
  changed_when: true
  when: not ansible_check_mode and not recovery_report.already_fixed

- name: entry | Restore previously installed certifi from the verified wheel as its owner
  ansible.builtin.command:
    argv:
      - "{{ security_trust_recover_uv_bin }}"
      - pip
      - install
      - --python
      - "{{ recovery.path }}/bin/python"
      - --no-deps
      - --no-index
      - "{{ security_trust_recover_wheel }}"
  become: true
  become_user: "{{ recovery.owner }}"
  changed_when: true
  when: not ansible_check_mode and not recovery_report.already_fixed
