---
- name: validate_source | Inspect controller-side source directory
  ansible.builtin.stat:
    path: "{{ static_site_source_path }}"
  delegate_to: localhost
  become: false
  register: static_site_source_stat

- name: validate_source | Require a real controller-side source directory
  ansible.builtin.assert:
    that:
      - static_site_source_stat.stat.exists
      - static_site_source_stat.stat.isdir
      - not static_site_source_stat.stat.islnk
    fail_msg: "Static site source is missing, not a directory, or a symlink: {{ static_site_source_path }}"

- name: validate_source | Inspect required controller-side files
  ansible.builtin.stat:
    path: "{{ static_site_source_path }}/{{ item }}"
    follow: false
  delegate_to: localhost
  become: false
  register: static_site_required_file_stats
  loop: "{{ static_site_required_files }}"

- name: validate_source | Require regular publication files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
    fail_msg: "Required static publication file is missing or unsafe: {{ item.item }}"
  loop: "{{ static_site_required_file_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: validate_source | Find symbolic links in source
  ansible.builtin.find:
    paths: "{{ static_site_source_path }}"
    recurse: true
    hidden: true
    file_type: link
  delegate_to: localhost
  become: false
  register: static_site_source_links

- name: validate_source | Reject symbolic links in publication source
  ansible.builtin.assert:
    that:
      - static_site_source_links.matched == 0
    fail_msg: "Static publication source contains symbolic links; refusing to follow or publish them."

- name: validate_source | Find all publication source entries
  ansible.builtin.find:
    paths: "{{ static_site_source_path }}"
    recurse: true
    hidden: true
    file_type: any
  delegate_to: localhost
  become: false
  register: static_site_source_entries

- name: validate_source | Find regular publication files
  ansible.builtin.find:
    paths: "{{ static_site_source_path }}"
    recurse: true
    hidden: true
    file_type: file
  delegate_to: localhost
  become: false
  register: static_site_source_regular_files

- name: validate_source | Find publication directories
  ansible.builtin.find:
    paths: "{{ static_site_source_path }}"
    recurse: true
    hidden: true
    file_type: directory
  delegate_to: localhost
  become: false
  register: static_site_source_directories

- name: validate_source | Reject special publication source entries
  ansible.builtin.assert:
    that:
      - >-
        static_site_source_entries.matched
        == (static_site_source_regular_files.matched + static_site_source_directories.matched)
    fail_msg: >-
      Static publication source contains a socket, FIFO, device, or another
      unsupported entry; only regular files and directories are accepted.

- name: validate_source | Enforce exact compact publication allowlist
  ansible.builtin.assert:
    that:
      - static_site_source_directories.matched == 0
      - static_site_source_regular_files.matched == (static_site_required_files | length)
      - >-
        static_site_source_regular_files.files
        | map(attribute='path')
        | map('basename')
        | difference(static_site_required_files)
        | length == 0
    fail_msg: >-
      Strict static publication accepts only the configured required regular
      files at the source root; nested directories and extra files are refused.
  when: static_site_restrict_to_required_files | bool
