---
- name: validate | Validate static site configuration
  ansible.builtin.assert:
    that:
      - static_site_service_name is match('^[a-z][a-z0-9-]{1,62}\Z')
      - static_site_user is match('^[a-z_][a-z0-9_-]{0,30}\Z')
      - static_site_group is match('^[a-z_][a-z0-9_-]{0,30}\Z')
      - static_site_content_source in ['controller', 'external']
      - static_site_content_source != 'controller' or static_site_source_path is match('^/[A-Za-z0-9_./-]+\Z')
      - static_site_content_source != 'controller' or static_site_source_path != '/'
      - static_site_content_source != 'controller' or static_site_path_owner == 'root'
      - static_site_path_owner is match('^[a-z_][a-z0-9_-]{0,30}\Z')
      - static_site_path_mode is string
      - static_site_path_mode is match('^0?[0-7]{3,4}\Z')
      - static_site_allowed_networks is sequence
      - static_site_allowed_networks is not string
      - static_site_path is match('^/[A-Za-z0-9_./-]+\Z')
      - static_site_path != '/'
      - static_site_python_path is match('^/[A-Za-z0-9_./-]+\Z')
      - static_site_server_path is match('^/[A-Za-z0-9_./-]+\Z')
      - static_site_systemd_unit_name is match('^[a-z][a-z0-9_.-]{1,62}\Z')
      - static_site_systemd_unit_path is match('^/[A-Za-z0-9_./-]+[.]service\Z')
      - not (static_site_traefik_enabled | bool) or static_site_traefik_cert_resolver is match('^[A-Za-z0-9_.-]*\Z')
      - static_site_bind_host == '127.0.0.1'
      - static_site_port | int >= 1024
      - static_site_port | int <= 65535
      - static_site_required_files is sequence
      - static_site_required_files is not string
      - static_site_required_files | length > 0
      - not (static_site_traefik_enabled | bool) or static_site_host is match('^[A-Za-z0-9.-]+\Z')
      - not (static_site_traefik_enabled | bool) or static_site_host != 'static.example.com'
      - not (static_site_traefik_enabled | bool) or static_site_traefik_entrypoints is sequence
      - not (static_site_traefik_enabled | bool) or static_site_traefik_entrypoints is not string
      - not (static_site_traefik_enabled | bool) or static_site_traefik_entrypoints | length > 0
      - not (static_site_traefik_enabled | bool) or static_site_traefik_http_entrypoint is string
      - not (static_site_traefik_enabled | bool) or static_site_traefik_http_entrypoint is match('^[A-Za-z0-9_.-]+\Z')
      - not (static_site_traefik_enabled | bool) or static_site_traefik_http_entrypoint not in static_site_traefik_entrypoints
      - not (static_site_traefik_enabled | bool) or static_site_traefik_config_path is match('^/[A-Za-z0-9_./-]+[.]ya?ml\Z')
      - static_site_public_healthcheck_retries | int > 0
      - static_site_public_healthcheck_delay | int >= 0
    fail_msg: >-
      static_site_deploy requires a known content source (controller or
      external; controller mode keeps a root-owned document root), a quoted
      document-root mode, a safe absolute source/document root,
      loopback bind, unprivileged port, valid service identifiers, and a real
      Traefik hostname when ingress is enabled.

- name: validate | Validate required file names
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^[A-Za-z0-9_.-]+\Z')
    fail_msg: "Unsafe static_site_required_files entry: {{ item }}"
  loop: "{{ static_site_required_files }}"

- name: validate | Validate HTTPS entrypoint names
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^[A-Za-z0-9_.-]+\Z')
    fail_msg: "Unsafe static_site_traefik_entrypoints entry: {{ item }}"
  loop: "{{ static_site_traefik_entrypoints }}"
  when: static_site_traefik_enabled | bool

- name: validate | Validate allowed source networks
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^[0-9A-Fa-f:.]+/[0-9]{1,3}\Z')
    fail_msg: "Unsafe static_site_allowed_networks entry (expected CIDR): {{ item }}"
  loop: "{{ static_site_allowed_networks }}"
  when: static_site_traefik_enabled | bool
