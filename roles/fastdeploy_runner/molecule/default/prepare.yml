---
# The state of a host before this role: FastDeploy's site and services root
# owned by fastdeploy, the runner script inside the service directory (owned
# by fastdeploy, as a FastDeploy redeploy's recursive chown left it) and a
# sudoers file naming that FastDeploy-writable path.
- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  vars:
    site: /home/fastdeploy/site
    legacy_dir: /home/fastdeploy/site/services/demo-backup

  tasks:
    - name: Install sudo and python3
      ansible.builtin.apt:
        name:
          - sudo
          - python3
        state: present
        update_cache: true

    - name: Create the deploy group
      ansible.builtin.group:
        name: deploy

    - name: Create the fastdeploy group
      ansible.builtin.group:
        name: fastdeploy

    - name: Create the deploy user (member of the fastdeploy group, as fastdeploy_deploy sets it up)
      ansible.builtin.user:
        name: deploy
        group: deploy
        groups: [fastdeploy]
        shell: /bin/bash

    - name: Create the fastdeploy user
      ansible.builtin.user:
        name: fastdeploy
        group: fastdeploy
        shell: /bin/bash

    - name: Create FastDeploy-owned site directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: fastdeploy
        group: fastdeploy
        mode: "0755"
      loop:
        - "{{ site }}"
        - "{{ site }}/.venv"
        - "{{ site }}/.venv/bin"
        - "{{ site }}/services"
        - "{{ legacy_dir }}"
        - "{{ site }}/services/other-service"

    - name: Link the stub virtualenv python
      ansible.builtin.file:
        src: /usr/bin/python3
        dest: "{{ site }}/.venv/bin/python"
        state: link
        owner: fastdeploy
        group: fastdeploy
        force: true

    # Stand-in for FastDeploy's `commands.py syncservices`: records the
    # services' config.json in a state file and prints the same summary line.
    - name: Install the stub commands.py
      ansible.builtin.copy:
        dest: "{{ site }}/commands.py"
        owner: fastdeploy
        group: fastdeploy
        mode: "0644"
        content: |
          import json, os, sys
          from pathlib import Path

          assert sys.argv[1:] == ["syncservices"], sys.argv
          root = Path(__file__).resolve().parent
          state = root / "synced.json"
          old = json.loads(state.read_text()) if state.exists() else {}
          new = {}
          for config in sorted((root / "services").glob("*/config.json")):
              new[config.parent.name] = json.loads(config.read_text())
          updated = [name for name in new if old.get(name) != new[name]]
          state.write_text(json.dumps(new))
          (root / "sync-uid").write_text(str(os.getuid()))
          print("syncing services")
          print("updated: " + (", ".join(updated) or "-"))
          print("deleted: -")
          print("services synced")

    - name: Install the legacy runner script owned by fastdeploy
      ansible.builtin.copy:
        dest: "{{ legacy_dir }}/backup.py"
        owner: fastdeploy
        group: fastdeploy
        mode: "0755"
        content: |
          #!/bin/sh
          echo legacy

    - name: Install the legacy config.json owned by fastdeploy
      ansible.builtin.copy:
        dest: "{{ legacy_dir }}/config.json"
        owner: fastdeploy
        group: fastdeploy
        mode: "0644"
        content: '{"name": "demo-backup", "deploy_script": "backup.py", "steps": [{"name": "backup"}]}'

    - name: Install another service's config.json
      ansible.builtin.copy:
        dest: "{{ site }}/services/other-service/config.json"
        owner: fastdeploy
        group: fastdeploy
        mode: "0644"
        content: '{"name": "other-service", "deploy_script": "deploy.py", "steps": [{"name": "deploy"}]}'

    - name: Install the legacy sudoers rules naming the FastDeploy-writable path
      ansible.builtin.copy:
        dest: /etc/sudoers.d/demo_backup
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
        content: |
          fastdeploy ALL=(deploy) NOPASSWD:NOSETENV: {{ legacy_dir }}/backup.py *
          deploy ALL=(root) NOPASSWD:NOSETENV: {{ legacy_dir }}/backup.py *
