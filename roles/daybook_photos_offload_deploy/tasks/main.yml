---
- name: validate | Ensure Photos offload target is macOS
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Darwin'
    fail_msg: "daybook_photos_offload_deploy only supports macOS targets."
  when: daybook_photos_offload_enabled | bool

- name: validate | Ensure required Photos offload variables are safe
  ansible.builtin.assert:
    that:
      - daybook_photos_offload_service_user | string | trim | length > 0
      - daybook_photos_offload_service_user != "CHANGEME"
      - daybook_photos_offload_service_group | string | trim | length > 0
      - daybook_photos_offload_system_group | string | trim | length > 0
      - (daybook_photos_offload_service_home | string).startswith('/Users/')
      - daybook_photos_offload_repo_url | string | trim | length > 0
      - (daybook_photos_offload_checkout_path | string).startswith('/Library/Application Support/Daybook/')
      - (daybook_photos_offload_checkout_path | dirname | dirname) == '/Library/Application Support/Daybook'
      - >-
        daybook_photos_offload_checkout_attestation_path
        == (daybook_photos_offload_checkout_path | dirname) ~ '/managed-v1'
      - >-
        daybook_photos_offload_repo_bundle_path
        == (daybook_photos_offload_checkout_path | dirname) ~ '/source.bundle'
      - >-
        (daybook_photos_offload_repo_bundle_src | string).startswith('/')
      - daybook_photos_offload_repo_bundle_src != 'CHANGEME'
      - daybook_photos_offload_repo_url == daybook_photos_offload_repo_bundle_path
      - (daybook_photos_offload_repo_ref | string | regex_search('^[0-9a-f]{40}$')) is not none
      - (daybook_photos_offload_uv_bin | string).startswith('/')
      - daybook_photos_offload_python_version | string | trim | length > 0
      - daybook_photos_offload_venv_path == daybook_photos_offload_checkout_path ~ '/.venv'
      - (daybook_photos_offload_library_path | string).startswith(daybook_photos_offload_service_home ~ '/')
      - (daybook_photos_offload_runtime_dir | string).startswith(daybook_photos_offload_service_home ~ '/')
      - (daybook_photos_offload_state_path | string).startswith(daybook_photos_offload_runtime_dir ~ '/')
      - daybook_photos_offload_state_path != daybook_photos_offload_library_path
      - not (daybook_photos_offload_state_path | string).startswith(daybook_photos_offload_library_path ~ '/')
      - (daybook_photos_offload_config_dir | string).startswith(daybook_photos_offload_service_home ~ '/')
      - (daybook_photos_offload_launcher_path | string).startswith(daybook_photos_offload_config_dir ~ '/')
      - daybook_photos_offload_log_dir == daybook_photos_offload_runtime_dir ~ '/logs'
      - (daybook_photos_offload_stdout_log | string).startswith(daybook_photos_offload_log_dir ~ '/')
      - (daybook_photos_offload_stderr_log | string).startswith(daybook_photos_offload_log_dir ~ '/')
      - daybook_photos_offload_launchd_label | string | trim | length > 0
      - daybook_photos_offload_launchd_plist_path == daybook_photos_offload_service_home ~ '/Library/LaunchAgents/' ~ daybook_photos_offload_launchd_label ~ '.plist'
      - daybook_photos_offload_launchd_manage_state | type_debug == 'bool'
      - daybook_photos_offload_launchd_manage_state | bool
      - daybook_photos_offload_launchd_enabled | type_debug == 'bool'
      - daybook_photos_offload_readiness_timeout_seconds | int >= 1
      - daybook_photos_offload_readiness_timeout_seconds | int <= 300
      - daybook_photos_offload_throttle_interval_seconds | int >= 10
      - daybook_photos_offload_start_calendar is sequence
      - daybook_photos_offload_start_calendar is not string
      - daybook_photos_offload_start_calendar | length > 0
    fail_msg: >-
      Photos offload requires an exact Daybook commit, explicit owner-local
      data paths, owner-only private logs, an external ledger, and a user
      LaunchAgent configuration.
  when: daybook_photos_offload_enabled | bool

- name: validate | Reject traversal and relative Photos offload paths
  ansible.builtin.assert:
    that:
      - item | string | length > 1
      - (item | string).startswith('/')
      - "'.' not in (item | string).split('/')"
      - "'..' not in (item | string).split('/')"
    fail_msg: "Photos offload paths must be absolute and contain no dot or dot-dot components."
  loop:
    - "{{ daybook_photos_offload_service_home }}"
    - "{{ daybook_photos_offload_checkout_path }}"
    - "{{ daybook_photos_offload_checkout_attestation_path }}"
    - "{{ daybook_photos_offload_repo_bundle_path }}"
    - "{{ daybook_photos_offload_venv_path }}"
    - "{{ daybook_photos_offload_uv_bin }}"
    - "{{ daybook_photos_offload_library_path }}"
    - "{{ daybook_photos_offload_runtime_dir }}"
    - "{{ daybook_photos_offload_state_path }}"
    - "{{ daybook_photos_offload_config_dir }}"
    - "{{ daybook_photos_offload_launcher_path }}"
    - "{{ daybook_photos_offload_log_dir }}"
    - "{{ daybook_photos_offload_stdout_log }}"
    - "{{ daybook_photos_offload_stderr_log }}"
    - "{{ daybook_photos_offload_launchd_plist_path }}"
  when: daybook_photos_offload_enabled | bool

- name: validate | Ensure each Photos offload calendar entry is closed and valid
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.keys() | list | sort == ['Hour', 'Minute']
      - item.Hour | type_debug == 'int'
      - item.Minute | type_debug == 'int'
      - item.Hour >= 0
      - item.Hour <= 23
      - item.Minute >= 0
      - item.Minute <= 59
    fail_msg: "Each Photos offload schedule must contain only integer Hour and Minute values."
  loop: "{{ daybook_photos_offload_start_calendar }}"
  when: daybook_photos_offload_enabled | bool

- name: validate | Resolve Photos offload service user id
  ansible.builtin.command:
    argv:
      - /usr/bin/id
      - -u
      - "{{ daybook_photos_offload_service_user }}"
  register: daybook_photos_offload_uid
  changed_when: false
  check_mode: false
  when: daybook_photos_offload_enabled | bool

- name: quiesce | Probe the logged-in user's GUI domain
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - print
      - "gui/{{ daybook_photos_offload_uid.stdout | trim }}"
  register: daybook_photos_offload_initial_domain
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_launchd_manage_state | bool

- name: quiesce | Read current Photos offload service state
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - print
      - "gui/{{ daybook_photos_offload_uid.stdout | trim }}/{{ daybook_photos_offload_launchd_label }}"
  register: daybook_photos_offload_launchd_print
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_launchd_manage_state | bool

- name: quiesce | Read current Photos offload disabled state
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - print-disabled
      - "gui/{{ daybook_photos_offload_uid.stdout | trim }}"
  register: daybook_photos_offload_launchd_disabled
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_launchd_manage_state | bool

- name: quiesce | Resolve current Photos offload state
  ansible.builtin.set_fact:
    daybook_photos_offload_launchd_is_loaded: "{{ daybook_photos_offload_launchd_print.rc == 0 }}"
    daybook_photos_offload_launchd_is_disabled: >-
      {{
        daybook_photos_offload_launchd_disabled.rc == 0
        and (
          (
            ('"' ~ daybook_photos_offload_launchd_label ~ '" => disabled')
            in daybook_photos_offload_launchd_disabled.stdout
          )
          or (
            ('"' ~ daybook_photos_offload_launchd_label ~ '" => true')
            in daybook_photos_offload_launchd_disabled.stdout
          )
        )
      }}
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_launchd_manage_state | bool

- name: quiesce | Disable Photos offload before changing deployment state
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - disable
      - "gui/{{ daybook_photos_offload_uid.stdout | trim }}/{{ daybook_photos_offload_launchd_label }}"
  register: daybook_photos_offload_quiesce_disable
  changed_when: daybook_photos_offload_quiesce_disable.rc == 0
  failed_when: false
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_launchd_manage_state | bool
    - not (daybook_photos_offload_launchd_is_disabled | bool)

- name: quiesce | Boot out the exact loaded Photos offload service
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - bootout
      - "gui/{{ daybook_photos_offload_uid.stdout | trim }}/{{ daybook_photos_offload_launchd_label }}"
  register: daybook_photos_offload_quiesce_bootout
  changed_when: daybook_photos_offload_quiesce_bootout.rc == 0
  failed_when: false
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_launchd_manage_state | bool

- name: quiesce | Verify Photos offload service is disabled
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - print-disabled
      - "gui/{{ daybook_photos_offload_uid.stdout | trim }}"
  register: daybook_photos_offload_quiesced_disabled
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_launchd_manage_state | bool
    - not ansible_check_mode

- name: quiesce | Revalidate the logged-in user's GUI domain
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - print
      - "gui/{{ daybook_photos_offload_uid.stdout | trim }}"
  register: daybook_photos_offload_quiesced_domain
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_launchd_manage_state | bool
    - not ansible_check_mode

- name: quiesce | Verify Photos offload service is absent
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - print
      - "gui/{{ daybook_photos_offload_uid.stdout | trim }}/{{ daybook_photos_offload_launchd_label }}"
  register: daybook_photos_offload_quiesced_print
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_launchd_manage_state | bool
    - not ansible_check_mode

- name: quiesce | Require disabled and unloaded Photos offload service
  ansible.builtin.assert:
    that:
      - daybook_photos_offload_quiesced_domain.rc == 0
      - daybook_photos_offload_quiesced_disabled.rc == 0
      - >-
        (
          ('"' ~ daybook_photos_offload_launchd_label ~ '" => disabled')
          in daybook_photos_offload_quiesced_disabled.stdout
        )
        or (
          ('"' ~ daybook_photos_offload_launchd_label ~ '" => true')
          in daybook_photos_offload_quiesced_disabled.stdout
        )
      - daybook_photos_offload_quiesced_print.rc == 113
      - >-
        (
          'Could not find service "' ~ daybook_photos_offload_launchd_label
          ~ '" in domain for user gui: ' ~ (daybook_photos_offload_uid.stdout | trim)
        ) in daybook_photos_offload_quiesced_print.stderr
    fail_msg: "Photos offload must be disabled and unloaded before deployment changes."
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_launchd_manage_state | bool
    - not ansible_check_mode

- name: source | Inspect fixed system checkout ancestors
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  register: daybook_photos_offload_system_ancestors
  check_mode: false
  loop:
    - /Library
    - /Library/Application Support
  when: daybook_photos_offload_enabled | bool

- name: source | Require protected fixed system checkout ancestors
  ansible.builtin.assert:
    that:
      - item.stat.isdir | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.pw_name == 'root'
      - not (item.stat.wgrp | default(true))
      - not (item.stat.woth | default(true))
    fail_msg: "Every fixed system checkout ancestor must be a protected root-owned directory."
  loop: "{{ daybook_photos_offload_system_ancestors.results }}"
  when: daybook_photos_offload_enabled | bool

- name: source | Ensure protected Daybook Photos checkout ancestors exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ daybook_photos_offload_system_group }}"
    mode: "0755"
    follow: false
  loop:
    - /Library/Application Support/Daybook
    - "{{ daybook_photos_offload_checkout_path | dirname }}"
  when:
    - daybook_photos_offload_enabled | bool
    - not ansible_check_mode

- name: source | Remove ACLs from managed checkout ancestors
  ansible.builtin.command:
    argv:
      - /bin/chmod
      - -N
      - "{{ item }}"
  changed_when: false
  loop:
    - /Library/Application Support/Daybook
    - "{{ daybook_photos_offload_checkout_path | dirname }}"
  when:
    - daybook_photos_offload_enabled | bool
    - not ansible_check_mode

- name: source | Inspect complete protected checkout ancestry
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  register: daybook_photos_offload_checkout_ancestors
  check_mode: false
  loop:
    - /Library
    - /Library/Application Support
    - /Library/Application Support/Daybook
    - "{{ daybook_photos_offload_checkout_path | dirname }}"
  when: daybook_photos_offload_enabled | bool

- name: source | Require complete protected checkout ancestry
  ansible.builtin.assert:
    that:
      - >-
        (
          item.stat.isdir | default(false)
          and not (item.stat.islnk | default(false))
          and item.stat.pw_name == 'root'
          and not (item.stat.wgrp | default(true))
          and not (item.stat.woth | default(true))
        )
        or (
          ansible_check_mode
          and not (item.stat.exists | default(false))
          and item.item in [
            '/Library/Application Support/Daybook',
            (daybook_photos_offload_checkout_path | dirname)
          ]
        )
    fail_msg: "Every checkout ancestor must be protected against service-user replacement."
  loop: "{{ daybook_photos_offload_checkout_ancestors.results }}"
  when: daybook_photos_offload_enabled | bool

- name: source | Inspect ACLs on complete checkout ancestry
  ansible.builtin.command:
    argv:
      - /bin/ls
      - -lde
      - "{{ item }}"
  register: daybook_photos_offload_checkout_ancestor_acls
  changed_when: false
  check_mode: false
  loop: >-
    {{
      daybook_photos_offload_checkout_ancestors.results
      | selectattr('stat.exists')
      | map(attribute='item')
      | list
    }}
  when: daybook_photos_offload_enabled | bool

- name: source | Require ACL-free complete checkout ancestry
  ansible.builtin.assert:
    that:
      - item.stdout_lines | length == 1
    fail_msg: "Every checkout ancestor must be free of extended ACLs."
  loop: "{{ daybook_photos_offload_checkout_ancestor_acls.results }}"
  when: daybook_photos_offload_enabled | bool

- name: validate | Reject existing symlink components in managed paths
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['python']['executable'] }}"
      - -c
      - >-
        import os, stat, sys;
        current = '/';
        parts = [part for part in sys.argv[1].split('/') if part];
        [(
          (_ for _ in ()).throw(SystemExit('symlink component: ' + current))
          if stat.S_ISLNK(os.lstat(current).st_mode) else None
        ) for current in [
          '/' + '/'.join(parts[:index]) for index in range(1, len(parts) + 1)
        ] if os.path.lexists(current)]
      - "{{ item }}"
  changed_when: false
  check_mode: false
  loop:
    - "{{ daybook_photos_offload_checkout_path | dirname }}"
    - "{{ daybook_photos_offload_repo_bundle_path }}"
    - "{{ daybook_photos_offload_checkout_path }}"
    - "{{ daybook_photos_offload_checkout_path }}/.git"
    - "{{ daybook_photos_offload_venv_path }}"
    - "{{ daybook_photos_offload_library_path }}"
    - "{{ daybook_photos_offload_runtime_dir }}"
    - "{{ daybook_photos_offload_state_path }}"
    - "{{ daybook_photos_offload_config_dir }}"
    - "{{ daybook_photos_offload_launcher_path }}"
    - "{{ daybook_photos_offload_log_dir }}"
    - "{{ daybook_photos_offload_stdout_log }}"
    - "{{ daybook_photos_offload_stderr_log }}"
    - "{{ daybook_photos_offload_launchd_plist_path }}"
  when: daybook_photos_offload_enabled | bool

- name: source | Inspect managed Photos offload source bundle before writing
  ansible.builtin.stat:
    path: "{{ daybook_photos_offload_repo_bundle_path }}"
    follow: false
  register: daybook_photos_offload_repo_bundle_before
  check_mode: false
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_repo_bundle_src | string | length > 0

- name: source | Reject a substituted managed Photos offload source bundle
  ansible.builtin.assert:
    that:
      - >-
        not (daybook_photos_offload_repo_bundle_before.stat.exists | default(false))
        or (daybook_photos_offload_repo_bundle_before.stat.isreg | default(false))
      - >-
        not (daybook_photos_offload_repo_bundle_before.stat.exists | default(false))
        or not (daybook_photos_offload_repo_bundle_before.stat.islnk | default(false))
      - >-
        not (daybook_photos_offload_repo_bundle_before.stat.exists | default(false))
        or (daybook_photos_offload_repo_bundle_before.stat.nlink | default(0) == 1)
    fail_msg: "The managed Photos offload source bundle must be a single-link regular file."
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_repo_bundle_src | string | length > 0

- name: source | Install controller-verified Photos offload source bundle
  ansible.builtin.copy:
    src: "{{ daybook_photos_offload_repo_bundle_src }}"
    dest: "{{ daybook_photos_offload_repo_bundle_path }}"
    owner: root
    group: "{{ daybook_photos_offload_system_group }}"
    mode: "0600"
    follow: false
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_repo_bundle_src | string | length > 0
    - not ansible_check_mode

- name: source | Remove ACLs from managed Photos offload source bundle
  ansible.builtin.command:
    argv:
      - /bin/chmod
      - -N
      - "{{ daybook_photos_offload_repo_bundle_path }}"
  changed_when: false
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_repo_bundle_src | string | length > 0
    - not ansible_check_mode

- name: source | Inspect managed Photos offload source bundle after writing
  ansible.builtin.stat:
    path: "{{ daybook_photos_offload_repo_bundle_path }}"
    follow: false
  register: daybook_photos_offload_repo_bundle_after
  check_mode: false
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_repo_bundle_src | string | length > 0
    - not ansible_check_mode

- name: source | Inspect ACLs on managed Photos offload source bundle
  ansible.builtin.command:
    argv:
      - /bin/ls
      - -le
      - "{{ daybook_photos_offload_repo_bundle_path }}"
  register: daybook_photos_offload_repo_bundle_acl
  changed_when: false
  check_mode: false
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_repo_bundle_src | string | length > 0
    - not ansible_check_mode

- name: source | Require exact managed Photos offload source bundle
  ansible.builtin.assert:
    that:
      - daybook_photos_offload_repo_bundle_after.stat.isreg | default(false)
      - not (daybook_photos_offload_repo_bundle_after.stat.islnk | default(false))
      - daybook_photos_offload_repo_bundle_after.stat.nlink | default(0) == 1
      - daybook_photos_offload_repo_bundle_after.stat.pw_name == 'root'
      - daybook_photos_offload_repo_bundle_after.stat.mode == '0600'
      - daybook_photos_offload_repo_bundle_acl.stdout_lines | length == 1
    fail_msg: "The managed Photos offload source bundle must be protected and ACL-free."
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_repo_bundle_src | string | length > 0
    - not ansible_check_mode

- name: validate | Inspect pre-existing Photos offload checkout
  ansible.builtin.stat:
    path: "{{ daybook_photos_offload_checkout_path }}"
    follow: false
  register: daybook_photos_offload_checkout_before
  check_mode: false
  when: daybook_photos_offload_enabled | bool

- name: validate | Reject a substituted pre-existing Photos offload checkout
  ansible.builtin.assert:
    that:
      - >-
        not (daybook_photos_offload_checkout_before.stat.exists | default(false))
        or (daybook_photos_offload_checkout_before.stat.isdir | default(false))
      - >-
        not (daybook_photos_offload_checkout_before.stat.exists | default(false))
        or not (daybook_photos_offload_checkout_before.stat.islnk | default(false))
      - >-
        not (daybook_photos_offload_checkout_before.stat.exists | default(false))
        or daybook_photos_offload_checkout_before.stat.pw_name == 'root'
      - >-
        not (daybook_photos_offload_checkout_before.stat.exists | default(false))
        or not (daybook_photos_offload_checkout_before.stat.wgrp | default(true))
      - >-
        not (daybook_photos_offload_checkout_before.stat.exists | default(false))
        or not (daybook_photos_offload_checkout_before.stat.woth | default(true))
    fail_msg: "A pre-existing Photos offload checkout must be a protected root-owned directory."
  when: daybook_photos_offload_enabled | bool

- name: validate | Inspect pre-existing Photos offload Git directory
  ansible.builtin.stat:
    path: "{{ daybook_photos_offload_checkout_path }}/.git"
    follow: false
  register: daybook_photos_offload_git_dir_before
  check_mode: false
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_checkout_before.stat.exists | default(false)

- name: validate | Require a real pre-existing Photos offload Git directory
  ansible.builtin.assert:
    that:
      - daybook_photos_offload_git_dir_before.stat.isdir | default(false)
      - not (daybook_photos_offload_git_dir_before.stat.islnk | default(false))
      - daybook_photos_offload_git_dir_before.stat.pw_name == 'root'
      - not (daybook_photos_offload_git_dir_before.stat.wgrp | default(true))
      - not (daybook_photos_offload_git_dir_before.stat.woth | default(true))
    fail_msg: "A pre-existing Photos offload checkout must contain protected root-owned Git metadata."
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_checkout_before.stat.exists | default(false)

- name: validate | Inspect Photos offload checkout trust attestation
  ansible.builtin.stat:
    path: "{{ daybook_photos_offload_checkout_attestation_path }}"
    follow: false
  register: daybook_photos_offload_attestation_before
  check_mode: false
  when: daybook_photos_offload_enabled | bool

- name: validate | Reject unsafe trust attestation and require it for a pre-existing checkout
  ansible.builtin.assert:
    that:
      - >-
        not (daybook_photos_offload_checkout_before.stat.exists | default(false))
        or (daybook_photos_offload_attestation_before.stat.exists | default(false))
      - >-
        not (daybook_photos_offload_attestation_before.stat.exists | default(false))
        or (daybook_photos_offload_attestation_before.stat.isreg | default(false))
      - >-
