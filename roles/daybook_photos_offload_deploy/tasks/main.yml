  ansible.builtin.assert:
    that:
      - daybook_photos_offload_managed_dirs.results[0].stdout | trim == daybook_photos_offload_runtime_dir
      - daybook_photos_offload_managed_dirs.results[1].stdout | trim == daybook_photos_offload_config_dir
      - daybook_photos_offload_managed_dirs.results[2].stdout | trim == daybook_photos_offload_service_home ~ '/Library/LaunchAgents'
      - daybook_photos_offload_managed_dirs.results[3].stdout | trim == daybook_photos_offload_log_dir
    fail_msg: "Photos offload managed directories must resolve to their exact configured paths."
  when:
    - daybook_photos_offload_enabled | bool
    - not ansible_check_mode

- name: runtime | Verify managed Photos offload file types and links
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  register: daybook_photos_offload_managed_files_after
  loop:
    - path: "{{ daybook_photos_offload_launcher_path }}"
      mode: "0700"
      owner: "{{ daybook_photos_offload_service_user }}"
    - path: "{{ daybook_photos_offload_launchd_plist_path }}"
      mode: "0644"
      owner: "{{ daybook_photos_offload_service_user }}"
    - path: "{{ daybook_photos_offload_stdout_log }}"
      mode: "0600"
      owner: "{{ daybook_photos_offload_service_user }}"
    - path: "{{ daybook_photos_offload_stderr_log }}"
      mode: "0600"
      owner: "{{ daybook_photos_offload_service_user }}"
  check_mode: false
  when:
    - daybook_photos_offload_enabled | bool
    - not ansible_check_mode

- name: runtime | Require exact managed Photos offload files
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.nlink | default(0) == 1
      - item.stat.mode == item.item.mode
      - item.stat.pw_name == item.item.owner
    fail_msg: "Photos offload managed file ownership, mode, type, or link count is unsafe."
  loop: "{{ daybook_photos_offload_managed_files_after.results }}"
  when:
    - daybook_photos_offload_enabled | bool
    - not ansible_check_mode

- name: activate | Enable and verify Photos offload with fail-closed rescue
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_launchd_manage_state | bool
    - daybook_photos_offload_launchd_enabled | bool
    - not ansible_check_mode
  block:
    - name: activate | Enable explicitly activated Photos offload agent
      ansible.builtin.command:
        argv:
          - /bin/launchctl
          - enable
          - "gui/{{ daybook_photos_offload_uid.stdout | trim }}/{{ daybook_photos_offload_launchd_label }}"

    - name: activate | Bootstrap explicitly activated Photos offload agent
      ansible.builtin.command:
        argv:
          - /bin/launchctl
          - bootstrap
          - "gui/{{ daybook_photos_offload_uid.stdout | trim }}"
          - "{{ daybook_photos_offload_launchd_plist_path }}"

    - name: activate | Read enabled Photos offload disabled state
      ansible.builtin.command:
        argv:
          - /bin/launchctl
          - print-disabled
          - "gui/{{ daybook_photos_offload_uid.stdout | trim }}"
      register: daybook_photos_offload_enabled_disabled
      changed_when: false
      failed_when: false
      check_mode: false

    - name: activate | Revalidate GUI domain after bootstrap
      ansible.builtin.command:
        argv:
          - /bin/launchctl
          - print
          - "gui/{{ daybook_photos_offload_uid.stdout | trim }}"
      register: daybook_photos_offload_enabled_domain
      changed_when: false
      failed_when: false
      check_mode: false

    - name: activate | Read enabled Photos offload service state
      ansible.builtin.command:
        argv:
          - /bin/launchctl
          - print
          - "gui/{{ daybook_photos_offload_uid.stdout | trim }}/{{ daybook_photos_offload_launchd_label }}"
      register: daybook_photos_offload_enabled_print
      changed_when: false
      check_mode: false

    - name: activate | Require enabled and loaded Photos offload service
      ansible.builtin.assert:
        that:
          - daybook_photos_offload_enabled_domain.rc == 0
          - daybook_photos_offload_enabled_disabled.rc == 0
          - ('"' ~ daybook_photos_offload_launchd_label ~ '" => disabled') not in daybook_photos_offload_enabled_disabled.stdout
          - ('"' ~ daybook_photos_offload_launchd_label ~ '" => true') not in daybook_photos_offload_enabled_disabled.stdout
          - daybook_photos_offload_enabled_print.rc == 0
        fail_msg: "Explicit Photos offload activation did not converge."

  rescue:
    - name: activate | Disable Photos offload after activation failure
      ansible.builtin.command:
        argv:
          - /bin/launchctl
          - disable
          - "gui/{{ daybook_photos_offload_uid.stdout | trim }}/{{ daybook_photos_offload_launchd_label }}"
      register: daybook_photos_offload_rescue_disable
      changed_when: daybook_photos_offload_rescue_disable.rc == 0
      failed_when: false

    - name: activate | Boot out Photos offload after activation failure
      ansible.builtin.command:
        argv:
          - /bin/launchctl
          - bootout
          - "gui/{{ daybook_photos_offload_uid.stdout | trim }}/{{ daybook_photos_offload_launchd_label }}"
      register: daybook_photos_offload_rescue_bootout
      changed_when: daybook_photos_offload_rescue_bootout.rc == 0
      failed_when: false

    - name: activate | Verify rescue disabled Photos offload
      ansible.builtin.command:
        argv:
          - /bin/launchctl
          - print-disabled
          - "gui/{{ daybook_photos_offload_uid.stdout | trim }}"
      register: daybook_photos_offload_rescue_disabled
      changed_when: false
      failed_when: false
      check_mode: false

    - name: activate | Revalidate GUI domain after rescue
      ansible.builtin.command:
        argv:
          - /bin/launchctl
          - print
          - "gui/{{ daybook_photos_offload_uid.stdout | trim }}"
      register: daybook_photos_offload_rescue_domain
      changed_when: false
      failed_when: false
      check_mode: false

    - name: activate | Verify rescue unloaded Photos offload
      ansible.builtin.command:
        argv:
          - /bin/launchctl
          - print
          - "gui/{{ daybook_photos_offload_uid.stdout | trim }}/{{ daybook_photos_offload_launchd_label }}"
      register: daybook_photos_offload_rescue_print
      changed_when: false
      failed_when: false
      check_mode: false

    - name: activate | Require fail-closed Photos offload rescue
      ansible.builtin.assert:
        that:
          - daybook_photos_offload_rescue_domain.rc == 0
          - daybook_photos_offload_rescue_disabled.rc == 0
          - >-
            (
              ('"' ~ daybook_photos_offload_launchd_label ~ '" => disabled')
              in daybook_photos_offload_rescue_disabled.stdout
            )
            or (
              ('"' ~ daybook_photos_offload_launchd_label ~ '" => true')
              in daybook_photos_offload_rescue_disabled.stdout
            )
          - daybook_photos_offload_rescue_print.rc == 113
          - >-
            (
              'Could not find service "' ~ daybook_photos_offload_launchd_label
              ~ '" in domain for user gui: ' ~ (daybook_photos_offload_uid.stdout | trim)
            ) in daybook_photos_offload_rescue_print.stderr
        fail_msg: "Photos offload activation failed and could not be quiesced."

    - name: activate | Report failed Photos offload activation
      ansible.builtin.fail:
        msg: "Photos offload activation failed; the service was disabled and unloaded."

- name: verify | Read disabled Photos offload state
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - print-disabled
      - "gui/{{ daybook_photos_offload_uid.stdout | trim }}"
  register: daybook_photos_offload_final_disabled
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_launchd_manage_state | bool
    - not (daybook_photos_offload_launchd_enabled | bool)
    - not ansible_check_mode

- name: verify | Revalidate GUI domain for disabled Photos offload
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - print
      - "gui/{{ daybook_photos_offload_uid.stdout | trim }}"
  register: daybook_photos_offload_final_domain
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_launchd_manage_state | bool
    - not (daybook_photos_offload_launchd_enabled | bool)
    - not ansible_check_mode

- name: verify | Read unloaded Photos offload service state
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - print
      - "gui/{{ daybook_photos_offload_uid.stdout | trim }}/{{ daybook_photos_offload_launchd_label }}"
  register: daybook_photos_offload_final_print
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_launchd_manage_state | bool
    - not (daybook_photos_offload_launchd_enabled | bool)
    - not ansible_check_mode

- name: verify | Require disabled and unloaded Photos offload state
  ansible.builtin.assert:
    that:
      - daybook_photos_offload_final_domain.rc == 0
      - daybook_photos_offload_final_disabled.rc == 0
      - >-
        (
          ('"' ~ daybook_photos_offload_launchd_label ~ '" => disabled')
          in daybook_photos_offload_final_disabled.stdout
        )
        or (
          ('"' ~ daybook_photos_offload_launchd_label ~ '" => true')
          in daybook_photos_offload_final_disabled.stdout
        )
      - daybook_photos_offload_final_print.rc == 113
      - >-
        (
          'Could not find service "' ~ daybook_photos_offload_launchd_label
          ~ '" in domain for user gui: ' ~ (daybook_photos_offload_uid.stdout | trim)
        ) in daybook_photos_offload_final_print.stderr
    fail_msg: "Photos offload did not remain disabled and unloaded."
  when:
    - daybook_photos_offload_enabled | bool
    - daybook_photos_offload_launchd_manage_state | bool
    - not (daybook_photos_offload_launchd_enabled | bool)
    - not ansible_check_mode
