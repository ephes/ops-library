- name: validate | Verify attested pre-existing protected checkout content
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['python']['executable'] }}"
      - -c
      - |
        import os
        import re
        import stat
        import subprocess
        import sys

        root, excluded = sys.argv[1:]
        for base, dirs, files in os.walk(root, topdown=True, followlinks=False):
            included_dirs = [
                name
                for name in dirs
                if os.path.join(base, name) != excluded
            ]
            dirs[:] = included_dirs
            paths = [
                base,
                *[os.path.join(base, name) for name in included_dirs],
                *[os.path.join(base, name) for name in files],
            ]
            for path in paths:
                metadata = os.lstat(path)
                file_type_safe = (
                    stat.S_ISDIR(metadata.st_mode)
                    or stat.S_ISREG(metadata.st_mode)
                )
                link_count_safe = (
                    stat.S_ISDIR(metadata.st_mode) or metadata.st_nlink == 1
                )
                acl_output = subprocess.run(
                    ["/bin/ls", "-lde", path],
                    check=True,
                    capture_output=True,
                    text=True,
                ).stdout
                has_acl = any(
                    re.match(r"^\s*\d+:", line)
                    for line in acl_output.splitlines()[1:]
                )
                if (
                    not file_type_safe
                    or not link_count_safe
                    or metadata.st_uid != 0
                    or stat.S_IMODE(metadata.st_mode) & 0o022
                    or has_acl
                ):
                    raise SystemExit("unsafe protected checkout content")
