---
# User and group
vibe_coding_user: "vibe"
vibe_coding_group: "vibe"
vibe_coding_user_home: "/mnt/cryptdata/vibe"
vibe_coding_shell: "/usr/bin/fish"

# Projects directory
vibe_coding_projects_dir: "{{ vibe_coding_user_home }}/projects"

# SSH authorized keys (list of public key strings)
vibe_coding_ssh_authorized_keys: []

# chezmoi — dotfiles git repo (cloned via SSH agent forwarding; preferred)
vibe_coding_dotfiles_repo: ""  # e.g. "git@github.com:user/dotfiles.git" — empty to skip

# chezmoi — rsync dotfiles source from local machine (legacy fallback)
vibe_coding_chezmoi_source_dir: ""  # e.g. "~/.local/share/chezmoi" — empty to skip

# Environment variables (for API keys — deployed outside chezmoi)
vibe_coding_fish_env: {}
#   ANTHROPIC_API_KEY: "sk-ant-..."

# Extra packages passed through to shell_basics_deploy
vibe_coding_shell_basics_extra_packages:
  - gh
  - zoxide

# Node.js (NodeSource LTS)
vibe_coding_install_node: true
vibe_coding_node_major_version: "22"

# Neovim (from GitHub releases — apt version is too old for LazyVim)
vibe_coding_neovim_version: "0.12.5"

# lazygit (required by LazyVim <leader>gg keybinding)
vibe_coding_lazygit_version: "0.65.1"

# Rust toolchain (rustup) — needed by rustaceanvim / LazyVim rust extra
vibe_coding_install_rust: true

# Per-user npm global prefix (avoids root-owned binaries that break auto-update)
vibe_coding_npm_prefix: "{{ vibe_coding_user_home }}/.npm-global"

# AI coding tools installed via npm (per-user, not system-wide)
vibe_coding_npm_tools:
  - "@anthropic-ai/claude-code"
  - "@openai/codex"
  - "opencode-ai"
  - "@mariozechner/pi-coding-agent"

# zellij (installed alongside tmux as a first-class multiplexer option)
vibe_coding_zellij_install: true

# GitHub CLI auth (managed via ~/.config/gh/hosts.yml)
vibe_coding_github_cli_auth_enabled: false
vibe_coding_github_username: ""
vibe_coding_github_token: ""

# SSH hardening — Match User block in sshd_config
vibe_coding_sshd_hardening: true

vibe_coding_rustup_version: "1.29.2"
vibe_coding_zellij_version: "0.45.1"

vibe_coding_lazygit_checksum:
  # https://github.com/jesseduffield/lazygit/releases/download/v0.65.1/checksums.txt
  x86_64: "sha256:02beacbcda0fa342e50ae3480ba8147307353af3fb28e1d5f790e02329c201a6"
  # https://github.com/jesseduffield/lazygit/releases/download/v0.65.1/checksums.txt
  arm64: "sha256:49abecdf6adf4f2dfdb11bf7b9bfada267ea523612ed809d1c6d87f6c04000a7"

# GitHub release asset digest via API, no project-published checksum file for
# v0.12.5: https://api.github.com/repos/neovim/neovim/releases/tags/v0.12.5
# (assets[].digest of nvim-linux-x86_64.tar.gz / nvim-linux-arm64.tar.gz).
vibe_coding_neovim_checksum:
  x86_64: "sha256:bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875"
  arm64: "sha256:1aa5ca085249580ae0f91eb14f27ec0919773ff2d99a163d03f3d6c21ac29725"

