---
- name: rust | Check if rustup is installed
  ansible.builtin.stat:
    path: "{{ vibe_coding_user_home }}/.cargo/bin/rustup"
  register: vibe_coding_rustup_bin

- name: rust | Install rustup
  when: not vibe_coding_rustup_bin.stat.exists
  block:
    - name: rust | Create temporary directory for installer
      ansible.builtin.tempfile:
        state: directory
        prefix: rustup_
      become: true
      become_user: "{{ vibe_coding_user }}"
      register: vibe_coding_rustup_tmpdir

    - name: rust | Select release architecture
      ansible.builtin.set_fact:
        vibe_coding_rustup_arch: "{{ {'x86_64': 'x86_64', 'aarch64': 'aarch64'}.get(ansible_architecture, 'unsupported') }}"

    - name: rust | Validate pinned release
      ansible.builtin.assert:
        that:
          - vibe_coding_rustup_arch in vibe_coding_rustup_checksum
          - vibe_coding_rustup_version != 'latest'

    - name: rust | Download rustup-init
      ansible.builtin.get_url:
        url: "https://static.rust-lang.org/rustup/archive/{{ vibe_coding_rustup_version }}/{{ vibe_coding_rustup_arch }}-unknown-linux-gnu/rustup-init"
        checksum: "{{ vibe_coding_rustup_checksum[vibe_coding_rustup_arch] }}"
        dest: "{{ vibe_coding_rustup_tmpdir.path }}/rustup-init"
        mode: "0755"
      become: true
      become_user: "{{ vibe_coding_user }}"

    - name: rust | Run rustup-init
      ansible.builtin.command:
        cmd: "{{ vibe_coding_rustup_tmpdir.path }}/rustup-init -y --no-modify-path"
      become: true
      become_user: "{{ vibe_coding_user }}"
      changed_when: true

  always:
    - name: rust | Remove temporary installer directory
      ansible.builtin.file:
        path: "{{ vibe_coding_rustup_tmpdir.path }}"
        state: absent
      when: vibe_coding_rustup_tmpdir.path is defined
      become: true
      become_user: "{{ vibe_coding_user }}"

- name: rust | Ensure rust-analyzer is installed
  ansible.builtin.command:
    cmd: "{{ vibe_coding_user_home }}/.cargo/bin/rustup component add rust-analyzer"
  become: true
  become_user: "{{ vibe_coding_user }}"
  register: vibe_coding_rust_analyzer_result
  changed_when: "'installing' in vibe_coding_rust_analyzer_result.stderr"
