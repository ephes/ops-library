---
- name: neovim | Determine release architecture
  ansible.builtin.set_fact:
    vibe_coding_neovim_arch: >-
      {{ 'x86_64' if ansible_architecture == 'x86_64' else ('arm64' if ansible_architecture == 'aarch64' else '') }}

- name: neovim | Validate release architecture support
  ansible.builtin.assert:
    that:
      - vibe_coding_neovim_arch | length > 0
    fail_msg: "Unsupported architecture for Neovim release tarball: {{ ansible_architecture }}"

- name: neovim | Check installed version
  ansible.builtin.command:
    cmd: nvim --version
  register: vibe_coding_nvim_version
  changed_when: false
  failed_when: false

- name: neovim | Install from GitHub releases
  when: >-
    vibe_coding_nvim_version.rc != 0 or
    vibe_coding_nvim_version.stdout_lines[0] | default('') is not search('NVIM v' + vibe_coding_neovim_version)
  block:
    - name: neovim | Remove apt neovim if present
      ansible.builtin.apt:
        name: neovim
        state: absent
        force_apt_get: true

    - name: neovim | Validate checksum architecture
      ansible.builtin.assert:
        that:
          - vibe_coding_neovim_arch in vibe_coding_neovim_checksum
          - vibe_coding_neovim_version != 'latest'

    - name: neovim | Allocate release directory
      ansible.builtin.tempfile:
        state: directory
        prefix: neovim_
      register: vibe_coding_neovim_tmp

    - name: neovim | Download verified archive
      ansible.builtin.get_url:
        url: "https://github.com/neovim/neovim/releases/download/v{{ vibe_coding_neovim_version }}/nvim-linux-{{ vibe_coding_neovim_arch }}.tar.gz"
        checksum: "{{ vibe_coding_neovim_checksum[vibe_coding_neovim_arch] }}"
        dest: "{{ vibe_coding_neovim_tmp.path }}/release.tar.gz"
        mode: "0644"

    - name: neovim | Extract verified archive
      ansible.builtin.unarchive:
        src: "{{ vibe_coding_neovim_tmp.path }}/release.tar.gz"
        dest: /opt
        remote_src: true

    - name: neovim | Symlink nvim to /usr/local/bin
      ansible.builtin.file:
        src: "/opt/nvim-linux-{{ vibe_coding_neovim_arch }}/bin/nvim"
        dest: /usr/local/bin/nvim
        state: link
  always:
    - name: neovim | Remove release directory
      ansible.builtin.file:
        path: "{{ vibe_coding_neovim_tmp.path }}"
        state: absent
      when: vibe_coding_neovim_tmp.path is defined
