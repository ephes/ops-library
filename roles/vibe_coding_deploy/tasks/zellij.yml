---
- name: zellij | Check if zellij is installed
  ansible.builtin.command: which zellij
  register: vibe_coding_zellij_check
  changed_when: false
  failed_when: false

- name: zellij | Install zellij from GitHub release
  when: vibe_coding_zellij_check.rc != 0
  block:
    - name: zellij | Determine system architecture
      ansible.builtin.set_fact:
        vibe_coding_zellij_arch: "{{ {'x86_64': 'x86_64', 'aarch64': 'aarch64'}.get(ansible_architecture, 'unsupported') }}"

    - name: zellij | Validate checksum architecture
      ansible.builtin.assert:
        that:
          - vibe_coding_zellij_arch in vibe_coding_zellij_checksum
          - vibe_coding_zellij_arch in vibe_coding_zellij_binary_checksum
          - vibe_coding_zellij_version != 'latest'

    - name: zellij | Allocate release directory
      ansible.builtin.tempfile:
        state: directory
        prefix: zellij_
      register: vibe_coding_zellij_tmp

    - name: zellij | Download verified archive
      ansible.builtin.get_url:
        url: "https://github.com/zellij-org/zellij/releases/download/v{{ vibe_coding_zellij_version }}/zellij-{{ vibe_coding_zellij_arch }}-unknown-linux-musl.tar.gz"
        checksum: "{{ vibe_coding_zellij_checksum[vibe_coding_zellij_arch] }}"
        dest: "{{ vibe_coding_zellij_tmp.path }}/release.tar.gz"
        mode: "0644"

    - name: zellij | Extract archive into release directory
      ansible.builtin.unarchive:
        src: "{{ vibe_coding_zellij_tmp.path }}/release.tar.gz"
        dest: "{{ vibe_coding_zellij_tmp.path }}"
        remote_src: true
        include:
          - zellij

    - name: zellij | Hash extracted binary
      ansible.builtin.stat:
        path: "{{ vibe_coding_zellij_tmp.path }}/zellij"
        checksum_algorithm: sha256
      register: vibe_coding_zellij_binary

    # zellij publishes <asset>.sha256sum for the binary inside the archive,
    # not for the archive itself; this is the check against that file.
    - name: zellij | Verify binary against the published checksum
      ansible.builtin.assert:
        that:
          - vibe_coding_zellij_binary.stat.exists
          - vibe_coding_zellij_binary.stat.isreg
          - ("sha256:" ~ vibe_coding_zellij_binary.stat.checksum) == vibe_coding_zellij_binary_checksum[vibe_coding_zellij_arch]
        fail_msg: "zellij binary does not match the published SHA-256; nothing was installed"
        quiet: true

    - name: zellij | Install verified binary
      ansible.builtin.copy:
        src: "{{ vibe_coding_zellij_tmp.path }}/zellij"
        dest: /usr/local/bin/zellij
        remote_src: true
        mode: "0755"
        owner: root
        group: root
  always:
    - name: zellij | Remove release directory
      ansible.builtin.file:
        path: "{{ vibe_coding_zellij_tmp.path }}"
        state: absent
      when: vibe_coding_zellij_tmp.path is defined
