---
# Fill the nginx federation cache through nginx itself, as remote servers would
# reach it via Traefik, and check that the second request is a cache hit.
- name: Build the federation cache fill list
  ansible.builtin.import_tasks: federation_cache_items.yml

- name: Fill the Mastodon federation cache
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ mastodon_nginx_port }}{{ item.path }}"
    headers:
      X-Forwarded-Host: "{{ item.host }}"
      X-Forwarded-Proto: https
      Accept: "{{ item.accept }}"
    status_code: 200
  register: mastodon_federation_cache_fill
  until: mastodon_federation_cache_fill.status == 200
  retries: "{{ mastodon_healthcheck_retries }}"
  delay: "{{ mastodon_healthcheck_delay }}"
  loop: "{{ mastodon_federation_cache_prime_items }}"
  loop_control:
    label: "{{ item.host }}{{ item.path }}"
  changed_when: false

- name: Check that the federation documents are served from the cache
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ mastodon_nginx_port }}{{ item.path }}"
    headers:
      X-Forwarded-Host: "{{ item.host }}"
      X-Forwarded-Proto: https
      Accept: "{{ item.accept }}"
    status_code: 200
  register: mastodon_federation_cache_check
  loop: "{{ mastodon_federation_cache_prime_items }}"
  loop_control:
    label: "{{ item.host }}{{ item.path }}"
  failed_when: >-
    mastodon_federation_cache_check.status != 200
    or (mastodon_federation_cache_check.x_cache_status | default('')) not in ['HIT', 'STALE', 'UPDATING', 'REVALIDATED']
  changed_when: false
