---
- name: configure | Ensure Redis data directory exists
  ansible.builtin.file:
    path: "{{ redis_install_data_dir }}"
    state: directory
    owner: "{{ redis_install_user }}"
    group: "{{ redis_install_group }}"
    mode: "0750"

- name: configure | Ensure Redis log directory exists
  ansible.builtin.file:
    path: "{{ redis_install_log_dir }}"
    state: directory
    owner: "{{ redis_install_user }}"
    group: "{{ redis_install_group }}"
    mode: "0755"

- name: configure | Ensure Redis config directory exists
  ansible.builtin.file:
    path: "{{ redis_install_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: configure | Configure Redis with optional candidate validation
  block:
    - name: configure | Create private Redis validator directory
      ansible.builtin.tempfile:
        state: directory
        suffix: .redis-validator
      register: _redis_install_validator_dir
      changed_when: false
      when:
        - redis_install_validate_config | bool
        - not ansible_check_mode

    - name: configure | Render ephemeral Redis validator
      ansible.builtin.template:
        src: validate-config.sh.j2
        dest: "{{ _redis_install_validator_dir.path }}/validate.sh"
        owner: root
        group: root
        mode: "0700"
      changed_when: false
      when:
        - redis_install_validate_config | bool
        - not ansible_check_mode

    - name: configure | Render private Redis configuration candidate
      ansible.builtin.template:
        src: redis.conf.j2
        dest: "{{ _redis_install_validator_dir.path }}/redis.conf"
        owner: root
        group: root
        mode: "0600"
      changed_when: false
      no_log: true
      when:
        - redis_install_validate_config | bool
        - not ansible_check_mode

    - name: configure | Validate Redis configuration candidate
      ansible.builtin.command:
        argv:
          - /bin/bash
          - "{{ _redis_install_validator_dir.path }}/validate.sh"
          - "{{ _redis_install_validator_dir.path }}/redis.conf"
      changed_when: false
      when:
        - redis_install_validate_config | bool
        - not ansible_check_mode

    - name: configure | Atomically install validated Redis configuration
      ansible.builtin.copy:
        src: "{{ _redis_install_validator_dir.path }}/redis.conf"
        remote_src: true
        dest: "{{ redis_install_config_path }}"
        owner: root
        group: "{{ redis_install_group }}"
        # May contain requirepass; redis-server reads it via its group.
        mode: "0640"
        backup: true
      notify: restart redis
      no_log: true
      when:
        - redis_install_validate_config | bool
        - not ansible_check_mode

    - name: configure | Render Redis configuration without execution validation
      ansible.builtin.template:
        src: redis.conf.j2
        dest: "{{ redis_install_config_path }}"
        owner: root
        group: "{{ redis_install_group }}"
        mode: "0640"
        backup: true
      notify: restart redis
      no_log: true
      when: not redis_install_validate_config | bool or ansible_check_mode

  always:
    - name: configure | Remove ephemeral Redis validator directory
      ansible.builtin.file:
        path: "{{ _redis_install_validator_dir.path }}"
        state: absent
      changed_when: false
      when:
        - _redis_install_validator_dir.path is defined

- name: configure | Find earlier Redis configuration backups
  ansible.builtin.find:
    paths: "{{ redis_install_config_path | dirname }}"
    patterns: "{{ redis_install_config_path | basename }}.*~"
    file_type: file
  register: _redis_install_config_backups

- name: configure | Restrict earlier Redis configuration backups
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: "{{ redis_install_group }}"
    mode: "0640"
  loop: "{{ _redis_install_config_backups.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
