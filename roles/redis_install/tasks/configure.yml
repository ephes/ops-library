---
- name: Ensure Redis data directory exists
  ansible.builtin.file:
    path: "{{ redis_install_data_dir }}"
    state: directory
    owner: "{{ redis_install_user }}"
    group: "{{ redis_install_group }}"
    mode: "0750"

- name: Ensure Redis log directory exists
  ansible.builtin.file:
    path: "{{ redis_install_log_dir }}"
    state: directory
    owner: "{{ redis_install_user }}"
    group: "{{ redis_install_group }}"
    mode: "0755"

- name: Ensure Redis config directory exists
  ansible.builtin.file:
    path: "{{ redis_install_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render Redis configuration
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ redis_install_config_path }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: restart redis

- name: Validate Redis configuration syntax
  ansible.builtin.shell: |
    set -euo pipefail
    validate_root={{ redis_install_validate_dir | quote }}
    mkdir -p "${validate_root}"
    validate_dir=$(mktemp -d "${validate_root}/redis-config.XXXXXX")
    pidfile="${validate_dir}/redis-config-test.pid"
    logfile="${validate_dir}/redis-config-test.log"
    socket="${validate_dir}/v.sock"

    cleanup() {
      if [[ -s "${pidfile}" ]]; then
        pid=$(cat "${pidfile}")
        if [[ "${pid}" =~ ^[0-9]+$ ]]; then
          kill "${pid}" 2>/dev/null || true
          for _ in {1..50}; do
            kill -0 "${pid}" 2>/dev/null || break
            sleep 0.1
          done
          if kill -0 "${pid}" 2>/dev/null; then
            kill -KILL "${pid}" 2>/dev/null || true
          fi
        fi
      fi
      rm -rf -- "${validate_dir}"
    }

    trap cleanup EXIT

    if ! redis-server {{ redis_install_config_path | quote }} \
      --port 0 \
      --unixsocket "${socket}" \
      --unixsocketperm 700 \
      --supervised no \
      --pidfile "${pidfile}" \
      --logfile "${logfile}" \
      --dir "${validate_dir}" \
      --save "" \
      --appendonly no \
      --daemonize yes >"${logfile}" 2>&1; then
      echo "Redis validation rejected the configuration." >&2
      exit 1
    fi

    for _ in {1..50}; do
      if [[ -s "${pidfile}" && -S "${socket}" ]]; then
        break
      fi
      sleep 0.1
    done

    if [[ ! -s "${pidfile}" || ! -S "${socket}" ]]; then
      echo "Redis validation failed to start test instance." >&2
      exit 1
    fi

    kill -0 "$(cat "${pidfile}")"
  args:
    executable: /bin/bash
  when:
    - redis_install_validate_config | bool
    - not ansible_check_mode
  changed_when: false
