---
# Restore SnappyMail data from a backup archive

snappymail_restore_source: ""      # Path to backup archive (tar.gz or tar.zst) or extracted directory
snappymail_restore_clean: true     # true: restore into a fresh directory; false: merge into a copy of the live data
snappymail_restore_owner: "{{ snappymail_user }}"
snappymail_restore_group: "{{ snappymail_group }}"
snappymail_restore_mode: "0750"
snappymail_restore_root: "{{ snappymail_backup_root | default('/mnt/cryptdata/backups/snappymail') }}"
snappymail_restore_restart_services: true
snappymail_restore_packages:
  - rsync
snappymail_restore_cleanup: true   # Remove the staging directory (also after a failure)
# Archives are unpacked here first. Keep it next to the data directory.
snappymail_restore_staging_dir: "{{ snappymail_data_dir | dirname }}/.{{ snappymail_data_dir | basename }}.restore-staging"

# The live data directory is renamed to <dir>.pre-restore-<UTC timestamp>
# next to itself (copied there with snappymail_restore_clean: false). The
# safety root holds the rollback manifest. A successful run removes older
# generations and keeps only its own copy.
snappymail_restore_safety_root: /var/backups/snappymail-pre-restore
