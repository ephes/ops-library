---
# mail_backend_deploy - Main task orchestration

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - mail_backend_domains is defined
      - mail_backend_domains | length > 0
      - mail_backend_postgres_password is defined
      - mail_backend_postgres_password | length > 0
      - mail_backend_relay_host is defined
      - mail_backend_relay_password is defined
    fail_msg: |
      Required variables not set:
      - mail_backend_domains: List of domains to host
      - mail_backend_postgres_password: PostgreSQL password for mail user
      - mail_backend_relay_host: Edge relay for outbound mail
      - mail_backend_relay_password: Password for SMTP AUTH to edge

- name: Validate sender-only domains
  ansible.builtin.assert:
    that:
      - mail_backend_schema_mode == 'postfixadmin'
      - mail_backend_sender_only_domains | map('lower') | list
        | intersect(mail_backend_domains | map('lower') | list) | length == 0
      - mail_backend_sender_only_domains | map('lower') | list == mail_backend_sender_only_domains | list
      - mail_backend_sender_only_domains | map('lower') | list
        | intersect(
            (mail_backend_postfixadmin_domain_aliases | default([]) | map(attribute='alias_domain') | map('lower') | list)
            + (mail_backend_postfixadmin_domain_aliases | default([]) | map(attribute='target_domain') | map('lower') | list)
          ) | length == 0
    fail_msg: >-
      mail_backend_sender_only_domains requires
      mail_backend_schema_mode = 'postfixadmin' (got '{{ mail_backend_schema_mode }}'),
      must not overlap mail_backend_domains or either side of
      mail_backend_postfixadmin_domain_aliases, and must be lowercase.
      A domain is either hosted or sender-only, never both -- overlap would leave the
      `domain` row's active flag depending on task order. An alias-domain mapping would
      defeat the guarantee differently: virtual_domain_aliases.cf resolves recipients
      through alias_domain without consulting domain.active, so the sender-only domain
      would still be treated as a recipient domain. Lowercase is required because
      alias.domain is written lowercased and its foreign key onto domain.domain is
      case sensitive, so a mixed-case entry would pass every existence check and then
      fail when mail_users_sync inserts the send-as alias.
  when: mail_backend_sender_only_domains | default([]) | length > 0

- name: Validate PostfixAdmin domain alias mappings
  ansible.builtin.assert:
    that:
      - item.alias_domain is defined
      - item.target_domain is defined
      - (item.alias_domain | trim) | length > 0
      - (item.target_domain | trim) | length > 0
      - (item.alias_domain | lower) != (item.target_domain | lower)
    fail_msg: "Invalid mail_backend_postfixadmin_domain_aliases entry: {{ item | to_json }}"
  loop: "{{ mail_backend_postfixadmin_domain_aliases | default([]) }}"
  when: mail_backend_postfixadmin_domain_aliases | default([]) | length > 0

- name: Install mail backend packages
  ansible.builtin.import_tasks: packages.yml

- name: Create vmail user and directories
  ansible.builtin.import_tasks: vmail.yml

- name: Set up PostgreSQL database and schema
  ansible.builtin.import_tasks: database.yml

- name: Configure Postfix
  ansible.builtin.import_tasks: postfix.yml

- name: Configure Dovecot
  ansible.builtin.import_tasks: dovecot.yml

- name: Configure DKIM
  ansible.builtin.import_tasks: dkim.yml
  when: mail_backend_dkim_enabled

- name: Configure services
  ansible.builtin.import_tasks: services.yml
