---
- name: Validate attention removal inputs
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Darwin'
      - daybook_voice_memo_attention_remove_confirm is boolean
      - daybook_voice_memo_attention_remove_confirm
      - daybook_voice_memo_attention_remove_service_user is match('^[a-z_][a-z0-9_-]*$')
      - daybook_voice_memo_attention_remove_service_user not in ['root', 'CHANGEME']
      - daybook_voice_memo_attention_remove_service_home == '/Users/' ~ daybook_voice_memo_attention_remove_service_user
      - daybook_voice_memo_attention_remove_launchd_label == 'de.wersdoerfer.daybook.voice-memo-attention'
      - daybook_voice_memo_attention_remove_service_user is not search('[\r\n]')
    fail_msg: Explicitly confirm removal for the macOS owner; tracking state is preserved.

- name: Inspect attention removal paths
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ daybook_voice_memo_attention_remove_service_home }}"
    - "{{ daybook_voice_memo_attention_remove_service_home }}/Library"
    - "{{ daybook_voice_memo_attention_remove_service_home }}/Library/LaunchAgents"
    - "{{ daybook_voice_memo_attention_remove_service_home }}/Library/LaunchAgents/{{ daybook_voice_memo_attention_remove_launchd_label }}.plist"
  register: daybook_voice_memo_attention_remove_paths

- name: Reject linked attention removal paths
  ansible.builtin.assert:
    that:
      - not item.stat.islnk | default(false)
    fail_msg: Attention removal paths must not be symlinks.
  loop: "{{ daybook_voice_memo_attention_remove_paths.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Resolve attention removal owner UID
  ansible.builtin.command:
    argv: [/usr/bin/id, -u, "{{ daybook_voice_memo_attention_remove_service_user }}"]
  register: daybook_voice_memo_attention_remove_uid
  changed_when: false
  check_mode: false

- name: Require owner GUI domain for safe attention removal
  ansible.builtin.command:
    argv: [/bin/launchctl, print, "gui/{{ daybook_voice_memo_attention_remove_uid.stdout }}"]
  changed_when: false
  no_log: true
  check_mode: false

- name: Disable attention label for removal
  ansible.builtin.command:
    argv: [/bin/launchctl, disable, "gui/{{ daybook_voice_memo_attention_remove_uid.stdout }}/{{ daybook_voice_memo_attention_remove_launchd_label }}"]
  changed_when: false

- name: Unload attention label for removal
  ansible.builtin.command:
    argv: [/bin/launchctl, bootout, "gui/{{ daybook_voice_memo_attention_remove_uid.stdout }}/{{ daybook_voice_memo_attention_remove_launchd_label }}"]
  register: daybook_voice_memo_attention_remove_bootout
  changed_when: daybook_voice_memo_attention_remove_bootout.rc == 0
  failed_when: false

- name: Verify attention label is unloaded before removal
  ansible.builtin.command:
    argv: [/bin/launchctl, print, "gui/{{ daybook_voice_memo_attention_remove_uid.stdout }}/{{ daybook_voice_memo_attention_remove_launchd_label }}"]
  register: daybook_voice_memo_attention_remove_probe
  changed_when: false
  no_log: true
  failed_when: daybook_voice_memo_attention_remove_probe.rc == 0
  when: not ansible_check_mode

- name: Remove only attention LaunchAgent plist and preserve all data
  ansible.builtin.file:
    path: "{{ daybook_voice_memo_attention_remove_service_home }}/Library/LaunchAgents/{{ daybook_voice_memo_attention_remove_launchd_label }}.plist"
    state: absent
