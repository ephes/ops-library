---
# The Rust release of the production units (rust/software-live/PLAN.md 7.3
# steps 0-4, shadow units 8.1; Python retired in S12). Included by main.yml
# after the policy and endpoint configuration, before the units.
#
# 0. live_state.yml reads what runs now (read-only).
# 2./3. rust.yml: install the release with rust_release_binary and validate
#    the candidate by its versioned path before anything points at it.
# 8.1 shadow.yml: the shadow units (on) or their removal (off); they touch only
#    the shadow units, their configuration and <data_dir>/shadow.
# 4. The base units (main.yml) name the versioned binary themselves; the
#    impl.conf drop-ins earlier deploys used for that are removed here, in
#    the same play and before the handlers, so the units switch over in one
#    daemon reload and restart.
#
# Verification (step 6) and pins/prune (step 7) follow in main.yml after the
# units were restarted and the initial collection ran.

- name: impl | Read the live state
  ansible.builtin.include_tasks: live_state.yml

- name: impl | Set the release paths
  ansible.builtin.set_fact:
    _software_live_rust_binary: >-
      {{ software_live_install_dir ~ '/releases/' ~ software_live_rust_version ~ '/software-live' }}
    _software_live_rust_apt_binary: >-
      {{ software_live_install_dir ~ '/releases/' ~ software_live_rust_version ~ '/software-live-apt' }}

# --- 2./3. Install and validate the release ------------------------------------

- name: impl | Install and validate the Rust release
  ansible.builtin.include_tasks: rust.yml

# --- 8.1 Shadow units ----------------------------------------------------------

- name: impl | Configure the shadow units
  ansible.builtin.include_tasks: shadow.yml

# --- 4. Retired drop-ins ---------------------------------------------------------

# Runs only after the candidate was validated (rust.yml); the handlers that
# reload systemd and restart the units run after main.yml wrote the base
# units, so no unit ever starts with the drop-in gone and the old base
# command (Python) in place.
- name: impl | Remove the retired implementation drop-ins
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop: '{{ _software_live_dropins }}'
  register: _software_live_dropins_removed
  notify:
    - Reload software live systemd
    - Restart software live endpoint
    - Restart software live timer

# The drop-in directories are removed only when empty (another drop-in there
# is not this role's).
- name: impl | Remove the empty drop-in directories
  ansible.builtin.command:
    argv: [rmdir, --, '{{ item.item | dirname }}']
  loop: '{{ _software_live_dropins_removed.results }}'
  loop_control:
    label: '{{ item.item | dirname }}'
  register: _software_live_dropin_dirs
  changed_when: _software_live_dropin_dirs.rc == 0
  failed_when: false
  when:
    - item is changed
    - not ansible_check_mode
