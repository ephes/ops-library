---
- name: Validate software live configuration
  ansible.builtin.assert:
    that:
      - software_live_policy.host is defined
      - software_live_policy.os is defined
      - software_live_policy.postgresql is defined
      - software_live_policy.traefik is defined
      - software_live_auth_user != 'CHANGE_ME'
      - software_live_auth_user is match('^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$')
      - software_live_auth_password != 'CHANGE_ME'
      - software_live_auth_password | length >= 12
      - software_live_port | int > 1024
      - software_live_port | int < 65536
      - software_live_config_dir is match('^/[a-zA-Z0-9_./-]+$')
      - software_live_data_dir is match('^/[a-zA-Z0-9_./-]+$')
      - software_live_install_dir is match('^/[a-zA-Z0-9_./-]+$')
    fail_msg: Supply a host policy and non-placeholder metrics credentials.
  no_log: true

- name: Require dedicated software observation directories
  ansible.builtin.assert:
    that:
      - item is match('^/(etc|var/lib|usr/local/lib)/[a-zA-Z0-9_-]*software-live[a-zA-Z0-9_-]*$')
    fail_msg: Paths must be dedicated software-live directories under etc, var/lib or usr/local/lib.
  loop:
    - '{{ software_live_config_dir }}'
    - '{{ software_live_data_dir }}'
    - '{{ software_live_install_dir }}'

# The Rust release (rust/software-live/PLAN.md 7.3, S12): a released variant,
# version and checksum, validated before anything changes.
- name: Validate the implementation selection
  ansible.builtin.include_tasks: impl_inputs.yml

- name: Validate private IPv4 endpoint binding
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        import ipaddress,sys;
        ip=ipaddress.ip_address(sys.argv[1]);
        assert ip.version == 4 and (ip.is_loopback or ip in ipaddress.ip_network('100.64.0.0/10'))
      - '{{ software_live_bind }}'
  changed_when: false
  check_mode: false

- name: Install software observation dependencies
  ansible.builtin.package:
    name: '{{ software_live_packages }}'
    state: present

- name: Create software metrics group
  ansible.builtin.group:
    name: '{{ software_live_group }}'
    system: true

- name: Create software metrics user
  ansible.builtin.user:
    name: '{{ software_live_user }}'
    group: '{{ software_live_group }}'
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create software observation directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: '{{ software_live_group }}'
    mode: '0750'
  loop:
    - '{{ software_live_config_dir }}'
    - '{{ software_live_data_dir }}'

- name: Create public program directory
  ansible.builtin.file:
    path: '{{ software_live_install_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

# The Nyxmon helper stays Python; the collector and the endpoint are the Rust
# release (impl.yml). files/software_live.py stays in the role only as the
# test oracle of the Rust port and is not deployed (PLAN.md S12).
- name: Install software observation programs
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '{{ software_live_install_dir }}/{{ item }}'
    owner: root
    group: root
    mode: '0755'
  loop:
    - nyxmon_checks.py

- name: Install software observation policy
  ansible.builtin.copy:
    content: "{{ software_live_policy | to_nice_json }}\n"
    dest: '{{ software_live_config_dir }}/policy.json'
    owner: root
    group: '{{ software_live_group }}'
    mode: '0640'

# The Rust candidate validates the policy before anything points at it
# (tasks/rust.yml, PLAN.md 7.3 steps 3 and 5).

- name: Verify current software endpoint credentials
  ansible.builtin.command:
    argv: [htpasswd, '-vi', '{{ software_live_config_dir }}/htpasswd', '{{ software_live_auth_user }}']
    stdin: '{{ software_live_auth_password }}'
  changed_when: false
  failed_when: false
  register: _software_live_auth
  no_log: true

- name: Create software endpoint password hash
  ansible.builtin.command:
    argv: [htpasswd, '-niB', '{{ software_live_auth_user }}']
    stdin: '{{ software_live_auth_password }}'
  changed_when: false
  register: _software_live_hash
  when: _software_live_auth.rc | default(1) != 0
  no_log: true

- name: Install software endpoint password hash
  ansible.builtin.copy:
    content: "{{ _software_live_hash.stdout }}\n"
    dest: '{{ software_live_config_dir }}/htpasswd'
    owner: root
    group: '{{ software_live_group }}'
    mode: '0640'
  when: _software_live_auth.rc | default(1) != 0 and not ansible_check_mode
  no_log: true

- name: Configure software endpoint
  ansible.builtin.copy:
    content: "{{ _software_live_endpoint_config | to_nice_json }}\n"
    dest: '{{ software_live_config_dir }}/endpoint.json'
    owner: root
    group: '{{ software_live_group }}'
    mode: '0640'
  vars:
    _software_live_endpoint_config:
      bind: '{{ software_live_bind }}'
      port: '{{ software_live_port | int }}'
      path: /.well-known/software-live
      state: '{{ software_live_data_dir }}/state.json'
      auth_user: '{{ software_live_auth_user }}'
      htpasswd: '{{ software_live_config_dir }}/htpasswd'
  notify: Restart software live endpoint

- name: Validate opt-in inventory export
  ansible.builtin.assert:
    that:
      - software_live_inventory_export is boolean
      - software_live_inventory_group is match('^[a-z_][a-z0-9_-]*$')

- name: Prepare a separate read-only inventory projection directory
  when: software_live_inventory_export
  block:
    - name: Require the existing inventory reader group
      ansible.builtin.getent:
        database: group
        key: '{{ software_live_inventory_group }}'

    - name: Inspect inventory projection directory without following links
      ansible.builtin.stat:
        path: /var/lib/software-estate-observations
        follow: false
      register: _software_live_inventory_dir

    - name: Refuse unsafe existing inventory projection directory
      ansible.builtin.assert:
        that:
          - >-
            not _software_live_inventory_dir.stat.exists or
            (_software_live_inventory_dir.stat.isdir | default(false) and
             not _software_live_inventory_dir.stat.islnk | default(false) and
             _software_live_inventory_dir.stat.uid == 0 and
             _software_live_inventory_dir.stat.mode in ['0750', '0700'])

    - name: Create the root-owned inventory projection directory
      ansible.builtin.file:
        path: /var/lib/software-estate-observations
        state: directory
        owner: root
        group: '{{ software_live_inventory_group }}'
        mode: '0750'

# Live state, Rust install and candidate validation, shadow units, removal of
# the retired drop-ins (PLAN.md 7.3 steps 0-4, 8.1, S12).
- name: Select the software observation implementation
  ansible.builtin.include_tasks: impl.yml

- name: Install software observation units
  ansible.builtin.template:
    src: '{{ item.src }}'
    dest: '{{ software_live_systemd_dir }}/{{ item.dest }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - {src: collector.service.j2, dest: software-live-collector.service}
    - {src: collector.timer.j2, dest: software-live-collector.timer}
    - {src: endpoint.service.j2, dest: software-live-endpoint.service}
  notify:
    - Reload software live systemd
    - Restart software live endpoint
    - Restart software live timer

- name: Load software observation units
  ansible.builtin.meta: flush_handlers

# A run the timer started before the units were reloaded still executes the
# previous program, and `state: started` below would see it as running and
# start nothing. Wait until it is over (the unit allows 90 s), so the initial
# collection runs the selected program (rust/software-live/PLAN.md 7.3 step 6).
- name: Wait for a running software observation to finish
  ansible.builtin.command:
    argv: [systemctl, show, --property=ActiveState, --value, software-live-collector.service]
  register: _software_live_collector_state
  changed_when: false
  failed_when: false
  retries: '{{ software_live_collector_wait_retries | int }}'
  delay: '{{ software_live_verify_delay | int }}'
  until: >-
    _software_live_collector_state.rc | default(1) == 0
    and (_software_live_collector_state.stdout | trim)
        not in ['activating', 'deactivating', 'reloading', 'refreshing']
  when: not ansible_check_mode

- name: Check the software observation before the initial collection
  ansible.builtin.stat:
    path: '{{ software_live_data_dir }}/state.json'
    get_checksum: false
  register: _software_live_state_before

- name: Collect an initial software observation
  ansible.builtin.systemd_service:
    name: software-live-collector.service
    state: started
  changed_when: false
  when: not ansible_check_mode

- name: Enable software observation timer and endpoint
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    state: started
    enabled: true
  loop:
    - software-live-collector.timer
    - software-live-endpoint.service

- name: Enable the shadow timer and endpoint
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    state: started
    enabled: true
  loop:
    - software-live-shadow-collector.timer
    - software-live-shadow-endpoint.service
  when: software_live_rust_shadow | bool

# PLAN.md 7.3 step 6: the units run the selected program; then step 7.
- name: Verify the running software observation implementation
  ansible.builtin.include_tasks: verify_impl.yml

# PLAN.md S12: the retired Python program and its bytecode cache leave the
# host only once the Rust units are verified (the Nyxmon helper stays).
- name: Remove the retired Python software observation program
  ansible.builtin.file:
    path: '{{ software_live_install_dir }}/{{ item }}'
    state: absent
  loop:
    - software_live.py
    - __pycache__

- name: Pin and prune the software-live releases
  ansible.builtin.include_tasks: rust_pins.yml
