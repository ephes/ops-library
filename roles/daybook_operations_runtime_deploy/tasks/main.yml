---
- name: Validate protected runtime installation
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Darwin'
      - daybook_operations_runtime_action in ['install', 'cutover', 'rollback']
      - daybook_operations_runtime_action == 'install' or daybook_operations_runtime_confirmed | bool
      - not daybook_operations_runtime_start | bool or daybook_operations_runtime_confirmed | bool
      - daybook_operations_runtime_user != 'CHANGEME'
      - daybook_operations_runtime_revision is match('^[0-9a-f]{40}$')
      - daybook_operations_runtime_binding is match('^[a-z0-9][a-z0-9_-]{0,49}$')
      - daybook_operations_runtime_api_url is match('^https://[a-z0-9.-]+(:[0-9]+)?$')
      - daybook_operations_runtime_token is match('^[A-Za-z0-9._~-]{32,256}$')
      - daybook_operations_runtime_mode in ['tick', 'serve']
      # A binding list and the supervisor go together, in both directions.
      # `operations tick` with no `--binding` cannot choose between several
      # bindings -- it stops with `ambiguous_binding` -- and launchd's fixed
      # wake-up could not honour their separate cadences even if it could. A
      # `serve` label with no list would supervise the single schema 1 binding
      # by accident rather than by decision.
      - (daybook_operations_runtime_mode == 'serve')
        == (daybook_operations_runtime_bindings | length > 0)
  no_log: true

- name: Validate every binding in a multi-binding profile
  ansible.builtin.assert:
    that:
      # Shared configuration that does not parse stops the whole profile at load,
      # so catch a typo here rather than on the machine.
      - item.keys() | sort == ['adapter', 'cadence', 'deadline', 'journal', 'lease', 'name']
      - item.name is match('^[a-z0-9][a-z0-9_-]{0,49}$')
      - item.adapter in daybook_operations_runtime_adapters
      - item.journal is match('^/')
      # Whole numbers, not merely things `| int` would coerce. The profile is
      # emitted verbatim, and the client requires real integers: a quoted "300"
      # or a 300.5 would pass a coercing check here and then stop the whole
      # profile at load. `is integer` accepts booleans, hence the second test.
      - item.cadence is integer and item.cadence is not boolean
      - item.deadline is integer and item.deadline is not boolean
      - item.lease is integer and item.lease is not boolean
      - item.cadence >= 60 and item.cadence <= 3600
      - item.deadline >= 60 and item.deadline <= 3600
      # The lease has to outlast the child plus the room to stop it and deliver
      # its receipt, which is what the client checks when it loads this.
      - item.lease >= item.deadline + 60
    fail_msg: "Binding {{ item.name | default(item) }} is not a usable profile entry."
  loop: "{{ daybook_operations_runtime_bindings }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"

- name: Require distinct binding names and journals
  ansible.builtin.assert:
    that:
      - daybook_operations_runtime_bindings | map(attribute='name') | unique | length
        == daybook_operations_runtime_bindings | length
      - daybook_operations_runtime_bindings | map(attribute='journal') | unique | length
        == daybook_operations_runtime_bindings | length
    fail_msg: Two bindings sharing a name or a journal would interleave their delivery slots.
  when: daybook_operations_runtime_bindings | length > 0

- name: Verify protected interpreter checkout revision
  ansible.builtin.command:
    argv: [/usr/bin/git, -C, "{{ daybook_operations_runtime_install_root }}/daybook", rev-parse, HEAD]
  register: daybook_operations_runtime_installed_revision
  changed_when: false

- name: Require the reviewed Daybook revision already installed
  ansible.builtin.assert:
    that:
      - daybook_operations_runtime_installed_revision.stdout | trim == daybook_operations_runtime_revision
    fail_msg: Install the reviewed protected Daybook revision in the attended maintenance window first.

- name: Verify runtime is importable in the existing FDA interpreter
  ansible.builtin.command:
    argv: ["{{ daybook_operations_runtime_python }}", -I, -c, 'import daybook.operations_runtime']
  become: true
  become_user: "{{ daybook_operations_runtime_user }}"
  become_flags: "-H -S -n -i"
  changed_when: false

- name: Read existing local operations policy
  ansible.builtin.stat:
    path: "{{ daybook_operations_runtime_policy }}"
  register: daybook_operations_runtime_existing_policy

- name: Require disabled staging before an attended transition
  ansible.builtin.assert:
    that:
      - daybook_operations_runtime_action == 'install' or daybook_operations_runtime_existing_policy.stat.exists
    fail_msg: Install the disabled local policy before cutover or rollback.

- name: Inspect existing disabled policy locally
  ansible.builtin.slurp:
    src: "{{ daybook_operations_runtime_policy }}"
  register: daybook_operations_runtime_previous_policy
  when: daybook_operations_runtime_existing_policy.stat.exists
  no_log: true

- name: Map the previous profile's bindings to their journals
  ansible.builtin.set_fact:
    # Schema 1 names its one binding inline; schema 2 lists them. Reading only
    # the schema 1 shape made every guard below undefined against a multi-binding
    # profile -- the role could write one and then not read its own output.
    daybook_operations_runtime_previous_journals: >-
      {{ dict(previous.bindings | map(attribute='name') | zip(previous.bindings | map(attribute='journal')))
         if previous.bindings is defined
         else {previous.binding: previous.journal} }}
    daybook_operations_runtime_previous_enabled: "{{ previous.enabled }}"
    daybook_operations_runtime_previous_api_url: "{{ previous.api_url }}"
  vars:
    previous: "{{ daybook_operations_runtime_previous_policy.content | b64decode | from_json }}"
  when: daybook_operations_runtime_existing_policy.stat.exists
  no_log: true

- name: Preserve profile identity and refuse installing over an enabled runtime
  ansible.builtin.assert:
    that:
      - daybook_operations_runtime_action != 'install' or not daybook_operations_runtime_previous_enabled | bool
      - daybook_operations_runtime_previous_api_url == daybook_operations_runtime_api_url
      # The binding being transitioned must already exist and keep its journal.
      # Moving it would strand whatever delivery is outstanding in the old one.
      - daybook_operations_runtime_binding in daybook_operations_runtime_previous_journals
      - daybook_operations_runtime_previous_journals[daybook_operations_runtime_binding]
        == daybook_operations_runtime_journal
      # Bindings may be added, never silently dropped: one removed here would
      # leave its journal holding an undelivered receipt nobody reads again.
      - daybook_operations_runtime_previous_journals.keys() | difference(
          daybook_operations_runtime_bindings | map(attribute='name') | list
          if daybook_operations_runtime_bindings else [daybook_operations_runtime_binding]) | length == 0
    fail_msg: Preserve the existing profile identity and journal; use attended cutover or rollback for an enabled runtime.
  when: daybook_operations_runtime_existing_policy.stat.exists

- name: Inspect existing runtime status before configuration changes
  ansible.builtin.command:
    # Name the binding explicitly: a multi-binding profile has no single implied
    # one, and `operations status` would stop with `ambiguous_binding` rather
    # than report the state these guards are about to read.
    argv: ["{{ daybook_operations_runtime_python }}", -I, -c, 'from daybook.cli import main; raise SystemExit(main())', operations, status, --policy, "{{ daybook_operations_runtime_policy }}", --binding, "{{ daybook_operations_runtime_binding }}"]
  become: true
  become_user: "{{ daybook_operations_runtime_user }}"
  become_flags: "-H -S -n -i"
  register: daybook_operations_runtime_existing_status
  changed_when: false
  when:
    - daybook_operations_runtime_existing_policy.stat.exists
    - daybook_operations_runtime_action != 'install'

- name: Refuse to overwrite an active installation or bypass unresolved evidence
  ansible.builtin.assert:
    that:
      - not (daybook_operations_runtime_existing_status.stdout | from_json).enabled or daybook_operations_runtime_action == 'rollback'
      - (daybook_operations_runtime_existing_status.stdout | from_json).status in ['idle', 'awaiting', 'blocked']
      - (daybook_operations_runtime_existing_status.stdout | from_json).server.active_state not in ['assigned', 'awaiting_apply']
      - daybook_operations_runtime_action != 'rollback' or not (daybook_operations_runtime_existing_status.stdout | from_json).server.enabled
    fail_msg: Quiesce and reconcile the runtime and server binding before replacing configuration.
  when:
    - daybook_operations_runtime_existing_policy.stat.exists
    - daybook_operations_runtime_action != 'install'

- name: Create an owner-private delivery journal for every binding
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ daybook_operations_runtime_user }}"
    group: staff
    mode: "0700"
  # One per binding, not one for the profile. A worker opens its journal before
  # it does anything else, so a binding whose directory is missing stops at once
  # and reports needing an operator -- which is correct behaviour for a fault,
  # and a silly way to discover that deployment simply never created it.
  loop: "{{ daybook_operations_runtime_bindings | map(attribute='journal') | list
            if daybook_operations_runtime_bindings
            else [daybook_operations_runtime_journal] }}"

- name: Create owner-private credential directory
  ansible.builtin.file:
    path: "{{ daybook_operations_runtime_credential | dirname }}"
    state: directory
    owner: "{{ daybook_operations_runtime_user }}"
    group: staff
    mode: "0700"

- name: Write local API credential
  ansible.builtin.template:
    src: credentials.json.j2
    dest: "{{ daybook_operations_runtime_credential }}"
    owner: "{{ daybook_operations_runtime_user }}"
    group: staff
    mode: "0600"
  no_log: true

- name: Stage candidate outside LaunchAgents
  ansible.builtin.template:
    src: runtime.plist.j2
    dest: "{{ daybook_operations_runtime_staged_plist }}"
    owner: root
    group: wheel
    mode: "0644"

- name: Perform attended regular-label transition
  ansible.builtin.include_tasks: transition.yml
  when: daybook_operations_runtime_action != 'install'

- name: Write disabled-first root-owned local policy
  ansible.builtin.template:
    src: policy.json.j2
    dest: "{{ daybook_operations_runtime_policy }}"
    owner: root
    group: wheel
    mode: "0644"

- name: Optionally enable the reviewed regular label after transition
  ansible.builtin.include_tasks: start.yml
  when:
    - daybook_operations_runtime_start | bool
    - daybook_operations_runtime_action != 'install'
