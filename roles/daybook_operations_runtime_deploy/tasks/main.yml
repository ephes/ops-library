---
- name: Validate protected runtime installation
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Darwin'
      - daybook_operations_runtime_action in ['install', 'replace', 'cutover', 'rollback', 'closeout']
      - daybook_operations_runtime_action == 'install' or daybook_operations_runtime_confirmed | bool
      - not daybook_operations_runtime_start | bool or daybook_operations_runtime_confirmed | bool
      - daybook_operations_runtime_action != 'closeout' or not daybook_operations_runtime_start | bool
      # `replace` writes a disabled profile and starts nothing; the cutover that
      # follows it is what enables and starts, after its own guards.
      - daybook_operations_runtime_action != 'replace' or not daybook_operations_runtime_start | bool
      - daybook_operations_runtime_user != 'CHANGEME'
      - daybook_operations_runtime_revision is match('^[0-9a-f]{40}$')
      - daybook_operations_runtime_binding is match('^[a-z0-9][a-z0-9_-]{0,49}$')
      - daybook_operations_runtime_api_url is match('^https://[a-z0-9.-]+(:[0-9]+)?$')
      - daybook_operations_runtime_token is match('^[A-Za-z0-9._~-]{32,256}$')
      - daybook_operations_runtime_journal is match('^/')
      - "'..' not in daybook_operations_runtime_journal.split('/')"
      # `tick` is gone with the source list: a profile names no source for one
      # wake-up to run, its interval would break the server's 60-second discovery
      # bound, and one long task would hold the only tick. `host` is `serve` run
      # inside the capability host by the keeper.
      - daybook_operations_runtime_mode in ['serve', 'host']
      - daybook_operations_runtime_owner in ['root', 'user']
      - daybook_operations_runtime_mode != 'host' or (
          daybook_operations_runtime_host_socket is match('^[a-z0-9][a-z0-9-]{0,49}$')
          and daybook_operations_runtime_host_session is match('^[a-z0-9][a-z0-9-]{0,49}$')
          and daybook_operations_runtime_host_tmux is match('^/')
          and daybook_operations_runtime_host_tmpdir is match('^/')
          and daybook_operations_runtime_host_lock is match('^/')
          and '..' not in daybook_operations_runtime_host_lock.split('/'))
      - daybook_operations_runtime_code_bundle_src == '' or daybook_operations_runtime_code_bundle_src is match('^/')
      - daybook_operations_runtime_kinds | length > 0
      - daybook_operations_runtime_workers is mapping
      - daybook_operations_runtime_workers.keys() | sort == ['count', 'long']
      - daybook_operations_runtime_workers.count is integer and daybook_operations_runtime_workers.count is not boolean
      - daybook_operations_runtime_workers.long is integer and daybook_operations_runtime_workers.long is not boolean
      - daybook_operations_runtime_workers.count >= 2 and daybook_operations_runtime_workers.count <= 16
      # Long work must always leave a worker it cannot take.
      - daybook_operations_runtime_workers.long >= 1
      - daybook_operations_runtime_workers.long < daybook_operations_runtime_workers.count
  no_log: true

- name: Validate every kind of work in the profile
  ansible.builtin.assert:
    that:
      # Shared configuration that does not parse stops the whole profile at load,
      # so catch a typo here rather than on the machine. No source name, no
      # cadence, no journal: those are the server's, or the store's. `long` and
      # `run` are the kind's own: whether it draws on the long allowance, and its
      # adapter's local settings, which the client checks per adapter when the
      # profile written below is loaded.
      - item.keys() | difference(['adapter', 'deadline', 'lease', 'long', 'run']) | length == 0
      - "'adapter' in item and 'deadline' in item and 'lease' in item"
      - item.long is not defined or item.long is boolean
      - item.run is not defined or item.run is mapping
      - item.adapter in daybook_operations_runtime_adapters
      # Whole numbers, not merely things `| int` would coerce. The profile is
      # emitted verbatim, and the client requires real integers: a quoted "330"
      # or a 330.5 would pass a coercing check here and then stop the whole
      # profile at load. `is integer` accepts booleans, hence the second test.
      - item.deadline is integer and item.deadline is not boolean
      - item.lease is integer and item.lease is not boolean
      - item.deadline >= 60 and item.deadline <= 3600
      # The lease has to outlast the child plus the room to stop it and deliver
      # its receipt, which is what the client checks when it loads this.
      - item.lease >= item.deadline + 60
    fail_msg: "Kind {{ item.adapter | default(item) }} is not a usable profile entry."
  loop: "{{ daybook_operations_runtime_kinds }}"
  loop_control:
    label: "{{ item.adapter | default('unnamed') }}"

- name: Require each kind of work at most once
  ansible.builtin.assert:
    that:
      - daybook_operations_runtime_kinds | map(attribute='adapter') | unique | length
        == daybook_operations_runtime_kinds | length
    fail_msg: A kind of work may be listed once; its budget would otherwise be ambiguous.

- name: Inspect whether the machine was closed out
  ansible.builtin.stat:
    path: "{{ daybook_operations_runtime_closeout_marker }}"
  register: daybook_operations_runtime_closed_out

- name: Refuse a rollback on a machine that was closed out
  ansible.builtin.assert:
    that:
      - daybook_operations_runtime_action != 'rollback' or not daybook_operations_runtime_closed_out.stat.exists
    fail_msg: >-
      This machine was closed out, so there is nothing a rollback may restore. Fix
      the capability host or the supervisor (the keeper restarts it), and disable a
      source on the server if it must stop.

- name: Close the machine out
  ansible.builtin.include_tasks: closeout.yml
  when: daybook_operations_runtime_action == 'closeout'

- name: Stop after closing the machine out
  # Nothing else is touched: the supervisor keeps running under its keeper.
  ansible.builtin.meta: end_role
  when: daybook_operations_runtime_action == 'closeout'

- name: Install the pinned code where no other role does
  # Before the revision is verified below: on a fresh machine there is no
  # checkout yet, and one at another revision is what this replaces.
  ansible.builtin.include_tasks: code.yml
  when: daybook_operations_runtime_code_bundle_src != ''

- name: Verify protected interpreter checkout revision
  ansible.builtin.command:
    argv: [/usr/bin/git, -C, "{{ daybook_operations_runtime_install_root }}/daybook", rev-parse, HEAD]
  register: daybook_operations_runtime_installed_revision
  changed_when: false

- name: Require the reviewed Daybook revision already installed
  ansible.builtin.assert:
    that:
      - daybook_operations_runtime_installed_revision.stdout | trim == daybook_operations_runtime_revision
    fail_msg: Install the reviewed protected Daybook revision in the attended maintenance window first.

- name: Verify runtime is importable in the installed interpreter
  ansible.builtin.command:
    argv: ["{{ daybook_operations_runtime_python }}", -I, -c, 'import daybook.operations_runtime, daybook.operations_keeper']
  become: "{{ daybook_operations_runtime_owner == 'root' }}"
  become_user: "{{ daybook_operations_runtime_user }}"
  become_flags: "-H -S -n -i"
  changed_when: false

- name: Read existing local operations policy
  ansible.builtin.stat:
    path: "{{ daybook_operations_runtime_policy }}"
  register: daybook_operations_runtime_existing_policy

- name: Require disabled staging before an attended transition
  ansible.builtin.assert:
    that:
      - daybook_operations_runtime_action == 'install' or daybook_operations_runtime_existing_policy.stat.exists
    fail_msg: Install the disabled local policy before cutover or rollback.

- name: Inspect existing disabled policy locally
  ansible.builtin.slurp:
    src: "{{ daybook_operations_runtime_policy }}"
  register: daybook_operations_runtime_previous_policy
  when: daybook_operations_runtime_existing_policy.stat.exists
  no_log: true

- name: Read the previous profile's shape
  ansible.builtin.set_fact:
    # Schemas 1 and 2 kept a journal per source; schema 3 keeps one store for the
    # machine. Both are read, because moving from the first to the second is
    # exactly the transition that has to prove the old journals drained.
    daybook_operations_runtime_previous_schema: "{{ previous.schema }}"
    # The kinds of work the old profile could run. Schema 4 lists them; schemas 2
    # and 3 imply them through their sources' adapters, and schema 1 ran only the
    # regular ingest. Leaving the older ones empty would let a replace drop a kind
    # without the guard below ever seeing it.
    daybook_operations_runtime_previous_kinds: >-
      {{ previous.kinds | map(attribute='adapter') | list if previous.kinds is defined
         else (previous.bindings | map(attribute='adapter') | unique | list
               if previous.bindings is defined else ['voice_memos.ingest.v1']) }}
    daybook_operations_runtime_previous_journals: >-
      {{ [previous.journal] if previous.schema >= 3
         else (previous.bindings | map(attribute='journal') | list
               if previous.bindings is defined else [previous.journal]) }}
    daybook_operations_runtime_previous_enabled: "{{ previous.enabled }}"
    daybook_operations_runtime_previous_api_url: "{{ previous.api_url }}"
  vars:
    previous: "{{ daybook_operations_runtime_previous_policy.content | b64decode | from_json }}"
  when: daybook_operations_runtime_existing_policy.stat.exists
  no_log: true

- name: Preserve profile identity and refuse installing over an enabled runtime
  ansible.builtin.assert:
    that:
      # Only shapes this role knows how to prove drained. A schema written by some
      # later release may keep obligations somewhere these checks do not look, so
      # it is refused rather than assumed to look like the newest one known here.
      - daybook_operations_runtime_previous_schema | int in [1, 2, 3, 4, 5]
      - daybook_operations_runtime_action != 'install' or not daybook_operations_runtime_previous_enabled | bool
      - daybook_operations_runtime_previous_api_url == daybook_operations_runtime_api_url
      # Kinds of work may be added, never silently dropped: a delivery record for
      # a dropped kind has no budget left to finish it with.
      - daybook_operations_runtime_previous_kinds | difference(
          daybook_operations_runtime_kinds | map(attribute='adapter') | list) | length == 0
      # Once there is one store, it must not move, or outstanding records would
      # be stranded in the old one.
      - daybook_operations_runtime_previous_schema | int < 3
        or daybook_operations_runtime_previous_journals[0] == daybook_operations_runtime_journal
      # Only `replace` may change the store's shape: it is the one action that
      # proves the label quiesced and every old journal or store drained. `install`
      # over a disabled old profile would skip the label check, and
      # `cutover`/`rollback` act on the profile as installed. Schema 4 to 5 keeps
      # the store -- only where the importer policy is written moves -- and the
      # client reads both, so it needs no replace.
      - daybook_operations_runtime_previous_schema | int in [4, 5]
        or daybook_operations_runtime_action == 'replace'
    fail_msg: Preserve the existing profile identity and store; drain and replace to change the store's shape.
  when: daybook_operations_runtime_existing_policy.stat.exists

- name: Resolve local GUI user ID for a replace
  ansible.builtin.command:
    argv: [/usr/bin/id, -u, "{{ daybook_operations_runtime_user }}"]
  register: daybook_operations_runtime_uid_for_replace
  changed_when: false
  when: daybook_operations_runtime_action == 'replace'

- name: Require the regular label already quiesced before a replace
  ansible.builtin.command:
    argv: [/bin/launchctl, print, "gui/{{ daybook_operations_runtime_uid_for_replace.stdout | trim }}/{{ daybook_operations_runtime_label }}"]
  register: daybook_operations_runtime_replace_label
  changed_when: false
  # `replace` does not stop anything itself. The supervisor runs under KeepAlive,
  # and stopping it here would mean sending a signal while a child may be mid-scan;
  # the attended importer upgrade is what quiesces the label, and this proves it did.
  failed_when: daybook_operations_runtime_replace_label.rc != 113
  when: daybook_operations_runtime_action == 'replace'
  no_log: true

- name: Inspect every journal being left behind
  ansible.builtin.stat:
    path: "{{ item }}"
  # For a store its two subdirectories too: a `find` over a directory
  # that is not there matches nothing, which would read as "owes nothing".
  loop: >-
    {{ daybook_operations_runtime_previous_journals
       if daybook_operations_runtime_previous_schema | int < 3
       else [daybook_operations_runtime_previous_journals[0],
             daybook_operations_runtime_previous_journals[0] ~ '/deliveries',
             daybook_operations_runtime_previous_journals[0] ~ '/halts'] }}
  register: daybook_operations_runtime_old_dirs
  when: daybook_operations_runtime_action == 'replace'

- name: Require every journal being left behind to exist
  ansible.builtin.assert:
    that:
      # A proof over files that are not there proves nothing. A journal the
      # profile names but the disk does not have has been lost or removed, and
      # either way nobody can say what it owed.
      - item.stat.exists and item.stat.isdir
    fail_msg: "{{ item.item }} is named by the installed profile but missing; its deliveries cannot be proven drained."
  loop: "{{ daybook_operations_runtime_old_dirs.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('none') }}"
  when: daybook_operations_runtime_action == 'replace'

- name: Inspect the evidence files of each per-source journal
  ansible.builtin.stat:
    path: "{{ item.0 }}/{{ item.1 }}"
  loop: "{{ daybook_operations_runtime_previous_journals | product(['delivery.json', 'runtime.lock', 'halted.json']) | list }}"
  loop_control:
    label: "{{ item.0 | basename }}/{{ item.1 }}"
  register: daybook_operations_runtime_old_files
  when:
    - daybook_operations_runtime_action == 'replace'
    - daybook_operations_runtime_previous_schema | int < 3

- name: Read each per-source delivery slot being left behind
  ansible.builtin.slurp:
    src: "{{ item.stat.path }}"
  loop: "{{ daybook_operations_runtime_old_files.results | default([])
            | selectattr('item.1', 'equalto', 'delivery.json')
            | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item.0 | default('none') | basename }}"
  register: daybook_operations_runtime_old_slots
  no_log: true
  when:
    - daybook_operations_runtime_action == 'replace'
    - daybook_operations_runtime_previous_schema | int < 3

- name: Start the idle evidence from nothing
  ansible.builtin.set_fact:
    # A fact persists for the host across plays and earlier role runs. Without a
    # reset, a journal found idle by some previous invocation would still count as
    # proven idle here, whatever its slot says now.
    daybook_operations_runtime_idle_journals: []
  when:
    - daybook_operations_runtime_action == 'replace'
    - daybook_operations_runtime_previous_schema | int < 3

- name: Collect the per-source journals whose slot reads exactly idle
  ansible.builtin.set_fact:
    daybook_operations_runtime_idle_journals: >-
      {{ daybook_operations_runtime_idle_journals
         + ([item.item.item.0] if (item.content | b64decode | from_json).phase == 'idle' else []) }}
  loop: "{{ daybook_operations_runtime_old_slots.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.0 | default('none') | basename }}"
  no_log: true
  when:
    - daybook_operations_runtime_action == 'replace'
    - daybook_operations_runtime_previous_schema | int < 3

- name: Prove every per-source journal being left behind is drained
  ansible.builtin.assert:
    that:
      # A halt marker is a person's attention request; carrying on past one into
      # a new store would lose it. It has to be recovered first.
      - not halted.stat.exists
      # A slot that exists must read exactly `idle`, whatever else is there --
      # anything else is a delivery still owed. Only a journal with neither slot
      # nor lock counts as never opened. A lock without a slot is a used journal
      # whose evidence is gone, and is refused; a lock is never what makes a slot
      # acceptable, since a missing lock would then hide an outstanding delivery.
      - (slot.stat.exists and item in daybook_operations_runtime_idle_journals)
        or (not slot.stat.exists and not lock.stat.exists)
    fail_msg: >-
      {{ item }} is not drained. Tick that source to idle with the runtime still
      on its current profile, or recover it, before changing the store's shape.
      Never delete its files to get past this.
  vars:
    files: "{{ daybook_operations_runtime_old_files.results | selectattr('item.0', 'equalto', item) | list }}"
    halted: "{{ files | selectattr('item.1', 'equalto', 'halted.json') | first }}"
    lock: "{{ files | selectattr('item.1', 'equalto', 'runtime.lock') | first }}"
    slot: "{{ files | selectattr('item.1', 'equalto', 'delivery.json') | first }}"
  loop: "{{ daybook_operations_runtime_previous_journals }}"
  when:
    - daybook_operations_runtime_action == 'replace'
    - daybook_operations_runtime_previous_schema | int < 3

- name: Find anything still owed in a store being replaced
  ansible.builtin.find:
    paths:
      - "{{ daybook_operations_runtime_previous_journals[0] }}/deliveries"
      - "{{ daybook_operations_runtime_previous_journals[0] }}/halts"
    patterns: ['*.json']
    # Every entry the client could read as a record or a stop: symlinked and
    # dot-named ones too.
    file_type: any
    hidden: true
  register: daybook_operations_runtime_old_store
  when:
    - daybook_operations_runtime_action == 'replace'
    - daybook_operations_runtime_previous_schema | int >= 3

- name: Prove a store being replaced owes nothing
  ansible.builtin.assert:
    that:
      # In a store there is no idle record: any record is owed, and any halt --
      # including the store-wide one for an unreadable record -- is a person's
      # attention request.
      - daybook_operations_runtime_old_store.matched == 0
      # A path find could not read proves nothing about what is in it.
      - daybook_operations_runtime_old_store.skipped_paths | default({}) | length == 0
    fail_msg: >-
      {{ daybook_operations_runtime_previous_journals[0] }} still holds deliveries or
      halts. Settle or recover them before replacing the profile.
  when:
    - daybook_operations_runtime_action == 'replace'
    - daybook_operations_runtime_previous_schema | int >= 3

- name: Inspect existing runtime status before configuration changes
  ansible.builtin.command:
    # Name the binding explicitly: a multi-source profile has no single implied
    # one, and `operations status` would stop with `ambiguous_binding` rather
    # than report the state these guards are about to read. Only a schema 3
    # profile can be asked at all -- the installed client reads no other -- which
    # is why changing the store's shape goes through `replace` instead.
    argv: ["{{ daybook_operations_runtime_python }}", -I, -c, 'from daybook.cli import main; raise SystemExit(main())', operations, status, --policy, "{{ daybook_operations_runtime_policy }}", --policy-owner, "{{ daybook_operations_runtime_owner }}", --binding, "{{ daybook_operations_runtime_binding }}"]
  become: "{{ daybook_operations_runtime_owner == 'root' }}"
  become_user: "{{ daybook_operations_runtime_user }}"
  become_flags: "-H -S -n -i"
  register: daybook_operations_runtime_existing_status
  changed_when: false
  when:
    - daybook_operations_runtime_existing_policy.stat.exists
    - daybook_operations_runtime_action in ['cutover', 'rollback']

- name: Refuse to overwrite an active installation or bypass unresolved evidence
  ansible.builtin.assert:
    that:
      - not (daybook_operations_runtime_existing_status.stdout | from_json).enabled or daybook_operations_runtime_action == 'rollback'
      # `idle` means this source owes nothing. `awaiting` and `blocked` are the
      # phases a transition may carry across: the receipt reached the server, and
      # the record stays in the same store to be settled afterwards.
      - (daybook_operations_runtime_existing_status.stdout | from_json).status in ['idle', 'awaiting', 'blocked']
      - (daybook_operations_runtime_existing_status.stdout | from_json).server.active_state not in ['assigned', 'awaiting_apply']
      - daybook_operations_runtime_action != 'rollback' or not (daybook_operations_runtime_existing_status.stdout | from_json).server.enabled
    fail_msg: Quiesce and reconcile the runtime and server binding before replacing configuration.
  when:
    - daybook_operations_runtime_existing_policy.stat.exists
    - daybook_operations_runtime_action in ['cutover', 'rollback']

- name: Create the owner-private delivery store
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ daybook_operations_runtime_user }}"
    group: staff
    mode: "0700"
  # One store for the machine: the root, the delivery records keyed by operation,
  # and the per-source halt markers. The client refuses to open a store whose
  # parts are missing or loose, so deployment creates all three.
  loop:
    - "{{ daybook_operations_runtime_journal }}"
    - "{{ daybook_operations_runtime_journal }}/deliveries"
    - "{{ daybook_operations_runtime_journal }}/halts"

- name: Create owner-private credential directory
  ansible.builtin.file:
    path: "{{ daybook_operations_runtime_credential | dirname }}"
    state: directory
    owner: "{{ daybook_operations_runtime_user }}"
    group: staff
    mode: "0700"

- name: Write local API credential
  ansible.builtin.template:
    src: credentials.json.j2
    dest: "{{ daybook_operations_runtime_credential }}"
    owner: "{{ daybook_operations_runtime_user }}"
    group: staff
    mode: "0600"
  no_log: true

- name: Stage candidate outside LaunchAgents
  ansible.builtin.template:
    src: runtime.plist.j2
    dest: "{{ daybook_operations_runtime_staged_plist }}"
    owner: "{{ daybook_operations_runtime_file_owner }}"
    group: "{{ daybook_operations_runtime_file_group }}"
    mode: "0644"

- name: Perform attended supervisor-label transition
  ansible.builtin.include_tasks: transition.yml
  # `replace` needs none: it proved the label already quiesced and every old
  # journal drained, and it writes the new profile disabled for a cutover to act on.
  when: daybook_operations_runtime_action in ['cutover', 'rollback']

- name: Write disabled-first local policy
  ansible.builtin.template:
    src: policy.json.j2
    dest: "{{ daybook_operations_runtime_policy }}"
    owner: "{{ daybook_operations_runtime_file_owner }}"
    group: "{{ daybook_operations_runtime_file_group }}"
    mode: "0644"

- name: Prove the written profile loads in the installed client
  ansible.builtin.command:
    # Every rule the client applies -- each adapter's settings, whether a
    # publishing kind said if it is long, the importer policy's budget, the
    # profile's owner -- is caught here, at deployment, instead of on the machine
    # when the supervisor starts.
    argv: ["{{ daybook_operations_runtime_python }}", -I, -c, "import sys; from daybook.operations_runtime import Config; Config.load(sys.argv[1], sys.argv[2])", "{{ daybook_operations_runtime_policy }}", "{{ daybook_operations_runtime_owner }}"]
  become: "{{ daybook_operations_runtime_owner == 'root' }}"
  become_user: "{{ daybook_operations_runtime_user }}"
  become_flags: "-H -S -n -i"
  changed_when: false

- name: Optionally enable the reviewed regular label after transition
  ansible.builtin.include_tasks: start.yml
  when:
    - daybook_operations_runtime_start | bool
    - daybook_operations_runtime_action in ['cutover', 'rollback']
