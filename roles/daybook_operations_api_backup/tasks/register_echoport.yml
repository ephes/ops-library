---
- name: register_echoport | Validate fixed operations backup registration
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - ansible_facts.system == 'Linux'
      - daybook_operations_api_backup_runner == '/usr/local/libexec/daybook-operations-backup'
      - daybook_operations_api_backup_policy == '/etc/daybook-operations-backup.json'
      - daybook_operations_api_backup_target is match('^[a-z][a-z0-9_-]+$')
      - daybook_operations_api_backup_bucket is match('^[a-z][a-z0-9-]+$')
      - daybook_operations_api_backup_alias is match('^[a-z][a-z0-9-]+$')
      - daybook_operations_api_backup_retention_days | int >= 1
    fail_msg: Registration requires live execution on Linux with the fixed backup policy; check mode is not supported.

- name: register_echoport | Validate the FastDeploy service token settings
  ansible.builtin.assert:
    that:
      - daybook_operations_api_backup_token_user | string | length > 0
      - daybook_operations_api_backup_token_origin | string | length > 0
      - daybook_operations_api_backup_token_days | int >= 1
      - daybook_operations_api_backup_token_days | int <= 90
      - daybook_operations_api_backup_token_renewal_days | int >= 1
      - daybook_operations_api_backup_token_renewal_days | int < daybook_operations_api_backup_token_days | int
    fail_msg: >-
      Set daybook_operations_api_backup_token_user to an existing FastDeploy user
      (the token is issued for it) and keep
      daybook_operations_api_backup_token_renewal_days below
      daybook_operations_api_backup_token_days, which may not exceed 90 days
      (FastDeploy also refuses lifetimes over SERVICE_TOKEN_MAX_EXPIRE_DAYS).

- name: register_echoport | Create root-controlled runner and upload directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: /usr/local/libexec, mode: '0755'}
    - {path: '{{ daybook_operations_api_backup_staging }}', mode: '0700'}
    - {path: '{{ daybook_operations_api_backup_fastdeploy_root }}/services/{{ daybook_operations_api_backup_fastdeploy_service }}', mode: '0755'}

- name: register_echoport | Install fixed-source backup bridge outside service-writable directories
  ansible.builtin.copy:
    src: echoport_runner.py
    dest: "{{ daybook_operations_api_backup_runner }}"
    owner: root
    group: root
    mode: '0755'

- name: register_echoport | Write root-owned backup bridge policy
  ansible.builtin.copy:
    dest: "{{ daybook_operations_api_backup_policy }}"
    owner: root
    group: root
    mode: '0600'
    content: "{{ {'user': daybook_operations_api_backup_user, 'python': daybook_operations_api_backup_python, 'lifecycle': daybook_operations_api_backup_script, 'config': daybook_operations_api_backup_config, 'backup_root': daybook_operations_api_backup_root, 'staging_root': daybook_operations_api_backup_staging, 'mc': daybook_operations_api_backup_mc, 'alias': daybook_operations_api_backup_alias, 'bucket': daybook_operations_api_backup_bucket, 'target': daybook_operations_api_backup_target, 'lock': daybook_operations_api_backup_staging + '/bridge.lock'} | to_nice_json }}"

- name: register_echoport | Define the shared FastDeploy service payload
  ansible.builtin.set_fact:
    daybook_operations_api_backup_service_payload: "{{ {'name': daybook_operations_api_backup_fastdeploy_service, 'description': 'Daybook operations backup; attended restore only', 'deploy_script': daybook_operations_api_backup_runner, 'steps': [{'name': 'backup'}, {'name': 'upload'}, {'name': 'verify'}, {'name': 'result'}]} }}"

- name: register_echoport | Install FastDeploy bridge configuration
  ansible.builtin.copy:
    dest: "{{ daybook_operations_api_backup_fastdeploy_root }}/services/{{ daybook_operations_api_backup_fastdeploy_service }}/config.json"
    owner: root
    group: root
    mode: '0644'
    content: "{{ daybook_operations_api_backup_service_payload | to_nice_json }}"

- name: register_echoport | Permit only the root-owned backup bridge through the established runner chain
  ansible.builtin.copy:
    dest: /etc/sudoers.d/daybook_operations_backup
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
    content: |  # pragma: allowlist secret (sudoers rule, no credential)
      fastdeploy ALL=(deploy) NOPASSWD:NOSETENV: {{ daybook_operations_api_backup_runner }} --config *
      deploy ALL=(root) NOPASSWD:NOSETENV: {{ daybook_operations_api_backup_runner }} --config *

- name: register_echoport | Register this FastDeploy service without syncing unrelated services
  community.postgresql.postgresql_query:
    login_db: fastdeploy
    query: >-
      INSERT INTO service (name, data) VALUES (%(name)s, %(data)s::json)
      ON CONFLICT (name) DO UPDATE SET data = EXCLUDED.data
      WHERE service.data::jsonb IS DISTINCT FROM EXCLUDED.data::jsonb
      RETURNING name
    named_args:
      name: "{{ daybook_operations_api_backup_fastdeploy_service }}"
      data: "{{ daybook_operations_api_backup_service_payload | to_json }}"
  become: true
  become_user: postgres
  register: daybook_operations_api_backup_service_row
  changed_when: daybook_operations_api_backup_service_row.rowcount > 0

- name: register_echoport | Inspect the FastDeploy token stored in Echoport
  ansible.builtin.command:
    argv: ['{{ daybook_operations_api_backup_echoport_root }}/.venv/bin/python', '{{ daybook_operations_api_backup_echoport_root }}/manage.py', shell]
    chdir: '{{ daybook_operations_api_backup_echoport_root }}'
    stdin: "{{ lookup('ansible.builtin.file', 'service_token_status.py') }}"
  environment:
    SERVICE_TOKEN_STATUS_TARGETS: "{{ [daybook_operations_api_backup_target] | to_json }}"
    SERVICE_TOKEN_STATUS_SERVICE: "{{ daybook_operations_api_backup_fastdeploy_service }}"
    SERVICE_TOKEN_STATUS_RENEWAL_DAYS: "{{ daybook_operations_api_backup_token_renewal_days | int }}"
  become: true
  become_user: echoport
  register: daybook_operations_api_backup_token_inspection
  changed_when: false

- name: register_echoport | Decide whether a new FastDeploy token is needed
  ansible.builtin.set_fact:
    daybook_operations_api_backup_token_status: "{{ daybook_operations_api_backup_token_inspection.stdout_lines | last | from_json }}"

- name: register_echoport | Issue a revocable token scoped to the backup bridge
  ansible.builtin.command:
    argv:
      - '{{ daybook_operations_api_backup_fastdeploy_root }}/.venv/bin/python'
      - commands.py
      - issueservicetoken
      - --service
      - '{{ daybook_operations_api_backup_fastdeploy_service }}'
      - --user
      - '{{ daybook_operations_api_backup_token_user }}'
      - --days
      - '{{ daybook_operations_api_backup_token_days | int }}'
      - --origin
      - '{{ daybook_operations_api_backup_token_origin }}'
    chdir: '{{ daybook_operations_api_backup_fastdeploy_root }}'
  become: true
  become_user: fastdeploy
  register: daybook_operations_api_backup_service_token
  when: >-
    daybook_operations_api_backup_rotate_service_token | bool
    or daybook_operations_api_backup_token_status.requires_rotation | bool
  changed_when: true
  no_log: true

- name: register_echoport | Check the issued token without showing it
  ansible.builtin.set_fact:
    daybook_operations_api_backup_token_issued: "{{ daybook_operations_api_backup_service_token is not skipped }}"
    daybook_operations_api_backup_token_format_valid: >-
      {{
        daybook_operations_api_backup_service_token is skipped
        or (
          daybook_operations_api_backup_service_token.stdout_lines | length == 1
          and (daybook_operations_api_backup_service_token.stdout_lines | last)
          is match('^[A-Za-z0-9_-]+[.][A-Za-z0-9_-]+[.][A-Za-z0-9_-]+$')
        )
      }}
  no_log: true

- name: register_echoport | Require exactly one JWT from issueservicetoken
  ansible.builtin.assert:
    that:
      - daybook_operations_api_backup_token_format_valid | bool
    fail_msg: issueservicetoken did not print exactly one JWT-formatted line. The token value remains hidden.

- name: register_echoport | Report the token decision (never the token)
  ansible.builtin.debug:
    msg: >-
      FastDeploy token for {{ daybook_operations_api_backup_fastdeploy_service }}:
      {{ 'issued a new token' if daybook_operations_api_backup_token_issued | bool else 'reused the stored token' }}
      (stored token: {{ daybook_operations_api_backup_token_status.reason }}).
      {{ ('Replaced token id ' ~ daybook_operations_api_backup_token_status.previous_jti
          ~ ' stays valid until it expires; revoke it with commands.py revokeservicetoken once Echoport uses the new token.')
         if daybook_operations_api_backup_token_issued | bool and daybook_operations_api_backup_token_status.previous_jti
         else '' }}

- name: register_echoport | Register the backup schedule and retention in Echoport
  ansible.builtin.command:
    argv: ['{{ daybook_operations_api_backup_echoport_root }}/.venv/bin/python', '{{ daybook_operations_api_backup_echoport_root }}/manage.py', shell]
    chdir: '{{ daybook_operations_api_backup_echoport_root }}'
    stdin: |
      import json
      from backups.models import BackupTarget
      from django.db import transaction
      with transaction.atomic():
          target, created = BackupTarget.objects.get_or_create(name={{ daybook_operations_api_backup_target | to_json }}, defaults={'fastdeploy_service': {{ daybook_operations_api_backup_fastdeploy_service | to_json }}, 'target_mode': 'service_owned'})
          target.fastdeploy_service = {{ daybook_operations_api_backup_fastdeploy_service | to_json }}
          issued_token = {{ ((daybook_operations_api_backup_service_token.stdout | default('') | trim) if daybook_operations_api_backup_token_issued | bool else '') | to_json }}
          if issued_token:
              target.service_token = issued_token
          elif not target.service_token:
              raise RuntimeError('no FastDeploy service token to store')
          target.target_mode = 'service_owned'
          target.service_name = 'daybook-operations'
          target.description = 'Database and replay keyring; restore only through attended operations lifecycle'
          target.db_path = ''
          target.backup_files = []
          target.storage_bucket = {{ daybook_operations_api_backup_bucket | to_json }}
          if created or {{ daybook_operations_api_backup_update_schedule | bool }}:
              target.schedule = {{ daybook_operations_api_backup_schedule | to_json }}
              target.schedule_required = bool(target.schedule)
          target.retention_days = {{ daybook_operations_api_backup_retention_days | int }}
          target.timeout_seconds = 1800
          if created:
              target.status = 'active'
          target.full_clean()
          target.save()
      print(json.dumps({'schedule': target.schedule, 'status': target.status}))
  become: true
  become_user: echoport
  register: daybook_operations_api_backup_target_result
  changed_when: true
  no_log: true

- name: register_echoport | Expose the preserved schedule for monitoring
  ansible.builtin.set_fact:
    daybook_operations_api_backup_registered_schedule: "{{ (daybook_operations_api_backup_target_result.stdout_lines[-1] | from_json).schedule }}"
