---
- name: Verify PostfixAdmin backup
  hosts: all
  become: true

  pre_tasks:
    - name: Ensure Ansible remote tmp exists
      ansible.builtin.file:
        path: /tmp/.ansible/tmp
        state: directory
        mode: "0700"

  vars:
    postfixadmin_backup_path: "/tmp/postfixadmin-backups"

  tasks:
    - name: Find backup directories
      ansible.builtin.find:
        paths: "{{ postfixadmin_backup_path }}"
        file_type: directory
      register: backup_dirs

    - name: Assert backup directory was created
      ansible.builtin.assert:
        that:
          - backup_dirs.matched > 0
        fail_msg: "No backup directory found in {{ postfixadmin_backup_path }}"

    - name: Get latest backup directory
      ansible.builtin.set_fact:
        latest_backup: "{{ (backup_dirs.files | sort(attribute='mtime'))[-1].path }}"

    - name: Verify manifest exists
      ansible.builtin.stat:
        path: "{{ latest_backup }}/manifest.yml"
      register: manifest_stat

    - name: Assert manifest exists
      ansible.builtin.assert:
        that:
          - manifest_stat.stat.exists
        fail_msg: "Backup manifest missing"

    - name: Verify config backup exists
      ansible.builtin.stat:
        path: "{{ latest_backup }}/config.local.php"
      register: config_backup_stat

    - name: Assert config backup exists
      ansible.builtin.assert:
        that:
          - config_backup_stat.stat.exists
        fail_msg: "Config backup missing"

    - name: Verify admin table backup exists
      ansible.builtin.stat:
        path: "{{ latest_backup }}/admin.json"
      register: admin_backup_stat

    - name: Assert admin backup exists
      ansible.builtin.assert:
        that:
          - admin_backup_stat.stat.exists
        fail_msg: "Admin table backup missing"

    - name: Read admin backup content
      ansible.builtin.slurp:
        src: "{{ latest_backup }}/admin.json"
      register: admin_content

    - name: Parse admin backup
      ansible.builtin.set_fact:
        admin_data: "{{ admin_content.content | b64decode | from_json }}"

    - name: Assert admin backup has data
      ansible.builtin.assert:
        that:
          - admin_data | length > 0
        fail_msg: "Admin backup is empty"

    - name: Read manifest content
      ansible.builtin.slurp:
        src: "{{ latest_backup }}/manifest.yml"
      register: manifest_content

    - name: Parse manifest
      ansible.builtin.set_fact:
        manifest: "{{ manifest_content.content | b64decode | from_yaml }}"

    - name: Assert manifest lists exactly the written parts
      ansible.builtin.assert:
        that:
          - manifest.backup_type == 'postfixadmin'
          - manifest.manifest_version | int == 2
          - manifest.contents | sort == ['admin.json', 'config.local.php', 'domain_admins.json', 'log.json']
          - manifest.postfixadmin_version | length > 0
          - manifest.db_schema_version | int > 0
        fail_msg: "Unexpected manifest: {{ manifest }}"

    - name: Assert every listed part exists
      ansible.builtin.stat:
        path: "{{ latest_backup }}/{{ item }}"
      loop: "{{ manifest.contents }}"
      register: listed_parts
      failed_when: not listed_parts.stat.exists

    # Fail-closed: a run with a missing required part publishes nothing and
    # leaves no .tmp directory behind.
    - name: Run a backup with a missing config.local.php
      block:
        - name: Back up from a broken install path
          ansible.builtin.include_role:
            name: postfixadmin_backup
          vars:
            postfixadmin_db_password: "molecule-test-password"
            postfixadmin_install_path: /nonexistent/postfixadmin

        - name: Record unexpected success
          ansible.builtin.set_fact:
            broken_backup_failed: false
      rescue:
        - name: Record expected failure
          ansible.builtin.set_fact:
            broken_backup_failed: true

    - name: Find backup directories after the failed run
      ansible.builtin.find:
        paths: "{{ postfixadmin_backup_path }}"
        file_type: directory
      register: dirs_after_failure

    - name: Assert the failed run published nothing
      ansible.builtin.assert:
        that:
          - broken_backup_failed
          - dirs_after_failure.matched == backup_dirs.matched
          - dirs_after_failure.files | map(attribute='path') | select('search', '\\.tmp$') | list | length == 0
        fail_msg: "A failed backup left a directory behind: {{ dirs_after_failure.files | map(attribute='path') | list }}"

    # Retention: old completed backups beyond keep_min are pruned after a
    # successful run; the newest keep_min and any .tmp directory are kept.
    - name: Create expired fake backups
      ansible.builtin.file:
        path: "{{ postfixadmin_backup_path }}/{{ item }}"
        state: directory
        mode: "0700"
        modification_time: "202001010000.00"
        access_time: "202001010000.00"
      loop:
        - 20200101T000001
        - 20200101T000002
        - 20200101T000003
        - 20200101T000004
        - 20200101T000005
        - 20200101T000006
        - 20200101T000007
        - 20200101T000008.tmp

    - name: Wait so the next backup gets a new timestamp
      ansible.builtin.pause:
        seconds: 1

    - name: Refresh the timestamp fact
      ansible.builtin.setup:
        gather_subset: [min]

    - name: Run a successful backup
      ansible.builtin.include_role:
        name: postfixadmin_backup
      vars:
        postfixadmin_db_password: "molecule-test-password"

    - name: Find backups after retention
      ansible.builtin.find:
        paths: "{{ postfixadmin_backup_path }}"
        file_type: directory
      register: dirs_after_retention

    - name: Assert retention kept the newest five completed backups
      ansible.builtin.assert:
        that:
          - _names | select('match', '^[0-9]{8}T[0-9]{6}$') | list | length == 5
          - "'20200101T000007' in _names"
          - "'20200101T000005' in _names"
          - "'20200101T000004' not in _names"
          - "'20200101T000001' not in _names"
          - "'20200101T000008.tmp' in _names"
          - (latest_backup | basename) in _names
        fail_msg: "Unexpected backups after retention: {{ _names }}"
      vars:
        _names: "{{ dirs_after_retention.files | map(attribute='path') | map('basename') | sort | list }}"

    - name: Display verification summary
      ansible.builtin.debug:
        msg: |
          PostfixAdmin backup verification completed successfully:
          - Backup directory: {{ latest_backup }}
          - Manifest: OK ({{ manifest.contents | join(', ') }}, schema {{ manifest.db_schema_version }})
          - Admin table backup: OK ({{ admin_data | length }} entries)
          - Failed run published nothing: OK
          - Retention kept the newest five: OK
