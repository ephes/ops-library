---
# Pre-commit hooks for ops-library
# Install with: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        files: &legacy_text_files "^(.*\\.(yml|yaml|py|sh|bash|j2|md)|Justfile|Makefile)$"
      - id: end-of-file-fixer
        files: *legacy_text_files
      - id: check-yaml
        files: *legacy_text_files
        args: [--unsafe]  # Allow custom tags like !vault
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
        files: *legacy_text_files
      - id: check-merge-conflict
        files: *legacy_text_files
      - id: check-executables-have-shebangs
        files: *legacy_text_files
      - id: check-shebang-scripts-are-executable
        files: *legacy_text_files
      - id: detect-private-key
      - id: mixed-line-ending
        files: *legacy_text_files
        args: [--fix=lf]

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint]
        types: [yaml]

  # Use the same locked Ansible toolchain as the contributor test suite.
  - repo: local
    hooks:
      - id: ansible-lint
        name: Ansible-lint
        entry: uv run ansible-lint
        language: system
        files: \.(yaml|yml)$
        exclude: '(^|/)(\.github|molecule)/'

  # Python code formatting (for deploy.py scripts)
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3
        files: \.py$

  # Python linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: \.py$

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        files: \.(sh|bash)$
        args: [--severity=warning]

  # Jinja2 template linting
  - repo: local
    hooks:
      - id: jinja-syntax
        name: Check Jinja template syntax
        entry: uv run python scripts/check_jinja.py
        language: system
        files: \.j2$

  # Security checks
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: [--exclude-secrets, "^CHANGE_ME$"]

  # Markdown linting (for documentation)
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: [--fix]
        files: \.md$

# Don't run on these paths
exclude: |
  (?x)^(
    .venv/.*|
    venv/.*|
    __pycache__/.*|
    \.git/.*|
    \.pytest_cache/.*
  )$
