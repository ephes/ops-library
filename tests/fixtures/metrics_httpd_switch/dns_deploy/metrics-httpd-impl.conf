# Managed by ops-library metrics_httpd_switch: selects the Rust metrics-httpd.
# Remove this file (daemon-reload, restart) to fall back to Python.
[Service]
ExecStart=
ExecStart=/opt/metrics-httpd/0.1.0/metrics-httpd json-file --bind 100.64.0.10 --port 9112 --path /.well-known/ddns --json-path /var/lib/ddns/status.json --htpasswd-file /etc/ddns-status-endpoint/htpasswd --realm ddns-status --server-name ddns-status-httpd/0.1 --missing-message "Status file not found - updater may not have run yet" --request-timeout 10
