# Managed by ops-library metrics_httpd_switch: selects the Rust metrics-httpd.
# Remove this file (daemon-reload, restart) to fall back to Python.
[Service]
ExecStart=
ExecStart=/opt/metrics-httpd/0.1.0/metrics-httpd json-file --bind 100.64.0.10 --port 9107 --path /.well-known/tailscale --json-path /var/lib/tailscale-metrics/tailscale.json --htpasswd-file /etc/tailscale-metrics-endpoint/htpasswd --realm tailscale-metrics --server-name tailscale-metrics-httpd/0.1 --path-match path-only
