# Managed by ops-library metrics_httpd_switch: selects the Rust metrics-httpd.
# Remove this file (daemon-reload, restart) to fall back to Python.
[Service]
ExecStart=
ExecStart=/opt/metrics-httpd/0.1.0/metrics-httpd json-file --bind 100.64.0.10 --port 9104 --path /.well-known/thermal --json-path /var/lib/thermal-metrics/thermal.json --htpasswd-file /etc/thermal-metrics-endpoint/htpasswd --realm thermal-metrics --server-name thermal-metrics-httpd/0.1
