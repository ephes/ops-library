# Managed by ops-library metrics_httpd_switch: selects the Rust metrics-httpd.
# Remove this file (daemon-reload, restart) to fall back to Python.
[Service]
ExecStart=
ExecStart=/opt/metrics-httpd/0.1.0/metrics-httpd json-file --bind 100.64.0.10 --port 9101 --path /.well-known/storage --json-path /var/lib/storage-metrics/storage.json --htpasswd-file /etc/storage-metrics-endpoint/htpasswd --realm storage-metrics --server-name storage-metrics-httpd/0.1
