# Managed by ops-library metrics_httpd_switch: selects the Rust metrics-httpd.
# Remove this file (daemon-reload, restart) to fall back to Python.
[Service]
ExecStart=
ExecStart=/opt/metrics-httpd/0.1.0/metrics-httpd json-file --bind 100.64.0.10 --port 9107 --path /.well-known/dns --json-path /var/lib/dns-metrics/dns.json --htpasswd-file /etc/dns-metrics-endpoint/htpasswd --realm dns-metrics --server-name dns-metrics-httpd/0.1 --meta merge --request-timeout 15
