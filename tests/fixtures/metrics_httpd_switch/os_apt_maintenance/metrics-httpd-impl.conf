# Managed by ops-library metrics_httpd_switch: selects the Rust metrics-httpd.
# Remove this file (daemon-reload, restart) to fall back to Python.
[Service]
ExecStart=
ExecStart=/opt/metrics-httpd/0.1.0/metrics-httpd apt-state --bind 100.64.0.10 --port 9106 --path /.well-known/os-apt-maintenance --json-path /var/lib/os-apt-maintenance/state.json --htpasswd-file /etc/os-apt-maintenance-endpoint/htpasswd --freshness-max-age 1209600 --state-max-age 1296000 --realm os-apt-maintenance --server-name os-apt-maintenance-httpd/0.1
