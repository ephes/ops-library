# Managed by ops-library metrics_httpd_switch: selects the Rust metrics-httpd.
# Remove this file (daemon-reload, restart) to fall back to Python.
[Service]
ExecStart=
ExecStart=/opt/metrics-httpd/0.1.0/metrics-httpd json-file --bind 100.64.0.10 --port 9103 --path /.well-known/backup --json-path /var/lib/backup-metrics/backup.json --htpasswd-file /etc/backup-metrics-endpoint/htpasswd --realm backup-metrics --server-name backup-metrics-httpd/0.1
