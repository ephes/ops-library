# Managed by ops-library metrics_httpd_switch: selects the Rust metrics-httpd.
# Remove this file (daemon-reload, restart) to fall back to Python.
[Service]
ExecStart=
ExecStart=/opt/metrics-httpd/0.1.0/metrics-httpd script --bind 100.64.0.10 --port 9100 --path /.well-known/health --script /usr/local/bin/mail-metrics.sh --script-timeout 10 --htpasswd-file /etc/metrics-endpoint/htpasswd --realm metrics --server-name metrics-httpd/0.1
