# Managed by ops-library metrics_httpd_switch: selects the Rust metrics-httpd.
# Remove this file (daemon-reload, restart) to fall back to Python.
[Service]
ExecStart=
ExecStart=/opt/metrics-httpd/0.1.0/metrics-httpd json-file --bind 127.0.0.1 --port 9104 --path /.well-known/openclaw-health --json-path /var/lib/openclaw-metrics/openclaw-health.json --htpasswd-file /etc/openclaw-metrics-endpoint/htpasswd --realm openclaw-metrics --server-name openclaw-metrics-httpd/0.1 --missing-message "Metrics file not found - collector timer may not have run yet"
