---
# Test playbook for wagtail_deploy role templates
# Run with: ansible-playbook tests/test_wagtail_deploy.yml -i tests/inventory/test.yml

- name: Test Wagtail Deploy Role Templates
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    role_path: "{{ playbook_dir }}/../roles/wagtail_deploy"
    rendered_service: "/tmp/test-wagtail.service"
    rendered_worker: "/tmp/test-wagtail-db-worker.service"
    rendered_worker_with_args: "/tmp/test-wagtail-db-worker-with-args.service"
    rendered_env: "/tmp/test-wagtail.env"
    rendered_env_staging: "/tmp/test-wagtail-staging.env"
    rendered_env_plain: "/tmp/test-wagtail-plain.env"
    wagtail_project_slug: "python-podcast"
    # Shared inputs for the wagtail.env.j2 renders below. Task-level vars in the
    # service-template tasks override these where the names overlap.
    wagtail_django_secret_key: "test-secret"
    wagtail_admin_url: "hidden_admin/"
    wagtail_django_allowed_hosts: "example.com"
    wagtail_django_cache_location: "/home/python-podcast/site/cache"
    wagtail_postgres_user: "python-podcast"
    wagtail_postgres_password: "test-pw"
    wagtail_postgres_host: "localhost"
    wagtail_postgres_port: 5432
    wagtail_postgres_database: "python-podcast"
    wagtail_django_aws_access_key_id: "key"
    wagtail_django_aws_secret_access_key: "secret"
    wagtail_django_aws_storage_bucket_name: "bucket"
    wagtail_cloudfront_domain: "cdn.example.com"
    wagtail_django_sentry_dsn: "https://example@sentry.invalid/1"
    wagtail_django_mailgun_api_key: "mg-key"
    wagtail_mailgun_sender_domain: "mg.example.com"
    wagtail_mailgun_api_url: ""
    wagtail_django_server_email: "noreply@example.com"
    wagtail_env_extra: {}

    # Taken from the role defaults instead of repeated as literals: a default
    # that flips in the role has to reach the "default case" of these renders.
    # A play var on purpose - set_fact would rank above the task vars of the
    # renders below and override their deliberate false.
    wagtail_require_object_storage: "{{ wagtail_defaults.wagtail_require_object_storage }}"
    wagtail_require_sentry: "{{ wagtail_defaults.wagtail_require_sentry }}"

    # Flattened failure text of the most recent rescued failure; a looped
    # assert reports through .results, a plain assert through .msg.
    wagtail_validate_failure_text: >-
      {{ ansible_failed_result.msg | default('') ~ ' ' ~
      (
        ansible_failed_result.results | default([])
        | map(attribute='msg', default='') | list | join(' ')
      ) }}

  tasks:
    - name: Load role defaults
      ansible.builtin.include_vars:
        file: "{{ role_path }}/defaults/main.yml"
        name: wagtail_defaults

    - name: Assert db_worker is opt-in by default
      ansible.builtin.assert:
        that:
          - wagtail_defaults.wagtail_db_worker_enabled == false
          - wagtail_defaults.wagtail_db_worker_backend == "default"
          - "'/cache' in wagtail_defaults.wagtail_rsync_excludes"

    - name: Assert Sentry environment defaults to production
      ansible.builtin.assert:
        that:
          - wagtail_defaults.wagtail_django_sentry_environment == "production"
        fail_msg: >-
          wagtail_django_sentry_environment must default to production so
          existing production deployments keep their Sentry environment tag.

    # ------------------------------------------------------------------
    # Validation: the wagtail_require_* switches decide which secrets are
    # demanded.  Rendering the templates alone would not notice an inverted
    # when: on those asserts.
    #
    # include_tasks, not include_role: the role depends on postgres_install
    # through its meta, and include_role would run that dependency - which
    # needs become and has nothing to do with validating inputs.  The switches
    # come from the defaults through the set_fact above.
    # ------------------------------------------------------------------
    - name: Validation accepts a complete set of secrets
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate.yml"
      vars:
        wagtail_service_name: "python-podcast"
        wagtail_fqdn: "example.com"
        wagtail_traefik_host_rule: "Host(`example.com`)"
        wagtail_app_port: 10014
        wagtail_source_path: "/tmp"
        wagtail_deploy_method: "{{ wagtail_defaults.wagtail_deploy_method }}"

    - name: Validation rejects a missing object storage secret
      block:
        - name: Run validation without an AWS key
          ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate.yml"
          vars:
            wagtail_service_name: "python-podcast"
            wagtail_fqdn: "example.com"
            wagtail_traefik_host_rule: "Host(`example.com`)"
            wagtail_app_port: 10014
            wagtail_source_path: "/tmp"
            wagtail_deploy_method: "{{ wagtail_defaults.wagtail_deploy_method }}"
            wagtail_django_aws_access_key_id: ""

        - name: Fail because the missing key was accepted
          ansible.builtin.fail:
            msg: "Validation accepted an empty wagtail_django_aws_access_key_id"
      rescue:
        - name: Confirm the failure came from the object storage assert
          ansible.builtin.assert:
            that:
              - "'Object storage secrets are missing' in wagtail_validate_failure_text"
            fail_msg: "Unexpected failure: {{ wagtail_validate_failure_text }}"

    - name: Validation passes without object storage and Sentry when both are off
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate.yml"
      vars:
        wagtail_service_name: "ggs-lennestrasse"
        wagtail_fqdn: "example.org"
        wagtail_traefik_host_rule: "Host(`example.org`)"
        wagtail_app_port: 10021
        wagtail_source_path: "/tmp"
        wagtail_deploy_method: "{{ wagtail_defaults.wagtail_deploy_method }}"
        wagtail_require_object_storage: false
        wagtail_require_sentry: false
        wagtail_django_aws_access_key_id: ""
        wagtail_django_aws_secret_access_key: ""
        wagtail_django_aws_storage_bucket_name: ""
        wagtail_cloudfront_domain: ""
        wagtail_django_sentry_dsn: ""

    - name: Validation still demands the shared secrets when both are off
      block:
        - name: Run validation without a secret key
          ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate.yml"
          vars:
            wagtail_service_name: "ggs-lennestrasse"
            wagtail_fqdn: "example.org"
            wagtail_traefik_host_rule: "Host(`example.org`)"
            wagtail_app_port: 10021
            wagtail_source_path: "/tmp"
            wagtail_deploy_method: "{{ wagtail_defaults.wagtail_deploy_method }}"
            wagtail_require_object_storage: false
            wagtail_require_sentry: false
            wagtail_django_secret_key: ""

        - name: Fail because the missing secret key was accepted
          ansible.builtin.fail:
            msg: "Validation accepted an empty wagtail_django_secret_key"
      rescue:
        - name: Confirm the failure came from the shared assert
          ansible.builtin.assert:
            that:
              - "'Required secrets or settings are missing' in wagtail_validate_failure_text"
            fail_msg: "Unexpected failure: {{ wagtail_validate_failure_text }}"

    - name: Render Wagtail web service template
      ansible.builtin.template:
        src: "{{ role_path }}/templates/wagtail.service.j2"
        dest: "{{ rendered_service }}"
      vars:
        wagtail_service_name: "python-podcast"
        wagtail_systemd_unit_name: "python-podcast"
        wagtail_user: "python-podcast"
        wagtail_group: "python-podcast"
        wagtail_site_path: "/home/python-podcast/site"
        wagtail_env_path: "/home/python-podcast/site/.env"
        wagtail_django_settings_module: "config.settings.production"
        wagtail_venv_bin: "/home/python-podcast/site/.venv/bin"
        wagtail_app_host: "127.0.0.1"
        wagtail_app_port: 10014
        wagtail_gunicorn_workers: 4
        wagtail_gunicorn_timeout: 600
        wagtail_gunicorn_extra_args: ""
        wagtail_wsgi_module: "config.wsgi"
        wagtail_cache_dir: "/home/python-podcast/site/cache"

    - name: Render Wagtail db_worker service template
      ansible.builtin.template:
        src: "{{ role_path }}/templates/wagtail-db-worker.service.j2"
        dest: "{{ rendered_worker }}"
      vars:
        wagtail_service_name: "python-podcast"
        wagtail_user: "python-podcast"
        wagtail_group: "python-podcast"
        wagtail_site_path: "/home/python-podcast/site"
        wagtail_env_path: "/home/python-podcast/site/.env"
        wagtail_django_settings_module: "config.settings.production"
        wagtail_python: "/home/python-podcast/site/.venv/bin/python"
        wagtail_manage_py: "/home/python-podcast/site/manage.py"
        wagtail_db_worker_backend: "cast_transcripts"
        wagtail_db_worker_id: "python-podcast-transcripts"
        wagtail_db_worker_queue_name: ""
        wagtail_db_worker_interval_seconds: 5
        wagtail_db_worker_extra_args: ""
        wagtail_cache_dir: "/home/python-podcast/site/cache"

    - name: Render Wagtail db_worker service template with queue and extra args
      ansible.builtin.template:
        src: "{{ role_path }}/templates/wagtail-db-worker.service.j2"
        dest: "{{ rendered_worker_with_args }}"
      vars:
        wagtail_service_name: "python-podcast"
        wagtail_user: "python-podcast"
        wagtail_group: "python-podcast"
        wagtail_site_path: "/home/python-podcast/site"
        wagtail_env_path: "/home/python-podcast/site/.env"
        wagtail_django_settings_module: "config.settings.production"
        wagtail_python: "/home/python-podcast/site/.venv/bin/python"
        wagtail_manage_py: "/home/python-podcast/site/manage.py"
        wagtail_db_worker_backend: "cast_transcripts"
        wagtail_db_worker_id: "python-podcast-transcripts"
        wagtail_db_worker_queue_name: "transcripts"
        wagtail_db_worker_interval_seconds: 5
        wagtail_db_worker_extra_args: "--verbose"
        wagtail_cache_dir: "/home/python-podcast/site/cache"

    - name: Render Wagtail env file with the default Sentry environment
      ansible.builtin.template:
        src: "{{ role_path }}/templates/wagtail.env.j2"
        dest: "{{ rendered_env }}"
      vars:
        wagtail_django_settings_module: "config.settings.production"
        wagtail_django_sentry_environment: "{{ wagtail_defaults.wagtail_django_sentry_environment }}"

    - name: Render Wagtail env file for a staging deployment
      ansible.builtin.template:
        src: "{{ role_path }}/templates/wagtail.env.j2"
        dest: "{{ rendered_env_staging }}"
      vars:
        wagtail_django_settings_module: "config.settings.production"
        wagtail_django_sentry_environment: "staging"

    - name: Render Wagtail env file for a site without object storage and Sentry
      ansible.builtin.template:
        src: "{{ role_path }}/templates/wagtail.env.j2"
        dest: "{{ rendered_env_plain }}"
      vars:
        wagtail_django_settings_module: "ggs_lennestrasse.settings.production"
        wagtail_require_object_storage: false
        wagtail_require_sentry: false
        wagtail_django_aws_access_key_id: ""
        wagtail_django_aws_secret_access_key: ""
        wagtail_django_aws_storage_bucket_name: ""
        wagtail_cloudfront_domain: ""
        wagtail_django_sentry_dsn: ""
        wagtail_django_sentry_environment: "staging"

    - name: Read rendered services
      ansible.builtin.slurp:
        path: "{{ item }}"
      loop:
        - "{{ rendered_service }}"
        - "{{ rendered_worker }}"
        - "{{ rendered_worker_with_args }}"
        - "{{ rendered_env }}"
        - "{{ rendered_env_staging }}"
        - "{{ rendered_env_plain }}"
      register: rendered_files

    - name: Assert rendered services include web and worker commands
      ansible.builtin.assert:
        that:
          - "'gunicorn' in rendered_service_text"
          - "'config.wsgi:application' in rendered_service_text"
          - "'manage.py db_worker' in rendered_worker_text"
          - "'--backend cast_transcripts' in rendered_worker_text"
          - "'--worker-id python-podcast-transcripts' in rendered_worker_text"
          - "'--interval 5' in rendered_worker_text"
          - "'EnvironmentFile=/home/python-podcast/site/.env' in rendered_worker_text"
          - "'--queue-name transcripts' in rendered_worker_with_args_text"
          - "'--verbose' in rendered_worker_with_args_text"
      vars:
        rendered_service_text: "{{ rendered_files.results[0].content | b64decode }}"
        rendered_worker_text: "{{ rendered_files.results[1].content | b64decode }}"
        rendered_worker_with_args_text: "{{ rendered_files.results[2].content | b64decode }}"

    - name: Assert env file carries an explicit Sentry environment
      ansible.builtin.assert:
        that:
          - "'DJANGO_SENTRY_ENVIRONMENT=\"production\"' in rendered_env_text"
          - "'SENTRY_ENVIRONMENT=\"production\"' in rendered_env_text"
          - "'DJANGO_SENTRY_ENVIRONMENT=\"staging\"' in rendered_env_staging_text"
          - "'SENTRY_ENVIRONMENT=\"staging\"' in rendered_env_staging_text"
        fail_msg: >-
          The env file must state the Sentry environment explicitly. Staging
          shares config.settings.production, and the Sentry SDK tags events
          "production" whenever no environment is supplied.
      vars:
        rendered_env_text: "{{ rendered_files.results[3].content | b64decode }}"
        rendered_env_staging_text: "{{ rendered_files.results[4].content | b64decode }}"

    - name: Assert a site without object storage keeps those names out of the env file
      ansible.builtin.assert:
        that:
          - "'DJANGO_AWS_ACCESS_KEY_ID' not in rendered_env_plain_text"
          - "'DJANGO_AWS_SECRET_ACCESS_KEY' not in rendered_env_plain_text"
          - "'DJANGO_AWS_STORAGE_BUCKET_NAME' not in rendered_env_plain_text"
          - "'CLOUDFRONT_DOMAIN' not in rendered_env_plain_text"
          - "'SENTRY_DSN' not in rendered_env_plain_text"
          - "'SENTRY_ENVIRONMENT' not in rendered_env_plain_text"
          - "'DATABASE_URL' in rendered_env_plain_text"
          - "'MAILGUN_SENDER_DOMAIN' in rendered_env_plain_text"
          - "'DJANGO_SECRET_KEY' in rendered_env_plain_text"
        fail_msg: >-
          A site that serves static files with WhiteNoise and runs without
          Sentry must not receive empty S3, CloudFront or Sentry variables:
          an empty DSN reads as a configured one in some SDK versions.
      vars:
        rendered_env_plain_text: "{{ rendered_files.results[5].content | b64decode }}"

    - name: Clean up rendered services
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ rendered_service }}"
        - "{{ rendered_worker }}"
        - "{{ rendered_worker_with_args }}"
        - "{{ rendered_env }}"
        - "{{ rendered_env_staging }}"
        - "{{ rendered_env_plain }}"
