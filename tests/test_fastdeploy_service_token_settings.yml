---
# Test the optional FastDeploy service token settings of fastdeploy_deploy and
# fastdeploy_self_deploy: unset by default (nothing rendered), rendered when
# set, and invalid values are refused before the .env file is written.
# Run with: ansible-playbook -i localhost, -c local tests/test_fastdeploy_service_token_settings.yml

- name: Test FastDeploy service token settings
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    deploy_role: "{{ playbook_dir }}/../roles/fastdeploy_deploy"
    self_role: "{{ playbook_dir }}/../roles/fastdeploy_self_deploy"
    render_dir: "{{ lookup('env', 'TMPDIR') | default('/tmp', true) }}/ops-library-fastdeploy-token-test"
    # inputs of fastdeploy.env.j2
    fastdeploy_environment: production
    fastdeploy_venv_bin: /home/fastdeploy/site/.venv/bin
    fastdeploy_services_path: /home/fastdeploy/site/services
    fastdeploy_api_url: https://deploy.example.com
    fastdeploy_postgres_user: fastdeploy
    fastdeploy_postgres_password: pw
    fastdeploy_postgres_host: localhost
    fastdeploy_postgres_port: 5432
    fastdeploy_postgres_database: fastdeploy
    fastdeploy_secret_key: secret
    # inputs of env.j2
    secret_key: secret
    postgres_password: pw
    postgres_host: localhost
    postgres_db_name: fastdeploy
    fd_self_service_port_blue: 8000
    fd_self_base_dir: /home/deploy/apps
    # Unquoted on purpose: YAML turns this into a datetime, whose string form
    # uses a space instead of "T".
    yaml_datetime: 2026-11-01T00:00:00+00:00

  tasks:
    - name: Load role defaults
      ansible.builtin.include_vars:
        file: "{{ item.file }}"
        name: "{{ item.name }}"
      loop:
        - {file: "{{ deploy_role }}/defaults/main.yml", name: deploy_defaults}
        - {file: "{{ self_role }}/defaults/main.yml", name: self_defaults}

    - name: Assert the settings are unset by default
      ansible.builtin.assert:
        that:
          - deploy_defaults.fastdeploy_legacy_service_tokens_accepted_until == ""
          - deploy_defaults.fastdeploy_service_token_max_expire_days == ""
          - deploy_defaults.fastdeploy_service_token_retention_days == ""
          - self_defaults.fd_self_legacy_service_tokens_accepted_until == ""
          - self_defaults.fd_self_service_token_max_expire_days == ""
          - self_defaults.fd_self_service_token_retention_days == ""

    - name: Create render directory
      ansible.builtin.file:
        path: "{{ render_dir }}"
        state: directory
        mode: "0700"

    # ------------------------------------------------------------------
    # Rendering
    # ------------------------------------------------------------------
    - name: Render fastdeploy.env.j2 with the defaults
      ansible.builtin.template:
        src: "{{ deploy_role }}/templates/fastdeploy.env.j2"
        dest: "{{ render_dir }}/default.env"
        mode: "0600"
      vars:
        fastdeploy_legacy_service_tokens_accepted_until: "{{ deploy_defaults.fastdeploy_legacy_service_tokens_accepted_until }}"
        fastdeploy_service_token_max_expire_days: "{{ deploy_defaults.fastdeploy_service_token_max_expire_days }}"
        fastdeploy_service_token_retention_days: "{{ deploy_defaults.fastdeploy_service_token_retention_days }}"

    - name: Render fastdeploy.env.j2 with all settings
      ansible.builtin.template:
        src: "{{ deploy_role }}/templates/fastdeploy.env.j2"
        dest: "{{ render_dir }}/set.env"
        mode: "0600"
      vars:
        fastdeploy_legacy_service_tokens_accepted_until: "2026-11-01T00:00:00+00:00"
        fastdeploy_service_token_max_expire_days: 60
        fastdeploy_service_token_retention_days: "14"

    - name: Render fastdeploy.env.j2 with only the grace period, given as a YAML datetime
      ansible.builtin.template:
        src: "{{ deploy_role }}/templates/fastdeploy.env.j2"
        dest: "{{ render_dir }}/grace-only.env"
        mode: "0600"
      vars:
        fastdeploy_legacy_service_tokens_accepted_until: "{{ yaml_datetime }}"
        fastdeploy_service_token_max_expire_days: ""
        fastdeploy_service_token_retention_days: ""

    - name: Render env.j2 (self deploy) with the defaults
      ansible.builtin.template:
        src: "{{ self_role }}/templates/env.j2"
        dest: "{{ render_dir }}/self-default.env"
        mode: "0600"
      vars:
        fd_self_legacy_service_tokens_accepted_until: "{{ self_defaults.fd_self_legacy_service_tokens_accepted_until }}"
        fd_self_service_token_max_expire_days: "{{ self_defaults.fd_self_service_token_max_expire_days }}"
        fd_self_service_token_retention_days: "{{ self_defaults.fd_self_service_token_retention_days }}"

    - name: Render env.j2 (self deploy) with all settings
      ansible.builtin.template:
        src: "{{ self_role }}/templates/env.j2"
        dest: "{{ render_dir }}/self-set.env"
        mode: "0600"
      vars:
        fd_self_legacy_service_tokens_accepted_until: "2026-11-01T00:00:00Z"
        fd_self_service_token_max_expire_days: 60
        fd_self_service_token_retention_days: 14

    - name: Read rendered files
      ansible.builtin.slurp:
        src: "{{ render_dir }}/{{ item }}"
      loop: [default.env, set.env, grace-only.env, self-default.env, self-set.env]
      register: rendered_files

    - name: Collect rendered lines
      ansible.builtin.set_fact:
        rendered: "{{ rendered | default({}) | combine({item.item: (item.content | b64decode).splitlines()}) }}"
      loop: "{{ rendered_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert nothing token related is rendered by default
      ansible.builtin.assert:
        that:
          - rendered[item] | select('search', 'SERVICE_TOKEN') | list == []
          - rendered[item] | select('search', 'Service tokens') | list == []
          - rendered[item] | select('match', '^SECRET_KEY=secret$') | list | length == 1
      loop: [default.env, self-default.env]

    - name: Assert the fastdeploy_deploy settings are rendered when set
      ansible.builtin.assert:
        that:
          - "'LEGACY_SERVICE_TOKENS_ACCEPTED_UNTIL=2026-11-01T00:00:00+00:00' in rendered['set.env']"
          - "'SERVICE_TOKEN_MAX_EXPIRE_DAYS=60' in rendered['set.env']"
          - "'SERVICE_TOKEN_RETENTION_DAYS=14' in rendered['set.env']"
          - "'SECRET_KEY=secret' in rendered['set.env']"

    - name: Assert a YAML datetime is written in ISO 8601 form and alone
      ansible.builtin.assert:
        that:
          - "'LEGACY_SERVICE_TOKENS_ACCEPTED_UNTIL=2026-11-01T00:00:00+00:00' in rendered['grace-only.env']"
          - rendered['grace-only.env'] | select('search', '^SERVICE_TOKEN_') | list == []

    - name: Assert the fastdeploy_self_deploy settings are rendered when set
      ansible.builtin.assert:
        that:
          - "'LEGACY_SERVICE_TOKENS_ACCEPTED_UNTIL=2026-11-01T00:00:00Z' in rendered['self-set.env']"
          - "'SERVICE_TOKEN_MAX_EXPIRE_DAYS=60' in rendered['self-set.env']"
          - "'SERVICE_TOKEN_RETENTION_DAYS=14' in rendered['self-set.env']"

    # ------------------------------------------------------------------
    # Validation
    # ------------------------------------------------------------------
    - name: Accept valid fastdeploy_deploy settings
      ansible.builtin.include_tasks: "{{ deploy_role }}/tasks/validate_service_token_settings.yml"
      vars:
        fastdeploy_legacy_service_tokens_accepted_until: "{{ item.until }}"
        fastdeploy_service_token_max_expire_days: "{{ item.max }}"
        fastdeploy_service_token_retention_days: "{{ item.retention }}"
      loop:
        - {until: "", max: "", retention: ""}
        - {until: "2026-11-01T00:00:00+00:00", max: 90, retention: 30}
        - {until: "2026-11-01T00:00:00Z", max: "1", retention: "1"}
        - {until: "2026-11-01T12:30+02:00", max: "", retention: ""}
        - {until: "2026-11-01T12:30:00.5-05:00", max: "", retention: ""}
        - {until: "{{ yaml_datetime }}", max: "", retention: ""}
        - {until: "2028-02-29T00:00:00+00:00", max: "", retention: ""}

    - name: Accept valid fastdeploy_self_deploy settings
      ansible.builtin.include_tasks: "{{ self_role }}/tasks/validate_service_token_settings.yml"
      vars:
        fd_self_legacy_service_tokens_accepted_until: "2026-11-01T00:00:00+00:00"
        fd_self_service_token_max_expire_days: 90
        fd_self_service_token_retention_days: 30

    - name: Refuse invalid fastdeploy_deploy settings
      ansible.builtin.include_tasks: tasks/fastdeploy_service_token_refused.yml
      vars:
        validate_tasks: "{{ deploy_role }}/tasks/validate_service_token_settings.yml"
        expected_message: "{{ item.message }}"
        fastdeploy_legacy_service_tokens_accepted_until: "{{ item.until | default('') }}"
        fastdeploy_service_token_max_expire_days: "{{ item.max | default('') }}"
        fastdeploy_service_token_retention_days: "{{ item.retention | default('') }}"
      loop:
        - {until: "2026-11-01", message: "UTC offset"}
        - {until: "2026-11-01T00:00:00", message: "UTC offset"}
        - {until: "2026-13-01T00:00:00+00:00", message: "UTC offset"}
        - {until: "2026-11-01T24:00:00+00:00", message: "UTC offset"}
        - {until: "2026-02-30T00:00:00+00:00", message: "UTC offset"}
        - {until: "2026-11-31T00:00:00+00:00", message: "UTC offset"}
        - {until: "2027-02-29T00:00:00+00:00", message: "UTC offset"}
        - {until: "0000-01-01T00:00:00+00:00", message: "UTC offset"}
        - {until: "next tuesday", message: "UTC offset"}
        - {until: "2026-11-01T00:00:00+00:00\nSECRET_KEY=x", message: "UTC offset"}
        - {max: "0", message: "fastdeploy_service_token_max_expire_days must be a positive"}
        - {max: "-5", message: "fastdeploy_service_token_max_expire_days must be a positive"}
        - {max: "ninety", message: "fastdeploy_service_token_max_expire_days must be a positive"}
        - {retention: "1.5", message: "fastdeploy_service_token_retention_days must be a positive"}
        - {retention: "30\nX=1", message: "fastdeploy_service_token_retention_days must be a positive"}

    - name: Refuse invalid fastdeploy_self_deploy settings
      ansible.builtin.include_tasks: tasks/fastdeploy_service_token_refused.yml
      vars:
        validate_tasks: "{{ self_role }}/tasks/validate_service_token_settings.yml"
        expected_message: "{{ item.message }}"
        fd_self_legacy_service_tokens_accepted_until: "{{ item.until | default('') }}"
        fd_self_service_token_max_expire_days: "{{ item.max | default('') }}"
        fd_self_service_token_retention_days: "{{ item.retention | default('') }}"
      loop:
        - {until: "2026-11-01T00:00:00", message: "UTC offset"}
        - {until: "2026-02-30T00:00:00+00:00", message: "UTC offset"}
        - {max: "0", message: "fd_self_service_token_max_expire_days must be a positive"}
        - {retention: "x", message: "fd_self_service_token_retention_days must be a positive"}

    - name: Assert both roles validate before writing anything
      ansible.builtin.assert:
        that:
          - >-
            (lookup('file', deploy_role ~ '/tasks/main.yml') | from_yaml | map(attribute='name') | list).index('Validate service token settings')
            < (lookup('file', deploy_role ~ '/tasks/main.yml') | from_yaml | map(attribute='name') | list).index('Setup user and directories')
          - >-
            (lookup('file', self_role ~ '/tasks/main.yml') | from_yaml | map(attribute='name') | list).index('Validate service token settings')
            < (lookup('file', self_role ~ '/tasks/main.yml') | from_yaml | map(attribute='name') | list).index('Ensure deployment directories exist')

    - name: Remove render directory
      ansible.builtin.file:
        path: "{{ render_dir }}"
        state: absent
